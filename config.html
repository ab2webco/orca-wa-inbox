          return
        }
        el('ack-quiet').value = String(Number(silencio))
        var claves = ['ackMode', 'ackText', 'ackQuietMinutes', 'greetingMode', 'greetingText']
        var pares = claves.map(function (k) { return [k, valorDe(CONTROLES[k][0])] })
        pares.push(['firstReply', primer])
        busy(event.currentTarget, guardar(pares).then(function (mal) {
          if (mal.indexOf('firstReply') === -1) {
            PRIMER_IDS.forEach(function (id) { delete sucios[id] })
          }
          said('said-auto', mal.length ? t('saveFailed') : '✓ ' + t('savedOk'), !!mal.length)
          pintarChecklist()
        }))
      })
      // La meta: un entero de 1 a 1440 (el mismo rango que valida wa-scope). Fuera de rango
      // no se guarda: un valor que el CLI descarta en silencio dejaria al panel mintiendo.
      var SLA_MIN = 1, SLA_MAX = 1440
      el('sla-minutes').value = CONTROLES.slaMinutes[1]
      el('save-sla').addEventListener('click', function (event) {
        var texto = el('sla-minutes').value.trim()
        var x = Number(texto)
        if (!/^\d+$/.test(texto) || x < SLA_MIN || x > SLA_MAX) {
          said('said-sla', t('slaRange'), true)
          return
        }
        el('sla-minutes').value = String(x)
        guardarTarjeta(event.currentTarget, 'said-sla', ['slaMinutes'])
      })
      // Las horas de la pregunta de proyecto: un entero desde 1, como lo valida wa-scope
      // (`project_question_hours` es positivo). Otra cosa no se guarda y se dice.
      el('pq-hours').value = CONTROLES.projectQuestionHours[1]
      el('save-pq-hours').addEventListener('click', function (event) {
        var texto = el('pq-hours').value.trim()
        if (!/^\d+$/.test(texto) || Number(texto) < 1) {
          said('said-pq-hours', t('pqHoursRange'), true)
          return
        }
        el('pq-hours').value = String(Number(texto))
        guardarTarjeta(event.currentTarget, 'said-pq-hours', ['projectQuestionHours'])
      })
      // ---------- los avisos de Orca por WhatsApp (avisos-orca) ----------
      // UNA clave, `orcaNotices`, en texto como el resto, con los mismos rangos que valida
      // wa-scope. Lo que falta o no sirve se pinta con el de fabrica: todo apagado.
      var ORCA_DEFECTO = { waiting: 'off', finished: 'off', automationFailed: 'off',
        quietStart: '', quietEnd: '', hourlyCap: '6', finishedDelaySeconds: '25' }
      var ORCA_INTERRUPTORES = [['waiting', 'orca-waiting'], ['finished', 'orca-finished'],
        ['automationFailed', 'orca-automation']]
      var ORCA_CAMPOS = [['quietStart', 'orca-quiet-start'], ['quietEnd', 'orca-quiet-end'],
        ['hourlyCap', 'orca-cap'], ['finishedDelaySeconds', 'orca-delay']]
      var ORCA_IDS = ['orca-waiting', 'orca-finished', 'orca-automation', 'orca-quiet-start',
        'orca-quiet-end', 'orca-cap', 'orca-delay']
      var HORA_ORCA = /^([01]\d|2[0-3]):[0-5]\d$/
      ORCA_IDS.forEach(ensuciar)
      ORCA_INTERRUPTORES.forEach(function (p) {
        el(p[1]).addEventListener('click', function () {
          var n = el(p[1])
          n.setAttribute('aria-checked', n.getAttribute('aria-checked') === 'true' ? 'false' : 'true')
          sucios[p[1]] = true
          pintarOrcaVista()
        })
      })
      function pintarOrca (valor, s) {
        if (!hayRespuesta(valor) || !vigente(s)) return
        var v = valor && typeof valor === 'object' ? valor : {}
        ORCA_INTERRUPTORES.forEach(function (p) {
          if (sucios[p[1]]) return
          el(p[1]).setAttribute('aria-checked', v[p[0]] === 'on' ? 'true' : 'false')
        })
        ORCA_CAMPOS.forEach(function (p) {
          if (sucios[p[1]] || document.activeElement === el(p[1])) return
          var x = v[p[0]]
          el(p[1]).value = x !== undefined && x !== null && (String(x).trim() !== '' ||
            p[0] === 'quietStart' || p[0] === 'quietEnd') ? String(x).trim() : ORCA_DEFECTO[p[0]]
        })
        pintarOrcaVista()
      }
      /** La espera del "termino" solo cuenta con ese aviso encendido. */
      function pintarOrcaVista () {
        el('orca-delay-row').hidden = el('orca-finished').getAttribute('aria-checked') !== 'true'
      }
      /** Sin numero de aprobacion guardado (y de confianza) no sale ningun aviso. */
      function pintarOrcaNumero () {
        el('orca-no-number').hidden = !!numeroGuardado &&
          duenosVisibles().some(function (d) { return d.id === numeroGuardado })
      }
      /** Lo que la tarjeta guardaria, o la clave del texto que dice por que no. */
      function orcaDelFormulario () {
        var salida = {}
        ORCA_INTERRUPTORES.forEach(function (p) {
          salida[p[0]] = el(p[1]).getAttribute('aria-checked') === 'true' ? 'on' : 'off'
        })
        var ini = el('orca-quiet-start').value.trim()
        var fin = el('orca-quiet-end').value.trim()
        if ((ini || fin) && (!HORA_ORCA.test(ini) || !HORA_ORCA.test(fin) || ini === fin)) {
          return { mal: 'orcaQuietRange' }
        }
        salida.quietStart = ini
        salida.quietEnd = fin
        var tope = el('orca-cap').value.trim()
        if (!/^\d+$/.test(tope) || Number(tope) < 1 || Number(tope) > 60) return { mal: 'orcaCapRange' }
        salida.hourlyCap = String(Number(tope))
        var demora = el('orca-delay').value.trim()
        if (!/^\d+$/.test(demora) || Number(demora) < 10 || Number(demora) > 600) {
          return { mal: 'orcaDelayRange' }
        }
        salida.finishedDelaySeconds = String(Number(demora))
        return { valor: salida }
      }
      ORCA_INTERRUPTORES.forEach(function (p) { el(p[1]).setAttribute('aria-checked', 'false') })
      ORCA_CAMPOS.forEach(function (p) { el(p[1]).value = ORCA_DEFECTO[p[0]] })
      pintarOrcaVista()
      pintarOrcaNumero()
      el('save-orca').addEventListener('click', function (event) {
        var f = orcaDelFormulario()
        if (f.mal) { said('said-orca', t(f.mal), true); return }
        busy(event.currentTarget, guardar([['orcaNotices', f.valor]]).then(function (mal) {
          if (!mal.length) ORCA_IDS.forEach(function (id) { delete sucios[id] })
          said('said-orca', mal.length ? t('saveFailed') : '✓ ' + t('savedOk'), !!mal.length)
        }))
      })
      el('save-reading').addEventListener('click', function (event) {
        guardarTarjeta(event.currentTarget, 'said-reading', ['inboxDays', 'syncMinutes'])
      })

      // ---------- el autocompletar (T17) ----------
      // UN campo: lo que se escribe filtra una lista que dibuja la pagina, debajo. El
      // dueno lo pidio asi ("es raro desplegar el select y el buscador aparte, eso debe
      // ser como un autocomplete"), y ademas la lista de un select nativo no se abre en el
      // panel de Orca. Patron combobox/listbox de ARIA: flechas mueven, Enter elige, Esc
      // cierra, clic elige.
      //
      // El sondeo repinta cada 12 s. Lo que el dueno escribio y la lista abierta tienen
      // que sobrevivir: `refrescar` vuelve a dibujar la lista con el mismo filtro y la
      // misma opcion activa, y NUNCA toca el texto del campo.
      //
      // `cfg.opciones(terminos)` devuelve { items, vacio }: cada item es
      // { value, nombre, kind?, sub?, grupo? } y `vacio` lo que se dice sin ninguno.
      function idDeOpcion (lista, value) {
        return lista + '-o-' + (String(value).replace(/[^A-Za-z0-9_-]/g, '_') || '_vacio')
      }
      function crearCombo (cfg) {
        var input = el(cfg.input), lista = el(cfg.lista)
        var c = { abierto: false, activo: null, escrito: false, items: [] }

        function terminos () {
          return c.escrito ? aplanar(input.value).split(' ').filter(Boolean) : []
        }
        function pintar () {
          var r = cfg.opciones(terminos())
          c.items = r.items
          if (!c.items.some(function (i) { return i.value === c.activo })) c.activo = null
          if (!c.items.length) {
            lista.innerHTML = '<div class="combo-empty">' + esc(r.vacio || '') + '</div>'
          } else {
            var html = '', grupo = null, abierto = false
            c.items.forEach(function (i) {
              if ((i.grupo || null) !== grupo) {
                if (abierto) html += '</div>'
                grupo = i.grupo || null
                abierto = !!grupo
                if (grupo) {
                  html += '<div role="group" aria-label="' + escAttr(grupo) + '">' +
                    '<div class="combo-group" role="presentation">' + esc(grupo) + '</div>'
                }
              }
              html += '<div class="combo-opt" role="option" id="' +
                escAttr(idDeOpcion(cfg.lista, i.value)) + '" data-value="' + escAttr(i.value) +
                '" aria-selected="' + (i.value === c.activo ? 'true' : 'false') + '">' +
                (i.kind ? '<span class="combo-kind">' + esc(i.kind) + '</span>' : '') +
                '<span class="combo-name">' + esc(i.nombre) + '</span>' +
                (i.sub ? '<span class="combo-sub">' + esc(i.sub) + '</span>' : '') + '</div>'
            })
            if (abierto) html += '</div>'
            lista.innerHTML = html
          }
          marcarActivo()
        }
        function marcarActivo () {
          var id = c.activo === null ? '' : idDeOpcion(cfg.lista, c.activo)
          Array.prototype.forEach.call(lista.querySelectorAll('[role="option"]'), function (o) {
            o.setAttribute('aria-selected', o.id === id ? 'true' : 'false')
          })
          if (id) {
            input.setAttribute('aria-activedescendant', id)
            var n = el(id)
            if (n && n.scrollIntoView) n.scrollIntoView({ block: 'nearest' })
          } else {
            input.removeAttribute('aria-activedescendant')
          }
        }
        function abrir () {
          if (input.disabled || input.readOnly) return
          c.abierto = true
          lista.hidden = false
          input.setAttribute('aria-expanded', 'true')
          pintar()
        }
        function cerrar () {
          c.abierto = false
          c.activo = null
          lista.hidden = true
          input.setAttribute('aria-expanded', 'false')
          input.removeAttribute('aria-activedescendant')
        }
        function mover (paso) {
          if (!c.items.length) return
          var i = c.items.map(function (x) { return x.value }).indexOf(c.activo)
          i = i < 0 ? (paso > 0 ? 0 : c.items.length - 1)
            : Math.max(0, Math.min(c.items.length - 1, i + paso))
          c.activo = c.items[i].value
          marcarActivo()
        }
        function elegir (value) {
          var item = c.items.filter(function (i) { return i.value === value })[0]
          if (!item) return
          c.escrito = false
          cerrar()
          cfg.elegir(item)
        }

        input.addEventListener('input', function () {
          c.escrito = true
          c.activo = null
          abrir()
          if (cfg.alEscribir) cfg.alEscribir()
        })
        input.addEventListener('click', function () { if (!c.abierto) abrir() })
        input.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowDown') {
            e.preventDefault()
            if (!c.abierto) abrir()
            mover(1)
          } else if (e.key === 'ArrowUp') {
            e.preventDefault()
            if (!c.abierto) abrir()
            mover(-1)
          } else if (e.key === 'Enter') {
            if (c.abierto && c.activo !== null) { e.preventDefault(); elegir(c.activo) }
          } else if (e.key === 'Escape') {
            if (c.abierto) { e.preventDefault(); cerrar() }
          } else if (e.key === 'Tab') {
            cerrar()
          }
        })
        input.addEventListener('blur', function () { cerrar() })
        // El clic en la lista no puede llevarse el foco: el `blur` la cerraria antes de que
        // llegue el `click`.
        lista.addEventListener('mousedown', function (e) { e.preventDefault() })
        lista.addEventListener('click', function (e) {
          var o = e.target.closest ? e.target.closest('[role="option"]') : null
          if (o) elegir(o.getAttribute('data-value'))
        })

        return {
          refrescar: function () { if (c.abierto) pintar() },
          abrir: abrir,
          cerrar: cerrar,
          escribiendo: function () { return c.escrito || document.activeElement === input },
          olvidar: function () { c.escrito = false }
        }
      }

      // ---------- selector de conversaciones ----------
      // Se elige de la lista en vez de escribir el nombre exacto. El valor es el jid,
      // porque hay grupos que comparten nombre y el nombre no identifica nada.
      var chatsPorJid = {}
      // El jid que se esta editando: mientras dura la edicion la conversacion no cambia
      // y el campo queda de solo lectura.
      var editandoJid = ''
      // El jid que el dueno eligio de la lista. Escribir otra cosa encima lo suelta: lo
      // que se autoriza es lo que se ve en el campo, nunca la eleccion de antes.
      var chatElegido = ''

      function pickChat (jid, nombre) {
        chatElegido = jid || ''
        var c = chatsPorJid[jid]
        var visible = c ? nombreVisible(c) : (nombre || jid || '')
        el('chat-search').value = visible
        el('chat').value = visible
        pintarIdentidad()
      }

      // La lista completa se guarda aparte: el buscador filtra sobre esto, no sobre
      // lo que quedo pintado, si no cada tecleo iria achicando la lista sin volver.
      var chatsTodos = []

      // ---------- estado de la busqueda ----------
      // El panel no ejecuta nada, asi que por si mismo no puede saber si el worker esta
      // buscando, si fallo o si se quedo callado. Lo lee de syncStatus, que el worker
      // escribe antes y despues de cada intento.
      var estadoSync = null
      var ABIERTO_EN = Date.now()
      // Sin una sola noticia del worker en este tiempo, seguir diciendo "buscando" es
      // mentir: o el plugin no esta activo, o el worker nunca arranco.
      var ESPERA_MS = 45000
      // Un intento que lleva mas que el timeout del propio sync ya no esta corriendo.
      var CORRIENDO_MS = 150000

      function edadMs (iso) {
        var ms = Date.parse(iso)
        return ms ? Date.now() - ms : Infinity
      }

      function motivoTexto (estado) {
        var mapa = {
          'sin-herramientas': 'syncNoTools', 'sin-permiso': 'syncNoPerm',
          'demoro': 'syncTimeout', 'sin-registro': 'syncNoRecord'
        }
        return t(mapa[estado && estado.reason] || 'syncFailed')
      }

      /** Que decir con la lista vacia. Tres finales: sigue buscando, fallo con motivo,
       *  o lleva demasiado sin llegar. Los dos ultimos ofrecen el boton, porque un
       *  estado sin salida es el mismo callejon que el spinner eterno. */
      function estadoVacio (estado) {
        if (estado && estado.running && edadMs(estado.startedAt) < CORRIENDO_MS) {
          // Sin texto aparte: el renglon del buscador ya dice que esta buscando, y
          // repetirlo debajo no agrega nada que mirar.
          return { corto: t('noChats'), largo: '', detalle: '', boton: false }
        }
        if (estado && estado.ok === false) {
          return { corto: t('noChatsFail'), largo: motivoTexto(estado),
                   detalle: estado.detail || '', boton: true }
        }
        // El sync corrio bien y aun asi no hay nada: el problema no es el plugin.
        if (estado && estado.ok === true) {
          return { corto: t('noChatsFail'), largo: t('syncNoChats'), detalle: '', boton: true }
        }
        if (!estado && Date.now() - ABIERTO_EN < ESPERA_MS) {
          return { corto: t('noChats'), largo: '', detalle: '', boton: false }
        }
        return { corto: t('noChatsFail'), largo: t('syncStalled'), detalle: '', boton: true }
      }

      function pintarEstadoSync () {
        var v = estadoVacio(estadoSync)
        var mostrar = !chatsTodos.length && !!(v.largo || v.boton)
        el('sync-state').hidden = !mostrar
        if (!mostrar) return
        el('sync-msg').textContent = v.largo
        el('sync-detail').textContent = v.detalle
        el('sync-detail').hidden = !v.detalle
        el('sync-retry').hidden = !v.boton
      }

      // El panel no puede correr un sync: escribe el pedido y el worker lo atiende.
      // Mismo camino que Tomar/Ignorar en el panel de actividad.
      el('sync-retry').addEventListener('click', function (event) {
        busy(event.currentTarget, write('syncRequest', { at: new Date().toISOString() })
          .then(function (r) {
            said('said-sync', r && r.ok ? t('syncAsked') : 'error', !(r && r.ok))
          }))
      })

      // Como se busca una conversacion. Con 296 de ellas —lo que hay en la cuenta del
      // dueno— encontrar una es LA interaccion diaria de esta pantalla.
      //
      // Lo que habia comparaba `indexOf` sobre el texto crudo, y eso falla con lo que
      // la gente escribe de verdad. Dos nombres reales de ese almacen:
      // `Lista de espera | Taller Demo \u{1F680} #2` y `Comite - Cliente -  Sur`, este
      // ultimo con dos espacios seguidos. Nadie reproduce el emoji, ni la almohadilla,
      // ni el espacio de mas, ni la tilde de un apellido.
      //
      // La regla: se comparan textos APLANADOS —sin tildes, en minusculas y con todo lo
      // que no sea letra o numero convertido en un solo espacio— y cada palabra de lo
      // buscado tiene que aparecer en alguna parte. Palabras sueltas, en cualquier
      // orden, porque de un grupo uno recuerda dos palabras y no el titulo.
      //
      // `\p{L}\p{N}` y no `a-z0-9`: un nombre en cirilico o en chino aplanado con la
      // segunda forma queda VACIO, y una conversacion que no se puede buscar por su
      // nombre se ve igual que una que no existe.
      //
      // Lo que NO se hizo, a proposito: coincidencia aproximada (Levenshtein y
      // compania). Con 296 filas el fallo caro no es no encontrar la conversacion, es
      // AUTORIZAR LA EQUIVOCADA, y una busqueda que devuelve lo que el usuario no
      // escribio empuja exactamente hacia ahi. (La lista propia con teclado, que antes
      // se descarto, llego en T17: el desplegable nativo no se abre en el panel de Orca.)
      function aplanar (texto) {
        return String(texto == null ? '' : texto)
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .replace(/[^\p{L}\p{N}]+/gu, ' ')
          .trim()
      }

      // El texto sobre el que busca cada conversacion, calculado UNA vez por lista: son
      // 296 nombres y el filtro corre en cada tecla.
      var buscaPorJid = {}

      // Lo ultimo que se supo del alcance. Vive aca —y no se vuelve a pedir— porque el
      // panel YA lee `scope` en cada vuelta completa: marcar lo autorizado en el
      // selector no cuesta un solo mensaje mas del cupo del host.
      var alcancePorJid = {}

      /** El permiso vigente de una conversacion, o '' si no tiene ninguno. */
      function modoPropio (jid) {
        var e = alcancePorJid[jid]
        var m = e && e.mode
        return m && m !== 'off' ? m : ''
      }

      /** El modo de una fila de la lista: el suyo o, si no tiene, el de su gemela (la misma
       *  persona con su otra forma, lid-sigue-autorizacion), que es donde quedo autorizada. */
      function modoDe (jid) {
        var m = modoPropio(jid)
        if (!m) (gemelosDe[jid] || []).some(function (g) { m = modoPropio(g); return !!m })
        return m
      }

      // WhatsApp mueve un uno a uno de `<telefono>@s.whatsapp.net` a `<digitos>@lid` (o al
      // reves), y la lista trae las dos formas con el MISMO telefono: el del LID sale del par
      // verificado que anota el sidecar, nunca de los digitos. Se ofrece una sola fila, la
      // viva, y lo que se guarda va a ella. `actualDeJid`: de la forma vieja a la viva;
      // `gemelosDe`: de la viva a las viejas.
      var actualDeJid = {}
      var gemelosDe = {}
      function jidActual (jid) { return actualDeJid[jid] || jid }

      /** Donde se guarda lo que se edita o se elige: en la forma viva, salvo que esa ya
       *  tenga su propia autorizacion — las dos formas autorizadas no se unen solas. */
      function destinoDe (jid, alcance) {
        var actual = jidActual(jid)
        return actual !== jid && alcance[actual] ? jid : actual
      }

      /** El final de la llave, para desempatar dos nombres iguales. No el jid entero:
       *  eso es un renglon aparte —`#chat-id`— y aca solo hace falta lo que los
       *  distingue. */
      function colaDeJid (jid) {
        var usuario = String(jid || '').split('@')[0]
        return usuario.length > 5 ? '\u2026' + usuario.slice(-5) : usuario
      }

      // Los codigos de pais de la UIT (E.164) no se pisan entre si: ninguno es el
      // comienzo de otro. Los de uno y dos digitos son estos; todos los demas tienen
      // tres. Con eso alcanza para separar el codigo del numero de cualquier pais, sin
      // cargar una tabla de formatos nacionales.
      var CODIGOS_PAIS_1 = ['1', '7']
      var CODIGOS_PAIS_2 = ['20', '27', '30', '31', '32', '33', '34', '36', '39', '40', '41',
        '43', '44', '45', '46', '47', '48', '49', '51', '52', '53', '54', '55', '56', '57',
        '58', '60', '61', '62', '63', '64', '65', '66', '81', '82', '84', '86', '90', '91',
        '92', '93', '94', '95', '98']

      /** Un telefono E.164 (`+573000000000`) como se lee: `+57 300 000 0000`. El codigo
       *  de pais aparte y el resto en grupos de tres, con el ultimo de cuatro. Lo que no
       *  tiene forma de telefono vuelve tal cual: mejor crudo que inventado. */
      function formatearTelefono (e164) {
        var digitos = String(e164 == null ? '' : e164).replace(/^\+/, '')
        if (!/^\d{8,15}$/.test(digitos)) return String(e164 == null ? '' : e164)
        var largo = CODIGOS_PAIS_1.indexOf(digitos.slice(0, 1)) !== -1 ? 1
          : CODIGOS_PAIS_2.indexOf(digitos.slice(0, 2)) !== -1 ? 2 : 3
        var resto = digitos.slice(largo)
        var grupos = []
        while (resto.length > 4 && resto.length !== 8) {
          grupos.push(resto.slice(0, 3))
          resto = resto.slice(3)
        }
        if (resto.length === 8) grupos.push(resto.slice(0, 4), resto.slice(4))
        else if (resto) grupos.push(resto)
        return '+' + digitos.slice(0, largo) + ' ' + grupos.join(' ')
      }

      /** El telefono de un directo, ya formateado, o ''. WhatsApp guarda los directos con
       *  un id interno (`@lid`) y ya no muestra el numero: sin esto el dueno no distingue
       *  uno de otro. El propio no lo lleva: es el de la linea. */
      function telefonoVisible (c) {
        return c && c.kind === 'directo' && !c.own && c.phone ? formatearTelefono(c.phone) : ''
      }

      /** Como se llama una conversacion en pantalla. El chat de la linea consigo misma
       *  (`own`, T10) se nombra como en WhatsApp —"<nombre> (tu)"— y nunca con su jid
       *  pelado: sin nombre de linea conocido es "Su propio chat". Un directo sin nombre
       *  se llama como su telefono, si se sabe, y no como su id interno. */
      function nombreVisible (c) {
        if (!c) return ''
        if (c.own) {
          var propio = c.name && String(c.name).indexOf('@') === -1 ? c.name : ''
          return propio ? propio + ' ' + t('chatOwnTag') : t('chatOwnNoName')
        }
        if ((!c.name || c.name === c.jid) && telefonoVisible(c)) return telefonoVisible(c)
        return c.name || c.jid
      }

      /** Lo que acompana el nombre en la lista: el telefono, con que modo quedo, y el
       *  desempate. */
      function detalleChat (c, repetido) {
        var partes = []
        var telefono = telefonoVisible(c)
        if (telefono && telefono !== nombreVisible(c)) partes.push(telefono)
        var modo = modoDe(c.jid)
        // El modo va EN la opcion y no solo en la tabla: quien busca una conversacion
        // para cambiarla necesita saber como quedo sin cambiar de seccion.
        if (modo) partes.push(porCodigo(MODE_KEY, modo, modo))
        // Y el desempate aparece SOLO cuando hay dos que se llaman igual. Ponerlo
        // siempre ensuciaria 296 renglones para resolver un choque que casi nunca hay.
        if (repetido) partes.push(colaDeJid(c.jid))
        return partes.length ? '· ' + partes.join(' · ') : ''
      }

      // Cada numero, su linea (T9). `cuentaVinculada` es el numero que dice el sidecar
      // (`sidecar.cuenta`); `chatsCuenta`, de que numero es la lista guardada. Lo de otro
      // numero queda guardado pero no se ofrece ni se lista: tras vincular un numero
      // nuevo, el panel mostraba las 305 conversaciones y las autorizaciones del viejo.
      // Sin numero conocido (un worker de antes) no se filtra nada.
      var cuentaVinculada = null
      var chatsCuenta = null
      function deEstaLinea (cuenta) {
        return !cuentaVinculada || (cuenta || 'local') === cuentaVinculada
      }

      /** Los digitos del telefono de un directo, o '': la llave que junta sus dos formas. */
      function telefonoDeFila (c) {
        return c && c.kind === 'directo' && !c.own && c.phone
          ? String(c.phone).replace(/\D/g, '') : ''
      }

      function renderChats (chats) {
        chatsTodos = Array.isArray(chats) && deEstaLinea(chatsCuenta) ? chats.slice() : []
        // El chat propio primero, como en WhatsApp (T10). `sort` estable: el resto
        // conserva el orden que trae la lista.
        chatsTodos.sort(function (a, b) { return (b.own ? 1 : 0) - (a.own ? 1 : 0) })
        chatsPorJid = {}
        buscaPorJid = {}
        actualDeJid = {}
        gemelosDe = {}
        // Todas quedan en `chatsPorJid`: editar una autorizacion que quedo en la forma vieja
        // la tiene que poder nombrar. La viva de cada telefono es la de `last` mas reciente.
        var vivaDe = {}
        chatsTodos.forEach(function (c) {
          chatsPorJid[c.jid] = c
          var tel = telefonoDeFila(c)
          if (tel && (!vivaDe[tel] || String(c.last || '') > String(vivaDe[tel].last || ''))) {
            vivaDe[tel] = c
          }
        })
        chatsTodos = chatsTodos.filter(function (c) {
          var tel = telefonoDeFila(c)
          if (!tel || vivaDe[tel] === c) return true
          actualDeJid[c.jid] = vivaDe[tel].jid
          gemelosDe[vivaDe[tel].jid] = (gemelosDe[vivaDe[tel].jid] || []).concat(c.jid)
          return false
        })
        chatsTodos.forEach(function (c) {
          // El jid entra al indice: hay grupos que comparten nombre y la llave es lo
          // unico que los distingue. El telefono entra formateado y en digitos seguidos:
          // "300 777" y "3007776655" son las dos formas en que se copia de la agenda.
          buscaPorJid[c.jid] = aplanar(nombreVisible(c)) + ' ' + aplanar(c.jid) +
            (gemelosDe[c.jid] || []).map(function (g) { return ' ' + aplanar(g) }).join('') +
            (telefonoVisible(c) ? ' ' + aplanar(telefonoVisible(c)) + ' ' +
              String(c.phone).replace(/\D/g, '') : '')
        })
        pintarChats()
      }

      /** Las conversaciones que ofrece el autocompletar con lo escrito. */
      function filtrarChats (terminos) {
        return terminos.length
          ? chatsTodos.filter(function (c) {
              var texto = buscaPorJid[c.jid] || ''
              return terminos.every(function (x) { return texto.indexOf(x) !== -1 })
            })
          : chatsTodos
      }

      function opcionesDeChats (terminos) {
        if (!chatsTodos.length) return { items: [], vacio: estadoVacio(estadoSync).corto }
        var visibles = filtrarChats(terminos)
        if (!visibles.length) return { items: [], vacio: t('chatNoMatch') }
        // Nombres repetidos ENTRE LAS QUE SE VEN: dos homonimos que el filtro no puso
        // juntos no se confunden con nada.
        var repetidos = {}
        visibles.forEach(function (c) {
          var k = aplanar(c.name || c.jid)
          repetidos[k] = (repetidos[k] || 0) + 1
        })
        var item = function (grupo) {
          return function (c) {
            return { value: c.jid, nombre: nombreVisible(c), grupo: grupo,
              kind: t(c.kind === 'grupo' ? 'kindGroup' : 'kindDirect'),
              sub: detalleChat(c, repetidos[aplanar(c.name || c.jid)] > 1) }
          }
        }
        // Lo autorizado, arriba y aparte. Con 296 filas las tres que importan son
        // invisibles, y son justo las que el dueno vuelve a abrir. Sin ninguna
        // autorizada, un unico titulo "Sin autorizar" no dice nada: es ruido.
        var conModo = visibles.filter(function (c) { return !!modoDe(c.jid) })
        if (!conModo.length) return { items: visibles.map(item(null)) }
        var sinModo = visibles.filter(function (c) { return !modoDe(c.jid) })
        return { items: conModo.map(item(t('chatGroupOn')))
          .concat(sinModo.map(item(t('chatGroupOff')))) }
      }

      var comboChats = crearCombo({
        input: 'chat-search', lista: 'chat-list',
        opciones: opcionesDeChats,
        elegir: function (item) { pickChat(item.value, item.nombre) },
        alEscribir: function () {
          // Lo escrito ya no es lo elegido: se suelta, y se autoriza solo lo que se ve.
          if (!editandoJid && chatElegido && el('chat-search').value !== el('chat').value) {
            chatElegido = ''
            el('chat').value = ''
            pintarIdentidad()
          }
          pintarCuenta()
        }
      })

      /** El renglon de debajo del buscador: el estado de la lista si no hay ninguna, y
       *  cuantas quedaron si se esta filtrando ("214 de 214" no le dice nada a nadie). */
      function pintarCuenta () {
        var n = el('chat-count')
        if (!chatsTodos.length) { n.textContent = estadoVacio(estadoSync).corto; return }
        var terminos = comboChats.escribiendo() && !chatElegido
          ? aplanar(el('chat-search').value).split(' ').filter(Boolean) : []
        n.textContent = terminos.length
          ? t('chatCount').replace('{n}', filtrarChats(terminos).length)
            .replace('{total}', chatsTodos.length)
          : ''
      }

      function pintarChats () {
        pintarEstadoSync()
        pintarCuenta()
        // El campo NO se toca: es lo que el dueno esta escribiendo. Solo se redibuja la
        // lista, si esta abierta, con el mismo filtro y la misma opcion activa.
        comboChats.refrescar()
        if (editandoJid) pickChat(editandoJid, (chatsPorJid[editandoJid] || {}).name)
        else pintarIdentidad()
      }

      /** La identidad de lo que quedo elegido, debajo del selector.
       *
       *  §11-A1: la llave es `(cuenta, jid)` y el nombre visible NO es identidad —
       *  cambia y se repite. Antes de darle permiso a un agente sobre la conversacion
       *  de un cliente, lo que hay que poder mirar es la llave, no la etiqueta. Y si ya
       *  tenia permiso, tambien: guardar encima de una autorizacion sin saberlo es la
       *  otra mitad del mismo error. */
      function pintarIdentidad () {
        // Las personas de la conversacion siguen a la que quedo elegida (roles-por-numero).
        pintarPersonas()
        var jid = editandoJid || chatElegido
        // La llave que se va a guardar: la de la forma viva cuando la hay.
        if (jid) jid = destinoDe(jid, alcancePorJid)
        var n = el('chat-id')
        if (!jid) { n.textContent = ''; return }
        var c = chatsPorJid[jid]
        // El propio no muestra su jid: es el chat de la linea consigo misma (T10).
        var partes = [c && c.own ? nombreVisible(c) : jid]
        if (telefonoVisible(c)) partes.push(telefonoVisible(c))
        if (c && c.last) partes.push(c.last)
        var modo = modoDe(jid)
        if (modo) partes.push(fmt('chatAlready', { m: porCodigo(MODE_KEY, modo, modo) }))
        n.textContent = partes.join(' · ')
      }

      // ---------- proyectos (T12) ----------
      // El catalogo vive en storage (`projects`, lo escribe el worker) y las propuestas en
      // `projectsStatus`. El panel NO sabe de Orca: pide por el canal del worker -el mismo
      // del alcance, para no sumar un sondeo- y pinta lo que el worker deja.
      var proyectos = []
      var catalogoLeido = false, propuestasLeidas = false
      var estadoPropuestas = null
      var proyectosJson = null
      // Lo ultimo que se pinto de cada tabla que NOMBRA un proyecto: cuando el catalogo
      // cambia se repintan, o seguirian mostrando el id donde ya hay un nombre.
      var scopeCrudo = null, reglasCrudas = null

      // Los motivos que puede traer un pedido de proyectos, por CODIGO: el worker no sabe
      // en que idioma esta el usuario. Lo que el panel no conozca cae en el generico.
      var PROY_HOW_KEY = {
        'sin-cli-orca': 'projNoCli', 'sin-herramientas': 'projNoCli',
        'sin-permiso': 'projNoPerm', 'demoro': 'projSlow', 'fallo': 'projFail',
        'sin-json': 'projNoJson', 'sin-cambios': 'projNoChange',
        'proyecto-no-existe': 'projGone', 'catalogo-lleno': 'projFull',
        'argumentos-invalidos': 'projFail', 'vencido': 'projFail',
        'accion-desconocida': 'projFail'
      }

      function escAttr(text) { return esc(text).replace(/"/g, '&quot;') }

      /** El nombre de un proyecto para una tabla, escapado. Uno que el dueno quito se
       *  sigue diciendo por su id y se marca: la conversacion lo conserva, puede volver. */
      function nombreDeProyecto(id) {
        if (!id) return '—'
        var p = proyectos.filter(function (x) { return x.id === id })[0]
        return p ? esc(p.name || p.id) : esc(fmt('workspaceMissing', { id: id }))
      }

      /** El nombre de un proyecto para un campo de texto, sin escapar. */
      function nombreDeProyectoPlano(id) {
        if (!id) return t('workspaceNone')
        var p = proyectos.filter(function (x) { return x.id === id })[0]
        return p ? (p.name || p.id) : fmt('workspaceMissing', { id: id })
      }

      /** Los proyectos que ofrece un autocompletar de proyecto, con lo escrito. `actual` es
       *  el que tiene elegido: uno que el dueno quito del catalogo se sigue ofreciendo,
       *  marcado, para que guardar sin tocarlo no lo borre — puede volver. */
      function opcionesDeProyectos(terminos, conNinguno, actual) {
        var items = []
        if (conNinguno) items.push({ value: '', nombre: t('workspaceNone') })
        proyectos.forEach(function (p) {
          items.push({ value: p.id, nombre: p.name || p.id, sub: p.path || '' })
        })
        if (actual && !proyectos.some(function (p) { return p.id === actual })) {
          items.push({ value: actual, nombre: fmt('workspaceMissing', { id: actual }) })
        }
        if (terminos.length) {
          items = items.filter(function (i) {
            var texto = aplanar(i.nombre) + ' ' + aplanar(i.value)
            return terminos.every(function (x) { return texto.indexOf(x) !== -1 })
          })
        }
        return { items: items, vacio: t('workspaceNoMatch') }
      }

      /** El autocompletar de proyecto de la regla: el valor elegido vive en un campo oculto
       *  (`#r-workspace`). */
      function comboDeProyecto(prefijo, conNinguno) {
        // Escribir sin elegir no cambia el proyecto: al salir del campo vuelve a decir el
        // que de verdad quedo elegido, que es el que se guarda.
        el(prefijo + '-search').addEventListener('blur', function () {
          combo.olvidar()
          var v = el(prefijo).value
          el(prefijo + '-search').value = v || conNinguno ? nombreDeProyectoPlano(v) : ''
        })
        var combo = crearCombo({
          input: prefijo + '-search', lista: prefijo + '-list',
          opciones: function (terminos) {
            return opcionesDeProyectos(terminos, conNinguno, el(prefijo).value)
          },
          elegir: function (item) {
            el(prefijo).value = item.value
            el(prefijo + '-search').value = conNinguno || item.value
              ? nombreDeProyectoPlano(item.value) : ''
          }
        })
        return combo
      }

      // ---------- los proyectos de una conversacion (proyectos-por-chat, M6) ----------
      // Una conversacion guarda una LISTA ordenada (`workspaces`) y, al lado, `workspace`
      // derivado: el unico id con uno, null con cero o con dos o mas. Se guardan las dos en
      // cada guardado, porque el CLI confia en la lista solo si el `workspace` de al lado
      // es su derivado: si no, un panel o un CLI de antes cambio `workspace` y dejo la
      // lista vieja, y gana `workspace` (`lista_de_proyectos`, bin/wa-scope).
      function sinRepetir(xs) {
        var vistos = {}
        return xs.filter(function (x) {
          if (typeof x !== 'string' || !x || vistos[x]) return false
          vistos[x] = true
          return true
        })
      }
      function derivadoDe(lista) { return lista.length === 1 ? lista[0] : null }
      /** La lista de proyectos de una entrada del alcance, con la misma regla que el CLI. */
      function listaDeEntrada(entry) {
        if (!entry || typeof entry !== 'object') return []
        var uno = typeof entry.workspace === 'string' && entry.workspace ? entry.workspace : null
        if (Array.isArray(entry.workspaces)) {
          var lista = sinRepetir(entry.workspaces)
          if (!('workspace' in entry) || derivadoDe(lista) === uno) return lista
        }
        return uno ? [uno] : []
      }

      // Las filas del formulario, en orden: '' es una fila sin elegir. La primera vive en
      // los controles de siempre (`#workspace-search`, `#workspace`); las demas se arman en
      // `#workspace-more` con el mismo autocompletar.
      var filasProyecto = ['']
      var combosExtra = []
      function nombreDeFila(i) {
        var v = filasProyecto[i]
        if (v) return nombreDeProyectoPlano(v)
        return i === 0 && filasProyecto.length === 1 ? t('workspaceNone') : ''
      }
      /** Lo que ofrece la fila `i`: el catalogo menos lo que eligieron las otras filas, su
       *  propio proyecto aunque el dueno lo haya quitado (marcado: puede volver), y "Sin
       *  proyecto" solo en la primera cuando es la unica — con dos o mas se quita con el
       *  boton de la fila. */
      function opcionesDeFila(terminos, i) {
        var actual = filasProyecto[i]
        var otros = filasProyecto.filter(function (v, j) { return j !== i && v })
        var items = []
        if (i === 0 && filasProyecto.length === 1) items.push({ value: '', nombre: t('workspaceNone') })
        proyectos.forEach(function (p) {
          if (otros.indexOf(p.id) === -1) items.push({ value: p.id, nombre: p.name || p.id, sub: p.path || '' })
        })
        if (actual && !proyectos.some(function (p) { return p.id === actual })) {
          items.push({ value: actual, nombre: fmt('workspaceMissing', { id: actual }) })
        }
        if (terminos.length) {
          items = items.filter(function (it) {
            var texto = aplanar(it.nombre) + ' ' + aplanar(it.value)
            return terminos.every(function (x) { return texto.indexOf(x) !== -1 })
          })
        }
        return { items: items, vacio: t('workspaceNoMatch') }
      }
      /** La fila dice lo elegido; un nombre largo que el campo corta se lee entero en el
       *  title. */
      function mostrarFila(i) {
        var campo = campoDeFila(i)
        if (!campo) return
        campo.value = nombreDeFila(i)
        campo.title = filasProyecto[i] ? campo.value : ''
      }
      function campoDeFila(i) { return el(i === 0 ? 'workspace-search' : 'workspace-search-' + (i + 1)) }
      function elegirEnFila(i, valor) {
        if (i === 0 && !valor) filasProyecto = ['']
        else filasProyecto[i] = valor
        el('workspace').value = filasProyecto[0]
        var oculto = i > 0 ? el('workspace-' + (i + 1)) : null
        if (oculto) oculto.value = valor
        mostrarFila(i)
        pintarControlesDeFilas()
      }
      /** Quita la fila `i`; la de abajo sube. El foco va a la fila que queda en su lugar o a
       *  la de arriba (`arriba`), nunca se pierde en la pagina. */
      function quitarFila(i, arriba) {
        filasProyecto.splice(i, 1)
        if (!filasProyecto.length) filasProyecto = ['']
        el('workspace').value = filasProyecto[0]
        comboProyecto.olvidar()
        mostrarFila(0)
        pintarFilasExtra()
        var destino = campoDeFila(Math.max(0, Math.min(arriba ? i - 1 : i, filasProyecto.length - 1)))
        if (destino) destino.focus()
      }
      function agregarFila() {
        filasProyecto.push('')
        pintarFilasExtra()
        var i = filasProyecto.length - 1
        var campo = campoDeFila(i)
        if (campo) campo.focus()
        if (combosExtra[i - 1]) combosExtra[i - 1].abrir()
      }
      /** Lo que depende de cuantas filas hay: quitar la primera, agregar otra y a quien se
       *  pregunta. No rehace las filas: el foco y lo escrito se quedan donde estan. */
      function pintarControlesDeFilas() {
        var varias = filasProyecto.length > 1
        var rm = el('workspace-rm')
        rm.hidden = !varias
        rm.setAttribute('aria-label', fmt('workspaceRemove', { name: nombreDeFila(0) }))
        Array.prototype.forEach.call(el('workspace-more').querySelectorAll('[data-wsrm]'), function (b) {
          b.setAttribute('aria-label', fmt('workspaceRemove',
            { name: nombreDeFila(Number(b.getAttribute('data-wsrm')) - 1) || t('workspaceNone') }))
        })
        var ultima = filasProyecto[filasProyecto.length - 1]
        var quedan = proyectos.some(function (p) { return filasProyecto.indexOf(p.id) === -1 })
        el('workspace-add').hidden = !ultima || !quedan
        el('project-question-wrap').hidden = filasProyecto.filter(Boolean).length < 2
      }
      /** Rehace las filas 2..N con sus autocompletar. */
      function pintarFilasExtra() {
        var caja = el('workspace-more')
        caja.textContent = ''
        combosExtra = []
        filasProyecto.slice(1).forEach(function (valor, k) {
          var i = k + 1, n = i + 1
          var fila = document.createElement('div')
          fila.className = 'ws-fila'
          fila.innerHTML = '<div class="combo"><input id="workspace-search-' + n + '" type="text" ' +
            'autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" ' +
            'aria-expanded="false" aria-controls="workspace-list-' + n + '" /><div ' +
            'class="combo-list" id="workspace-list-' + n + '" role="listbox" hidden></div></div>' +
            '<input type="hidden" id="workspace-' + n + '" /><button type="button" ' +
            'class="link ws-quitar" data-wsrm="' + n + '"></button>'
          caja.appendChild(fila)
          var campo = el('workspace-search-' + n)
          var rotulo = fmt('workspaceRow', { n: n })
          campo.setAttribute('aria-label', rotulo)
          campo.placeholder = t('workspaceSearchPh')
          el('workspace-list-' + n).setAttribute('aria-label', rotulo)
          el('workspace-' + n).value = valor
          mostrarFila(i)
          var boton = fila.querySelector('[data-wsrm]')
          boton.textContent = t('remove')
          boton.addEventListener('click', function () { quitarFila(i, false) })
          var combo = crearCombo({
            input: 'workspace-search-' + n, lista: 'workspace-list-' + n,
            opciones: function (terminos) { return opcionesDeFila(terminos, i) },
            elegir: function (item) { elegirEnFila(i, item.value) }
          })
          campo.addEventListener('blur', function () {
            combo.olvidar()
            mostrarFila(i)
          })
          // Retroceso en una fila que no eligio nada la quita: lo que se agrego sin querer
          // se saca con el teclado, sin buscar el boton.
          campo.addEventListener('keydown', function (e) {
            if (e.key === 'Backspace' && !campo.value && !filasProyecto[i]) {
              e.preventDefault()
              quitarFila(i, true)
            }
          })
          combosExtra.push(combo)
        })
        pintarControlesDeFilas()
      }
      var comboProyecto = crearCombo({
        input: 'workspace-search', lista: 'workspace-list',
        opciones: function (terminos) { return opcionesDeFila(terminos, 0) },
        elegir: function (item) { elegirEnFila(0, item.value) }
      })
      // Escribir sin elegir no cambia el proyecto: al salir del campo vuelve a decir el que
      // de verdad quedo elegido, que es el que se guarda.
      el('workspace-search').addEventListener('blur', function () {
        comboProyecto.olvidar()
        mostrarFila(0)
      })
      el('workspace-rm').addEventListener('click', function () { quitarFila(0, false) })
      el('workspace-add').addEventListener('click', agregarFila)
      var comboRegla = comboDeProyecto('r-workspace', false)

      /** La celda de la tabla: el primero y cuantos mas ("A +N"), con la lista entera en el
       *  title y para el lector de pantalla. Escapada. */
      function celdaDeProyectos(lista) {
        if (lista.length < 2) return nombreDeProyecto(lista[0])
        var nombres = lista.map(nombreDeProyectoPlano)
        return '<span class="ws-cel" title="' + escAttr(nombres.join(', ')) + '">' +
          esc(nombres[0]) + ' <span class="ws-mas" aria-hidden="true">+' + (lista.length - 1) +
          '</span><span class="sr-only"> ' + esc(fmt('workspaceMore',
            { list: nombres.slice(1).join(', ') })) + '</span></span>'
      }

      /** Los autocompletar que ofrecen proyectos: los de la conversacion y el de cada regla.
       *  `lista` es lo que debe quedar elegido en la conversacion; sin ella se conserva lo
       *  que habia. Lo que el dueno esta escribiendo no se pisa. */
      function pintarSelectoresDeProyecto(lista) {
        var forzar = lista !== undefined
        if (forzar) {
          filasProyecto = sinRepetir(lista || [])
          if (!filasProyecto.length) filasProyecto = ['']
          el('workspace').value = filasProyecto[0]
          comboProyecto.olvidar()
          comboProyecto.cerrar()
          pintarFilasExtra()
        } else {
          combosExtra.forEach(function (c, k) {
            if (!c.escribiendo()) mostrarFila(k + 1)
            c.refrescar()
          })
          pintarControlesDeFilas()
        }
        if (forzar || !comboProyecto.escribiendo()) mostrarFila(0)
        comboProyecto.refrescar()
        el('workspace-hint').textContent = t(proyectos.length ? 'workspaceHint'
          : 'workspaceHintNoProjects')
        // La regla solo apunta a un proyecto del catalogo: uno quitado se suelta.
        var rs = el('r-workspace')
        if (rs.value && !proyectos.some(function (p) { return p.id === rs.value })) rs.value = ''
        if (!comboRegla.escribiendo()) {
          el('r-workspace-search').value = rs.value ? nombreDeProyectoPlano(rs.value) : ''
        }
        el('r-workspace-search').disabled = !proyectos.length
        comboRegla.refrescar()
        el('route-hint').textContent = proyectos.length ? '' : t('routesNeedProject')
      }

      function renderProjects(lista, forzar) {
        var nuevo = Array.isArray(lista) ? lista.filter(function (p) {
          return p && typeof p === 'object' && typeof p.id === 'string'
        }) : []
        var firma = JSON.stringify(nuevo)
        // Sin cambios no se toca el DOM: una nota a medio escribir no se pierde porque
        // el sondeo volvio a leer lo mismo.
        if (!forzar && catalogoLeido && firma === proyectosJson) return
        var cambio = proyectosJson !== null && firma !== proyectosJson
        proyectos = nuevo
        proyectosJson = firma
        catalogoLeido = true
        var caja = el('projects-wrap')
        if (!proyectos.length) {
          caja.innerHTML = '<p class="empty">' + t('projectsEmpty') + '</p>'
        } else {
          caja.innerHTML = proyectos.map(function (p) {
            return '<div class="proj"><div class="proj-head"><b>' + esc(p.name || p.id) +
              '</b><button class="link" data-prm="' + escAttr(p.id) + '">' + t('remove') +
              '</button></div><code class="proj-path">' + esc(p.path || '') + '</code>' +
              '<div class="proj-note"><input data-pnote="' + escAttr(p.id) +
              '" maxlength="300" value="' + escAttr(p.note || '') + '" placeholder="' +
              escAttr(t('projectsNotePh')) + '" aria-label="' + escAttr(t('projectsNotePh')) +
              '" /><button class="link" data-psave="' + escAttr(p.id) + '">' +
              t('projectsSaveNote') + '</button></div></div>'
          }).join('')
          Array.prototype.forEach.call(caja.querySelectorAll('[data-prm]'), function (b) {
            b.addEventListener('click', function () {
              pedirProyectos('proyectos-quitar', { project: b.dataset.prm }, b, 'projectRemoved')
            })
          })
          Array.prototype.forEach.call(caja.querySelectorAll('[data-psave]'), function (b) {
            b.addEventListener('click', function () {
              var campo = caja.querySelector('[data-pnote="' + b.dataset.psave + '"]')
              pedirProyectos('proyectos-nota',
                { project: b.dataset.psave, note: campo ? campo.value : '' }, b, 'projectNoteSaved')
            })
          })
        }
        pintarSelectoresDeProyecto()
        if (cambio || forzar) {
          if (scopeCrudo) renderScope(scopeCrudo)
          if (reglasCrudas) renderRoutes(reglasCrudas)
        }
      }

      function horaDe(iso) {
        var d = new Date(iso)
        if (isNaN(d.getTime())) return ''
        try { return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) } catch (e) { return '' }
      }

      /** Lo que Orca propone, o por que no se pudo preguntar. Un fallo NO se pinta como
       *  "no hay propuestas": son dos cosas opuestas y la segunda mandaria al dueno a dar
       *  por revisado un catalogo que nadie reviso. */
      function renderProposals(st) {
        estadoPropuestas = st
        propuestasLeidas = true
        var caja = el('proposals-wrap')
        var linea = el('projects-status')
        linea.className = 'hint'
        if (!st || typeof st !== 'object') {
          linea.textContent = t('projectsNotAsked'); caja.innerHTML = ''; return
        }
        if (st.ok === false) {
          linea.className = 'hint mal'
          linea.textContent = porCodigo(PROY_HOW_KEY, st.reason, '') || t('projFail')
          caja.innerHTML = ''
          return
        }
        var lista = Array.isArray(st.proposals) ? st.proposals.filter(function (p) {
          return p && typeof p.id === 'string'
        }) : []
        var cuando = st.at ? fmt('projectsChecked', { h: horaDe(st.at) }) : ''
        linea.textContent = (lista.length ? t('projectsProposed') : t('projectsNoNew')) +
          (cuando ? ' · ' + cuando : '')
        caja.innerHTML = lista.map(function (p) {
          return '<div class="proj"><div class="proj-head"><b>' + esc(p.name || p.id) +
            '</b><button class="link" data-padd="' + escAttr(p.id) + '">' + t('projectsAdd') +
            '</button></div><code class="proj-path">' + esc(p.path || '') + '</code></div>'
        }).join('')
        Array.prototype.forEach.call(caja.querySelectorAll('[data-padd]'), function (b) {
          b.addEventListener('click', function () {
            pedirProyectos('proyectos-aceptar', { ids: [b.dataset.padd] }, b, 'projectAdded')
          })
        })
      }

      /** Lo que depende del idioma, otra vez: cambiar de idioma no recarga los datos. */
      function repintarProyectos() {
        if (catalogoLeido) renderProjects(proyectos, true)
        else pintarSelectoresDeProyecto()
        if (propuestasLeidas) renderProposals(estadoPropuestas)
      }

      function recargarProyectos() {
        return Promise.all([read('projects', true), read('projectsStatus', true)])
          .then(function (rs) {
            if (hayRespuesta(rs[0])) renderProjects(rs[0])
            if (hayRespuesta(rs[1])) renderProposals(rs[1])
          })
      }

      /** Un pedido al worker sobre los proyectos y SU veredicto. Nada se anuncia hasta
       *  que el worker contesta: agregar, quitar y anotar los hace el, y un "✓"
       *  inmediato diria hecho algo que todavia no paso. */
      function pedirProyectos(accion, extra, boton, hecho) {
        var pedir = pedirAlWorker('scopeRequest', 'scopeResult',
          Object.assign({ action: accion }, extra || {})).then(function (v) {
          if (!v) { said('said-projects', t('pairingNoAnswer'), true); return }
          if (!v.ok) {
            said('said-projects', porCodigo(PROY_HOW_KEY, v.code, '') || t('projFail'), true)
          } else {
            said('said-projects', hecho ? '✓ ' + t(hecho) : '')
          }
          // Con exito o sin el se relee: un "ya no es propuesta" es justo la senal de que
          // la lista en pantalla quedo vieja.
          return recargarProyectos()
        })
        return boton ? busy(boton, pedir) : pedir
      }

      el('projects-refresh').addEventListener('click', function (event) {
        pedirProyectos('proyectos-refrescar', null, event.currentTarget, null)
      })

      // ---------- conversaciones ----------
      function renderScope(entries) {
        // El selector marca lo que ya esta autorizado, asi que esto es tambien su
        // fuente. Se guarda y se repinta aca en vez de pedir `scope` otra vez: el panel
        // ya lo lee en cada vuelta completa, y una lectura de mas sale del mismo cupo
        // de 30 mensajes por 10 s que el clic del usuario.
        scopeCrudo = entries
        var todas = entries && typeof entries === 'object' ? entries : {}
        // Solo las de la linea vinculada (T9); las de otro numero siguen en storage.
        entries = {}
        Object.keys(todas).forEach(function (jid) {
          if (deEstaLinea(todas[jid] && todas[jid].account)) entries[jid] = todas[jid]
        })
        alcancePorJid = entries
        pintarChats()
        if (typeof pintarAvisoNumero === 'function' && el('approval-number').childElementCount) {
          pintarAvisoNumero()
        }
        var keys = Object.keys(entries)
        if (!keys.length) {
          el('scope-wrap').innerHTML = '<p class="empty">' + t('empty') + '</p>'
          return
        }
        el('scope-wrap').innerHTML =
          '<table><thead><tr><th>' + t('colChat') + '</th><th>' + t('colProject') +
          '</th><th>' + t('colPerm') + '</th><th></th></tr></thead><tbody>' +
          keys.map(function (key) {
            var e = entries[key]
            return '<tr><td>' + esc(e.chatName || key) + '</td><td>' +
              celdaDeProyectos(listaDeEntrada(e)) + '</td><td>' +
              '<span class="pill ' + esc(e.mode || 'off') + '">' +
              esc(porCodigo(MODE_KEY, e.mode || 'off', e.mode)) +
              '</span></td><td class="acts">' +
              '<button class="link" data-edit="' + esc(key) + '">' + t('edit') + '</button>' +
              '<button class="link" data-rm="' + esc(key) + '">' + t('remove') + '</button>' +
              '</td></tr>'
          }).join('') + '</tbody></table>'

        Array.prototype.forEach.call(el('scope-wrap').querySelectorAll('[data-edit]'), function (b) {
          b.addEventListener('click', function () { startEdit(entries[b.dataset.edit], b.dataset.edit) })
        })
        Array.prototype.forEach.call(el('scope-wrap').querySelectorAll('[data-rm]'), function (b) {
          b.addEventListener('click', function () {
            var e = entries[b.dataset.rm]
            removeScope(b.dataset.rm, (e && e.chatName) || b.dataset.rm, b)
          })
        })
      }

      // Lo que hace cada modo, debajo de los botones: el nombre corto cabe en el boton y
      // la frase entera dice que pasa con los mensajes de esa conversacion.
      var MODE_DESC = { off: 'off', observar: 'observe', borrador: 'draft', responder: 'reply' }
      function pintarModo() {
        var m = valorSeg('mode')
        el('mode-desc').textContent = MODE_DESC[m] ? t(MODE_DESC[m]) : ''
      }
      el('mode').addEventListener('change', pintarModo)

      // A quien pregunta el agente "A o B?" (proyectos-por-chat, M5): lo que no sea uno de
      // los tres es `auto`, igual que en el CLI (`pregunta_del_panel`).
      var PREGUNTAS = ['auto', 'writer', 'owner']
      function preguntaDe(v) { return PREGUNTAS.indexOf(v) !== -1 ? v : 'auto' }

      // Los niveles de aprobacion de una conversacion (T22.3), con los mismos defectos que
      // bin/wa_reglas.py (NIVELES_DEFECTO): lo que no dice la entrada queda por defecto.
      var REGLAS_NIVEL = ['money', 'credential', 'commitment', 'quality']
      var NIVELES_DEFECTO = { money: 'ask', credential: 'ask', commitment: 'ask', quality: 'agent' }
      var NIVELES = ['ask', 'agent', 'allow']
      function ponerNiveles(aprobacion) {
        var a = aprobacion && typeof aprobacion === 'object' ? aprobacion : {}
        REGLAS_NIVEL.forEach(function (r) {
          ponerSeg('chat-ap-' + r, NIVELES.indexOf(a[r]) !== -1 ? a[r] : NIVELES_DEFECTO[r],
            NIVELES_DEFECTO[r])
        })
      }
      function nivelesDelFormulario() {
        var salida = {}
        REGLAS_NIVEL.forEach(function (r) {
          var v = valorSeg('chat-ap-' + r)
          salida[r] = NIVELES.indexOf(v) !== -1 ? v : NIVELES_DEFECTO[r]
        })
        return salida
      }

      // ---------- las personas de la conversacion y su rol (roles-por-numero, M11) ----------
      // `scope[jid].members` ([{id, name, role}]) guarda solo Operador y Super admin: Cliente
      // es no tener rol y nunca se escribe. El rol sale del NUMERO que el dueno marca aqui y
      // vale solo en esta conversacion; los numeros de confianza (`owners`) son Super admin
      // en todas y aqui solo se muestran. WhatsApp aprueba solo desde esos numeros.
      var ROLES = ['client', 'operator', 'admin']
      var ROLES_GUARDADOS = ['operator', 'admin']
      var ROL_TEXTO = { client: 'roleClient', operator: 'roleOperator', admin: 'roleAdmin' }
      // `groupMembers` de wa-scope sync: {jid: [{id, name, phone}]}, solo de los grupos del
      // alcance de la linea vinculada. Un directo no tiene entrada: su persona es el chat.
      var miembrosDeGrupos = {}
      // Los roles en edicion son de UNA conversacion (`rolesJid`); cambiarla los recarga.
      var rolesJid = null
      var rolesEnEdicion = {}
      var rolesOrden = []
      // Las filas pintadas, en orden: guardar escribe los roles en ese orden.
      var personasPintadas = []
      var firmaPersonas = ''

      function esIdDePersona (id) { return /^\d+@(lid|s\.whatsapp\.net)$/.test(id) }
      function esGrupo (jid) {
        var c = chatsPorJid[jid]
        return /@g\.us$/.test(jid) || !!(c && c.kind === 'grupo')
      }
      function renderGroupMembers (valor) {
        miembrosDeGrupos = valor && typeof valor === 'object' && !Array.isArray(valor) ? valor : {}
        pintarPersonas()
      }
      /** `groupMembers` no entra en la vuelta entera (CLAVES): el host admite 30 mensajes por
       *  10 s y esa vuelta ya gasta casi todos. Se lee al abrir un grupo en el formulario, y
       *  otra vez en cada vuelta mientras siga abierto, que es cuando puede llegar la lista
       *  de un grupo recien autorizado. Una sola lectura en vuelo a la vez. */
      var leyendoMiembros = false
      function leerMiembros () {
        if (leyendoMiembros) return
        leyendoMiembros = true
        read('groupMembers', true).then(function (v) {
          leyendoMiembros = false
          if (hayRespuesta(v)) renderGroupMembers(v)
        }, function () { leyendoMiembros = false })
      }
      function leerMiembrosSiHaceFalta () {
        var jid = editandoJid || chatElegido
        if (jid && esGrupo(jid)) leerMiembros()
      }
      /** Los roles guardados de la conversacion, como los lee el CLI (`miembros_del_panel`):
       *  un id de persona y un rol que se guarda; lo demas se descarta. */
      function cargarRoles (jid) {
        rolesJid = jid
        rolesEnEdicion = {}
        rolesOrden = []
        var entrada = jid && alcancePorJid ? alcancePorJid[jid] : null
        var lista = entrada && Array.isArray(entrada.members) ? entrada.members : []
        lista.forEach(function (m) {
          var id = m && idSinDispositivo(m.id)
          if (!id || !esIdDePersona(id) || ROLES_GUARDADOS.indexOf(m.role) === -1) return
          if (!rolesEnEdicion[id]) rolesOrden.push(id)
          rolesEnEdicion[id] = { role: m.role, name: typeof m.name === 'string' ? m.name : '' }
        })
      }
      /** Un numero de confianza: por su id EXACTO, como lo decide el motor (`es_dueno`). El
       *  telefono que trae la lista (del par LID-telefono) no lo vuelve dueno por el otro id:
       *  esa persona se ve como cualquier otra, y el dueno le puede dar un rol aqui. */
      function esDuenoGuardado (id) {
        return duenosGuardados.some(function (d) { return d.id === id })
      }
      /** Las personas de la conversacion: la del directo, o los participantes del grupo.
       *  null cuando la conversacion no es de personas (no hay a quien darle un rol). */
      function personasDelChat (jid) {
        var c = chatsPorJid[jid]
        if (!esGrupo(jid)) {
          var id = idSinDispositivo(jid)
          if (!esIdDePersona(id)) return null
          var tel = c && c.phone ? c.phone
            : /@s\.whatsapp\.net$/.test(id) ? '+' + id.split('@')[0] : ''
          return [{ id: id, name: c && c.name && c.name !== c.jid ? c.name : '',
            phone: c && c.own ? '' : tel, own: !!(c && c.own) }]
        }
        var lista = Array.isArray(miembrosDeGrupos[jid]) ? miembrosDeGrupos[jid] : []
        var vistos = {}
        var filas = []
        lista.forEach(function (m) {
          var id = m && idSinDispositivo(m.id)
          if (!id || vistos[id] || !esIdDePersona(id)) return
          vistos[id] = true
          filas.push({ id: id, name: typeof m.name === 'string' ? m.name : '',
            phone: typeof m.phone === 'string' ? m.phone : '' })
        })
        return filas
      }
      function filaDePersona (f) {
        var tel = f.phone ? formatearTelefono(f.phone) : ''
        var nombre = f.name || tel || f.id
        var subs = []
        if (tel && f.name) subs.push(tel)
        if (f.gone) subs.push(t('peopleGone'))
        var fijo = f.own ? 'own' : esDuenoGuardado(f.id) ? 'owner' : ''
        var rol = (rolesEnEdicion[f.id] || {}).role || 'client'
        var busca = aplanar([nombre, f.name, tel, String(f.phone || '').replace(/\D/g, ''), f.id].join(' '))
        var html = '<div class="persona" role="listitem" data-id="' + escAttr(f.id) +
          '" data-busca="' + escAttr(busca) + '"><div class="persona-quien">' +
          '<span class="persona-nombre">' + esc(nombre) + '</span>' +
          (subs.length ? '<span class="persona-sub">' + esc(subs.join(' · ')) + '</span>' : '')
        // Un numero de confianza (o el chat de la linea consigo misma): Super admin fijo, con
        // el porque debajo del nombre y, para cambiarlo, el boton a Su aprobacion.
        if (fijo) {
          return html + '<span class="persona-sub persona-nota">' +
            esc(t(fijo === 'own' ? 'peopleOwnLine' : 'peopleOwner')) +
            (fijo === 'owner' ? ' <button type="button" class="link" data-ir="aprobacion">' +
              esc(fmt('peopleOwnersGo', { tab: t('tabAprobacion') })) + '</button>' : '') +
            '</span></div><span class="rol-fijo">' + esc(t('roleAdmin')) + '</span></div>'
        }
        html += '</div>'
        return html + '<div class="seg" role="group" aria-label="' +
          escAttr(fmt('peopleRoleOf', { name: nombre })) + '">' + ROLES.map(function (r) {
            return '<button type="button" data-value="' + r + '" aria-pressed="' +
              (r === rol ? 'true' : 'false') + '">' + esc(t(ROL_TEXTO[r])) + '</button>'
          }).join('') + '</div></div>'
      }
      /** La tarjeta de personas de la conversacion elegida. Se repinta solo si cambio lo que
       *  muestra: el sondeo repinta los chats cada pocos segundos, y rehacer las filas le
       *  quitaria el foco a quien esta eligiendo un rol con el teclado. */
      function pintarPersonas () {
        var caja = el('people-wrap')
        var jid = editandoJid || chatElegido
        var filas = jid ? personasDelChat(jid) : null
        if (!filas) {
          caja.hidden = true
          el('people-list').innerHTML = ''
          personasPintadas = []
          firmaPersonas = ''
          return
        }
        if (rolesJid !== jid) {
          cargarRoles(jid)
          if (esGrupo(jid)) leerMiembros()
        }
        var grupo = esGrupo(jid)
        // Sin la lista del grupo todavia (recien autorizado, o antes del primer sync), los
        // que ya tienen rol se ven igual: no se pierden al guardar.
        var pendiente = grupo && !filas.length
          ? (editandoJid === jid || (alcancePorJid && alcancePorJid[jid]) ? 'guardado' : 'nuevo')
          : ''
        var ids = {}
        filas.forEach(function (f) { ids[f.id] = true })
        rolesOrden.forEach(function (id) {
          if (ids[id] || !rolesEnEdicion[id]) return
          ids[id] = true
          filas.push({ id: id, name: rolesEnEdicion[id].name, phone: '', gone: !pendiente })
        })
        var firma = JSON.stringify([jid, filas, rolesEnEdicion, duenosGuardados, pendiente])
        caja.hidden = false
        if (firma === firmaPersonas) return
        firmaPersonas = firma
        personasPintadas = filas.map(function (f) {
          return { id: f.id, name: f.name || (rolesEnEdicion[f.id] || {}).name || '' }
        })
        el('people-help').textContent = t('peopleHelp') + ' ' +
          t(grupo ? 'peopleHelpGroup' : 'peopleHelpDirect')
        el('people-search-wrap').hidden = !grupo || !filas.length
        var lista = el('people-list')
        lista.dataset.pendiente = pendiente
        lista.innerHTML = filas.map(filaDePersona).join('')
        Array.prototype.forEach.call(lista.querySelectorAll('.persona'), function (fila) {
          var id = fila.getAttribute('data-id')
          Array.prototype.forEach.call(fila.querySelectorAll('.seg button'), function (b) {
            b.addEventListener('click', function () {
              Array.prototype.forEach.call(fila.querySelectorAll('.seg button'), function (x) {
                apretar(x, x === b)
              })
              var rol = b.getAttribute('data-value')
              if (ROLES_GUARDADOS.indexOf(rol) === -1) {
                delete rolesEnEdicion[id]
              } else {
                var antes = rolesEnEdicion[id]
                rolesEnEdicion[id] = { role: rol, name: (antes && antes.name) ||
                  (personasPintadas.filter(function (p) { return p.id === id })[0] || {}).name || '' }
                if (rolesOrden.indexOf(id) === -1) rolesOrden.push(id)
              }
              // La firma sigue lo apretado: el proximo repintado no lo deshace ni lo repite.
              firmaPersonas = JSON.stringify([jid, filas, rolesEnEdicion, duenosGuardados, pendiente])
            })
          })
          var ir = fila.querySelector('button[data-ir]')
          if (ir) {
            ir.addEventListener('click', function () {
              pestanaElegida = true
              mostrarPestana(ir.getAttribute('data-ir'))
              var tarjeta = el('owners-card')
              if (tarjeta && tarjeta.scrollIntoView) tarjeta.scrollIntoView({ block: 'start' })
            })
          }
        })
        filtrarPersonas()
      }
      function filtrarPersonas () {
        var terminos = aplanar(el('people-search').value).split(' ').filter(Boolean)
        var filas = el('people-list').querySelectorAll('.persona')
        var vistas = 0
        Array.prototype.forEach.call(filas, function (f) {
          var texto = f.getAttribute('data-busca') || ''
          var si = terminos.every(function (x) { return texto.indexOf(x) !== -1 })
          f.hidden = !si
          if (si) vistas += 1
        })
        el('people-count').textContent = terminos.length && filas.length
          ? fmt('peopleCount', { n: vistas, total: filas.length }) : ''
        var vacio = el('people-empty')
        // Sin la lista del grupo: uno ya guardado no se guarda de nuevo, la lista llega sola.
        var pendiente = el('people-list').dataset.pendiente
        var mensaje = pendiente ? t(pendiente === 'guardado' ? 'peopleGroupPending' : 'peopleGroupEmpty')
          : filas.length && !vistas ? t('peopleNoMatch') : ''
        vacio.textContent = mensaje
        vacio.hidden = !mensaje
      }
      el('people-search').addEventListener('input', filtrarPersonas)
      /** Lo que se guarda en `members`: los de rol Operador o Super admin, en el orden de la
       *  lista. Los numeros de confianza no se agregan; si el CLI les guardo un rol, se
       *  conserva tal cual, porque aqui no se pueden tocar. */
      function miembrosDelFormulario (jid) {
        if (rolesJid !== jid) cargarRoles(jid)
        var orden = personasPintadas.map(function (p) { return p.id })
        rolesOrden.forEach(function (id) { if (orden.indexOf(id) === -1) orden.push(id) })
        return orden.filter(function (id) {
          return rolesEnEdicion[id] && ROLES_GUARDADOS.indexOf(rolesEnEdicion[id].role) !== -1
        }).map(function (id) {
          var pintada = personasPintadas.filter(function (p) { return p.id === id })[0]
          return { id: id, name: (pintada && pintada.name) || rolesEnEdicion[id].name || '',
            role: rolesEnEdicion[id].role }
        })
      }
      function olvidarPersonas () {
        rolesJid = null
        rolesEnEdicion = {}
        rolesOrden = []
        firmaPersonas = ''
        el('people-search').value = ''
      }

      function startEdit(entry, key) {
        if (!entry) return
        olvidarPersonas()
        editandoJid = key
        pickChat(key, entry.chatName || key)
        el('chat').value = entry.chatName || key
        // Mientras se edita, la conversacion no cambia: cambiarla seria otra autorizacion.
        el('chat-search').readOnly = true
        comboChats.cerrar()
        // Los proyectos de la conversacion, aunque alguno ya no este en la lista: se ofrece
        // como opcion propia de su fila para que guardar sin tocarlo no lo borre, que puede
        // volver.
        pintarSelectoresDeProyecto(listaDeEntrada(entry))
        ponerSeg('chat-project-question', preguntaDe(entry.projectQuestion), 'auto')
        el('chat-tone').value = entry.tone || ''
        el('chat-instructions').value = entry.instructions || ''
        ponerSeg('chat-ack', entry.ack, 'default')
        el('chat-ack-text').value = entry.ackText || ''
        ponerSeg('chat-greeting', entry.greeting, 'default')
        el('chat-greeting-text').value = entry.greetingText || ''
        ponerSeg('chat-first-reply', PRIMER_MODOS.indexOf(entry.firstReply) !== -1
          ? entry.firstReply : 'default', 'default')
        pintarPrimerVista()
        ponerNiveles(entry.approval)
        ponerSeg('mode', entry.mode, 'off')
        pintarModo()
        el('scope-form-title').textContent = t('formEditing')
        el('save-scope').textContent = t('saveEdit')
        el('cancel-edit').hidden = false
        said('said-scope', '')
        var form = el('scope-form')
        if (form.scrollIntoView) form.scrollIntoView({ block: 'start', behavior: 'smooth' })
      }
      function resetScopeForm() {
        editandoJid = ''
        chatElegido = ''
        el('chat').value = ''
        el('chat-search').value = ''
        el('chat-search').readOnly = false
        comboChats.olvidar()
        ponerSeg('mode', 'off', 'off')
        pintarModo()
        el('chat-tone').value = ''
        el('chat-instructions').value = ''
        ponerSeg('chat-ack', 'default', 'default')
        el('chat-ack-text').value = ''
        ponerSeg('chat-greeting', 'default', 'default')
        el('chat-greeting-text').value = ''
        ponerSeg('chat-first-reply', 'default', 'default')
        pintarPrimerVista()
        ponerNiveles(null)
        // Una conversacion nueva arranca sin proyecto: la mayoria de los 1 a 1 solo piden
        // que el agente lea y conteste, y elegir uno por inercia mandaria su trabajo a un
        // repo que nada tiene que ver.
        pintarSelectoresDeProyecto([])
        ponerSeg('chat-project-question', 'auto', 'auto')
        olvidarPersonas()
        pintarIdentidad()
        pintarCuenta()
        el('scope-form-title').textContent = t('formLegend')
        el('save-scope').textContent = t('save')
        el('cancel-edit').hidden = true
      }
      el('cancel-edit').addEventListener('click', function () { resetScopeForm(); said('said-scope', '') })

      // De que se queja el panel cuando el worker no pudo quitar la autorizacion. Mismo
      // trato que el resto: el veredicto trae CODIGO y la frase la arma el panel, que
      // es el unico que sabe en que idioma esta el usuario.
      var SCOPE_HOW_KEY = {
        'sin-herramientas': 'syncNoTools',
        'sin-permiso': 'syncNoPerm'
      }

      /** Quitar una autorizacion. NO la borra el panel: se la pide al worker.
       *
       *  El registro vive en DOS lados —`scope.db` del CLI y el `storage.json` del
       *  plugin— y todo lo que pregunta por el alcance lee la MEZCLA de los dos
       *  (`merged_scope`, bin/wa-scope:622-653). Con la mezcla, agregar y editar desde
       *  el panel funcionan porque lo del panel MANDA sobre lo del CLI; quitar no,
       *  porque sacar la fila del panel solo destapa la del CLI que sigue abajo.
       *
       *  Medido en la maquina del dueno: el panel borraba de su storage, decia
       *  "✓ Quitado", y la conversacion volvia a aparecer autorizada. Una
       *  autorizacion que alguien cree revocada y sigue en pie es de la misma familia
       *  que una credencial que alguien cree muerta — y esta le da permiso a un agente
       *  para actuar en la conversacion de un cliente.
       *
       *  Y no se dice nada hasta que el worker contesta. El "✓" inmediato es
       *  exactamente lo que mantuvo el defecto invisible: un veredicto que llega antes
       *  que el trabajo no es un veredicto. */
      function removeScope(key, name, boton) {
        // Con varias lineas, se quita en la linea que se esta mirando: el worker se la
        // nombra al CLI, y el alcance de la principal no se toca.
        var pedido = { action: 'quitar', jid: key }
        if (otraLineaVista()) pedido.linea = otraLineaVista()
        var pedir = pedirAlWorker('scopeRequest', 'scopeResult', pedido).then(function (v) {
          // El veredicto va al lado de la tabla, que es donde se apreto Quitar.
          if (!v) { said('said-scope-rm', t('pairingNoAnswer'), true); return }
          if (!v.ok) {
            // El detalle crudo del worker es ingles de un subproceso ('spawn ... ENOENT')
            // y no se muestra: el codigo manda cuando el panel lo conoce, y si no, la
            // frase generica, que al menos dice lo que importa — sigue autorizada.
            said('said-scope-rm', porCodigo(SCOPE_HOW_KEY, v.code, '') || t('scopeRmFail'), true)
            return
          }
          said('said-scope-rm', '✓ ' + t('removedOk') + ': ' + name)
          // El alcance NO esta entre las claves que el sondeo refresca, asi que se relee
          // esta sola: repintar con la copia de antes dejaria la fila en pantalla sobre
          // una autorizacion que ya no existe. Un mensaje, por el carril del usuario.
          return leerAlcanceVisto(true).then(function (v2) {
            if (hayRespuesta(v2)) renderScope(v2 || {})
          })
        })
        return boton ? busy(boton, pedir) : pedir
      }

      el('save-scope').addEventListener('click', function (event) {
        // La llave es el jid, como la del registro del CLI. Guardando por nombre, lo
        // escrito aca quedaba en una entrada aparte que `wa-scope` no encontraba nunca:
        // el panel decia guardado y el agente seguia con el valor viejo.
        var elegido = editandoJid || chatElegido
        var jid = elegido
        var chat = el('chat').value.trim() || jid
        // La lista en el orden de las filas, y `workspace` su derivado (proyectos-por-chat).
        var workspaces = sinRepetir(filasProyecto)
        var workspace = derivadoDe(workspaces)
        var mode = valorSeg('mode') || 'off'
        if (!jid) { said('said-scope', t('needChat'), true); return }
        busy(event.currentTarget, leerAlcanceVisto().then(function (next) {
          next = next || {}
          // Se guarda en la forma viva de la conversacion (lid-sigue-autorizacion). Lo que
          // ya estaba viene de la entrada editada o, al elegir la fila viva, de su gemela
          // vieja de esta linea; esa se quita y `wa-scope` borra su fila de la base.
          jid = destinoDe(elegido, next)
          var origen = editandoJid || (next[jid] ? jid : (gemelosDe[jid] || []).filter(
            function (g) { return next[g] && deEstaLinea(next[g].account) })[0]) || jid
          // Lo de antes se conserva: provider y target ya no se eligen aca, pero la fila
          // los trae de antes de este cambio y borrarlos seria perder lo que el dueno
          // configuro. Una conversacion nueva no abre tarjetas.
          var previa = next[origen] && typeof next[origen] === 'object' ? next[origen] : null
          if (origen !== jid) delete next[origen]
          next[jid] = Object.assign({ provider: 'ninguno', target: null }, previa, {
            chatName: chat, workspaces: workspaces, workspace: workspace,
            projectQuestion: preguntaDe(valorSeg('chat-project-question')),
            mode: mode, tone: el('chat-tone').value.trim() || null,
            instructions: el('chat-instructions').value.trim() || null,
            // `default` es null: vale lo de la tarjeta de respuestas automaticas.
            ack: valorSeg('chat-ack') === 'default' ? null : valorSeg('chat-ack'),
            ackText: el('chat-ack-text').value.trim() || null,
            greeting: valorSeg('chat-greeting') === 'default' ? null : valorSeg('chat-greeting'),
            greetingText: el('chat-greeting-text').value.trim() || null,
            firstReply: valorSeg('chat-first-reply') === 'default' ? null
              : valorSeg('chat-first-reply') || null,
            approval: nivelesDelFormulario(),
            // Los roles de esta conversacion (roles-por-numero): siempre una lista, vacia
            // cuando nadie tiene rol, que es lo mismo que no tener la clave.
            members: miembrosDelFormulario(jid),
            updatedAt: new Date().toISOString() })
          // Autorizar es autorizar para ESTE numero (T9): el mismo grupo visto desde
          // otro numero propio es otra autorizacion.
          if (cuentaVinculada) next[jid].account = cuentaVinculada
          return escribirAlcanceVisto(next).then(function () {
            renderScope(next)
            resetScopeForm()
            pintarChecklist()
            said('said-scope', '✓ ' + t('savedOk') + ': ' + chat + ' · ' +
              porCodigo(MODE_KEY, mode, mode))
          })
        }))
      })

      // ---------- los numeros del dueno (T22.1) ----------
      // Se eligen de los que ya escribieron (`senders`, que deja wa-scope) y de los chats
      // directos, por el id que dejo WhatsApp sin el dispositivo. Nunca se escribe un
      // numero: un id adivinado le daria a otro la autoridad del dueno.
      var duenosGuardados = []
      var duenosEnEdicion = null
      var remitentes = []
