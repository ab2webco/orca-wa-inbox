<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WhatsApp Inbox</title>
    <style>
      /* El host inyecta una lista corta de tokens en el <style> del shell
         (PANEL_DESIGN_TOKEN_ALLOWLIST, orca-oss src/shared/plugins/plugin-panel-shell.ts:34)
         y pone light/dark en <html>. Nada mas llega aca: ni utilidades de Tailwind,
         ni --radius-md, ni la tipografia de la app. Todo lo de abajo sale de esa
         lista o se calcula desde ella. */
      :root {
        color-scheme: light dark;
        /* De los radios solo viene --radius. md se calcula con el mismo factor que
           main.css:122, para no inventar un radio por elemento. */
        --radius-md: calc(var(--radius, 0.625rem) * 0.8);
        /* Respaldos para cuando el host no inyecta nada (host viejo, o el arnes
           jsdom). Son los valores reales de main.css, no un gris inventado: antes
           eran solo oscuros y el panel salia ilegible en cuanto el tema era claro. */
        --fb-background: #fff; --fb-foreground: #0a0a0a;
        --fb-primary: #171717; --fb-primary-foreground: #fafafa;
        --fb-secondary: #f5f5f5; --fb-secondary-foreground: #171717;
        --fb-muted: #f5f5f5; --fb-muted-foreground: #737373;
        --fb-accent: #f5f5f5; --fb-accent-foreground: #171717;
        --fb-destructive: #e40014;
        --fb-border: #e5e5e5; --fb-input: #e5e5e5; --fb-ring: #a1a1a1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fb-background: #0a0a0a; --fb-foreground: #fafafa;
          --fb-primary: #e5e5e5; --fb-primary-foreground: #171717;
          --fb-secondary: #262626; --fb-secondary-foreground: #fafafa;
          --fb-muted: #262626; --fb-muted-foreground: #a1a1a1;
          --fb-accent: #404040; --fb-accent-foreground: #fafafa;
          --fb-destructive: #ff6568;
          --fb-border: rgb(255 255 255 / 0.07); --fb-input: rgb(255 255 255 / 0.15);
          --fb-ring: #737373;
        }
      }
      /* Los widgets nativos (scrollbar, lista del select) siguen al tema real del
         host, no a la preferencia del sistema. */
      html.light { color-scheme: light; }
      html.dark { color-scheme: dark; }
      * { box-sizing: border-box; }
      /* Sin padding en el body: el iframe no tiene relleno propio
         (PluginPanel.tsx:231 lo monta con h-full w-full) y los paneles nativos de
         Orca son a sangre, con el relleno adentro de cada bloque. */
      body {
        margin: 0; padding: 0 0 24px;
        /* Geist es la fuente de la app, pero el iframe no ve sus @font-face: pedirla
           solo daria un fallback distinto en cada maquina. Se queda el del sistema. */
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px; letter-spacing: 0.01em;
        color: var(--foreground, var(--fb-foreground));
        background: var(--background, var(--fb-background));
      }
      .wrap { max-width: 760px; }
      h1 { font-size: 13px; font-weight: 600; margin: 0; padding: 12px 12px 0;
           letter-spacing: -0.01em; }
      .sub:first-child { margin-top: 0; }
      .sub { color: var(--muted-foreground, var(--fb-muted-foreground));
             margin: 0; padding: 2px 12px 12px; font-size: 12px; }
      /* Los paneles propios de Orca no usan la primitiva Card por seccion: son
         planos, a sangre, separados por un filete de --border y una etiqueta
         chica en mayusculas (right-sidebar/PortsPanel.tsx:471, source-control/
         panel/header-toolbar.tsx:196, checks-panel-content.tsx:4503). Este panel
         hace lo mismo: una caja redondeada por seccion se veia como otra app.
         El relleno horizontal es 12 px, que es el px-3 de la casa. */
      section { padding: 12px; margin: 0;
                border-top: 1px solid var(--border, var(--fb-border)); }
      /* Etiqueta meta de 11 px: el STYLEGUIDE la fija en 600 y 0.05em, igual que
         PortsPanel.tsx:336. */
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
           color: var(--muted-foreground, var(--fb-muted-foreground));
           margin: 0 0 10px; font-weight: 600; }
      label { display: block; font-size: 12px; margin: 10px 0 4px;
              color: var(--muted-foreground, var(--fb-muted-foreground)); }
      label:first-of-type { margin-top: 0; }
      /* Campos como el primitivo Input de Orca: fondo transparente, filete de
         --input y radio md (components/ui/input.tsx). */
      input, select, textarea {
        font: inherit; width: 100%; padding: 7px 9px; border-radius: var(--radius-md);
        border: 1px solid var(--input, var(--fb-input)); background: transparent;
        color: var(--foreground, var(--fb-foreground));
      }
      textarea { resize: vertical; }
      input:disabled { opacity: 1; color: var(--foreground, var(--fb-foreground));
                       border-color: transparent; background: var(--muted, var(--fb-muted)); }
      /* El destino con "ninguno" no es un campo vacio: es un campo que no aplica. Sin
         marca propia, en tema claro se veia igual que uno editable — el defecto de
         siempre: parece que se puede escribir y nadie lo mira. */
      #target:disabled { background: transparent;
                         color: var(--muted-foreground, var(--fb-muted-foreground));
                         border: 1px dashed var(--border, var(--fb-border)); }
      input:focus-visible, select:focus-visible, textarea:focus-visible {
        outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px;
        border-color: transparent;
      }
      button {
        font: inherit; font-weight: 500; padding: 7px 14px;
        border-radius: var(--radius-md); cursor: pointer;
        border: 1px solid var(--border, var(--fb-border));
        background: var(--secondary, var(--fb-secondary));
        color: var(--secondary-foreground, var(--fb-secondary-foreground));
        transition: background-color 90ms ease, color 90ms ease, transform 60ms ease;
      }
      /* Hover y active van por --accent, que es justamente para eso; el filete se
         queda en --border, porque --ring es enfasis fuerte y no decoracion. */
      button:hover { background: var(--accent, var(--fb-accent));
                     color: var(--accent-foreground, var(--fb-accent-foreground)); }
      button:active { transform: translateY(1px); }
      button:focus-visible { outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px; }
      button[disabled] { opacity: 0.5; cursor: default; transform: none; }
      button.primary { background: var(--primary, var(--fb-primary));
                       color: var(--primary-foreground, var(--fb-primary-foreground));
                       border-color: transparent; }
      button.primary:hover { background: var(--primary, var(--fb-primary));
                             color: var(--primary-foreground, var(--fb-primary-foreground));
                             filter: brightness(1.12); }
      /* Subrayado siempre, no solo en hover: en tema claro --primary es casi negro,
         asi que sin subrayar Editar/Quitar no se leen como algo clickeable. */
      button.link { border: 0; background: none; padding: 0; margin-left: 10px;
                    color: var(--primary, var(--fb-primary)); font-size: 11px; font-weight: 400;
                    text-decoration: underline; text-underline-offset: 2px; }
      button.link:hover { background: none; color: var(--primary, var(--fb-primary));
                          text-decoration-thickness: 2px; }
      /* El buscador y la lista son un solo control: pegados, sin costura visible. */
      #chat-search { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
      #chat-pick { border-top-left-radius: 0; border-top-right-radius: 0; border-top: 0; }
      #chat-count { margin-top: 4px; }
      .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
      .row2 { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
      .actions { display: flex; align-items: center; gap: 10px; margin-top: 14px;
                 min-height: 30px; flex-wrap: wrap; }
      /* Una fila de acciones sin nada visible deja 44 px de aire entre dos campos
         que van juntos. Se colapsa sola cuando no le quedan botones ni mensaje; si
         el navegador no soporta :has() se queda como antes, sin romperse. */
      .actions:not(:has(button:not([hidden]))):not(:has(.said:not(:empty))) {
        display: none;
      }
      /* La allowlist no trae color de exito, y no se inventa uno: el ✓ y el peso
         cargan la confirmacion. El fallo si tiene token, --destructive. */
      .said { font-size: 12px; font-weight: 500;
              color: var(--foreground, var(--fb-foreground)); }
      .said.bad { font-weight: 400; color: var(--destructive, var(--fb-destructive)); }
      /* Las filas van a sangre dentro de la seccion: el filete llega a los bordes
         del relleno, como las listas del panel de control de versiones. */
      table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
      th { text-align: left; font-weight: 500;
           color: var(--muted-foreground, var(--fb-muted-foreground));
           padding: 5px 8px 5px 0; border-bottom: 1px solid var(--border, var(--fb-border)); }
      td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--border, var(--fb-border));
           vertical-align: top; }
      tr:last-child td { border-bottom: 0; }
      td.acts { text-align: right; white-space: nowrap; }
      /* A 320 px una tabla de 4 columnas no cabe, y partir palabra deja pastillas que
         dicen "respon der". Debajo de 420 px cada fila pasa a ser un bloque: el valor
         se describe solo, asi que la cabecera no hace falta. */
      @media (max-width: 420px) {
        table, tbody, tr, td { display: block; width: 100%; }
        thead { display: none; }
        tr { border-bottom: 1px solid var(--border, var(--fb-border)); padding: 8px 0; }
        tr:last-child { border-bottom: 0; }
        td { border: 0; padding: 1px 0; }
        td.acts { text-align: left; margin-top: 6px; }
        .row { grid-template-columns: 1fr; }
      }
      /* Los cuatro permisos. La allowlist no tiene verde ni ambar y no se fabrican:
         se separan por peso y superficie, no por tono. "off" se queda en el estado
         base — texto apagado, sin filete —, "observar" suma filete y texto pleno,
         "borrador" es una superficie --accent, y solo "responder" (el unico que
         manda mensajes de verdad) usa --destructive. */
      .pill { display: inline-block; padding: 1px 8px; border-radius: 9999px; font-size: 11px;
              border: 1px solid transparent;
              color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .pill.observar { border-color: var(--border, var(--fb-border));
                       color: var(--foreground, var(--fb-foreground)); }
      .pill.borrador { background: var(--accent, var(--fb-accent));
                       color: var(--accent-foreground, var(--fb-accent-foreground)); }
      .pill.responder { border-color: var(--destructive, var(--fb-destructive));
                        color: var(--destructive, var(--fb-destructive)); font-weight: 600; }
      /* El estado de una linea usa las mismas tres superficies que los permisos, y por
         la misma razon: la allowlist no trae verde ni ambar. Lista = filete y texto
         pleno; esperando = superficie --accent, que es lo que pide atencion; rota =
         --destructive, el unico token de alerta que llega al panel. */
      .pill.lista { border-color: var(--border, var(--fb-border));
                    color: var(--foreground, var(--fb-foreground)); }
      /* Con filete ademas del relleno: en tema claro --accent es #f5f5f5 sobre blanco,
         asi que sin borde la pastilla se perdia y el estado dejaba de leerse. */
      .pill.pendiente { background: var(--accent, var(--fb-accent));
                        border-color: var(--border, var(--fb-border));
                        color: var(--accent-foreground, var(--fb-accent-foreground)); }
      .pill.roto { border-color: var(--destructive, var(--fb-destructive));
                   color: var(--destructive, var(--fb-destructive)); font-weight: 600; }
      /* Que hacer con esta linea, debajo de su estado. Es EL mensaje de la fila — no un
         consejo al margen — asi que va en el texto normal y no en el apagado. */
      td .how { display: block; margin-top: 3px; font-size: 11px; line-height: 1.5;
                color: var(--foreground, var(--fb-foreground)); }
      /* Desvincular borra cosas que no vuelven: la advertencia ocupa la fila entera y
         los dos botones quedan debajo, para que no se confirme de un clic de inercia. */
      tr.confirmando td { border-bottom: 0; }
      .confirm { font-size: 11px; line-height: 1.5; padding: 0 0 8px;
                 color: var(--destructive, var(--fb-destructive)); }
      .confirm .actions { margin-top: 8px; }
      /* Lo que fallo en el ultimo intento. No es una pista al margen: es el motivo por
         el que el boton no hizo lo que prometio. */
      .lines-error[hidden] { display: none; }
      .lines-error { font-size: 12px; line-height: 1.5; margin: 0 0 10px;
                     color: var(--destructive, var(--fb-destructive)); }
      /* El nombre de la linea no se parte en dos mientras sobre ancho: la segunda
         columna se lleva todo el sitio porque ahi va el parrafo del estado. */
      #lines-wrap td:first-child { min-width: 8em; }
      /* Conectar OTRA linea es una zona nueva debajo de la tabla. `label:first-of-type`
         le quitaba el margen de arriba y quedaba pegada al renglon anterior, como si
         fuera su pie. */
      #lines-place { margin: 8px 0 0; }
      .wrap label[for="line-label"] { margin-top: 16px; }
      /* La accion que resuelve el estado es un boton de verdad y no un enlace de 11 px:
         en "esperando el escaneo" es LO que hay que hacer, y el escaneo pasa en otra
         ventana. Desvincular se queda como enlace — no se ofrece, se busca. */
      td.acts button + button { margin-left: 10px; }
      .empty { color: var(--muted-foreground, var(--fb-muted-foreground));
               font-size: 12px; padding: 10px 0; }
      .hint { color: var(--muted-foreground, var(--fb-muted-foreground));
              font-size: 11px; margin: 6px 0 0; line-height: 1.5; }
      /* El motivo no es una pista al margen: es EL mensaje mientras no hay lista, asi
         que va en el color del texto y no en el apagado de los consejos. */
      #sync-msg { color: var(--foreground, var(--fb-foreground)); }
      /* La salida cruda de la herramienta se lee como lo que es. A 320 px la ruta no
         cabe en una linea y partirla es mejor que desbordar. */
      #sync-detail { font-family: ui-monospace, Menlo, monospace; overflow-wrap: anywhere; }
      /* Un requisito opcional no es una alerta: no bloquea nada. Va en gris, con su
         accion al lado, y desaparece cuando se resuelve. */
      #opcionales[hidden] { display: none; }
      #opcionales { margin: 0 0 12px; padding: 0 12px; }
      .opcional {
        display: flex; gap: 8px; align-items: baseline; padding: 7px 0;
        border-top: 1px solid var(--border, var(--fb-border)); font-size: 12px;
        color: var(--muted-foreground, var(--fb-muted-foreground));
      }
      .opcional:last-child { border-bottom: 1px solid var(--border, var(--fb-border)); }
      .opcional b { color: var(--foreground, var(--fb-foreground)); font-weight: 500; }
      .opcional code { color: var(--primary, var(--fb-primary)); }
      .alert[hidden] { display: none; }
      /* El unico bloque con caja: en Orca las cajas redondeadas quedan reservadas
         para avisos, no para estructura (listing/conflict-status-cards.tsx:49 usa
         rounded-md + filete + tinte). Radio md, filete y texto en --destructive; el
         tinte se deriva del mismo token con color-mix en vez de un rojo aparte, y si
         el motor no lo soporta la declaracion se cae y queda el filete. */
      .alert { display: flex; gap: 8px; align-items: baseline;
               border: 1px solid var(--destructive, var(--fb-destructive));
               border-radius: var(--radius-md); padding: 9px 11px;
               margin: 0 12px 12px; font-size: 12px;
               color: var(--foreground, var(--fb-foreground));
               background: color-mix(in srgb,
                 var(--destructive, var(--fb-destructive)) 8%, transparent); }
      code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
      @media (max-width: 620px) { .row { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- Sin titulo propio: en Ajustes el host ya pinta "WhatsApp Inbox" arriba de la
           pagina, asi que repetirlo lo dice dos veces. La bajada si aporta: explica que
           hace el panel, no como se llama. -->
      <p class="sub" data-t="sub"></p>
      <div class="alert" id="alert" hidden></div>
      <div id="opcionales" hidden></div>

      <section>
        <h2 data-t="agentLegend"></h2>
        <label for="agent" data-t="agentLabel"></label>
        <div class="row2">
          <input id="agent" data-t-ph="agentPh" />
          <button id="edit-agent" hidden data-t-title="editName">&#9998;</button>
        </div>
        <p class="hint" data-t="agentHelp"></p>
        <div class="actions">
          <button class="primary" id="save-agent" data-t="saveName"></button>
          <button id="cancel-agent" hidden data-t="cancel"></button>
          <span class="said" id="said-agent"></span>
        </div>

        <label for="owner" data-t="ownerLabel"></label>
        <input id="owner" data-t-ph="ownerPh" />
        <p class="hint" data-t="ownerHelp"></p>
        <div class="actions">
          <button id="save-owner" data-t="saveOwner"></button>
          <span class="said" id="said-owner"></span>
        </div>

        <label for="tone" data-t="toneLabel"></label>
        <textarea id="tone" rows="3" data-t-ph="tonePh"></textarea>
        <p class="hint" data-t="toneHelp"></p>
        <div class="actions">
          <button id="save-tone" data-t="saveTone"></button>
          <span class="said" id="said-tone"></span>
        </div>

        <label for="transcribe" data-t="transcribeLabel"></label>
        <select id="transcribe">
          <option value="local" data-t="trLocal"></option>
          <option value="off" data-t="trOff"></option>
        </select>
        <p class="hint" data-t="transcribeHelp"></p>
        <div class="actions">
          <button id="save-transcribe" data-t="saveTranscribe"></button>
          <span class="said" id="said-transcribe"></span>
        </div>

        <label for="lang" data-t="langLabel"></label>
        <select id="lang">
          <option value="auto" data-t="langAuto"></option>
          <option value="es" data-t="langEs"></option>
          <option value="en" data-t="langEn"></option>
          <option value="pt" data-t="langPt"></option>
        </select>
        <p class="hint" data-t="langHelp"></p>
        <div class="actions">
          <button id="save-lang" data-t="saveLang"></button>
          <span class="said" id="said-lang"></span>
        </div>

        <label for="quality" data-t="qualityLabel"></label>
        <select id="quality">
          <option value="optima" data-t="qualityOptima"></option>
          <option value="minima" data-t="qualityMinima"></option>
        </select>
        <p class="hint" data-t="qualityHelp"></p>
        <div class="actions">
          <button id="save-quality" data-t="saveQuality"></button>
          <span class="said" id="said-quality"></span>
        </div>
      </section>

      <section>
        <h2 data-t="sourceLegend"></h2>
        <label for="read-local" data-t="readLocalLabel"></label>
        <select id="read-local">
          <option value="on" data-t="readLocalOn"></option>
          <option value="off" data-t="readLocalOff"></option>
        </select>
        <label for="read-web" data-t="readWebLabel"></label>
        <select id="read-web">
          <option value="off" data-t="readWebOff"></option>
          <option value="on" data-t="readWebOn"></option>
        </select>
        <!-- `capture_max` y `capture_days` no estan aca a proposito: solo dicen cuanto
             dura un cache, nunca que puede leer ni contestar el agente, asi que no hay
             decision que tomar; el aviso que salta cuando el desalojo pierde un caso ya
             trae el comando exacto. Estos tres si: cambian de que lineas lee. -->
        <label for="read-web-text" data-t="readWebTextLabel"></label>
        <select id="read-web-text">
          <option value="off" data-t="readWebTextOff"></option>
          <option value="memoria" data-t="readWebTextMemoria"></option>
        </select>
        <p class="hint" data-t="sourceHelp"></p>
        <div class="actions">
          <button id="save-source" data-t="saveSource"></button>
          <span class="said" id="said-source"></span>
        </div>
      </section>

      <!-- Las lineas conectadas. Va pegada a "de donde lee" porque es su consecuencia:
           el interruptor dice que se sume WhatsApp Web, esto dice CUAL. -->
      <section>
        <h2 data-t="linesLegend"></h2>
        <p class="lines-error" id="lines-error" hidden></p>
        <div id="lines-wrap"></div>
        <p class="hint" id="lines-place" hidden></p>
        <label for="line-label" data-t="lineLabelLabel"></label>
        <input id="line-label" data-t-ph="lineLabelPh" />
        <p class="hint" data-t="linesHelp"></p>
        <div class="actions">
          <button class="primary" id="link-line" data-t="linkLine"></button>
          <span class="said" id="said-line"></span>
        </div>
      </section>

      <section>
        <h2 data-t="mapLegend"></h2>
        <label for="inbox-days" data-t="daysLabel"></label>
        <select id="inbox-days">
          <option value="1" data-t="days1"></option>
          <option value="3" data-t="days3"></option>
          <option value="7" data-t="days7"></option>
          <option value="14" data-t="days14"></option>
          <option value="30" data-t="days30"></option>
          <option value="90" data-t="days90"></option>
          <option value="0" data-t="days0"></option>
        </select>
        <p class="hint" data-t="daysHelp"></p>
        <div class="actions">
          <button id="save-days" data-t="saveDays"></button>
          <span class="said" id="said-days"></span>
        </div>

        <label for="sync-minutes" data-t="syncLabel"></label>
        <select id="sync-minutes">
          <option value="2" data-t="sync2"></option>
          <option value="5" data-t="sync5"></option>
          <option value="10" data-t="sync10"></option>
          <option value="15" data-t="sync15"></option>
          <option value="30" data-t="sync30"></option>
          <option value="60" data-t="sync60"></option>
        </select>
        <p class="hint" data-t="syncHelp"></p>
        <div class="actions">
          <button id="save-sync" data-t="saveSync"></button>
          <span class="said" id="said-sync"></span>
        </div>

        <label for="chat-search" data-t="chatLabel"></label>
        <input id="chat-search" type="search" autocomplete="off" data-t-ph="chatSearchPh" />
        <select id="chat-pick" size="1"></select>
        <p class="hint" id="chat-count"></p>
        <!-- Lo que paso de verdad con la busqueda. Antes el unico aviso era la opcion
             "Buscando…" del select, que no caduca nunca: si el sync fallaba, el panel
             seguia diciendo que buscaba y el usuario no tenia nada que apretar. -->
        <div id="sync-state" hidden>
          <p class="hint" id="sync-msg"></p>
          <p class="hint" id="sync-detail" hidden></p>
          <div class="actions">
            <button id="sync-retry" data-t="syncRetry"></button>
            <span class="said" id="said-sync"></span>
          </div>
        </div>

        chatInstrLabel: 'O que faz aqui (opcional)',
        chatInstrPh: 'ex. Leia o que mandarem e me faca um resumo. Responda o que voce ja ' +
          'sabe. Nao abra cartoes.',
        chatInstrHelp: 'O tom e COMO escreve; isto e O QUE faz. Manda sobre o comportamento ' +
          'padrao, menos nas regras de seguranca: nunca uma credencial, nunca enviar sem ' +
          'permissao de responder.',
        save: 'Salvar conversa', saveEdit: 'Salvar alteracoes', cancelEdit: 'Cancelar edicao',
        colChat: 'Conversa', colPerm: 'Permissao', edit: 'Editar', remove: 'Remover',
        routesLegend: 'Para qual projeto vai', addRoute: 'Adicionar regra',
        savedOk: 'Salvo', removedOk: 'Removido', named: 'Se chama',
        off: 'off — nao toca', observe: 'observar — so le, nao escreve',
        draft: 'rascunho — escreve sem enviar', reply: 'responder — envia'
      })

      var LANG = (function () {
        var tag = String(navigator.language || 'en').toLowerCase()
        if (tag.indexOf('es') === 0) return 'es'
        if (tag.indexOf('pt') === 0) return 'pt'
        return 'en'
      })()
      function t(key) { return (STRINGS[LANG] && STRINGS[LANG][key]) || STRINGS.en[key] || key }

      var el = function (id) { return document.getElementById(id) }

      function applyStrings() {
        var q = document.querySelectorAll.bind(document)
        Array.prototype.forEach.call(q('[data-t]'), function (n) { n.innerHTML = t(n.dataset.t) })
        Array.prototype.forEach.call(q('[data-t-ph]'), function (n) { n.placeholder = t(n.dataset.tPh) })
        Array.prototype.forEach.call(q('[data-t-title]'), function (n) {
          n.title = t(n.dataset.tTitle); n.setAttribute('aria-label', t(n.dataset.tTitle))
        })
        syncTargetLabel()
      }

      var seq = 0, pending = {}
      function call(action, params) {
        return new Promise(function (resolve) {
          var requestId = 'req-' + ++seq
          pending[requestId] = resolve
          // Origen opaco: '*' es el unico targetOrigin usable; el host valida la ventana.
          window.parent.postMessage(
            { type: 'orca-panel-action', requestId: requestId, action: action, params: params }, '*')
        })
      }
      window.addEventListener('message', function (event) {
        var d = event.data
        if (!d || d.type !== 'orca-panel-action-result') return
        var resolve = pending[d.requestId]
        if (!resolve) return
        delete pending[d.requestId]
        resolve(d)
      })

      // storage.get devuelve { value: <dato> } y el bridge lo envuelve otra vez.
      function stored(result) {
        if (!result || !result.ok || !result.value) return null
        return result.value.value === undefined ? null : result.value.value
      }
      function read(key) { return call('storage.get', { key: key }).then(stored) }
      function write(key, value) { return call('storage.set', { key: key, value: value }) }

      function esc(text) {
        return String(text == null ? '' : text)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      }

      // La confirmacion va al lado del boton que la provoco, no al pie del panel: ahi
      // abajo no se ve y parece que no paso nada.
      function said(id, text, bad) {
        var node = el(id)
        node.textContent = text
        node.className = 'said' + (bad ? ' bad' : '')
        if (!bad && text) {
          clearTimeout(node._timer)
          node._timer = setTimeout(function () { node.textContent = '' }, 4000)
        }
      }

      function busy(button, promise) {
        var label = button.textContent
        button.disabled = true
        button.textContent = '…'
        return Promise.resolve(promise).then(function (value) {
          button.disabled = false; button.textContent = label; return value
        }, function (error) {
          button.disabled = false; button.textContent = label
          throw error
        })
      }

      // El CLI habla ingles y no sabe en que idioma esta el usuario, asi que ademas del
      // texto manda un codigo estable. La frase la arma el panel, que si lo sabe; el
      // texto del CLI queda de respaldo para un codigo que este panel no conozca todavia.
      // Mismo trato que los motivos del worker en motivoTexto().
      var HEALTH_KEY = {
        system: 'hSystem', whatsapp: 'hWhatsapp', database: 'hDatabase',
        readable: 'hReadable', sqlite3: 'hSqlite3', send: 'hSend',
        'no-source': 'hNoSource',
        transcribe: 'hTranscribe', web: 'hWeb', fulldisk: 'hFulldisk',
        local: 'hLocal',
        unknown: 'hUnknown'
      }
      var HEALTH_HOW_KEY = {
        'local-covered-by-web': 'howLocalCoveredByWeb',
        'web-not-implemented': 'howWebNotBuilt',
        'web-off': 'howWebOff',
        'web-no-orca': 'howWebNoOrca',
        'web-no-session': 'howWebNoSession',
        'web-logged-out': 'howWebLoggedOut',
        'web-eval-timeout': 'howWebTimeout',
        'web-read-failed': 'howWebReadFailed',
        'web-text-unavailable': 'howWebNoText',
        'fulldisk-missing': 'howFulldiskMissing',
        'send-no-orca': 'howSendNoOrca',
        'transcribe-missing-tool': 'howTranscribeMissingTool',
        'transcribe-unknown': 'howTranscribeUnknown',
        'transcribe-orca-outdated': 'howTranscribeOrcaOutdated',
        'transcribe-no-engine': 'howTranscribeNoEngine',
        'transcribe-no-model': 'howTranscribeNoModel'
      }
      function porCodigo(mapa, code, respaldo) {
        var key = mapa[code]
        return key ? t(key) : (respaldo || '')
      }

      // El permiso y el servicio se guardan con estos valores y no se traducen nunca en
      // el storage; lo que se traduce es como se leen. La tabla decia el valor crudo
      // mientras el select de al lado ya lo decia en el idioma del usuario: dos formas
      // de nombrar lo mismo en la misma pantalla.
      var MODE_KEY = { off: 'modeOff', observar: 'modeObserve', borrador: 'modeDraft',
                       responder: 'modeReply' }
      var PROV_KEY = { ninguno: 'provNone', plane: 'provPlane', linear: 'provLinear',
                       github: 'provGithub' }

      // Se muestran los requisitos que el usuario puede activar, con su accion.
      // Separados de la alerta a proposito: una funcion que falta no es una rotura.
      function renderOpcionales(lista) {
        var caja = el('opcionales')
        if (!lista || !lista.length) { caja.hidden = true; caja.innerHTML = ''; return }
        caja.innerHTML = '<p class="hint" style="margin:0 0 4px">' + t('optionalTitle') +
          '</p>' + lista.map(function (o) {
            return '<div class="opcional"><span>\u25CB</span><span><b>' +
              esc(porCodigo(HEALTH_KEY, o.code, o.que)) + '</b> &mdash; <code>' +
              esc(porCodigo(HEALTH_HOW_KEY, o.howCode, o.como)) + '</code></span></div>'
          }).join('')
        caja.hidden = false
      }

      function showAlert(what, how) {
        el('alert').innerHTML = '<span>&#9888;</span><span><b>' + what + '</b>' +
          (how ? ' <span>' + how + '</span>' : '') + '</span>'
        el('alert').hidden = false
      }

      var TARGET_KEY = { ninguno: 'targetNone', plane: 'targetPlane',
                        linear: 'targetLinear', github: 'targetGithub' }
      var TARGET_PH = { ninguno: '', plane: 'OPS', linear: 'ENG', github: 'mi-org/mi-repo' }
      // Un campo que sigue viendose editable pero que nadie mira es el mismo defecto que
      // un boton que no hace nada: con "ninguno" el destino se apaga, se vacia y la pista
      // dice por que.
      function syncTargetLabel() {
        var p = el('provider').value
        var sinTarjeta = p === 'ninguno'
        el('target-label').textContent = t(TARGET_KEY[p])
        el('target').placeholder = TARGET_PH[p]
        el('target').disabled = sinTarjeta
        if (sinTarjeta) el('target').value = ''
        el('target-hint').textContent = t(sinTarjeta ? 'targetHintNone' : 'targetHint')
      }
      el('provider').addEventListener('change', syncTargetLabel)

      // ---------- nombre del agente ----------
      var savedAgent = null, agentDirty = false
      el('agent').addEventListener('input', function () { agentDirty = true })

      function showAgentSaved(name) {
        savedAgent = name
        el('agent').value = name
        el('agent').disabled = true
        el('edit-agent').hidden = false
        el('save-agent').hidden = true
        el('cancel-agent').hidden = true
        agentDirty = false
      }
      function showAgentEditing() {
        el('agent').disabled = false
        el('edit-agent').hidden = true
        el('save-agent').hidden = false
        el('save-agent').textContent = savedAgent ? t('saveChange') : t('saveName')
        el('cancel-agent').hidden = !savedAgent
        el('agent').focus(); el('agent').select()
      }
      el('edit-agent').addEventListener('click', showAgentEditing)
      el('cancel-agent').addEventListener('click', function () {
        showAgentSaved(savedAgent); said('said-agent', '')
      })
      el('save-agent').addEventListener('click', function (event) {
        var name = el('agent').value.trim()
        if (!name) { said('said-agent', t('needName'), true); return }
        busy(event.currentTarget, write('agentName', name).then(function (r) {
          if (!r.ok) { said('said-agent', 'error', true); return }
          showAgentSaved(name)
          said('said-agent', '✓ ' + t('named') + ' ' + name)
        }))
      })

      // ---------- tono ----------
      el('save-tone').addEventListener('click', function (event) {
        var tone = el('tone').value.trim()
        busy(event.currentTarget, write('tone', tone).then(function (r) {
          said('said-tone', r.ok ? '\u2713 ' + t('toneSaved') : 'error', !r.ok)
        }))
      })

      // ---------- para quien trabaja ----------
      // No es el nombre del agente: es el del dueno. El prompt lo lee para saber a
      // quien le reporta, y sin el se dirige al cliente como si trabajara solo.
      el('save-owner').addEventListener('click', function (event) {
        busy(event.currentTarget, write('ownerName', el('owner').value.trim())
          .then(function (r) {
            said('said-owner', r.ok ? '\u2713 ' + t('ownerSaved') : 'error', !r.ok)
          }))
      })

      // ---------- transcripcion: modo, idioma y calidad ----------
      el('save-transcribe').addEventListener('click', function (event) {
        busy(event.currentTarget, write('transcribe', el('transcribe').value)
          .then(function (r) {
            said('said-transcribe', r.ok ? '\u2713 ' + t('transcribeSaved') : 'error', !r.ok)
          }))
      })

      el('save-lang').addEventListener('click', function (event) {
        busy(event.currentTarget, write('transcribeLang', el('lang').value)
          .then(function (r) {
            said('said-lang', r.ok ? '\u2713 ' + t('langSaved') : 'error', !r.ok)
          }))
      })

      el('save-quality').addEventListener('click', function (event) {
        busy(event.currentTarget, write('transcribeQuality', el('quality').value)
          .then(function (r) {
            said('said-quality', r.ok ? '\u2713 ' + t('qualitySaved') : 'error', !r.ok)
          }))
      })

      // ---------- de donde lee ----------
      // Dos interruptores y no una lista de tres: las fuentes se SUMAN. La app de
      // escritorio lee una sola linea — la del telefono con el que se instalo — y cada
      // sesion de WhatsApp Web es otra. Encender la web no apaga la del escritorio.
      // Se comprueban las TRES, no la ultima. Encadenadas, el `r` que llegaba al final
      // era el de `readWebText`: las otras dos podian fallar y el panel decia guardado
      // igual, que es como cambiar de fuente no hacia nada y no lo decia nadie.
      // El texto es una eleccion aparte de leer la linea: la bandeja web trae quien te
      // nombro y cuando sin abrir nada, y el cuerpo solo si se pide.
      var SRC_LABEL = { readLocal: 'readLocalLabel', readWeb: 'readWebLabel',
                        readWebText: 'readWebTextLabel' }
      el('save-source').addEventListener('click', function (event) {
        var claves = [['readLocal', el('read-local').value],
                      ['readWeb', el('read-web').value],
                      ['readWebText', el('read-web-text').value]]
        busy(event.currentTarget, Promise.all(claves.map(function (par) {
          return write(par[0], par[1]).then(function (r) {
            return { key: par[0], ok: !!(r && r.ok) }
          })
        })).then(function (rs) {
          var mal = rs.filter(function (r) { return !r.ok })
          if (mal.length) {
            // Se nombra el control como lo ve el usuario. `readWeb` es la clave del
            // storage: quien lee el panel no la vio nunca.
            said('said-source', fmt('srcPartial', {
              k: mal.map(function (r) { return t(SRC_LABEL[r.key]) }).join(', ')
            }), true)
            return
          }
          said('said-source', '✓ ' + t('sourceSaved'))
          // Y se le pide una relectura al worker: el aviso rojo de arriba sale del
          // ultimo doctor, asi que apagar la app de escritorio dejaba en pantalla el
          // reclamo por lo que el usuario acababa de apagar hasta el proximo sync.
          write('syncRequest', { at: new Date().toISOString() })
        }))
      })

      // ---------- ventana de lectura ----------
      el('save-days').addEventListener('click', function (event) {
        busy(event.currentTarget, write('inboxDays', el('inbox-days').value)
          .then(function (r) {
            said('said-days', r.ok ? '\u2713 ' + t('daysSaved') : 'error', !r.ok)
          }))
      })

      // ---------- frecuencia del sync ----------
      el('save-sync').addEventListener('click', function (event) {
        busy(event.currentTarget, write('syncMinutes', el('sync-minutes').value)
          .then(function (r) {
            said('said-sync', r.ok ? '\u2713 ' + t('syncSaved') : 'error', !r.ok)
          }))
      })

      // Deja el select mostrando lo que rige de verdad. La terminal puede fijar un valor
      // que el select no ofrece (`wa-scope config inbox_days 45`): sin agregarlo, .value
      // no engancha, el control queda en blanco y el panel miente sobre lo que rige.
      function ponerEnSelect (id, valor, porDefecto) {
        var sel = el(id)
        if (document.activeElement === sel) return
        var v = valor === null || valor === undefined || valor === '' ? porDefecto : String(valor)
        var hay = Array.prototype.some.call(sel.options, function (o) { return o.value === v })
        if (!hay) {
          var o = document.createElement('option')
          o.value = v
          o.textContent = v
          sel.appendChild(o)
        }
        sel.value = v
      }

      // ---------- selector de conversaciones ----------
      // Se elige de la lista en vez de escribir el nombre exacto. El valor es el jid,
      // porque hay grupos que comparten nombre y el nombre no identifica nada.
      var chatsPorJid = {}
      // El jid que se esta editando. renderChats corre cada 8 s y reconstruye el
      // select entero; sin recordarlo, a mitad de una edicion la conversacion
      // desaparecia de la lista y el select quedaba en blanco.
      var editandoJid = ''

      // Deja el select mostrando este jid. Si no esta en la lista — el sync todavia
      // no lo trajo — se le agrega una opcion, porque si no `.value` no hace nada y
      // el select se queda callado en "Elegi una conversacion".
      function pickChat (jid, nombre) {
        var sel = el('chat-pick')
        if (jid && !Array.prototype.some.call(sel.options, function (o) { return o.value === jid })) {
          var o = document.createElement('option')
          o.value = jid
          o.textContent = nombre || jid
          sel.appendChild(o)
        }
        sel.value = jid || ''
      }

      // La lista completa se guarda aparte: el buscador filtra sobre esto, no sobre
      // lo que quedo pintado, si no cada tecleo iria achicando la lista sin volver.
      var chatsTodos = []

      // ---------- estado de la busqueda ----------
      // El panel no ejecuta nada, asi que por si mismo no puede saber si el worker esta
      // buscando, si fallo o si se quedo callado. Lo lee de syncStatus, que el worker
      // escribe antes y despues de cada intento.
      var estadoSync = null
      var ABIERTO_EN = Date.now()
      // Sin una sola noticia del worker en este tiempo, seguir diciendo "buscando" es
      // mentir: o el plugin no esta activo, o el worker nunca arranco.
      var ESPERA_MS = 45000
      // Un intento que lleva mas que el timeout del propio sync ya no esta corriendo.
      var CORRIENDO_MS = 150000

      function edadMs (iso) {
        var ms = Date.parse(iso)
        return ms ? Date.now() - ms : Infinity
      }

      function motivoTexto (estado) {
        var mapa = {
          'sin-herramientas': 'syncNoTools', 'sin-permiso': 'syncNoPerm',
          'demoro': 'syncTimeout', 'sin-registro': 'syncNoRecord'
        }
        return t(mapa[estado && estado.reason] || 'syncFailed')
      }

      /** Que decir con la lista vacia. Tres finales: sigue buscando, fallo con motivo,
       *  o lleva demasiado sin llegar. Los dos ultimos ofrecen el boton, porque un
       *  estado sin salida es el mismo callejon que el spinner eterno. */
      function estadoVacio (estado) {
        if (estado && estado.running && edadMs(estado.startedAt) < CORRIENDO_MS) {
          // Sin texto aparte: la opcion del select ya dice que esta buscando, y
          // repetirlo debajo no agrega nada que mirar.
          return { corto: t('noChats'), largo: '', detalle: '', boton: false }
        }
        if (estado && estado.ok === false) {
          return { corto: t('noChatsFail'), largo: motivoTexto(estado),
                   detalle: estado.detail || '', boton: true }
        }
        // El sync corrio bien y aun asi no hay nada: el problema no es el plugin.
        if (estado && estado.ok === true) {
          return { corto: t('noChatsFail'), largo: t('syncNoChats'), detalle: '', boton: true }
        }
        if (!estado && Date.now() - ABIERTO_EN < ESPERA_MS) {
          return { corto: t('noChats'), largo: '', detalle: '', boton: false }
        }
        return { corto: t('noChatsFail'), largo: t('syncStalled'), detalle: '', boton: true }
      }

      function pintarEstadoSync () {
        var v = estadoVacio(estadoSync)
        var mostrar = !chatsTodos.length && !!(v.largo || v.boton)
        el('sync-state').hidden = !mostrar
        // "Se elige de la lista" es consejo sobre una lista que no esta. Mientras el
        // aviso ocupa ese lugar, la pista estorba mas de lo que ayuda.
        el('chat-help').hidden = mostrar
        if (!mostrar) return
        el('sync-msg').textContent = v.largo
        el('sync-detail').textContent = v.detalle
        el('sync-detail').hidden = !v.detalle
        el('sync-retry').hidden = !v.boton
      }

      // El panel no puede correr un sync: escribe el pedido y el worker lo atiende.
      // Mismo camino que Tomar/Ignorar en el panel de actividad.
      el('sync-retry').addEventListener('click', function (event) {
        busy(event.currentTarget, write('syncRequest', { at: new Date().toISOString() })
          .then(function (r) {
            said('said-sync', r && r.ok ? t('syncAsked') : 'error', !(r && r.ok))
          }))
      })

      function renderChats (chats) {
        chatsTodos = Array.isArray(chats) ? chats : []
        chatsPorJid = {}
        chatsTodos.forEach(function (c) { chatsPorJid[c.jid] = c })
        pintarChats()
      }

      function etiqueta (c) {
        return (c.kind === 'grupo' ? '\u25A3  ' : '\u25CB  ') + (c.name || c.jid)
      }

      function pintarChats () {
        var sel = el('chat-pick')
        var elegido = sel.value
        var termino = el('chat-search').value.trim().toLowerCase()
        sel.innerHTML = ''
        if (!chatsTodos.length) {
          var o = document.createElement('option')
          o.value = ''; o.textContent = estadoVacio(estadoSync).corto
          sel.appendChild(o)
          el('chat-count').textContent = ''
          pintarEstadoSync()
          return
        }
        pintarEstadoSync()
        // Se busca en el nombre y en el identificador: hay grupos que comparten
        // nombre y el jid es lo unico que los distingue.
        var visibles = termino
          ? chatsTodos.filter(function (c) {
              return String(c.name || '').toLowerCase().indexOf(termino) !== -1 ||
                String(c.jid || '').toLowerCase().indexOf(termino) !== -1
            })
          : chatsTodos
        var vacio = document.createElement('option')
        vacio.value = ''
        vacio.textContent = visibles.length ? t('pickOne') : t('chatNoMatch')
        sel.appendChild(vacio)
        visibles.forEach(function (c) {
          var o = document.createElement('option')
          o.value = c.jid
          o.textContent = etiqueta(c)
          sel.appendChild(o)
        })
        // Contar solo cuando se esta filtrando: "214 de 214" no le dice nada a nadie.
        el('chat-count').textContent = termino
          ? t('chatCount').replace('{n}', visibles.length).replace('{total}', chatsTodos.length)
          : ''
        if (editandoJid) pickChat(editandoJid, (chatsPorJid[editandoJid] || {}).name)
        else if (elegido) sel.value = elegido
      }

      el('chat-search').addEventListener('input', pintarChats)
      el('chat-pick').addEventListener('change', function () {
        var c = chatsPorJid[el('chat-pick').value]
        el('chat').value = c ? (c.name || c.jid) : ''
      })

      // ---------- conversaciones ----------
      function renderScope(entries) {
        var keys = entries ? Object.keys(entries) : []
        if (!keys.length) {
          el('scope-wrap').innerHTML = '<p class="empty">' + t('empty') + '</p>'
          return
        }
        el('scope-wrap').innerHTML =
          '<table><thead><tr><th>' + t('colChat') + '</th><th>' + t('colTarget') +
          '</th><th>' + t('colPerm') + '</th><th></th></tr></thead><tbody>' +
          keys.map(function (key) {
            var e = entries[key]
            return '<tr><td>' + esc(e.chatName || key) + '</td><td>' +
              esc(porCodigo(PROV_KEY, e.provider || 'plane', e.provider)) + ' / ' +
              esc(e.target || '—') + '</td><td>' +
              '<span class="pill ' + esc(e.mode || 'off') + '">' +
              esc(porCodigo(MODE_KEY, e.mode || 'off', e.mode)) +
              '</span></td><td class="acts">' +
              '<button class="link" data-edit="' + esc(key) + '">' + t('edit') + '</button>' +
              '<button class="link" data-rm="' + esc(key) + '">' + t('remove') + '</button>' +
              '</td></tr>'
          }).join('') + '</tbody></table>'

        Array.prototype.forEach.call(el('scope-wrap').querySelectorAll('[data-edit]'), function (b) {
          b.addEventListener('click', function () { startEdit(entries[b.dataset.edit], b.dataset.edit) })
        })
        Array.prototype.forEach.call(el('scope-wrap').querySelectorAll('[data-rm]'), function (b) {
          b.addEventListener('click', function () {
            var e = entries[b.dataset.rm]
            removeScope(b.dataset.rm, (e && e.chatName) || b.dataset.rm)
          })
        })
      }

      function startEdit(entry, key) {
        if (!entry) return
        editandoJid = key
        pickChat(key, entry.chatName || key)
        el('chat').value = entry.chatName || key
        el('provider').value = entry.provider || 'plane'
        syncTargetLabel()
        el('target').value = entry.target || ''
        el('chat-tone').value = entry.tone || ''
        el('chat-instructions').value = entry.instructions || ''
        el('mode').value = entry.mode || 'off'
        el('save-scope').textContent = t('saveEdit')
        el('cancel-edit').hidden = false
        said('said-scope', '')
        el('chat').focus()
      }
      function resetScopeForm() {
        editandoJid = ''
        el('chat').value = ''; el('target').value = ''; el('mode').value = 'off'
        el('chat-tone').value = ''
        el('chat-instructions').value = ''
        // Una conversacion nueva arranca sin servicio de tareas: la mayoria de los DM
        // no necesitan tablero, y dejar Plane puesto hacia que se eligiera por inercia.
        el('provider').value = 'ninguno'
        syncTargetLabel()
        el('chat-pick').value = ''
        el('save-scope').textContent = t('save')
        el('cancel-edit').hidden = true
      }
      el('cancel-edit').addEventListener('click', function () { resetScopeForm(); said('said-scope', '') })

      function removeScope(key, name) {
        read('scope').then(function (next) {
          next = next || {}
          delete next[key]
          return write('scope', next).then(function () {
            renderScope(next)
            said('said-scope', '✓ ' + t('removedOk') + ': ' + name)
          })
        })
      }

      el('save-scope').addEventListener('click', function (event) {
        // La llave es el jid, como la del registro del CLI. Guardando por nombre, lo
        // escrito aca quedaba en una entrada aparte que `wa-scope` no encontraba nunca:
        // el panel decia guardado y el agente seguia con el valor viejo.
        var jid = editandoJid || el('chat-pick').value
        var chat = el('chat').value.trim() || jid
        var provider = el('provider').value
        var target = el('target').value.trim()
        var mode = el('mode').value
        if (!jid) { said('said-scope', t('needChat'), true); return }
        busy(event.currentTarget, read('scope').then(function (next) {
          next = next || {}
          next[jid] = { chatName: chat, provider: provider, target: target || null,
                        mode: mode, tone: el('chat-tone').value.trim() || null,
                        instructions: el('chat-instructions').value.trim() || null,
                        updatedAt: new Date().toISOString() }
          return write('scope', next).then(function () {
            renderScope(next)
            resetScopeForm()
            said('said-scope', '✓ ' + t('savedOk') + ': ' + chat + ' · ' + mode)
          })
        }))
      })

      // ---------- reglas de ruteo ----------
      function renderRoutes(rules) {
        rules = rules || []
        if (!rules.length) {
          el('routes-wrap').innerHTML = '<p class="empty">' + t('noRoutes') + '</p>'
          return
        }
        el('routes-wrap').innerHTML =
          '<table><thead><tr><th>' + t('colWhen') + '</th><th>' + t('colGoes') +
          '</th><th></th></tr></thead><tbody>' +
          rules.map(function (r, i) {
            return '<tr><td>' + esc(r.pattern) + '</td><td>' +
              esc(porCodigo(PROV_KEY, r.provider || 'plane', r.provider)) + ' / ' +
              esc(r.target) + '</td>' +
              '<td class="acts"><button class="link" data-rrm="' + i + '">' +
              t('remove') + '</button></td></tr>'
          }).join('') + '</tbody></table>'

        Array.prototype.forEach.call(el('routes-wrap').querySelectorAll('[data-rrm]'), function (b) {
          b.addEventListener('click', function () {
            var next = rules.slice()
            var gone = next.splice(Number(b.dataset.rrm), 1)[0]
            write('routes', next).then(function () {
              renderRoutes(next)
              said('said-route', '✓ ' + t('removedOk') + ': ' + (gone && gone.pattern))
            })
          })
        })
      }

      el('save-route').addEventListener('click', function (event) {
        var match = el('r-match').value.trim().toLowerCase()
        var target = el('r-target').value.trim()
        var provider = el('r-provider').value
        if (!match || !target) { said('said-route', t('needMatch'), true); return }
        busy(event.currentTarget, read('routes').then(function (rules) {
          rules = (rules || []).filter(function (r) { return r.pattern !== match })
          rules.push({ pattern: match, provider: provider, target: target })
          rules.sort(function (a, b) { return a.pattern < b.pattern ? -1 : 1 })
          return write('routes', rules).then(function () {
            renderRoutes(rules)
            el('r-match').value = ''; el('r-target').value = ''
            said('said-route', '✓ ' + t('savedOk') + ': ' + match + ' → ' + target)
          })
        }))
      })

      // ---------- lineas de WhatsApp Web ----------
      // El panel no puede ejecutar nada: deja el pedido en storage y el worker lo
      // atiende, igual que el boton de reintentar el sync. Lo que se ve aca es SIEMPRE
      // lo que el worker acaba de comprobar contra la sesion de verdad; afirmar el
      // estado desde el registro es lo que hacia que dijera "enlazada" con el QR en
      // pantalla.
      function fmt (key, vals) {
        return String(t(key)).replace(/\{(\w+)\}/g, function (_, k) {
          return vals && vals[k] != null ? vals[k] : ''
        })
      }

      // Devuelve el `at` del pedido: sin el, el panel no puede distinguir el veredicto
      // de SU clic del que quedo del clic anterior.
      function pedirWeb (action, extra) {
        var pedido = { at: new Date().toISOString(), action: action }
        for (var k in (extra || {})) pedido[k] = extra[k]
        return write('webRequest', pedido).then(function (r) {
          return { ok: !!(r && r.ok), at: pedido.at }
        })
      }

      // El worker escribe el veredicto en `webStatus`, que el sondeo no toca. Antes el
      // motivo iba dentro de `webLines` y la siguiente vuelta del sondeo — tres
      // segundos — lo borraba: el usuario no llegaba a verlo nunca.
      var WEB_ERR_KEY = {
        'sin-orca': 'stNoOrcaHow', 'sin-proyecto': 'lineNoPlace',
        'sin-herramientas': 'errSinHerramientas', 'sin-permiso': 'errSinPermiso',
        demoro: 'errDemoro', vencido: 'errVencido', 'a-medias': 'errAMedias',
        'sin-identidad': 'errSinIdentidad', 'sin-respuesta': 'lineNoAnswer'
      }
      function motivoWeb (code, detail) {
        return WEB_ERR_KEY[code] ? t(WEB_ERR_KEY[code]) : (detail || code || '')
      }

      /** Espera el veredicto de ESE pedido. Enlazar una linea son dos llamadas a la CLI
       *  de Orca con 30 s de tope cada una, asi que la espera tiene que darles lugar. */
      function esperarWeb (requestAt, limiteMs) {
        var fin = Date.now() + (limiteMs || 90000)
        return new Promise(function (resolve) {
          ;(function vuelta () {
            read('webStatus').then(function (st) {
              if (st && st.requestAt === requestAt) { resolve(st); return }
              if (Date.now() > fin) { resolve(null); return }
              setTimeout(vuelta, 1000)
            })
          })()
        })
      }

      // Estado -> como se llama, que hacer, y que boton lo arregla. Ninguno se queda
      // sin accion: un estado sin salida es el mismo callejon que el spinner eterno.
      var LINE_STATE = {
        esperando: { pill: 'stWaiting', how: 'stWaitingHow', cls: 'pendiente', act: 'show' },
        cargando: { pill: 'stLoading', how: 'stLoadingHow', cls: 'pendiente', act: 'show' },
        enlazada: { pill: 'stLinked', how: null, cls: 'lista', act: 'show' },
        caida: { pill: 'stDropped', how: 'stDroppedHow', cls: 'roto', act: 'show' },
        'sin-pestana': { pill: 'stNoTab', how: 'stNoTabHow', cls: 'roto', act: 'reopen' },
        'sin-orca': { pill: 'stNoOrca', how: 'stNoOrcaHow', cls: 'roto', act: 'retry' }
      }
      var ACT_KEY = { show: 'seeTab', reopen: 'openTab', retry: 'retryLine' }

      var lineasUlt = null
      var webStatusUlt = null
      var confirmando = null

      function lineHow (l) {
        if (l.state !== 'enlazada') return t(LINE_STATE[l.state].how)
        if (!l.authorizedChats) return t('stLinkedNone')
        return l.authorizedChats === 1
          ? t('stLinkedOne')
          : fmt('stLinkedSome', { n: l.authorizedChats })
      }

      function renderLineas (estado) {
        lineasUlt = estado && typeof estado === 'object' ? estado : null
        var lineas = (lineasUlt && lineasUlt.lines) || []
        var wrap = el('lines-wrap')
        // Lo que fallo se cuenta haya lineas o no: reabrir una pestana puede fallar con
        // tres lineas sanas en la tabla, y sin esto ese clic no dice nada. El veredicto
        // manda sobre el estado del sondeo: es lo que el usuario acaba de pedir.
        var err = null
        var detalle = ''
        if (webStatusUlt && webStatusUlt.ok === false) {
          err = webStatusUlt.code || 'fallo'
          detalle = webStatusUlt.detail || ''
        } else if (lineasUlt && lineasUlt.error) {
          err = lineasUlt.error
          detalle = lineasUlt.detail || ''
        }
        el('lines-error').textContent = err
          ? t('lineFailed') + ' ' + motivoWeb(err, detalle) : ''
        el('lines-error').hidden = !err
        if (!lineas.length) {
          wrap.innerHTML = '<p class="empty">' + esc(t('noLines')) + '</p>'
          el('lines-place').hidden = true
          vigilarLineas(false)
          return
        }
        wrap.innerHTML =
          '<table><thead><tr><th>' + t('colLine') + '</th><th>' + t('colLineState') +
          '</th><th></th></tr></thead><tbody>' +
          lineas.map(function (l, i) {
            var def = LINE_STATE[l.state] || LINE_STATE['sin-orca']
            var fila = '<tr' + (confirmando === l.id ? ' class="confirmando"' : '') +
              '><td>' + esc(l.label) + '</td>' +
              '<td><span class="pill ' + def.cls + '">' + esc(t(def.pill)) + '</span>' +
              '<span class="how">' + esc(lineHow(l)) + '</span></td>' +
              '<td class="acts"><button class="' +
              (l.state === 'enlazada' ? 'link' : '') + '" data-lact="' + i + '">' +
              t(ACT_KEY[def.act]) + '</button>' +
              '<button class="link" data-lrm="' + i + '">' + t('unlink') + '</button>' +
              '</td></tr>'
            if (confirmando !== l.id) return fila
            return fila + '<tr><td colspan="3"><div class="confirm">' +
              esc(fmt(!l.authorizedChats ? 'unlinkWarn0'
                : l.authorizedChats === 1 ? 'unlinkWarn1' : 'unlinkWarn',
                { l: l.label, n: l.authorizedChats })) +
              '<div class="actions"><button data-lyes="' + i + '">' + t('unlinkYes') +
              '</button><button data-lno="1">' + t('unlinkNo') + '</button></div>' +
              '</div></td></tr>'
          }).join('') + '</tbody></table>'

        Array.prototype.forEach.call(wrap.querySelectorAll('[data-lact]'), function (b) {
          b.addEventListener('click', function () {
            var l = lineas[Number(b.dataset.lact)]
            var accion = (LINE_STATE[l.state] || {}).act
            // Se espera el veredicto en vez de soltar el clic: "Ver la pestana" sobre
            // una pestana que ya no esta fallaba y el boton no decia nada hasta el
            // refresco siguiente, ocho segundos despues.
            busy(b, pedirWeb(accion === 'retry' ? 'refresh' : accion,
              { id: l.id, profile: l.profile, pageId: l.pageId || null })
              .then(function (p) {
                if (!p.ok) return
                return esperarWeb(p.at, 45000).then(function (st) {
                  webStatusUlt = st ||
                    { ok: false, code: 'sin-respuesta', detail: '' }
                  renderLineas(lineasUlt)
                })
              }))
          })
        })
        Array.prototype.forEach.call(wrap.querySelectorAll('[data-lrm]'), function (b) {
          b.addEventListener('click', function () {
            confirmando = lineas[Number(b.dataset.lrm)].id
            renderLineas(lineasUlt)
          })
        })
        Array.prototype.forEach.call(wrap.querySelectorAll('[data-lno]'), function (b) {
          b.addEventListener('click', function () { confirmando = null; renderLineas(lineasUlt) })
        })
        Array.prototype.forEach.call(wrap.querySelectorAll('[data-lyes]'), function (b) {
          b.addEventListener('click', function () {
            var l = lineas[Number(b.dataset.lyes)]
            confirmando = null
            busy(b, pedirWeb('unlink',
              { id: l.id, profile: l.profile, pageId: l.pageId || null })
              .then(function () { said('said-line', t('lineRemoving')); vigilarLineas(true) }))
          })
        })

        // Donde quedo la pestana. Se dice siempre que se sepa, no solo cuando falla:
        // "no encuentro la pestana" fue la pregunta de las dos primeras veces.
        var place = el('lines-place')
        var donde = lineasUlt && lineasUlt.placement
        if (donde === 'flotante') place.textContent = t('linePlacedFloating')
        else if (donde === 'proyecto') {
          place.textContent = fmt('linePlacedProject', { p: lineasUlt.project || '' })
        } else place.textContent = ''
        place.hidden = !place.textContent

        vigilarLineas(lineas.some(function (l) { return l.state !== 'enlazada' }))
      }

      // Mientras algo este a medias el estado se relee cada 2 s y no cada 8: el momento
      // que importa — escanear el QR — pasa en OTRA ventana, y esperar al proximo
      // refresco general dejaba el panel diciendo "esperando" con la linea ya enlazada.
      var timerLineas = null
      function vigilarLineas (transitorio) {
        if (timerLineas) { clearInterval(timerLineas); timerLineas = null }
        if (!transitorio) return
        timerLineas = setInterval(function () {
          if (document.visibilityState !== 'visible') return
          Promise.all([read('webLines'), read('webStatus')]).then(function (r) {
            webStatusUlt = r[1] && typeof r[1] === 'object' ? r[1] : null
            renderLineas(r[0])
          })
        }, 2000)
      }

      // El campo NO se vacia al mandar el pedido. Se vaciaba ahi, o sea antes de saber
      // si la linea existia: cuando fallaba, el usuario perdia lo que habia escrito y no
      // se enteraba de nada. Se vacia recien con el veredicto en la mano.
      el('link-line').addEventListener('click', function (event) {
        var label = el('line-label').value.trim()
        if (!label) { said('said-line', t('needLineLabel'), true); return }
        // No dice "conectada": todavia no lo esta. Lo que pasa de verdad es que el
        // worker esta creando el perfil y abriendo la pestana, y la tabla lo cuenta.
        said('said-line', t('lineWorking'))
        // Sin esto la primera vista del estado llegaria recien al proximo refresco,
        // que es justo el segundo en que el usuario pregunta donde se abrio.
        vigilarLineas(true)
        busy(event.currentTarget, pedirWeb('link', { label: label }).then(function (p) {
          if (!p.ok) {
            said('said-line', t('lineFailed') + ' ' + t('lineKept'), true)
            return
          }
          return esperarWeb(p.at).then(function (st) {
            if (!st) { said('said-line', t('lineNoAnswer'), true); return }
            if (!st.ok) {
              // El motivo va UNA vez, en el renglon de la seccion. Repetirlo al lado
              // del boton llenaba media pantalla de rojo con el mismo parrafo.
              webStatusUlt = st
              renderLineas(lineasUlt)
              said('said-line', t('lineKept'), true)
              return
            }
            el('line-label').value = ''
            said('said-line', '\u2713 ' + t('lineDone'))
            vigilarLineas(true)
          })
        }))
      })

      // ---------- carga y refresco ----------
      var liveStorage = null

      function reload() {
        if (!liveStorage) return Promise.resolve()
        return Promise.all([read('scope'), read('agentName'), read('health'),
                            read('routes'), read('tone'), read('chats'),
                            read('transcribeQuality'), read('inboxDays'),
                            read('ownerName'), read('transcribe'),
                            read('transcribeLang'), read('syncStatus'),
                            read('readLocal'), read('readWeb'),
                            read('syncMinutes'), read('readWebText'),
                            read('webLines'), read('webStatus')])
          .then(function (r) {
            renderScope(r[0])
            if (typeof r[4] === 'string' && document.activeElement !== el('tone')) {
              el('tone').value = r[4]
            }
            ponerEnSelect('quality', r[6], 'optima')
            // 7 dias y no 1: una mencion del viernes tiene que seguir a la vista el lunes.
            ponerEnSelect('inbox-days', r[7], '7')
            ponerEnSelect('transcribe', r[9], 'local')
            ponerEnSelect('lang', r[10], 'auto')
            ponerEnSelect('read-local', r[12], 'on')
            ponerEnSelect('read-web', r[13], 'off')
            ponerEnSelect('sync-minutes', r[14], '5')
            ponerEnSelect('read-web-text', r[15], 'off')
            if (typeof r[8] === 'string' && document.activeElement !== el('owner')) {
              el('owner').value = r[8]
            }
            // Sin guardia de foco: renderChats no toca el buscador — reconstruye el
            // select y pintarChats ya conserva el texto filtrado y lo elegido. La
            // guardia solo lograba que, con el cursor en el buscador, la lista nunca
            // se llenara: era justo donde esta el cursor de quien mira "Buscando…".
            estadoSync = r[11] && typeof r[11] === 'object' ? r[11] : null
            renderChats(r[5])
            if (typeof r[1] === 'string' && r[1] && !agentDirty &&
                document.activeElement !== el('agent')) {
              showAgentSaved(r[1])
            }
            // El health ya trae QUE falla y su detalle: mostrarlo es mejor que mandar
            // a correr un comando, que es justo lo que se saco del resto del panel.
            if (r[2] && r[2].ok === false) {
              var q = r[2].problem
                ? esc(porCodigo(HEALTH_KEY, r[2].problemCode, r[2].problem))
                : t('notReady')
              // El detalle es el dato crudo de la herramienta —una ruta, un tamano, un
              // error de sqlite— no una frase: se muestra tal cual, como el detalle del
              // sync fallido de mas arriba.
              var c = r[2].detail ? esc(r[2].detail) : t('notReadyHow')
              showAlert(q, c)
            }
            else if (r[2]) el('alert').hidden = true
            renderOpcionales(r[2] && r[2].optional)
            renderRoutes(r[3])
            webStatusUlt = r[17] && typeof r[17] === 'object' ? r[17] : null
            renderLineas(r[16])
          })
      }

      var timer = null
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') reload()
      })
      window.addEventListener('focus', reload)

      applyStrings()
      resetScopeForm()
      call('storage.get', { key: 'scope' }).then(function (r) {
        liveStorage = !!r.ok
        if (!liveStorage) {
          showAlert(t('needsUpdate'), t('needsUpdateHow'))
          Array.prototype.forEach.call(document.querySelectorAll('button'), function (b) {
            b.disabled = true
          })
          return
        }
        reload()
        // El worker sondea lento cuando no hay nada a medias; abrir el panel es la
        // senal de que alguien esta mirando, asi que se le pide una comprobacion ya.
        pedirWeb('refresh')
        // No hay evento de storage: un sondeo corto mientras el panel esta a la vista
        // cuesta 1 de los 30 mensajes por 10s que el host permite.
        timer = setInterval(function () {
          if (document.visibilityState === 'visible') reload()
        }, 8000)
      })
    </script>
  </body>
</html>
