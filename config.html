<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WhatsApp Inbox</title>
    <style>
      /* El host inyecta una lista corta de tokens en el <style> del shell
         (PANEL_DESIGN_TOKEN_ALLOWLIST, orca-oss src/shared/plugins/plugin-panel-shell.ts:34)
         y pone light/dark en <html>. Nada mas llega aca: ni utilidades de Tailwind,
         ni --radius-md, ni la tipografia de la app. Todo lo de abajo sale de esa
         lista o se calcula desde ella. */
      :root {
        color-scheme: light dark;
        /* De los radios solo viene --radius. md se calcula con el mismo factor que
           main.css:122, para no inventar un radio por elemento. */
        --radius-md: calc(var(--radius, 0.625rem) * 0.8);
        /* Respaldos para cuando el host no inyecta nada (host viejo, o el arnes
           jsdom). Son los valores reales de main.css, no un gris inventado: antes
           eran solo oscuros y el panel salia ilegible en cuanto el tema era claro. */
        --fb-background: #fff; --fb-foreground: #0a0a0a;
        --fb-primary: #171717; --fb-primary-foreground: #fafafa;
        --fb-secondary: #f5f5f5; --fb-secondary-foreground: #171717;
        --fb-muted: #f5f5f5; --fb-muted-foreground: #737373;
        --fb-accent: #f5f5f5; --fb-accent-foreground: #171717;
        --fb-destructive: #e40014;
        --fb-border: #e5e5e5; --fb-input: #e5e5e5; --fb-ring: #a1a1a1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fb-background: #0a0a0a; --fb-foreground: #fafafa;
          --fb-primary: #e5e5e5; --fb-primary-foreground: #171717;
          --fb-secondary: #262626; --fb-secondary-foreground: #fafafa;
          --fb-muted: #262626; --fb-muted-foreground: #a1a1a1;
          --fb-accent: #404040; --fb-accent-foreground: #fafafa;
          --fb-destructive: #ff6568;
          --fb-border: rgb(255 255 255 / 0.07); --fb-input: rgb(255 255 255 / 0.15);
          --fb-ring: #737373;
        }
      }
      /* Los widgets nativos (scrollbar, lista del select) siguen al tema real del
         host, no a la preferencia del sistema. */
      html.light { color-scheme: light; }
      html.dark { color-scheme: dark; }
      * { box-sizing: border-box; }
      /* Sin padding en el body: el iframe no tiene relleno propio
         (PluginPanel.tsx:231 lo monta con h-full w-full) y los paneles nativos de
         Orca son a sangre, con el relleno adentro de cada bloque. */
      body {
        margin: 0; padding: 0 0 24px;
        /* Geist es la fuente de la app, pero el iframe no ve sus @font-face: pedirla
           solo daria un fallback distinto en cada maquina. Se queda el del sistema. */
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px; letter-spacing: 0.01em;
        color: var(--foreground, var(--fb-foreground));
        background: var(--background, var(--fb-background));
      }
      .wrap { max-width: 760px; }
      h1 { font-size: 13px; font-weight: 600; margin: 0; padding: 12px 12px 0;
           letter-spacing: -0.01em; }
      .sub:first-child { margin-top: 0; }
      .sub { color: var(--muted-foreground, var(--fb-muted-foreground));
             margin: 0; padding: 2px 12px 12px; font-size: 12px; }
      /* Los paneles propios de Orca no usan la primitiva Card por seccion: son
         planos, a sangre, separados por un filete de --border y una etiqueta
         chica en mayusculas (right-sidebar/PortsPanel.tsx:471, source-control/
         panel/header-toolbar.tsx:196, checks-panel-content.tsx:4503). Este panel
         hace lo mismo: una caja redondeada por seccion se veia como otra app.
         El relleno horizontal es 12 px, que es el px-3 de la casa. */
      section { padding: 12px; margin: 0;
                border-top: 1px solid var(--border, var(--fb-border)); }
      /* Etiqueta meta de 11 px: el STYLEGUIDE la fija en 600 y 0.05em, igual que
         PortsPanel.tsx:336. */
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
           color: var(--muted-foreground, var(--fb-muted-foreground));
           margin: 0 0 10px; font-weight: 600; }
      label { display: block; font-size: 12px; margin: 10px 0 4px;
              color: var(--muted-foreground, var(--fb-muted-foreground)); }
      label:first-of-type { margin-top: 0; }
      /* Campos como el primitivo Input de Orca: fondo transparente, filete de
         --input y radio md (components/ui/input.tsx). */
      input, select, textarea {
        font: inherit; width: 100%; padding: 7px 9px; border-radius: var(--radius-md);
        border: 1px solid var(--input, var(--fb-input)); background: transparent;
        color: var(--foreground, var(--fb-foreground));
      }
      textarea { resize: vertical; }
      /* En Linux la lista desplegada del select la dibuja el mismo motor de render y
         hereda el color del control: con el fondo transparente salia blanca, y en
         tema oscuro con el texto en --foreground eso es blanco sobre blanco. En macOS
         es un menu del sistema y este CSS no la toca. Se fijan las dos propiedades en
         el control Y en las opciones porque el hueco entre ellas lo pinta el fondo
         del control, no el de la opcion. El cerrado no cambia: el token es el mismo
         fondo que ya tiene detras. */
      select { background-color: var(--background, var(--fb-background));
               color: var(--foreground, var(--fb-foreground)); }
      select option { background-color: var(--background, var(--fb-background));
                      color: var(--foreground, var(--fb-foreground)); }
      input:disabled { opacity: 1; color: var(--foreground, var(--fb-foreground));
                       border-color: transparent; background: var(--muted, var(--fb-muted)); }
      /* El destino con "ninguno" no es un campo vacio: es un campo que no aplica. Sin
         marca propia, en tema claro se veia igual que uno editable — el defecto de
         siempre: parece que se puede escribir y nadie lo mira. */
      #target:disabled { background: transparent;
                         color: var(--muted-foreground, var(--fb-muted-foreground));
                         border: 1px dashed var(--border, var(--fb-border)); }
      input:focus-visible, select:focus-visible, textarea:focus-visible {
        outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px;
        border-color: transparent;
      }
      button {
        font: inherit; font-weight: 500; padding: 7px 14px;
        border-radius: var(--radius-md); cursor: pointer;
        border: 1px solid var(--border, var(--fb-border));
        background: var(--secondary, var(--fb-secondary));
        color: var(--secondary-foreground, var(--fb-secondary-foreground));
        transition: background-color 90ms ease, color 90ms ease, transform 60ms ease;
      }
      /* Hover y active van por --accent, que es justamente para eso; el filete se
         queda en --border, porque --ring es enfasis fuerte y no decoracion. */
      button:hover { background: var(--accent, var(--fb-accent));
                     color: var(--accent-foreground, var(--fb-accent-foreground)); }
      button:active { transform: translateY(1px); }
      button:focus-visible { outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px; }
      button[disabled] { opacity: 0.5; cursor: default; transform: none; }
      button.primary { background: var(--primary, var(--fb-primary));
                       color: var(--primary-foreground, var(--fb-primary-foreground));
                       border-color: transparent; }
      button.primary:hover { background: var(--primary, var(--fb-primary));
                             color: var(--primary-foreground, var(--fb-primary-foreground));
                             filter: brightness(1.12); }
      /* Subrayado siempre, no solo en hover: en tema claro --primary es casi negro,
         asi que sin subrayar Editar/Quitar no se leen como algo clickeable. */
      button.link { border: 0; background: none; padding: 0; margin-left: 10px;
                    color: var(--primary, var(--fb-primary)); font-size: 11px; font-weight: 400;
                    text-decoration: underline; text-underline-offset: 2px; }
      button.link:hover { background: none; color: var(--primary, var(--fb-primary));
                          text-decoration-thickness: 2px; }
      /* El buscador y la lista son un solo control: pegados, sin costura visible. */
      #chat-search { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
      #chat-pick { border-top-left-radius: 0; border-top-right-radius: 0; border-top: 0; }
      #chat-count { margin-top: 4px; }
      .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
      .row2 { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
      .actions { display: flex; align-items: center; gap: 10px; margin-top: 14px;
                 min-height: 30px; flex-wrap: wrap; }
      /* Una fila de acciones sin nada visible deja 44 px de aire entre dos campos
         que van juntos. Se colapsa sola cuando no le quedan botones ni mensaje; si
         el navegador no soporta :has() se queda como antes, sin romperse. */
      .actions:not(:has(button:not([hidden]))):not(:has(.said:not(:empty))) {
        display: none;
      }
      /* La allowlist no trae color de exito, y no se inventa uno: el ✓ y el peso
         cargan la confirmacion. El fallo si tiene token, --destructive. */
      .said { font-size: 12px; font-weight: 500;
              color: var(--foreground, var(--fb-foreground)); }
      .said.bad { font-weight: 400; color: var(--destructive, var(--fb-destructive)); }
      /* Las filas van a sangre dentro de la seccion: el filete llega a los bordes
         del relleno, como las listas del panel de control de versiones. */
      table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
      th { text-align: left; font-weight: 500;
           color: var(--muted-foreground, var(--fb-muted-foreground));
           padding: 5px 8px 5px 0; border-bottom: 1px solid var(--border, var(--fb-border)); }
      td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--border, var(--fb-border));
           vertical-align: top; }
      tr:last-child td { border-bottom: 0; }
      td.acts { text-align: right; white-space: nowrap; }
      /* A 320 px una tabla de 4 columnas no cabe, y partir palabra deja pastillas que
         dicen "respon der". Debajo de 420 px cada fila pasa a ser un bloque: el valor
         se describe solo, asi que la cabecera no hace falta. */
      @media (max-width: 420px) {
        table, tbody, tr, td { display: block; width: 100%; }
        thead { display: none; }
        tr { border-bottom: 1px solid var(--border, var(--fb-border)); padding: 8px 0; }
        tr:last-child { border-bottom: 0; }
        td { border: 0; padding: 1px 0; }
        /* Con casa discrepante una fila lleva cuatro acciones, y en espanol el
           `nowrap` de arriba las empujaba a 333 px dentro de una ventana de 320.
           Abajo de 420 se envuelven; el `nowrap` sigue valiendo en pantalla ancha,
           donde parte una etiqueta a la mitad. */
        td.acts { text-align: left; margin-top: 6px; white-space: normal; }
        td.acts button { margin-bottom: 4px; }
        .row { grid-template-columns: 1fr; }
      }
      /* Los cuatro permisos. La allowlist no tiene verde ni ambar y no se fabrican:
         se separan por peso y superficie, no por tono. "off" se queda en el estado
         base — texto apagado, sin filete —, "observar" suma filete y texto pleno,
         "borrador" es una superficie --accent, y solo "responder" (el unico que
         manda mensajes de verdad) usa --destructive. */
      .pill { display: inline-block; padding: 1px 8px; border-radius: 9999px; font-size: 11px;
              border: 1px solid transparent;
              color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .pill.observar { border-color: var(--border, var(--fb-border));
                       color: var(--foreground, var(--fb-foreground)); }
      .pill.borrador { background: var(--accent, var(--fb-accent));
                       color: var(--accent-foreground, var(--fb-accent-foreground)); }
      .pill.responder { border-color: var(--destructive, var(--fb-destructive));
                        color: var(--destructive, var(--fb-destructive)); font-weight: 600; }
      /* El estado de una linea usa las mismas tres superficies que los permisos, y por
         la misma razon: la allowlist no trae verde ni ambar. Lista = filete y texto
         pleno; esperando = superficie --accent, que es lo que pide atencion; rota =
         --destructive, el unico token de alerta que llega al panel. */
      .pill.lista { border-color: var(--border, var(--fb-border));
                    color: var(--foreground, var(--fb-foreground)); }
      /* Con filete ademas del relleno: en tema claro --accent es #f5f5f5 sobre blanco,
         asi que sin borde la pastilla se perdia y el estado dejaba de leerse. */
      .pill.pendiente { background: var(--accent, var(--fb-accent));
                        border-color: var(--border, var(--fb-border));
                        color: var(--accent-foreground, var(--fb-accent-foreground)); }
      .pill.roto { border-color: var(--destructive, var(--fb-destructive));
                   color: var(--destructive, var(--fb-destructive)); font-weight: 600; }
      /* Que hacer con esta linea, debajo de su estado. Es EL mensaje de la fila — no un
         consejo al margen — asi que va en el texto normal y no en el apagado. */
      td .how { display: block; margin-top: 3px; font-size: 11px; line-height: 1.5;
                color: var(--foreground, var(--fb-foreground)); }
      /* Desvincular borra cosas que no vuelven: la advertencia ocupa la fila entera y
         los dos botones quedan debajo, para que no se confirme de un clic de inercia. */
      tr.confirmando td { border-bottom: 0; }
      .confirm { font-size: 11px; line-height: 1.5; padding: 0 0 8px;
                 color: var(--destructive, var(--fb-destructive)); }
      .confirm .actions { margin-top: 8px; }
      /* Lo que fallo en el ultimo intento. No es una pista al margen: es el motivo por
         el que el boton no hizo lo que prometio. */
      .lines-error[hidden] { display: none; }
      .lines-error { font-size: 12px; line-height: 1.5; margin: 0 0 10px;
                     color: var(--destructive, var(--fb-destructive)); }
      /* El nombre de la linea no se parte en dos mientras sobre ancho: la segunda
         columna se lleva todo el sitio porque ahi va el parrafo del estado. */
      #lines-wrap td:first-child { min-width: 8em; }
      /* Conectar OTRA linea es una zona nueva debajo de la tabla. `label:first-of-type`
         le quitaba el margen de arriba y quedaba pegada al renglon anterior, como si
         fuera su pie. */
      #lines-place { margin: 8px 0 0; }
      .wrap label[for="line-label"] { margin-top: 16px; }
      /* La accion que resuelve el estado es un boton de verdad y no un enlace de 11 px:
         en "esperando el escaneo" es LO que hay que hacer, y el escaneo pasa en otra
         ventana. Desvincular se queda como enlace — no se ofrece, se busca. */
      td.acts button + button { margin-left: 10px; }
      @media (max-width: 420px) { td.acts button + button { margin-left: 8px; } }
      .empty { color: var(--muted-foreground, var(--fb-muted-foreground));
               font-size: 12px; padding: 10px 0; }
      .hint { color: var(--muted-foreground, var(--fb-muted-foreground));
              font-size: 11px; margin: 6px 0 0; line-height: 1.5; }
      /* El motivo no es una pista al margen: es EL mensaje mientras no hay lista, asi
         que va en el color del texto y no en el apagado de los consejos. */
      #sync-msg { color: var(--foreground, var(--fb-foreground)); }
      /* La salida cruda de la herramienta se lee como lo que es. A 320 px la ruta no
         cabe en una linea y partirla es mejor que desbordar. */
      #sync-detail { font-family: ui-monospace, Menlo, monospace; overflow-wrap: anywhere; }
      /* Un requisito opcional no es una alerta: no bloquea nada. Va en gris, con su
         accion al lado, y desaparece cuando se resuelve. */
      #opcionales[hidden] { display: none; }
      #opcionales { margin: 0 0 12px; padding: 0 12px; }
      .opcional {
        display: flex; gap: 8px; align-items: baseline; padding: 7px 0;
        border-top: 1px solid var(--border, var(--fb-border)); font-size: 12px;
        color: var(--muted-foreground, var(--fb-muted-foreground));
      }
      .opcional:last-child { border-bottom: 1px solid var(--border, var(--fb-border)); }
      .opcional b { color: var(--foreground, var(--fb-foreground)); font-weight: 500; }
      .opcional code { color: var(--primary, var(--fb-primary)); }
      .alert[hidden] { display: none; }
      /* Un lugar por renglon: dos frases seguidas se leian como una sola. */
      #lines-place .place-line { display: block; }
      #lines-place .place-line + .place-line { margin-top: .35rem; }

      /* El unico bloque con caja: en Orca las cajas redondeadas quedan reservadas
         para avisos, no para estructura (listing/conflict-status-cards.tsx:49 usa
         rounded-md + filete + tinte). Radio md, filete y texto en --destructive; el
         tinte se deriva del mismo token con color-mix en vez de un rojo aparte, y si
         el motor no lo soporta la declaracion se cae y queda el filete. */
      .alert { display: flex; gap: 8px; align-items: baseline;
               border: 1px solid var(--destructive, var(--fb-destructive));
               border-radius: var(--radius-md); padding: 9px 11px;
               margin: 0 12px 12px; font-size: 12px;
               color: var(--foreground, var(--fb-foreground));
               background: color-mix(in srgb,
                 var(--destructive, var(--fb-destructive)) 8%, transparent); }
      /* El porque va apagado y en su renglon: la instruccion es lo que hay que leer. */
      .alert-why { display: block; margin-top: 4px; font-size: 11px;
                   color: var(--muted-foreground, var(--fb-muted-foreground)); }
      code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
      @media (max-width: 620px) { .row { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- Sin titulo propio: en Ajustes el host ya pinta "WhatsApp Inbox" arriba de la
           pagina, asi que repetirlo lo dice dos veces. La bajada si aporta: explica que
           hace el panel, no como se llama. -->
      <p class="sub" data-t="sub"></p>
      <div class="alert" id="alert" hidden></div>
      <div id="opcionales" hidden></div>

      <section>
        <h2 data-t="agentLegend"></h2>
        <label for="agent" data-t="agentLabel"></label>
        <div class="row2">
          <input id="agent" data-t-ph="agentPh" />
          <button id="edit-agent" hidden data-t-title="editName">&#9998;</button>
        </div>
        <p class="hint" data-t="agentHelp"></p>
        <div class="actions">
          <button class="primary" id="save-agent" data-t="saveName"></button>
          <button id="cancel-agent" hidden data-t="cancel"></button>
          <span class="said" id="said-agent"></span>
        </div>

        <label for="owner" data-t="ownerLabel"></label>
        <input id="owner" data-t-ph="ownerPh" />
        <p class="hint" data-t="ownerHelp"></p>
        <div class="actions">
          <button id="save-owner" data-t="saveOwner"></button>
          <span class="said" id="said-owner"></span>
        </div>

        <label for="tone" data-t="toneLabel"></label>
        <textarea id="tone" rows="3" data-t-ph="tonePh"></textarea>
        <p class="hint" data-t="toneHelp"></p>
        <div class="actions">
          <button id="save-tone" data-t="saveTone"></button>
          <span class="said" id="said-tone"></span>
        </div>

        <label for="transcribe" data-t="transcribeLabel"></label>
        <select id="transcribe">
          <option value="local" data-t="trLocal"></option>
          <option value="off" data-t="trOff"></option>
        </select>
        <p class="hint" data-t="transcribeHelp"></p>
        <div class="actions">
          <button id="save-transcribe" data-t="saveTranscribe"></button>
          <span class="said" id="said-transcribe"></span>
        </div>

        <label for="lang" data-t="langLabel"></label>
        <select id="lang">
          <option value="auto" data-t="langAuto"></option>
          <option value="es" data-t="langEs"></option>
          <option value="en" data-t="langEn"></option>
          <option value="pt" data-t="langPt"></option>
        </select>
        <p class="hint" data-t="langHelp"></p>
        <div class="actions">
          <button id="save-lang" data-t="saveLang"></button>
          <span class="said" id="said-lang"></span>
        </div>

        <label for="quality" data-t="qualityLabel"></label>
        <select id="quality">
          <option value="optima" data-t="qualityOptima"></option>
          <option value="minima" data-t="qualityMinima"></option>
        </select>
        <p class="hint" data-t="qualityHelp"></p>
        <div class="actions">
          <button id="save-quality" data-t="saveQuality"></button>
          <span class="said" id="said-quality"></span>
        </div>
      </section>

      <section>
        <h2 data-t="sourceLegend"></h2>
        <label for="read-local" data-t="readLocalLabel"></label>
        <select id="read-local">
          <option value="on" data-t="readLocalOn"></option>
          <option value="off" data-t="readLocalOff"></option>
        </select>
        <label for="read-web" data-t="readWebLabel"></label>
        <select id="read-web">
          <option value="off" data-t="readWebOff"></option>
          <option value="on" data-t="readWebOn"></option>
        </select>
        <!-- `capture_max` y `capture_days` no estan aca a proposito: solo dicen cuanto
             dura un cache, nunca que puede leer ni contestar el agente, asi que no hay
             decision que tomar; el aviso que salta cuando el desalojo pierde un caso ya
             trae el comando exacto. Estos tres si: cambian de que lineas lee. -->
        <label for="read-web-text" data-t="readWebTextLabel"></label>
        <select id="read-web-text">
          <option value="off" data-t="readWebTextOff"></option>
          <option value="memoria" data-t="readWebTextMemoria"></option>
        </select>
        <p class="hint" data-t="sourceHelp"></p>
        <div class="actions">
          <button id="save-source" data-t="saveSource"></button>
          <span class="said" id="said-source"></span>
        </div>
      </section>

      <!-- Las lineas conectadas. Va pegada a "de donde lee" porque es su consecuencia:
           el interruptor dice que se sume WhatsApp Web, esto dice CUAL. -->
      <section>
        <h2 data-t="linesLegend"></h2>
        <p class="lines-error" id="lines-error" hidden></p>
        <div id="lines-wrap"></div>
        <p class="hint" id="lines-place" hidden></p>
        <label for="line-label" data-t="lineLabelLabel"></label>
        <input id="line-label" data-t-ph="lineLabelPh" />
        <p class="hint" data-t="linesHelp"></p>
        <label for="line-where" data-t="lineWhereLabel"></label>
        <select id="line-where">
          <option value="proyecto" data-t="lineWhereProject"></option>
          <option value="flotante" data-t="lineWhereFloating"></option>
        </select>
        <p class="hint" data-t="lineWhereHelp"></p>
        <div class="actions">
          <button class="primary" id="link-line" data-t="linkLine"></button>
          <span class="said" id="said-line"></span>
        </div>
      </section>

      <section>
        <h2 data-t="mapLegend"></h2>
        <label for="inbox-days" data-t="daysLabel"></label>
        <select id="inbox-days">
          <option value="1" data-t="days1"></option>
          <option value="3" data-t="days3"></option>
          <option value="7" data-t="days7"></option>

      // otra: medido, arranque 21 + foco 19 = 40 en la misma ventana, y el
      // `storage.set` del clic llegaba en el puesto 31. El panel lo contaba como "el
      // plugin no contesto" y el usuario apretaba de nuevo — el segundo clic entraba
      // porque la ventana ya se habia vaciado. Por eso la ventana se lleva tambien de
      // este lado: lo que nace de un clic tiene cupo reservado y prioridad, y lo que no
      // entra espera su turno en vez de perderse.
      var CUPO = { max: 30, ventanaMs: 10000, reserva: 4 }
      var gastados = [], cola = [], colaTimer = null, frenoHasta = 0
      var RECHAZADO = { ok: false, errorCode: 'rate_limited' }

      // se pierde nada —un rechazo no gasta cupo— y el reintento lo pone igual. Frenar
      // un clic para no molestar al host seria cambiar un defecto por otro mas lento.
      function hayLugarDeSondeo() {
        var corte = Date.now() - CUPO.ventanaMs
        while (gastados.length && gastados[0] <= corte) gastados.shift()
        return gastados.length < CUPO.max - CUPO.reserva

      function proximoHueco() {
        var ahora = Date.now()
        // Lo del usuario espera SU reintento y nada mas: hacerlo esperar a que se
        // vacie la ventana del sondeo lo dejaba diez segundos quieto, que es el mismo
        // "no paso nada" que esto viene a sacar.
        if (cola[0] && cola[0].usuario) return Math.max(60, (cola[0].desde || 0) - ahora)
        var falta = frenoHasta - ahora
        if (gastados.length) falta = Math.max(falta, gastados[0] + CUPO.ventanaMs - ahora)

          // Solo reintenta lo del usuario. Una lectura del sondeo ya tiene su memoria
          // y la vuelta siguiente la vuelve a pedir; reintentarlas en manada era lo
