        var d = event.data
        if (!d || d.type !== 'orca-panel-action-result') return
        var resolve = pending[d.requestId]
        if (!resolve) return
        delete pending[d.requestId]
        resolve(d)
      })

      // Una lectura que el host RECHAZO no es una clave vacia. Aplastar las dos en
      // `null` es lo que hacia parpadear el panel: con la vuelta costando 19 de los 30
      // mensajes por 10 s, la COLA del lote volvia `rate_limited`, y con `webLines` y
      // `syncMinutes` ahi adentro la tabla se vaciaba y el select volvia a su defecto.
      var SIN_RESPUESTA = { sinRespuesta: true }
      function hayRespuesta(v) { return v !== SIN_RESPUESTA }

      // storage.get devuelve { value: <dato> } y el bridge lo envuelve otra vez.
      function stored(result) {
        if (!result || !result.ok) return SIN_RESPUESTA
        if (!result.value) return null
        return result.value.value === undefined ? null : result.value.value
      }
      // Lo ultimo que el host CONTESTO por cada clave. Un rechazo repinta eso y no el
      // defecto: sin respuesta el panel no sabe nada nuevo, y no saber no es "vacio".
      var ultimaLectura = {}
      function read(key, usuario) {
        return call('storage.get', { key: key }, usuario).then(function (r) {
          var v = stored(r)
          if (hayRespuesta(v)) { ultimaLectura[key] = v; return v }
          return key in ultimaLectura ? ultimaLectura[key] : SIN_RESPUESTA
        })
      }
      // Toda escritura nace de un clic —el sondeo solo lee—, asi que va por el carril
      // del usuario: con cupo reservado, prioridad en la cola y reintento.
      function write(key, value) {
        return call('storage.set', { key: key, value: value }, true)
      }

      function esc(text) {
        return String(text == null ? '' : text)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      }

      // La confirmacion va al lado del boton que la provoco, no al pie del panel: ahi
      // abajo no se ve y parece que no paso nada.
      function said(id, text, bad) {
        var node = el(id)
        node.textContent = text
        node.className = 'said' + (bad ? ' bad' : '')
        if (!bad && text) {
          clearTimeout(node._timer)
          node._timer = setTimeout(function () { node.textContent = '' }, 4000)
        }
      }

      function busy(button, promise) {
        var label = button.textContent
        button.disabled = true
        button.textContent = '…'
        return Promise.resolve(promise).then(function (value) {
          button.disabled = false; button.textContent = label; return value
        }, function (error) {
          button.disabled = false; button.textContent = label
          throw error
        })
      }

      // El CLI habla ingles y no sabe en que idioma esta el usuario, asi que ademas del
      // texto manda un codigo estable. La frase la arma el panel, que si lo sabe; el
      // texto del CLI queda de respaldo para un codigo que este panel no conozca todavia.
      // Mismo trato que los motivos del worker en motivoTexto().
      var HEALTH_KEY = {
        system: 'hSystem', whatsapp: 'hWhatsapp', database: 'hDatabase',
        readable: 'hReadable', sqlite3: 'hSqlite3', send: 'hSend',
        'no-source': 'hNoSource',
        transcribe: 'hTranscribe', web: 'hWeb', fulldisk: 'hFulldisk',
        local: 'hLocal',
        unknown: 'hUnknown'
      }
      var HEALTH_HOW_KEY = {
        'local-covered-by-web': 'howLocalCoveredByWeb',
        'web-not-implemented': 'howWebNotBuilt',
        'web-off': 'howWebOff',
        'web-no-orca': 'howWebNoOrca',
        'web-no-session': 'howWebNoSession',
        'web-logged-out': 'howWebLoggedOut',
        'web-line-pending': 'howWebLinePending',
        'web-no-line': 'howWebNoLine',
        'web-profile-ambiguous': 'howWebProfileAmbiguous',
        'web-eval-timeout': 'howWebTimeout',
        'web-read-failed': 'howWebReadFailed',
        'web-text-unavailable': 'howWebNoText',
        'fulldisk-missing': 'howFulldiskMissing',
        'send-no-orca': 'howSendNoOrca',
        'transcribe-missing-tool': 'howTranscribeMissingTool',
        'transcribe-unknown': 'howTranscribeUnknown',
        'transcribe-orca-outdated': 'howTranscribeOrcaOutdated',
        'transcribe-no-engine': 'howTranscribeNoEngine',
        'transcribe-no-model': 'howTranscribeNoModel'
      }
      function porCodigo(mapa, code, respaldo) {
        var key = mapa[code]
        return key ? t(key) : (respaldo || '')
      }

      // El permiso y el servicio se guardan con estos valores y no se traducen nunca en
      // el storage; lo que se traduce es como se leen. La tabla decia el valor crudo
      // mientras el select de al lado ya lo decia en el idioma del usuario: dos formas
      // de nombrar lo mismo en la misma pantalla.
      var MODE_KEY = { off: 'modeOff', observar: 'modeObserve', borrador: 'modeDraft',
                       responder: 'modeReply' }
      var PROV_KEY = { ninguno: 'provNone', plane: 'provPlane', linear: 'provLinear',
                       github: 'provGithub' }

      // Se muestran los requisitos que el usuario puede activar, con su accion.
      // Separados de la alerta a proposito: una funcion que falta no es una rotura.
      function renderOpcionales(lista) {
        var caja = el('opcionales')
        if (!lista || !lista.length) { caja.hidden = true; caja.innerHTML = ''; return }
        caja.innerHTML = '<p class="hint" style="margin:0 0 4px">' + t('optionalTitle') +
          '</p>' + lista.map(function (o) {
            return '<div class="opcional"><span>\u25CB</span><span><b>' +
              esc(porCodigo(HEALTH_KEY, o.code, o.que)) + '</b> &mdash; <code>' +
              esc(porCodigo(HEALTH_HOW_KEY, o.howCode, o.como)) + '</code></span></div>'
          }).join('')
        caja.hidden = false
      }

      // Cuanto puede tardar un latido antes de darlo por ido. El worker late cada 5 s
      // y una llamada a la CLI de Orca lo puede tener ocupado 30: por debajo de eso se
      // marcaria muerto a un worker que solo estaba trabajando.
      var LATIDO_VENCE_MS = 30000

      /** Si no hay nadie corriendo, y decirlo. Devuelve true cuando tomo el aviso.
       *
       *  `null` es "el worker nunca escribio": o no arranco nunca, o Orca no lo arranco
       *  porque el plugin espera aprobacion. Es el caso que se veia como un silencio de
       *  45 s indistinguible de una maquina lenta. SIN_RESPUESTA es otra cosa —el host
       *  no contesto— y ahi no se afirma nada. */
      /** Apaga lo que NECESITA al worker. Guardar no: el valor queda escrito y se
       *  aplica cuando el worker arranque. Lo que se apaga es lo que deja un pedido
       *  esperando respuesta — apretarlo sin nadie del otro lado es el silencio de 45 s
       *  que este aviso viene justamente a reemplazar. */
      var sinWorkerUlt = false
      function apagarLoQueNecesitaWorker(sinWorker) {
        sinWorkerUlt = !!sinWorker
        var dependen = ['link-line', 'sync-retry']
        dependen.forEach(function (id) {
          var b = el(id)
          if (b) b.disabled = !!sinWorker
        })
        apagarBotonesDeLineas()
      }

      function apagarBotonesDeLineas() {
        Array.prototype.forEach.call(
          document.querySelectorAll('#lines-wrap button'), function (b) {
            b.disabled = sinWorkerUlt
          })
      }

      function pintarLatido(beat) {
        if (!hayRespuesta(beat)) return false
        if (!beat || typeof beat !== 'object' || !beat.at) {
          showAlert(esc(t('workerGone')), esc(t('workerGoneHow')),
            esc(t('workerGoneWhy')))
          return true
        }
        var edad = Date.now() - Date.parse(beat.at)
        if (!(edad >= 0) || edad <= LATIDO_VENCE_MS) return false
        showAlert(esc(t('workerStale')),
          esc(fmt('workerStaleHow', { s: Math.round(edad / 1000) })))
        return true
      }

      function showAlert(what, how, why) {
        el('alert').innerHTML = '<span>&#9888;</span><span><b>' + what + '</b>' +
          (how ? ' <span>' + how + '</span>' : '') +
          (why ? '<span class="alert-why">' + why + '</span>' : '') + '</span>'
        el('alert').hidden = false
      }

      var TARGET_KEY = { ninguno: 'targetNone', plane: 'targetPlane',
                        linear: 'targetLinear', github: 'targetGithub' }
      var TARGET_PH = { ninguno: '', plane: 'OPS', linear: 'ENG', github: 'mi-org/mi-repo' }
      // Un campo que sigue viendose editable pero que nadie mira es el mismo defecto que
      // un boton que no hace nada: con "ninguno" el destino se apaga, se vacia y la pista
      // dice por que.
      function syncTargetLabel() {
        var p = el('provider').value
        var sinTarjeta = p === 'ninguno'
        el('target-label').textContent = t(TARGET_KEY[p])
        el('target').placeholder = TARGET_PH[p]
        el('target').disabled = sinTarjeta
        if (sinTarjeta) el('target').value = ''
        el('target-hint').textContent = t(sinTarjeta ? 'targetHintNone' : 'targetHint')
      }
      el('provider').addEventListener('change', syncTargetLabel)

      // ---------- nombre del agente ----------
      var savedAgent = null, agentDirty = false
      el('agent').addEventListener('input', function () { agentDirty = true })

      function showAgentSaved(name) {
        savedAgent = name
        el('agent').value = name
        el('agent').disabled = true
        el('edit-agent').hidden = false
        el('save-agent').hidden = true
        el('cancel-agent').hidden = true
        agentDirty = false
        delete sucios.agent
      }
      function showAgentEditing() {
        el('agent').disabled = false
        el('edit-agent').hidden = true
        el('save-agent').hidden = false
        el('save-agent').textContent = savedAgent ? t('saveChange') : t('saveName')
        el('cancel-agent').hidden = !savedAgent
        el('agent').focus(); el('agent').select()
      }
      el('edit-agent').addEventListener('click', showAgentEditing)
      el('cancel-agent').addEventListener('click', function () {
        showAgentSaved(savedAgent); said('said-agent', '')
      })
      el('save-agent').addEventListener('click', function (event) {
        var name = el('agent').value.trim()
        if (!name) { said('said-agent', t('needName'), true); return }
        // agentDirty se apaga antes de escribir: `guardar` relee y repinta, y con la
        // bandera puesta pintarClave se saltearia su propio repintado.
        agentDirty = false
        busy(event.currentTarget, guardar([['agentName', name]]).then(function (mal) {
          if (mal.length) { agentDirty = true; said('said-agent', 'error', true); return }
          said('said-agent', '✓ ' + t('named') + ' ' + savedAgent)
        }))
      })

      // ---------- tono ----------
      el('save-tone').addEventListener('click', function (event) {
        var tone = el('tone').value.trim()
        busy(event.currentTarget, guardar([['tone', tone]]).then(function (mal) {
          said('said-tone', mal.length ? 'error' : '\u2713 ' + t('toneSaved'), !!mal.length)
        }))
      })

      // ---------- para quien trabaja ----------
      // No es el nombre del agente: es el del dueno. El prompt lo lee para saber a
      // quien le reporta, y sin el se dirige al cliente como si trabajara solo.
      el('save-owner').addEventListener('click', function (event) {
        busy(event.currentTarget, guardar([['ownerName', el('owner').value.trim()]])
          .then(function (mal) {
            said('said-owner', mal.length ? 'error' : '\u2713 ' + t('ownerSaved'), !!mal.length)
          }))
      })

      // ---------- transcripcion: modo, idioma y calidad ----------
      el('save-transcribe').addEventListener('click', function (event) {
        busy(event.currentTarget, guardar([['transcribe', el('transcribe').value]])
          .then(function (mal) {
            said('said-transcribe',
              mal.length ? 'error' : '\u2713 ' + t('transcribeSaved'), !!mal.length)
          }))
      })

      el('save-lang').addEventListener('click', function (event) {
        busy(event.currentTarget, guardar([['transcribeLang', el('lang').value]])
          .then(function (mal) {
            said('said-lang', mal.length ? 'error' : '\u2713 ' + t('langSaved'), !!mal.length)
          }))
      })

      el('save-quality').addEventListener('click', function (event) {
        busy(event.currentTarget, guardar([['transcribeQuality', el('quality').value]])
          .then(function (mal) {
            said('said-quality', mal.length ? 'error' : '\u2713 ' + t('qualitySaved'), !!mal.length)
          }))
      })

      // ---------- de donde lee ----------
      // Dos interruptores y no una lista de tres: las fuentes se SUMAN. La app de
      // escritorio lee una sola linea — la del telefono con el que se instalo — y cada
      // sesion de WhatsApp Web es otra. Encender la web no apaga la del escritorio.
      // Se comprueban las TRES, no la ultima. Encadenadas, el `r` que llegaba al final
      // era el de `readWebText`: las otras dos podian fallar y el panel decia guardado
      // igual, que es como cambiar de fuente no hacia nada y no lo decia nadie.
      // El texto es una eleccion aparte de leer la linea: la bandeja web trae quien te
      // nombro y cuando sin abrir nada, y el cuerpo solo si se pide.
      var SRC_LABEL = { readLocal: 'readLocalLabel', readWeb: 'readWebLabel',
                        readWebText: 'readWebTextLabel' }
      el('save-source').addEventListener('click', function (event) {
        var claves = [['readLocal', el('read-local').value],
                      ['readWeb', el('read-web').value],
                      ['readWebText', el('read-web-text').value]]
        busy(event.currentTarget, guardar(claves).then(function (mal) {
          if (mal.length) {
            // Se nombra el control como lo ve el usuario. `readWeb` es la clave del
            // storage: quien lee el panel no la vio nunca.
            said('said-source', fmt('srcPartial', {
              k: mal.map(function (key) { return t(SRC_LABEL[key]) }).join(', ')
            }), true)
            return
          }
          said('said-source', '✓ ' + t('sourceSaved'))
          // Y se le pide una relectura al worker: el aviso rojo de arriba sale del
          // ultimo doctor, asi que apagar la app de escritorio dejaba en pantalla el
          // reclamo por lo que el usuario acababa de apagar hasta el proximo sync.
          write('syncRequest', { at: new Date().toISOString() })
        }))
      })

      // ---------- ventana de lectura ----------
      el('save-days').addEventListener('click', function (event) {
        busy(event.currentTarget, guardar([['inboxDays', el('inbox-days').value]])
          .then(function (mal) {
            said('said-days', mal.length ? 'error' : '\u2713 ' + t('daysSaved'), !!mal.length)
          }))
      })

      // ---------- frecuencia del sync ----------
      el('save-sync').addEventListener('click', function (event) {
        busy(event.currentTarget, guardar([['syncMinutes', el('sync-minutes').value]])
          .then(function (mal) {
            said('said-sync', mal.length ? 'error' : '\u2713 ' + t('syncSaved'), !!mal.length)
          }))
      })

      // ---------- que puede pisar el sondeo, y que no ----------
      // El sondeo LEE y PINTA en dos momentos distintos: sus 18 lecturas se contestan
      // con lo que hay, y recien pinta cuando llega la ultima — `chats` son 52 KB y es
      // siempre la ultima. Un guardado que aterriza en ese hueco queda pisado por el
      // valor de ANTES, y el usuario ve su eleccion deshacerse sola. Medido: guardado
      // readWeb=on, select en off 700 ms despues.
      //
      // Dos guardias, porque son dos carreras distintas:
      //  - `sucios`: lo que el usuario cambio y todavia no guardo. Sin esto el repintado
      //    le deshace la eleccion ANTES del clic, y el boton manda el valor viejo: una
      //    accion con un valor que el usuario no vio.
      //  - `guardadoSeq`: el sello de la lectura. Una pintura cuyo sello quedo atras
      //    nacio de una lectura anterior al guardado y no puede pisarlo.
      var sucios = {}
      var guardadoSeq = 0
      function vigente (s) { return s === undefined || s === guardadoSeq }
      function ensuciar (id) {
        var marcar = function () { sucios[id] = true }
        el(id).addEventListener('input', marcar)
        el(id).addEventListener('change', marcar)
      }

      // Que control pinta cada clave y con que valor cuando no hay nada guardado. Una
      // sola tabla para el sondeo y para la relectura del guardado: dos listas se
      // desincronizan y una de las dos termina pintando otra cosa.
      var CONTROLES = {
        agentName: ['agent', ''],
        tone: ['tone', ''],
        ownerName: ['owner', ''],
        transcribe: ['transcribe', 'local'],
        transcribeLang: ['lang', 'auto'],
        transcribeQuality: ['quality', 'optima'],
        readLocal: ['read-local', 'on'],
        readWeb: ['read-web', 'off'],
        readWebText: ['read-web-text', 'off'],
        // 7 dias y no 1: una mencion del viernes tiene que seguir a la vista el lunes.
        inboxDays: ['inbox-days', '7'],
        syncMinutes: ['sync-minutes', '5']
      }
      Object.keys(CONTROLES).forEach(function (k) { ensuciar(CONTROLES[k][0]) })

      function pintarClave (key, valor, s) {
        var c = CONTROLES[key]
        if (!c || !hayRespuesta(valor) || !vigente(s) || sucios[c[0]]) return
        var n = el(c[0])
        if (document.activeElement === n) return
        if (key === 'agentName') {
          if (typeof valor === 'string' && valor && !agentDirty) showAgentSaved(valor)
          return
        }
        if (n.tagName === 'SELECT') ponerEnSelect(c[0], valor, c[1])
        else n.value = typeof valor === 'string' ? valor : c[1]
      }

      /** Guarda y deja el control mostrando lo que quedo GUARDADO.
       *
       *  `pares` es [[clave, valor]]. Devuelve las claves que el host rechazo.
       *
       *  Se RELEE en vez de dar por bueno lo que se mando: afirmar el valor optimista
       *  hace que un host que guarde otra cosa no se note nunca. Y el sello se toma
       *  antes de escribir, asi que el sondeo que ya estaba en vuelo no puede pintar
       *  encima el valor de antes. */
      function guardar (pares) {
        var s = ++guardadoSeq
        return Promise.all(pares.map(function (p) {
          return write(p[0], p[1]).then(function (r) {
            var bien = !!(r && r.ok)
            var c = CONTROLES[p[0]]
            if (bien && c) delete sucios[c[0]]
            return { key: p[0], ok: bien }
          })
        })).then(function (rs) {
          var buenas = rs.filter(function (r) { return r.ok })
          return Promise.all(buenas.map(function (r) {
            return read(r.key, true).then(function (v) { return [r.key, v] })
          })).then(function (leidos) {
            if (s === guardadoSeq) {
              leidos.forEach(function (x) { pintarClave(x[0], x[1]) })
            }
            return rs.filter(function (r) { return !r.ok }).map(function (r) { return r.key })
          })
        })
      }

      // Deja el select mostrando lo que rige de verdad. La terminal puede fijar un valor
      // que el select no ofrece (`wa-scope config inbox_days 45`): sin agregarlo, .value
      // no engancha, el control queda en blanco y el panel miente sobre lo que rige.
      function ponerEnSelect (id, valor, porDefecto) {
        var sel = el(id)
        var v = valor === null || valor === undefined || valor === '' ? porDefecto : String(valor)
        var hay = Array.prototype.some.call(sel.options, function (o) { return o.value === v })
        if (!hay) {
          var o = document.createElement('option')
          o.value = v
          o.textContent = v
          sel.appendChild(o)
        }
        sel.value = v
      }

      // ---------- selector de conversaciones ----------
      // Se elige de la lista en vez de escribir el nombre exacto. El valor es el jid,
      // porque hay grupos que comparten nombre y el nombre no identifica nada.
      var chatsPorJid = {}
      // El jid que se esta editando. renderChats corre cada 8 s y reconstruye el
      // select entero; sin recordarlo, a mitad de una edicion la conversacion
      // desaparecia de la lista y el select quedaba en blanco.
      var editandoJid = ''

      // Deja el select mostrando este jid. Si no esta en la lista — el sync todavia
      // no lo trajo — se le agrega una opcion, porque si no `.value` no hace nada y
      // el select se queda callado en "Elija una conversacion".
      function pickChat (jid, nombre) {
        var sel = el('chat-pick')
        if (jid && !Array.prototype.some.call(sel.options, function (o) { return o.value === jid })) {
          var o = document.createElement('option')
          o.value = jid
          o.textContent = nombre || jid
          sel.appendChild(o)
        }
        sel.value = jid || ''
      }

      // La lista completa se guarda aparte: el buscador filtra sobre esto, no sobre
      // lo que quedo pintado, si no cada tecleo iria achicando la lista sin volver.
      var chatsTodos = []

      // ---------- estado de la busqueda ----------
      // El panel no ejecuta nada, asi que por si mismo no puede saber si el worker esta
      // buscando, si fallo o si se quedo callado. Lo lee de syncStatus, que el worker
      // escribe antes y despues de cada intento.
      var estadoSync = null
      var ABIERTO_EN = Date.now()
      // Sin una sola noticia del worker en este tiempo, seguir diciendo "buscando" es
      // mentir: o el plugin no esta activo, o el worker nunca arranco.
      var ESPERA_MS = 45000
      // Un intento que lleva mas que el timeout del propio sync ya no esta corriendo.
      var CORRIENDO_MS = 150000

      function edadMs (iso) {
        var ms = Date.parse(iso)
        return ms ? Date.now() - ms : Infinity
      }

      function motivoTexto (estado) {
        var mapa = {
          'sin-herramientas': 'syncNoTools', 'sin-permiso': 'syncNoPerm',
          'demoro': 'syncTimeout', 'sin-registro': 'syncNoRecord'
        }
        return t(mapa[estado && estado.reason] || 'syncFailed')
      }

      /** Que decir con la lista vacia. Tres finales: sigue buscando, fallo con motivo,
       *  o lleva demasiado sin llegar. Los dos ultimos ofrecen el boton, porque un
       *  estado sin salida es el mismo callejon que el spinner eterno. */
      function estadoVacio (estado) {
        if (estado && estado.running && edadMs(estado.startedAt) < CORRIENDO_MS) {
          // Sin texto aparte: la opcion del select ya dice que esta buscando, y
          // repetirlo debajo no agrega nada que mirar.
          return { corto: t('noChats'), largo: '', detalle: '', boton: false }
        }
        if (estado && estado.ok === false) {
          return { corto: t('noChatsFail'), largo: motivoTexto(estado),
                   detalle: estado.detail || '', boton: true }
        }
        // El sync corrio bien y aun asi no hay nada: el problema no es el plugin.
        if (estado && estado.ok === true) {
          return { corto: t('noChatsFail'), largo: t('syncNoChats'), detalle: '', boton: true }
        }
        if (!estado && Date.now() - ABIERTO_EN < ESPERA_MS) {
          return { corto: t('noChats'), largo: '', detalle: '', boton: false }
        }
        return { corto: t('noChatsFail'), largo: t('syncStalled'), detalle: '', boton: true }
      }

      function pintarEstadoSync () {
        var v = estadoVacio(estadoSync)
        var mostrar = !chatsTodos.length && !!(v.largo || v.boton)
        el('sync-state').hidden = !mostrar
        // "Se elige de la lista" es consejo sobre una lista que no esta. Mientras el
        // aviso ocupa ese lugar, la pista estorba mas de lo que ayuda.
        el('chat-help').hidden = mostrar
        if (!mostrar) return
        el('sync-msg').textContent = v.largo
        el('sync-detail').textContent = v.detalle
        el('sync-detail').hidden = !v.detalle
        el('sync-retry').hidden = !v.boton
      }

      // El panel no puede correr un sync: escribe el pedido y el worker lo atiende.
      // Mismo camino que Tomar/Ignorar en el panel de actividad.
      el('sync-retry').addEventListener('click', function (event) {
        busy(event.currentTarget, write('syncRequest', { at: new Date().toISOString() })
          .then(function (r) {
            said('said-sync', r && r.ok ? t('syncAsked') : 'error', !(r && r.ok))
          }))
      })

      function renderChats (chats) {
        chatsTodos = Array.isArray(chats) ? chats : []
        chatsPorJid = {}
        chatsTodos.forEach(function (c) { chatsPorJid[c.jid] = c })
        pintarChats()
      }

      function etiqueta (c) {
        return (c.kind === 'grupo' ? '\u25A3  ' : '\u25CB  ') + (c.name || c.jid)
      }

      function pintarChats () {
        var sel = el('chat-pick')
        var elegido = sel.value
        var termino = el('chat-search').value.trim().toLowerCase()
        sel.innerHTML = ''
        if (!chatsTodos.length) {
          var o = document.createElement('option')
          o.value = ''; o.textContent = estadoVacio(estadoSync).corto
          sel.appendChild(o)
          el('chat-count').textContent = ''
          pintarEstadoSync()
          return
        }
        pintarEstadoSync()
        // Se busca en el nombre y en el identificador: hay grupos que comparten
        // nombre y el jid es lo unico que los distingue.
        var visibles = termino
          ? chatsTodos.filter(function (c) {
              return String(c.name || '').toLowerCase().indexOf(termino) !== -1 ||
                String(c.jid || '').toLowerCase().indexOf(termino) !== -1
            })
          : chatsTodos
        var vacio = document.createElement('option')
        vacio.value = ''
        vacio.textContent = visibles.length ? t('pickOne') : t('chatNoMatch')
        sel.appendChild(vacio)
        visibles.forEach(function (c) {
          var o = document.createElement('option')
          o.value = c.jid
          o.textContent = etiqueta(c)
          sel.appendChild(o)
        })
        // Contar solo cuando se esta filtrando: "214 de 214" no le dice nada a nadie.
        el('chat-count').textContent = termino
          ? t('chatCount').replace('{n}', visibles.length).replace('{total}', chatsTodos.length)
          : ''
        if (editandoJid) pickChat(editandoJid, (chatsPorJid[editandoJid] || {}).name)
        else if (elegido) sel.value = elegido
      }

      el('chat-search').addEventListener('input', pintarChats)
      el('chat-pick').addEventListener('change', function () {
        var c = chatsPorJid[el('chat-pick').value]
        el('chat').value = c ? (c.name || c.jid) : ''
      })

      // ---------- conversaciones ----------
      function renderScope(entries) {
        var keys = entries ? Object.keys(entries) : []
        if (!keys.length) {
          el('scope-wrap').innerHTML = '<p class="empty">' + t('empty') + '</p>'
          return
        }
        el('scope-wrap').innerHTML =
          '<table><thead><tr><th>' + t('colChat') + '</th><th>' + t('colTarget') +
          '</th><th>' + t('colPerm') + '</th><th></th></tr></thead><tbody>' +
          keys.map(function (key) {
            var e = entries[key]
            return '<tr><td>' + esc(e.chatName || key) + '</td><td>' +
              esc(porCodigo(PROV_KEY, e.provider || 'plane', e.provider)) + ' / ' +
              esc(e.target || '—') + '</td><td>' +
              '<span class="pill ' + esc(e.mode || 'off') + '">' +
              esc(porCodigo(MODE_KEY, e.mode || 'off', e.mode)) +
              '</span></td><td class="acts">' +
              '<button class="link" data-edit="' + esc(key) + '">' + t('edit') + '</button>' +
              '<button class="link" data-rm="' + esc(key) + '">' + t('remove') + '</button>' +
              '</td></tr>'
          }).join('') + '</tbody></table>'

        Array.prototype.forEach.call(el('scope-wrap').querySelectorAll('[data-edit]'), function (b) {
          b.addEventListener('click', function () { startEdit(entries[b.dataset.edit], b.dataset.edit) })
        })
        Array.prototype.forEach.call(el('scope-wrap').querySelectorAll('[data-rm]'), function (b) {
          b.addEventListener('click', function () {
            var e = entries[b.dataset.rm]
            removeScope(b.dataset.rm, (e && e.chatName) || b.dataset.rm)
          })
        })
      }

      function startEdit(entry, key) {
        if (!entry) return
        editandoJid = key
        pickChat(key, entry.chatName || key)
        el('chat').value = entry.chatName || key
        el('provider').value = entry.provider || 'plane'
        syncTargetLabel()
        el('target').value = entry.target || ''
        el('chat-tone').value = entry.tone || ''
        el('chat-instructions').value = entry.instructions || ''
        el('mode').value = entry.mode || 'off'
        el('save-scope').textContent = t('saveEdit')
        el('cancel-edit').hidden = false
        said('said-scope', '')
        el('chat').focus()
      }
      function resetScopeForm() {
        editandoJid = ''
        el('chat').value = ''; el('target').value = ''; el('mode').value = 'off'
        el('chat-tone').value = ''
        el('chat-instructions').value = ''
        // Una conversacion nueva arranca sin servicio de tareas: la mayoria de los DM
        // no necesitan tablero, y dejar Plane puesto hacia que se eligiera por inercia.
        el('provider').value = 'ninguno'
        syncTargetLabel()
        el('chat-pick').value = ''
        el('save-scope').textContent = t('save')
        el('cancel-edit').hidden = true
      }
      el('cancel-edit').addEventListener('click', function () { resetScopeForm(); said('said-scope', '') })

      function removeScope(key, name) {
        read('scope').then(function (next) {
          next = next || {}
          delete next[key]
          return write('scope', next).then(function () {
            renderScope(next)
            said('said-scope', '✓ ' + t('removedOk') + ': ' + name)
          })
        })
      }

      el('save-scope').addEventListener('click', function (event) {
        // La llave es el jid, como la del registro del CLI. Guardando por nombre, lo
        // escrito aca quedaba en una entrada aparte que `wa-scope` no encontraba nunca:
        // el panel decia guardado y el agente seguia con el valor viejo.
        var jid = editandoJid || el('chat-pick').value
        var chat = el('chat').value.trim() || jid
        var provider = el('provider').value
        var target = el('target').value.trim()
        var mode = el('mode').value
        if (!jid) { said('said-scope', t('needChat'), true); return }
        busy(event.currentTarget, read('scope').then(function (next) {
          next = next || {}
          next[jid] = { chatName: chat, provider: provider, target: target || null,
                        mode: mode, tone: el('chat-tone').value.trim() || null,
                        instructions: el('chat-instructions').value.trim() || null,
                        updatedAt: new Date().toISOString() }
          return write('scope', next).then(function () {
            renderScope(next)
            resetScopeForm()
            said('said-scope', '✓ ' + t('savedOk') + ': ' + chat + ' · ' + mode)
          })
        }))
      })

      // ---------- reglas de ruteo ----------
      function renderRoutes(rules) {
        rules = rules || []
        if (!rules.length) {
          el('routes-wrap').innerHTML = '<p class="empty">' + t('noRoutes') + '</p>'
          return
        }
        el('routes-wrap').innerHTML =
          '<table><thead><tr><th>' + t('colWhen') + '</th><th>' + t('colGoes') +
          '</th><th></th></tr></thead><tbody>' +
          rules.map(function (r, i) {
            return '<tr><td>' + esc(r.pattern) + '</td><td>' +
              esc(porCodigo(PROV_KEY, r.provider || 'plane', r.provider)) + ' / ' +
              esc(r.target) + '</td>' +
              '<td class="acts"><button class="link" data-rrm="' + i + '">' +
              t('remove') + '</button></td></tr>'
          }).join('') + '</tbody></table>'

        Array.prototype.forEach.call(el('routes-wrap').querySelectorAll('[data-rrm]'), function (b) {
          b.addEventListener('click', function () {
            var next = rules.slice()
            var gone = next.splice(Number(b.dataset.rrm), 1)[0]
            write('routes', next).then(function () {
              renderRoutes(next)
              said('said-route', '✓ ' + t('removedOk') + ': ' + (gone && gone.pattern))
            })
          })
        })
      }

      el('save-route').addEventListener('click', function (event) {
        var match = el('r-match').value.trim().toLowerCase()
        var target = el('r-target').value.trim()
        var provider = el('r-provider').value
        if (!match || !target) { said('said-route', t('needMatch'), true); return }
        busy(event.currentTarget, read('routes').then(function (rules) {
          rules = (rules || []).filter(function (r) { return r.pattern !== match })
          rules.push({ pattern: match, provider: provider, target: target })
          rules.sort(function (a, b) { return a.pattern < b.pattern ? -1 : 1 })
          return write('routes', rules).then(function () {
            renderRoutes(rules)
            el('r-match').value = ''; el('r-target').value = ''
            said('said-route', '✓ ' + t('savedOk') + ': ' + match + ' → ' + target)
          })
        }))
      })

      // ---------- lineas de WhatsApp Web ----------
      // El panel no puede ejecutar nada: deja el pedido en storage y el worker lo
      // atiende, igual que el boton de reintentar el sync. Lo que se ve aca es SIEMPRE
      // lo que el worker acaba de comprobar contra la sesion de verdad; afirmar el
      // estado desde el registro es lo que hacia que dijera "enlazada" con el QR en
      // pantalla.
      function fmt (key, vals) {
        return String(t(key)).replace(/\{(\w+)\}/g, function (_, k) {
          return vals && vals[k] != null ? vals[k] : ''
        })
      }

      // Devuelve el `at` del pedido: sin el, el panel no puede distinguir el veredicto
      // de SU clic del que quedo del clic anterior.
      //
      // `enVuelo` es el `at` del pedido que se esta esperando. Sin el, el sondeo de 2 s
      // tomaba CUALQUIER `webStatus` y lo pintaba como respuesta al clic actual: medido
      // en su Mac, 1,49 s entre el clic y el veredicto propio, y en ese hueco el panel
      // mostro el "no se pudo" del clic ANTERIOR sobre un desvincular que salio bien.
      var enVuelo = null
      function pedirWeb (action, extra, silencioso) {
        var pedido = { at: new Date().toISOString(), action: action }
        for (var k in (extra || {})) pedido[k] = extra[k]
        // `silencioso` es el pedido que no nace de un clic — el de abrir el panel. No
        // pone nada en vuelo: nadie lo espera, y si el worker no contesta dejaria al
        // panel descartando para siempre cualquier veredicto posterior.
        if (!silencioso) {
          enVuelo = pedido.at
          webStatusUlt = null
          // El aviso de la seccion es la respuesta al clic ANTERIOR. Se baja al arrancar
          // uno nuevo: dejarlo puesto es lo que se leia como "no pude desvincular".
          el('lines-error').textContent = ''
          el('lines-error').hidden = true
        }
        return write('webRequest', pedido).then(function (r) {
          // El pedido que ni siquiera se pudo dejar no espera veredicto de nadie.
          if (!(r && r.ok) && enVuelo === pedido.at) enVuelo = null
          // Un freno del host no es un plugin caido, y decirle lo segundo al usuario es
          // lo que lo hacia apretar de nuevo buscando que "esta vez si".
          return { ok: !!(r && r.ok), at: pedido.at,
                   code: r && r.errorCode === 'rate_limited' ? 'saturado' : 'sin-respuesta' }
        })
      }

      /** El veredicto de ESTE pedido, o null. Con uno en vuelo, cualquier otro es del
       *  clic anterior y mostrarlo es decirle al usuario que fallo lo que esta saliendo
       *  bien. Sin nada en vuelo vale el ultimo que haya. */
      function veredictoPropio (st) {
        if (!st || !hayRespuesta(st) || typeof st !== 'object') return null
        if (!enVuelo) return st
        if (st.requestAt !== enVuelo) return null
        enVuelo = null
        return st
      }

      // El worker escribe el veredicto en `webStatus`, que el sondeo no toca. Antes el
      // motivo iba dentro de `webLines` y la siguiente vuelta del sondeo — tres
      // segundos — lo borraba: el usuario no llegaba a verlo nunca.
      var WEB_ERR_KEY = {
        'sin-orca': 'stNoOrcaHow', 'sin-proyecto': 'lineNoPlace',
        'sin-herramientas': 'errSinHerramientas', 'sin-permiso': 'errSinPermiso',
        demoro: 'errDemoro', vencido: 'errVencido', 'a-medias': 'errAMedias',
        desactualizado: 'errDesactualizado',
        'sin-identidad': 'errSinIdentidad', 'sin-respuesta': 'lineNoAnswer',
        'sin-pestana': 'errSinPestana', 'sin-flotante': 'errSinFlotante',
        'flotante-sin-via': 'errFlotanteSinVia', 'casa-ausente': 'errCasaAusente',
        'otro-host': 'errOtroHost', 'sin-casa': 'errSinCasa',
        saturado: 'errSaturado', 'sin-runtime': 'errSinRuntime'
      }
      function motivoWeb (code, detail) {
        // Un motivo que nombra una ruta la toma del detalle: la ruta la sabe el worker
        // y el panel no tiene forma de averiguarla. "No me pude conectar" sin decir
        // donde busco no le deja al usuario nada que hacer.
        if (!WEB_ERR_KEY[code]) return detail || code || ''
        return fmt(WEB_ERR_KEY[code], { p: detail || '' })
      }

      // El encabezado sale de la accion que fallo. Era fijo en "No pude conectar la
      // linea" y se pintaba igual sobre un desvincular y sobre un "Ver la pestana":
      // el usuario leia que fallo algo que ni siquiera habia pedido.
      var FAIL_KEY = { link: 'lineFailed', unlink: 'unlinkFailed', show: 'showFailed',
                       reopen: 'showFailed', move: 'moveFailed', home: 'moveFailed',
                       adopt: 'moveFailed' }

      /** Espera el veredicto de ESE pedido. Enlazar una linea son dos llamadas a la CLI
       *  de Orca con 30 s de tope cada una, asi que la espera tiene que darles lugar. */
      function esperarWeb (requestAt, limiteMs) {
        var fin = Date.now() + (limiteMs || 90000)
        // Quien espera aca es el dueno del pedido: al terminar lo saca de vuelo, o el
        // sondeo se quedaria descartando todo veredicto posterior por no ser este.
        var soltar = function () { if (enVuelo === requestAt) enVuelo = null }
        return new Promise(function (resolve) {
          ;(function vuelta () {
            read('webStatus').then(function (st) {
              if (st && st.requestAt === requestAt) { soltar(); resolve(st); return }
              if (Date.now() > fin) { soltar(); resolve(null); return }
              setTimeout(vuelta, 1000)
            })
          })()
        })
      }

      // Estado -> como se llama, que hacer, y que boton lo arregla. Ninguno se queda
      // sin accion: un estado sin salida es el mismo callejon que el spinner eterno.
      var LINE_STATE = {
        esperando: { pill: 'stWaiting', how: 'stWaitingHow', cls: 'pendiente', act: 'show' },
        cargando: { pill: 'stLoading', how: 'stLoadingHow', cls: 'pendiente', act: 'show' },
        enlazada: { pill: 'stLinked', how: null, cls: 'lista', act: 'show' },
        caida: { pill: 'stDropped', how: 'stDroppedHow', cls: 'roto', act: 'show' },
        'sin-pestana': { pill: 'stNoTab', how: 'stNoTabHow', cls: 'roto', act: 'reopen' },
        'sin-orca': { pill: 'stNoOrca', how: 'stNoOrcaHow', cls: 'roto', act: 'retry' },
        // Un estado que este panel no conozca se dice, no se disfraza. Antes el default
        // era el de "Orca no contesta" y `lineHow` explotaba antes de llegar: la tabla
        // entera quedaba vacia y el panel mostraba un estado que el worker no calculo.
        desconocido: { pill: 'stUnknown', how: 'stUnknownHow', cls: 'roto', act: 'retry' }
      }
      var ACT_KEY = { show: 'seeTab', reopen: 'openTab', retry: 'retryLine' }

      var lineasUlt = null
      var webStatusUlt = null
      var confirmando = null

      function defLinea (l) {
        return LINE_STATE[l && l.state] || LINE_STATE.desconocido
      }

      // La accion sale del estado Y de si hay pestana. Ofrecer "Ver la pestana" sin
      // pageId mandaba un `show` vacio que el worker contestaba ok: el boton no abria
      // nada y decia que si.
      function actoLinea (l) {
        // Una linea de otro Orca no tiene sesion aca: su perfil de navegador vive en
        // aquella maquina. Ofrecer abrir o reabrir su pestana seria ofrecer algo que
        // no se puede hacer — y escanear un QR aca quemaria un dispositivo vinculado
        // en una sesion que igual no se va a poder leer.
        if (l && l.homeState === 'otro-host') return null
        var act = defLinea(l).act
        return act === 'show' && !l.pageId ? 'reopen' : act
      }

      /** El nombre legible del lugar donde vive o esta una linea. */
      function nombreLugar (donde, proyecto) {
        if (donde === 'flotante') return t('homeFloating')
        return proyecto ? '"' + proyecto + '"' : t('lineWhereProject')
      }

      // El atajo que ABRE el panel es floatingTerminal.toggle, Mod+Alt+A, y existe en
      // las tres plataformas; `Mod` es Cmd en macOS y Ctrl en el resto. El que solo
      // esta en macOS es floatingWorkspace.maximize, que maximiza uno ya abierto: no
      // sirve para llegar al QR y por eso no se nombra.
      function atajoFlotante () {
        return /Mac|iPhone|iPad/.test(String(navigator.userAgent || ''))
          ? 'Cmd+Alt+A' : 'Ctrl+Alt+A'
      }

      /** Donde vive la pestana de ESA linea, dicho de modo que pueda ir a mirarla. */
      function fraseLugar (l) {
        if (!l || !l.placement) return ''
        if (l.placement === 'flotante') {
          return fmt('linePlacedFloating', { k: atajoFlotante() })
        }
        if (l.placement === 'proyecto') {
          return fmt('linePlacedProject', { p: l.project || '' })
        }
        return ''
      }

      function lineHow (l) {
        // Lo que se dice primero es lo que hay que decidir. Una pestana que aparecio en
        // otro lado es una pregunta para el usuario, no un detalle del estado.
        if (l.homeState === 'otro-host') return t('homeOtherHostHow')
        if (l.homeState === 'mudada') {
          return fmt('homeMovedHow', {
            c: nombreLugar(l.casa && l.casa.donde, l.casa && l.casa.proyecto),
            d: nombreLugar(l.placement, l.project)
          })
        }
        if (!LINE_STATE[l.state]) return fmt('stUnknownHow', { s: String(l.state) })
        // Sin pestana el que hacer es reabrirla, diga lo que diga el estado: el texto de
        // "Esperando el escaneo" manda a apretar "Ver la pestana", y ese boton ya no
        // esta. Una linea que nunca termino de escanear ademas no tiene sesion que
        // reanudar — prometerle que no le van a pedir el QR es lo que lo dejaba dando
        // vueltas entre un boton que no abria nada y una pestana que no existia.
        if (actoLinea(l) === 'reopen') {
          return l.linkedAt ? t('stNoTabHow') : t('stNoTabScan')
        }
        if (l.state === 'enlazada') {
          if (!l.authorizedChats) return t('stLinkedNone')
          return l.authorizedChats === 1
            ? t('stLinkedOne')
            : fmt('stLinkedSome', { n: l.authorizedChats })
        }
        return t(LINE_STATE[l.state].how)
      }

      // Despues de un veredicto el estado se RELEE. Repintar el que estaba en memoria
      // dejaba en pantalla un estado que el worker ya habia recalculado — la fila decia
      // "Esperando el escaneo" con la pestana muerta, y el boton que ofrecia era el de
      // ese estado viejo. Si la lectura no trae nada se deja lo que habia: vaciar la
      // tabla por una lectura fallida dice "no tiene lineas", que es lo contrario.
      function repintarLineas () {
        return read('webLines').then(function (nuevo) {
          renderLineas(nuevo && typeof nuevo === 'object' ? nuevo : lineasUlt)
        })
      }

      function renderLineas (estado) {
        // Un rechazo deja la tabla como estaba: vaciarla dice "no tiene lineas", que es
        // lo contrario de lo que paso. Aca y no en cada llamador — el sondeo, el
        // repintado tras un veredicto y el vigia de 2 s pasan todos por esta puerta.
        if (!hayRespuesta(estado)) estado = lineasUlt
        lineasUlt = estado && typeof estado === 'object' ? estado : null
        var lineas = (lineasUlt && lineasUlt.lines) || []
        var wrap = el('lines-wrap')
        // Lo que fallo se cuenta haya lineas o no: reabrir una pestana puede fallar con
        // tres lineas sanas en la tabla, y sin esto ese clic no dice nada. El veredicto
        // manda sobre el estado del sondeo: es lo que el usuario acaba de pedir.
        var err = null
        var detalle = ''
        if (webStatusUlt && webStatusUlt.ok === false) {
          err = webStatusUlt.code || 'fallo'
          detalle = webStatusUlt.detail || ''
        } else if (lineasUlt && lineasUlt.error) {
          err = lineasUlt.error
          detalle = lineasUlt.detail || ''
        }
        var accionMala = webStatusUlt && webStatusUlt.ok === false
          ? webStatusUlt.action : null
        el('lines-error').textContent = err
          ? t(FAIL_KEY[accionMala] || 'actionFailed') + ' ' + motivoWeb(err, detalle) : ''
        el('lines-error').hidden = !err
        if (!lineas.length) {
          wrap.innerHTML = '<p class="empty">' + esc(t('noLines')) + '</p>'
          el('lines-place').hidden = true
          vigilarLineas(false)
          return
        }
        wrap.innerHTML =
          '<table><thead><tr><th>' + t('colLine') + '</th><th>' + t('colLineState') +
          '</th><th></th></tr></thead><tbody>' +
          lineas.map(function (l, i) {
            var def = defLinea(l)
            var fila = '<tr' + (confirmando === l.id ? ' class="confirmando"' : '') +
              '><td>' + esc(l.label) + '</td>' +
              '<td><span class="pill ' + def.cls + '">' + esc(t(def.pill)) + '</span>' +
              '<span class="how">' + esc(lineHow(l)) + '</span></td>' +
              '<td class="acts">' +
              (actoLinea(l)
                ? '<button class="' + (l.state === 'enlazada' ? 'link' : '') +
                  '" data-lact="' + i + '">' + t(ACT_KEY[actoLinea(l)]) + '</button>'
                : '') +
              // Las dos mitades de una discrepancia, y solo cuando la hay: volverla a
              // su casa o adoptar la nueva. El plugin no elige ninguna por su cuenta.
              (l.homeState === 'mudada'
                ? '<button class="link" data-lhome="' + i + '">' + t('homeBack') +
                  '</button><button class="link" data-ladopt="' + i + '">' +
                  t('homeAdopt') + '</button>'
                : '') +
              '<button class="link" data-lrm="' + i + '">' + t('unlink') + '</button>' +
              '</td></tr>'
            if (confirmando !== l.id) return fila
            return fila + '<tr><td colspan="3"><div class="confirm">' +
              esc(fmt(!l.authorizedChats ? 'unlinkWarn0'
                : l.authorizedChats === 1 ? 'unlinkWarn1' : 'unlinkWarn',
                { l: l.label, n: l.authorizedChats })) +
              '<div class="actions"><button data-lyes="' + i + '">' + t('unlinkYes') +
              '</button><button data-lno="1">' + t('unlinkNo') + '</button></div>' +
              '</div></td></tr>'
          }).join('') + '</tbody></table>'

        Array.prototype.forEach.call(wrap.querySelectorAll('[data-lact]'), function (b) {
          b.addEventListener('click', function () {
            var l = lineas[Number(b.dataset.lact)]
            var accion = actoLinea(l)
            // Se espera el veredicto en vez de soltar el clic: "Ver la pestana" sobre
            // una pestana que ya no esta fallaba y el boton no decia nada hasta el
            // refresco siguiente, ocho segundos despues.
            // La ubicacion viaja con el pedido: sin ella el worker no puede saber que
            // esa pestana esta en un panel que no se puede abrir, y contestaba ok.
            // `visto` y `desde` son la fila TAL CUAL la vio el usuario. El worker las
            // compara con lo que ve el: si esa linea cambio entre la pintura y el clic,
            // no actua sobre otra cosa en silencio — lo dice.
            busy(b, pedirWeb(accion === 'retry' ? 'refresh' : accion,
              { id: l.id, profile: l.profile, pageId: l.pageId || null,
                placement: l.placement || null, project: l.project || null,
                worktreeId: l.worktreeId || null, donde: el('line-where').value,
                desde: (lineasUlt && lineasUlt.at) || null,
                visto: { state: l.state, pageId: l.pageId || null } })
              .then(function (p) {
                // Antes era `return` a secas: el pedido que no salia dejaba el boton
                // como si nada hubiera pasado. Eso es el "el primer clic no hace nada".
                if (!p.ok) {
                  webStatusUlt = { ok: false, code: p.code, detail: '', action: accion }
                  return renderLineas(lineasUlt)
                }
                return esperarWeb(p.at, 45000).then(function (st) {
                  webStatusUlt = st ||
                    { ok: false, code: 'sin-respuesta', detail: '' }
                  // Un foco que quedo preparado y no se ve no es un exito: se dice
                  // adonde tiene que ir a mirar. Antes esto contestaba ok y nada mas.
                  if (st && st.ok && st.action === 'show') {
                    said('said-line', st.surfaced
                      ? '\u2713 ' + fmt('lineShownIn', { p: st.project || '' })
                      : fmt('lineStagedIn', { p: st.project || '' }), !st.surfaced)
                  }
                  return repintarLineas()
                })
              }))
          })
        })
        // Las dos salidas de una discrepancia. Van juntas porque son la misma decision
        // vista de los dos lados, y las dos mandan `visto`: si la fila cambio entre que
        // se pinto y el clic, el worker rechaza en vez de actuar sobre otra cosa.
        function decidirCasa (attr, accion) {
          Array.prototype.forEach.call(wrap.querySelectorAll('[' + attr + ']'),
            function (b) {
              b.addEventListener('click', function () {
                var l = lineas[Number(b.getAttribute(attr))]
                busy(b, pedirWeb(accion,
                  { id: l.id, profile: l.profile, pageId: l.pageId || null,
                    placement: l.placement || null, project: l.project || null,
                    worktreeId: l.worktreeId || null, host: l.host || null,
                    desde: (lineasUlt && lineasUlt.at) || null,
                    visto: { state: l.state, pageId: l.pageId || null } })
                  .then(function (p) {
                    if (!p.ok) {
                      webStatusUlt = { ok: false, code: p.code, detail: '',
                        action: accion }
                      return renderLineas(lineasUlt)
                    }
                    return esperarWeb(p.at, 45000).then(function (st) {
                      webStatusUlt = st ||
                        { ok: false, code: 'sin-respuesta', detail: '' }
                      return repintarLineas()
                    })
                  }))
              })
            })
        }
        decidirCasa('data-lhome', 'home')
        decidirCasa('data-ladopt', 'adopt')

        Array.prototype.forEach.call(wrap.querySelectorAll('[data-lrm]'), function (b) {
          b.addEventListener('click', function () {
            confirmando = lineas[Number(b.dataset.lrm)].id
            renderLineas(lineasUlt)
          })
        })
        Array.prototype.forEach.call(wrap.querySelectorAll('[data-lno]'), function (b) {
          b.addEventListener('click', function () { confirmando = null; renderLineas(lineasUlt) })
        })
        Array.prototype.forEach.call(wrap.querySelectorAll('[data-lyes]'), function (b) {
          b.addEventListener('click', function () {
            var l = lineas[Number(b.dataset.lyes)]
            confirmando = null
            said('said-line', t('lineRemoving'))
            busy(b, pedirWeb('unlink',
              { id: l.id, profile: l.profile, pageId: l.pageId || null,
                desde: (lineasUlt && lineasUlt.at) || null,
                visto: { state: l.state, pageId: l.pageId || null } })
              .then(function (p) {
                if (!p.ok) {
                  webStatusUlt = { ok: false, code: p.code, detail: '',
                    action: 'unlink' }
                  said('said-line', '')
                  return renderLineas(lineasUlt)
                }
                vigilarLineas(true)
                // Se espera SU veredicto, como el resto de los botones. Soltar el clic
                // dejaba que el sondeo pintara el veredicto del clic ANTERIOR como si
                // fuera la respuesta a este: medido, 1,49 s diciendo "no se pudo" sobre
                // un desvincular que estaba saliendo bien. Ese es el "le doy de nuevo y
                // la borra": el segundo clic no arreglo nada, solo llego mas tarde.
                return esperarWeb(p.at, 45000).then(function (st) {
                  webStatusUlt = st ||
                    { ok: false, code: 'sin-respuesta', detail: '', action: 'unlink' }
                  said('said-line', st && st.ok ? '\u2713 ' + t('lineRemoved') : '',
                    !(st && st.ok))
                  return repintarLineas()
                })
              }))
          })
        })

        // Donde esta la pestana. Sale de las filas y no de un valor guardado: el que se
        // guardaba decia "flotante" con la pestana ya en un proyecto, y el usuario abrio
        // un panel vacio por leerlo. Cada frase distinta se dice una vez.
        var place = el('lines-place')
        var frases = []
        lineas.forEach(function (l) {
          var f = fraseLugar(l)
          if (f && frases.indexOf(f) === -1) frases.push(f)
        })
        // Con dos lugares distintos hay que decir CUAL es de cual: las dos frases
        // seguidas se leian como una sola, contradiciendose. Con uno solo el nombre
        // sobra — la tabla de arriba ya lo dice.
        if (frases.length < 2) place.textContent = frases[0] || ''
        else {
          place.innerHTML = lineas.filter(function (l) { return fraseLugar(l) })
            .map(function (l) {
              return '<span class="place-line">' + esc(l.label) + ': ' +
                esc(fraseLugar(l)) + '</span>'
            }).join('')
        }
        place.hidden = !place.textContent

        // Aca y no solo en reload(): esta tabla tambien la repintan el vigia de 2 s y
        // el veredicto de un clic, y por esos dos caminos los botones volvian a estar
        // vivos con el worker todavia ausente.
        apagarBotonesDeLineas()
        vigilarLineas(lineas.some(function (l) { return l.state !== 'enlazada' }))
      }

      // Mientras algo este a medias el estado se relee cada 2 s y no cada 8: el momento
      // que importa — escanear el QR — pasa en OTRA ventana, y esperar al proximo
      // refresco general dejaba el panel diciendo "esperando" con la linea ya enlazada.
      var timerLineas = null
      function vigilarLineas (transitorio) {
        if (timerLineas) { clearInterval(timerLineas); timerLineas = null }
        if (!transitorio) return
        timerLineas = setInterval(function () {
          if (document.visibilityState !== 'visible') return
          Promise.all([read('webLines'), read('webStatus')]).then(function (r) {
            var st = veredictoPropio(r[1])
            if (st) webStatusUlt = st
            renderLineas(r[0])
          })
          // 3 s y no 2: el worker atiende su cola cada 3 s (PETICION_MS), asi que
          // preguntar mas seguido no adelanta ninguna respuesta y le come cupo de
          // mensajes al clic que viene.
        }, 3000)
      }

      // El campo NO se vacia al mandar el pedido. Se vaciaba ahi, o sea antes de saber
      // si la linea existia: cuando fallaba, el usuario perdia lo que habia escrito y no
      // se enteraba de nada. Se vacia recien con el veredicto en la mano.
      el('link-line').addEventListener('click', function (event) {
        var label = el('line-label').value.trim()
        if (!label) { said('said-line', t('needLineLabel'), true); return }
        // No dice "conectada": todavia no lo esta. Lo que pasa de verdad es que el
        // worker esta creando el perfil y abriendo la pestana, y la tabla lo cuenta.
        said('said-line', t('lineWorking'))
        // Sin esto la primera vista del estado llegaria recien al proximo refresco,
        // que es justo el segundo en que el usuario pregunta donde se abrio.
        vigilarLineas(true)
        busy(event.currentTarget, pedirWeb('link',
          { label: label, donde: el('line-where').value }).then(function (p) {
          if (!p.ok) {
            said('said-line', t(p.code === 'saturado' ? 'errSaturado' : 'lineFailed') +
              ' ' + t('lineKept'), true)
            return
          }
          return esperarWeb(p.at).then(function (st) {
            if (!st) { said('said-line', t('lineNoAnswer'), true); return }
            if (!st.ok) {
              // El motivo va UNA vez, en el renglon de la seccion. Repetirlo al lado
              // del boton llenaba media pantalla de rojo con el mismo parrafo.
              webStatusUlt = st
              said('said-line', t('lineKept'), true)
              return repintarLineas()
            }
            el('line-label').value = ''
            said('said-line', '\u2713 ' + t('lineDone'))
            vigilarLineas(true)
          })
        }))
      })

      // ---------- carga y refresco ----------
      var liveStorage = null

      // Las 19 claves que pinta el panel, y las 5 que cambian solas. El sondeo pide
      // solo las vivas: las otras 14 las mueve el usuario desde este mismo panel, y
      // pedirlas cada 12 s gastaba 19 de los 30 mensajes que el host admite por 10 s
      // — justo el cupo que le faltaba al clic.
      var CLAVES = ['scope', 'agentName', 'health', 'routes', 'tone', 'chats',
                    'transcribeQuality', 'inboxDays', 'ownerName', 'transcribe',
                    'transcribeLang', 'syncStatus', 'readLocal', 'readWeb',
                    'syncMinutes', 'readWebText', 'webLines', 'webStatus', 'workerBeat']
      var CLAVES_VIVAS = ['chats', 'health', 'syncStatus', 'webLines', 'webStatus',
                          'workerBeat']

      function reload(soloVivas) {
        if (!liveStorage) return Promise.resolve()
        // El sello se toma ANTES de pedir nada: lo que llegue es de este momento, y un
        // guardado posterior lo invalida. Sin esto el sondeo pintaba el valor de antes
        // encima del que el usuario acababa de guardar.
        var sello = guardadoSeq
        var claves = soloVivas ? CLAVES_VIVAS : CLAVES
        // La vuelta entera solo la dispara el usuario —abrir el panel, volver a el,
        // guardar algo—, asi que no se auto-frena: se manda y, si el host la rechaza,
        // se reintenta. Lo que si se frena es el sondeo, que no lo pidio nadie.
        return Promise.all(claves.map(function (k) { return read(k, !soloVivas) }))
          .then(function (rs) {
            var leido = {}
            claves.forEach(function (k, i) { leido[k] = rs[i] })
            // Lo que esta vuelta no pidio se pinta con lo ultimo que el host CONTESTO,
            // que es lo que `read` memoriza. Nunca con un defecto: no saber no es vacio.
            function v(k) {
              if (k in leido) return leido[k]
              return k in ultimaLectura ? ultimaLectura[k] : SIN_RESPUESTA
            }
            if (hayRespuesta(v('scope'))) renderScope(v('scope'))
            pintarClave('tone', v('tone'), sello)
            pintarClave('transcribeQuality', v('transcribeQuality'), sello)
            pintarClave('inboxDays', v('inboxDays'), sello)
            pintarClave('ownerName', v('ownerName'), sello)
            pintarClave('transcribe', v('transcribe'), sello)
            pintarClave('transcribeLang', v('transcribeLang'), sello)
            pintarClave('readLocal', v('readLocal'), sello)
            pintarClave('readWeb', v('readWeb'), sello)
            pintarClave('syncMinutes', v('syncMinutes'), sello)
            pintarClave('readWebText', v('readWebText'), sello)
            // Sin guardia de foco: renderChats no toca el buscador — reconstruye el
            // select y pintarChats ya conserva el texto filtrado y lo elegido. La
            // guardia solo lograba que, con el cursor en el buscador, la lista nunca
            // se llenara: era justo donde esta el cursor de quien mira "Buscando…".
            if (hayRespuesta(v('syncStatus'))) {
              estadoSync = v('syncStatus') && typeof v('syncStatus') === 'object'
                ? v('syncStatus') : null
            }
            if (hayRespuesta(v('chats'))) renderChats(v('chats'))
            pintarClave('agentName', v('agentName'), sello)
            // El latido manda sobre todo lo demas: si nadie esta corriendo, el health
            // que haya es de otra sesion y "todo bien" seria mentira. Un rechazo del
            // host NO cuenta como worker ausente — no saber no es saber que no esta.
            var sinWorker = pintarLatido(v('workerBeat'))
            var salud = v('health')
            if (sinWorker) { /* el aviso ya quedo puesto */ }
            // El health ya trae QUE falla y su detalle: mostrarlo es mejor que mandar
            // a correr un comando, que es justo lo que se saco del resto del panel.
            else if (hayRespuesta(salud) && salud && salud.ok === false) {
              var q = salud.problem
                ? esc(porCodigo(HEALTH_KEY, salud.problemCode, salud.problem))
                : t('notReady')
              // El detalle es el dato crudo de la herramienta —una ruta, un tamano, un
              // error de sqlite— no una frase: se muestra tal cual, como el detalle del
              // sync fallido de mas arriba.
              var c = salud.detail ? esc(salud.detail) : t('notReadyHow')
              showAlert(q, c)
            }
            else if (hayRespuesta(salud) && salud) el('alert').hidden = true
            if (hayRespuesta(salud)) renderOpcionales(salud && salud.optional)
            if (hayRespuesta(v('routes'))) renderRoutes(v('routes'))
            var stWeb = veredictoPropio(v('webStatus'))
            if (stWeb) webStatusUlt = stWeb
            renderLineas(v('webLines'))
            // Despues de renderLineas: reconstruye la tabla entera y con ella sus
            // botones, asi que apagarlos antes no dejaria rastro.
            apagarLoQueNecesitaWorker(sinWorker)
          })
      }

      var timer = null
      // Volver al panel es el momento de pedirlo todo: puede haber cambiado algo por
      // terminal mientras el usuario no estaba. El sondeo de cada 12 s, en cambio,
      // pide solo lo que cambia solo — con las 19 en cada vuelta, entrar al panel
      // (foco) justo despues de una ponia 38 mensajes en la misma ventana de 10 s y el
      // clic que venia atras llegaba al rechazo.
      var ultimaCompleta = 0
      function reloadDeUsuario() {
        var completa = Date.now() - ultimaCompleta >= 10000
        if (completa) ultimaCompleta = Date.now()
        return reload(!completa)
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') reloadDeUsuario()
      })
      window.addEventListener('focus', reloadDeUsuario)

      applyStrings()
      resetScopeForm()
      call('storage.get', { key: 'scope' }).then(function (r) {
        // Un `rate_limited` es prueba de que el puente CONTESTO: es el host poniendo
        // limite, no un Orca sin storage. Tomarlo por lo segundo apagaba TODOS los
        // botones y mandaba a actualizar Orca por una sola lectura rechazada.
        liveStorage = !!r.ok || r.errorCode === 'rate_limited'
        if (!liveStorage) {
          showAlert(t('needsUpdate'), t('needsUpdateHow'))
          Array.prototype.forEach.call(document.querySelectorAll('button'), function (b) {
            b.disabled = true
          })
          return
        }
        ultimaCompleta = Date.now()
        reload()
        // El worker sondea lento cuando no hay nada a medias; abrir el panel es la
        // senal de que alguien esta mirando, asi que se le pide una comprobacion ya.
        pedirWeb('refresh', null, true)
        // No hay evento de storage, asi que se sondea mientras el panel esta a la vista.
        // 12 s y 6 claves: la vuelta entera son 19 de los 30 mensajes por 10 s que el
        // host admite, y asi no queda cupo para el clic del usuario.
        timer = setInterval(function () {
          if (document.visibilityState === 'visible') reload(true)
        }, 12000)
      })
    </script>
  </body>
</html>
