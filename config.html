<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WhatsApp Inbox</title>
    <style>
      /* El host inyecta una lista corta de tokens en el <style> del shell
         (PANEL_DESIGN_TOKEN_ALLOWLIST, orca-oss src/shared/plugins/plugin-panel-shell.ts:34)
         y pone light/dark en <html>. Nada mas llega aca: ni utilidades de Tailwind,
         ni --radius-md, ni la tipografia de la app. Todo lo de abajo sale de esa
         lista o se calcula desde ella. */
      :root {
        color-scheme: light dark;
        /* De los radios solo viene --radius. md se calcula con el mismo factor que
           main.css:122, para no inventar un radio por elemento. */
        --radius-md: calc(var(--radius, 0.625rem) * 0.8);
        /* Respaldos para cuando el host no inyecta nada (host viejo, o el arnes
           jsdom). Son los valores reales de main.css, no un gris inventado: antes
           eran solo oscuros y el panel salia ilegible en cuanto el tema era claro. */
        --fb-background: #fff; --fb-foreground: #0a0a0a;
        --fb-primary: #171717; --fb-primary-foreground: #fafafa;
        --fb-secondary: #f5f5f5; --fb-secondary-foreground: #171717;
        --fb-muted: #f5f5f5; --fb-muted-foreground: #737373;
        --fb-accent: #f5f5f5; --fb-accent-foreground: #171717;
        --fb-destructive: #e40014;
        --fb-border: #e5e5e5; --fb-input: #e5e5e5; --fb-ring: #a1a1a1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fb-background: #0a0a0a; --fb-foreground: #fafafa;
          --fb-primary: #e5e5e5; --fb-primary-foreground: #171717;
          --fb-secondary: #262626; --fb-secondary-foreground: #fafafa;
          --fb-muted: #262626; --fb-muted-foreground: #a1a1a1;
          --fb-accent: #404040; --fb-accent-foreground: #fafafa;
          --fb-destructive: #ff6568;
          --fb-border: rgb(255 255 255 / 0.07); --fb-input: rgb(255 255 255 / 0.15);
          --fb-ring: #737373;
        }
      }
      /* Los widgets nativos (scrollbar, autocompletado del navegador) siguen al tema
         real del host, no a la preferencia del sistema. */
      html.light { color-scheme: light; }
      html.dark { color-scheme: dark; }
      * { box-sizing: border-box; }
      /* Sin padding en el body: el iframe no tiene relleno propio
         (PluginPanel.tsx:231 lo monta con h-full w-full) y los paneles nativos de
         Orca son a sangre, con el relleno adentro de cada bloque. */
      body {
        margin: 0; padding: 0 0 24px;
        /* Geist es la fuente de la app, pero el iframe no ve sus @font-face: pedirla
           solo daria un fallback distinto en cada maquina. Se queda el del sistema. */
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px; letter-spacing: 0.01em;
        color: var(--foreground, var(--fb-foreground));
        background: var(--background, var(--fb-background));
      }
      .wrap { max-width: 760px; }
      h1 { font-size: 13px; font-weight: 600; margin: 0; padding: 12px 12px 0;
           letter-spacing: -0.01em; }
      .sub:first-child { margin-top: 0; }
      .sub { color: var(--muted-foreground, var(--fb-muted-foreground));
             margin: 0; padding: 2px 12px 12px; font-size: 12px; }
      /* Los paneles propios de Orca no usan la primitiva Card por seccion: son
         planos, a sangre, separados por un filete de --border y una etiqueta
         chica en mayusculas (right-sidebar/PortsPanel.tsx:471, source-control/
         panel/header-toolbar.tsx:196, checks-panel-content.tsx:4503). Este panel
         hace lo mismo: una caja redondeada por seccion se veia como otra app.
         El relleno horizontal es 12 px, que es el px-3 de la casa. */
      section { padding: 12px; margin: 0;
                border-top: 1px solid var(--border, var(--fb-border)); }
      /* Etiqueta meta de 11 px: el STYLEGUIDE la fija en 600 y 0.05em, igual que
         PortsPanel.tsx:336. */
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
           color: var(--muted-foreground, var(--fb-muted-foreground));
           margin: 0 0 10px; font-weight: 600; }
      label, .label { display: block; font-size: 12px; margin: 12px 0 4px;
              color: var(--muted-foreground, var(--fb-muted-foreground)); }
      section > h2 + label, section > h2 + .label { margin-top: 0; }
      [hidden] { display: none !important; }
      /* Campos como el primitivo Input de Orca: fondo transparente, filete de
         --input y radio md (components/ui/input.tsx). */
      input, textarea {
        font: inherit; width: 100%; padding: 7px 9px; border-radius: var(--radius-md);
        border: 1px solid var(--input, var(--fb-input)); background: transparent;
        color: var(--foreground, var(--fb-foreground));
      }
      textarea { resize: vertical; }
      input:disabled { opacity: 1; color: var(--foreground, var(--fb-foreground));
                       border-color: transparent; background: var(--muted, var(--fb-muted)); }
      input[readonly] { background: var(--muted, var(--fb-muted)); }
      input:focus-visible, textarea:focus-visible {
        outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px;
        border-color: transparent;
      }
      button {
        font: inherit; font-weight: 500; padding: 7px 14px;
        border-radius: var(--radius-md); cursor: pointer;
        border: 1px solid var(--border, var(--fb-border));
        background: var(--secondary, var(--fb-secondary));
        color: var(--secondary-foreground, var(--fb-secondary-foreground));
        transition: background-color 90ms ease, color 90ms ease, transform 60ms ease;
      }
      /* Hover y active van por --accent, que es justamente para eso; el filete se
         queda en --border, porque --ring es enfasis fuerte y no decoracion. */
      button:hover { background: var(--accent, var(--fb-accent));
                     color: var(--accent-foreground, var(--fb-accent-foreground)); }
      button:active { transform: translateY(1px); }
      button:focus-visible { outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px; }
      button[disabled] { opacity: 0.5; cursor: default; transform: none; }
      button.primary { background: var(--primary, var(--fb-primary));
                       color: var(--primary-foreground, var(--fb-primary-foreground));
                       border-color: transparent; }
      button.primary:hover { background: var(--primary, var(--fb-primary));
                             color: var(--primary-foreground, var(--fb-primary-foreground));
                             filter: brightness(1.12); }
      /* Subrayado siempre, no solo en hover: en tema claro --primary es casi negro,
         asi que sin subrayar Editar/Quitar no se leen como algo clickeable. */
      button.link { border: 0; background: none; padding: 0; margin-left: 10px;
                    color: var(--primary, var(--fb-primary)); font-size: 11px; font-weight: 400;
                    text-decoration: underline; text-underline-offset: 2px; }
      button.link:hover { background: none; color: var(--primary, var(--fb-primary));
                          text-decoration-thickness: 2px; }
      /* Pestanas (T17). Mismo dibujo que las del tablero (activity.html): subrayado en
         --primary, que es el token de enfasis. Se envuelven en vez de desplazarse: una
         pestana que queda fuera de la vista a 320 px no existe para quien no la ve. */
      .tabs { display: flex; flex-wrap: wrap; gap: 0 2px; padding: 0 8px; margin: 0;
              border-bottom: 1px solid var(--border, var(--fb-border)); }
      .tab { font: inherit; font-size: 13px; padding: 7px 8px; cursor: pointer;
             border: 0; border-bottom: 2px solid transparent; border-radius: 0;
             margin-bottom: -1px; background: none; white-space: nowrap;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .tab:hover { background: none; color: var(--foreground, var(--fb-foreground)); }
      .tab:active { transform: none; }
      .tab[aria-selected="true"] { color: var(--foreground, var(--fb-foreground));
             font-weight: 600; border-bottom-color: var(--primary, var(--fb-primary)); }
      .tab:focus-visible { outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: -2px; }
      [role="tabpanel"] > section:first-child { border-top: 0; }
      .hint.lead { margin: 0 0 10px; }

      /* Grupos de botones en vez de selects: la lista de un select nativo no se abre en el
         panel de Orca (iframe con sandbox). Un renglon de opciones que se envuelve, con
         la elegida en --primary — la unica superficie de enfasis de la allowlist. */
      .seg { display: flex; flex-wrap: wrap; gap: 4px; }
      .seg + input, .seg + textarea { margin-top: 8px; }
      .seg button { padding: 5px 10px; font-weight: 400; background: transparent;
                    color: var(--foreground, var(--fb-foreground)); }
      .seg button:hover { background: var(--accent, var(--fb-accent)); }
      .seg button[aria-pressed="true"], .seg button[aria-pressed="true"]:hover {
        background: var(--primary, var(--fb-primary));
        color: var(--primary-foreground, var(--fb-primary-foreground));
        border-color: transparent; font-weight: 500; }
      /* Las cuentas de Claude del bot: una por renglon, el correo y debajo su estado. */
      .seg.cuentas { flex-direction: column; align-items: stretch; }
      .seg.cuentas button { display: flex; flex-direction: column; align-items: flex-start;
                            gap: 2px; text-align: left; min-width: 0; }
      .seg.cuentas .cuenta-nombre { max-width: 100%; overflow-wrap: anywhere; }
      .seg.cuentas .cuenta-nota { font-size: 11px; opacity: 0.75; overflow-wrap: anywhere; }

      /* El autocompletar: UN campo, y la lista se dibuja debajo, en la pagina. Fondo
         opaco (--background) y filete: flota sobre lo que sigue y tiene que taparlo. */
      .combo { position: relative; min-width: 0; }
      .combo-row { display: flex; gap: 8px; align-items: flex-start; }
      .combo-row .combo { flex: 1; }
      .combo-row > button { white-space: nowrap; }
      .combo-list { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px);
                    max-height: 264px; overflow-y: auto; padding: 4px;
                    border: 1px solid var(--border, var(--fb-border));
                    border-radius: var(--radius-md);
                    background: var(--background, var(--fb-background));
                    box-shadow: 0 6px 20px rgb(0 0 0 / 0.18); }
      .combo-group { padding: 6px 8px 2px; font-size: 11px; font-weight: 600;
                     text-transform: uppercase; letter-spacing: 0.05em;
                     color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .combo-opt { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px;
                   border-radius: calc(var(--radius-md) * 0.75); cursor: pointer;
                   color: var(--foreground, var(--fb-foreground)); }
      .combo-opt[aria-selected="true"] { background: var(--accent, var(--fb-accent));
                   color: var(--accent-foreground, var(--fb-accent-foreground)); }
      .combo-kind { flex: none; font-size: 10px; text-transform: uppercase;
                    letter-spacing: 0.04em; padding: 0 5px; border-radius: 4px;
                    border: 1px solid var(--border, var(--fb-border));
                    color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .combo-name { min-width: 0; overflow-wrap: anywhere; }
      .combo-sub { flex: none; margin-left: auto; font-size: 11px; white-space: nowrap;
                   color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .combo-empty { padding: 8px; font-size: 12px;
                     color: var(--muted-foreground, var(--fb-muted-foreground)); }
      @media (max-width: 420px) {
        .combo-row { flex-wrap: wrap; }
        .combo-row .combo { flex-basis: 100%; }
        .combo-opt { flex-wrap: wrap; }
        .combo-sub { margin-left: 0; white-space: normal; flex: 1 1 100%; min-width: 0; }
      }
      /* Los proyectos de una conversacion (proyectos-por-chat): una fila por proyecto, el
         autocompletar a lo ancho y su Quitar al lado; agregar va debajo, como un enlace. */
      .ws-fila { display: flex; gap: 8px; align-items: center; }
      .ws-fila + .ws-fila, #workspace-more .ws-fila { margin-top: 6px; }
      .ws-fila .combo { flex: 1; }
      .ws-fila button.link { margin-left: 0; white-space: nowrap; }
      button.link.ws-agregar { display: block; margin: 8px 0 0; font-size: 12px; }
      #project-question-wrap .seg + .hint { margin-top: 6px; }
      .ws-mas { font-size: 11px; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      /* Las personas de la conversacion (roles-por-numero): un bloque del formulario con su
         titulo meta, como una seccion, y una fila por persona con su rol a la derecha. Un
         grupo grande no empuja Guardar fuera de la vista: la lista se desplaza sola. */
      .people { margin: 16px 0 4px; padding: 12px 0 10px;
                border-top: 1px solid var(--border, var(--fb-border));
                border-bottom: 1px solid var(--border, var(--fb-border)); }
      .people-titulo { display: block; font-size: 11px; font-weight: 600;
                       text-transform: uppercase; letter-spacing: 0.05em;
                       color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .people > .hint { margin: 4px 0 0; }
      #people-search-wrap label { margin-top: 10px; }
      /* El contador es una region viva: tiene que estar pintado ANTES de cambiar, o el
         lector de pantalla no dice la primera busqueda. Vacio no ocupa lugar. */
      #people-count:empty { margin: 0; }
      /* Con filete y radio, como la lista del autocompletar: una fila cortada abajo se lee
         como "hay mas" y no como algo roto, que es como se veia sin marco a 390 px. */
      #people-list { margin-top: 8px; max-height: 420px; overflow-y: auto; padding: 0 10px;
                     border: 1px solid var(--input, var(--fb-input));
                     border-radius: var(--radius-md); }
      #people-list:empty { display: none; }
      .persona { display: flex; gap: 8px 12px; align-items: center; justify-content: space-between;
                 padding: 8px 0; border-top: 1px solid var(--border, var(--fb-border)); }
      .persona:first-child { border-top: 0; }
      .persona-quien { flex: 1 1 160px; min-width: 0; }
      .persona-nombre { display: block; font-size: 13px; overflow-wrap: anywhere;
                        color: var(--foreground, var(--fb-foreground)); }
      .persona-sub { display: block; font-size: 11px; overflow-wrap: anywhere;
                     color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .persona .seg { flex: none; padding: 2px 0; }
      .persona-nota { margin-top: 2px; }
      .persona-nota button.link { margin-left: 4px; font-size: 11px; white-space: nowrap; }
      .persona > .rol-fijo { flex: none; }
      /* Super admin fijo: una pastilla con filete, sin color propio (la allowlist no trae
         uno), y el texto pleno para que no se lea como apagado. */
      .rol-fijo { display: inline-block; padding: 1px 8px; border-radius: 9999px; font-size: 11px;
                  font-weight: 500; border: 1px solid var(--ring, var(--fb-ring));
                  color: var(--foreground, var(--fb-foreground)); }
      #people-empty { padding: 8px 0 0; }
      @media (max-width: 520px) {
        .persona { flex-wrap: wrap; align-items: flex-start; }
        .persona-quien { flex-basis: 100%; }
      }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
                 overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
      #chat-count { margin-top: 4px; }
      #said-chat-fetch:not(:empty) { display: block; margin-top: 6px; }

      /* El interruptor de Jev: un boton con role=switch, no un select. */
      .switch-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
                    margin: 4px 0 2px; font-size: 13px; }
      /* Los avisos de Orca: la etiqueta larga se parte al lado de su interruptor y no
         baja entera a otra linea, lejos de el (visto a 390). */
      #orca-notices-card .switch-row { flex-wrap: nowrap; }
      #orca-notices-card .switch-row > span { flex: 1 1 auto; min-width: 0; }
      .switch { position: relative; width: 38px; height: 22px; padding: 0; flex: none;
                border-radius: 9999px; border: 1px solid var(--input, var(--fb-input));
                background: var(--muted, var(--fb-muted)); }
      .switch:hover { background: var(--muted, var(--fb-muted)); }
      .switch:active { transform: none; }
      .switch .knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
                      border-radius: 50%; transition: left 120ms ease;
                      background: var(--muted-foreground, var(--fb-muted-foreground)); }
      .switch[aria-checked="true"], .switch[aria-checked="true"]:hover {
        background: var(--primary, var(--fb-primary)); border-color: transparent; }
      .switch[aria-checked="true"] .knob { left: 18px;
        background: var(--primary-foreground, var(--fb-primary-foreground)); }

      /* Lo que falta (Estado) y las reglas fijas (Su aprobacion). */
      .checklist, .rules { list-style: none; margin: 0; padding: 0; }
      .checklist li { display: flex; gap: 8px; align-items: baseline; padding: 7px 0;
                      border-top: 1px solid var(--border, var(--fb-border)); font-size: 12px; }
      .checklist li:first-child { border-top: 0; }
      .checklist .mark { flex: none; width: 14px; text-align: center; }
      .checklist [data-ok="true"] { color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .checklist .what { flex: 1; min-width: 0; }
      .checklist .tag { font-size: 11px; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .checklist button.link { margin-left: 0; white-space: nowrap; }
      .checklist .done { padding: 7px 0 0; font-size: 12px; font-weight: 500; }
      .rules li { position: relative; padding: 5px 0 5px 16px; font-size: 12px; line-height: 1.5; }
      .rules + .hint.lead { margin-top: 12px; }
      /* Los niveles por regla (T22.3): el nombre de la regla arriba de sus tres botones. */
      .ap-reglas { margin-top: 4px; }
      .ap-regla { display: block; margin: 8px 0 4px; font-size: 12px;
                  color: var(--muted-foreground, var(--fb-muted-foreground)); }
      /* Los numeros del dueno: nombre e id, y el id se parte donde haga falta a 320 px. */
      .owner-id { display: block; font-size: 11px; overflow-wrap: anywhere;
                  color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .rules li::before { content: '\25CF'; position: absolute; left: 2px; top: 5px;
                          font-size: 8px; color: var(--muted-foreground, var(--fb-muted-foreground)); }

      /* Una regla de antes (Plane) se marca como tal: ya no se usa, pero borrarla
         callado seria perder lo que el dueno configuro. */
      .legacy { display: inline-block; margin-left: 6px; padding: 0 6px; font-size: 10px;
                border-radius: 9999px; border: 1px dashed currentColor;
                background: var(--muted, var(--fb-muted));
                color: var(--foreground, var(--fb-foreground)); }
      tr.vieja td:first-child, tr.vieja td:nth-child(2) {
        color: var(--muted-foreground, var(--fb-muted-foreground)); }
      /* Un jid no tiene espacios donde partir, y a 320 px se sale del panel. Se parte
         donde haga falta: un identificador cortado se sigue leyendo, un panel con
         scroll horizontal no. */
      #chat-id { margin-top: 4px; overflow-wrap: anywhere; }
      .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
      /* Proyecto y permiso: dos campos, no tres. */
      .row.dos { grid-template-columns: 1fr 1fr; margin-top: 10px; }
      .actions { display: flex; align-items: center; gap: 10px; margin-top: 14px;
                 min-height: 30px; flex-wrap: wrap; }
      /* Una fila de acciones sin nada visible deja 44 px de aire entre dos campos
         que van juntos. Se colapsa sola cuando no le quedan botones ni mensaje; si
         el navegador no soporta :has() se queda como antes, sin romperse. */
      .actions:not(:has(button:not([hidden]))):not(:has(.said:not(:empty))) {
        display: none;
      }
      /* La allowlist no trae color de exito, y no se inventa uno: el ✓ y el peso
         cargan la confirmacion. El fallo si tiene token, --destructive. */
      .said { font-size: 12px; font-weight: 500;
              color: var(--foreground, var(--fb-foreground)); }
      .said.bad { font-weight: 400; color: var(--destructive, var(--fb-destructive)); }
      /* Las filas van a sangre dentro de la seccion: el filete llega a los bordes
         del relleno, como las listas del panel de control de versiones. */
      table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
      th { text-align: left; font-weight: 500;
           color: var(--muted-foreground, var(--fb-muted-foreground));
           padding: 5px 8px 5px 0; border-bottom: 1px solid var(--border, var(--fb-border)); }
      td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--border, var(--fb-border));
           vertical-align: top; }
      tr:last-child td { border-bottom: 0; }
      td.acts { text-align: right; white-space: nowrap; }
      /* A 320 px una tabla de 4 columnas no cabe, y partir palabra deja pastillas que
         dicen "respon der". Debajo de 420 px cada fila pasa a ser un bloque: el valor
         se describe solo, asi que la cabecera no hace falta. */
      @media (max-width: 420px) {
        table, tbody, tr, td { display: block; width: 100%; }
        thead { display: none; }
        tr { border-bottom: 1px solid var(--border, var(--fb-border)); padding: 8px 0; }
        tr:last-child { border-bottom: 0; }
        td { border: 0; padding: 1px 0; }
        /* Con casa discrepante una fila lleva cuatro acciones, y en espanol el
           `nowrap` de arriba las empujaba a 333 px dentro de una ventana de 320.
           Abajo de 420 se envuelven; el `nowrap` sigue valiendo en pantalla ancha,
           donde parte una etiqueta a la mitad. */
        td.acts { text-align: left; margin-top: 6px; white-space: normal; }
        td.acts button { margin-bottom: 4px; }
        td.acts button.link:first-child { margin-left: 0; }
        .row, .row.dos { grid-template-columns: 1fr; }
      }
      /* Los cuatro permisos. La allowlist no tiene verde ni ambar y no se fabrican:
         se separan por peso y superficie, no por tono. "off" se queda en el estado
         base — texto apagado, sin filete —, "observar" suma filete y texto pleno,
         "borrador" es una superficie --accent, y solo "responder" (el unico que
         manda mensajes de verdad) usa --destructive. */
      .pill { display: inline-block; padding: 1px 8px; border-radius: 9999px; font-size: 11px;
              border: 1px solid transparent;
              color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .pill.observar { border-color: var(--border, var(--fb-border));
                       color: var(--foreground, var(--fb-foreground)); }
      .pill.borrador { background: var(--accent, var(--fb-accent));
                       color: var(--accent-foreground, var(--fb-accent-foreground)); }
      .pill.responder { border-color: var(--destructive, var(--fb-destructive));
                        color: var(--destructive, var(--fb-destructive)); font-weight: 600; }
      td.acts button + button { margin-left: 10px; }
      @media (max-width: 420px) { td.acts button + button { margin-left: 8px; } }
      .empty { color: var(--muted-foreground, var(--fb-muted-foreground));
               font-size: 12px; padding: 10px 0; }
      .hint { color: var(--muted-foreground, var(--fb-muted-foreground));
              font-size: 11px; margin: 6px 0 0; line-height: 1.5; }
      /* Un fallo al buscar proyectos: va en el color del texto y con el token de fallo, no
         en el gris apagado de los consejos, porque es EL mensaje mientras no hay lista. */
      .hint.mal { color: var(--destructive, var(--fb-destructive)); }
      /* El motivo no es una pista al margen: es EL mensaje mientras no hay lista, asi
         que va en el color del texto y no en el apagado de los consejos. */
      #sync-msg { color: var(--foreground, var(--fb-foreground)); }
      /* La salida cruda de la herramienta se lee como lo que es. A 320 px la ruta no
         cabe en una linea y partirla es mejor que desbordar. */
      #sync-detail { font-family: ui-monospace, Menlo, monospace; overflow-wrap: anywhere; }
      /* Un requisito opcional no es una alerta: no bloquea nada. Va en gris, con su
         accion al lado, y desaparece cuando se resuelve. */
      #opcionales[hidden] { display: none; }
      #opcionales { margin: 0 0 12px; padding: 0 12px; }
      .opcional {
        display: flex; gap: 8px; align-items: baseline; padding: 7px 0;
        border-top: 1px solid var(--border, var(--fb-border)); font-size: 12px;
        color: var(--muted-foreground, var(--fb-muted-foreground));
      }
      .opcional:last-child { border-bottom: 1px solid var(--border, var(--fb-border)); }
      .opcional b { color: var(--foreground, var(--fb-foreground)); font-weight: 500; }
      .opcional code { color: var(--primary, var(--fb-primary)); }
      .alert[hidden] { display: none; }

      /* El unico bloque con caja: en Orca las cajas redondeadas quedan reservadas
         para avisos, no para estructura (listing/conflict-status-cards.tsx:49 usa
         rounded-md + filete + tinte). Radio md, filete y texto en --destructive; el
         tinte se deriva del mismo token con color-mix en vez de un rojo aparte, y si
         el motor no lo soporta la declaracion se cae y queda el filete. */
      .alert { display: flex; gap: 8px; align-items: baseline;
               border: 1px solid var(--destructive, var(--fb-destructive));
               border-radius: var(--radius-md); padding: 9px 11px;
               margin: 0 12px 12px; font-size: 12px;
               color: var(--foreground, var(--fb-foreground));
               background: color-mix(in srgb,
                 var(--destructive, var(--fb-destructive)) 8%, transparent); }
      /* El porque va apagado y en su renglon: la instruccion es lo que hay que leer. */
      .alert-why { display: block; margin-top: 4px; font-size: 11px;
                   color: var(--muted-foreground, var(--fb-muted-foreground)); }
      code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
      @media (max-width: 620px) { .row, .row.dos { grid-template-columns: 1fr; } }
      /* El catalogo: una fila por proyecto, no una tabla, porque cada uno lleva su nota
         editable y a 320 px una tabla de cuatro columnas no cabe. Mismo filete que las
         filas de las tablas. */
      .proj { padding: 9px 0; border-top: 1px solid var(--border, var(--fb-border)); }
      .proj:first-child { border-top: 0; }
      .proj-head { display: flex; align-items: baseline; justify-content: space-between;
                   gap: 10px; flex-wrap: wrap; }
      .proj-head b { font-weight: 600; overflow-wrap: anywhere; }
      /* La ruta no tiene espacios donde partir: se parte donde haga falta antes que
         desbordar a 320 px. */
      .proj-path { display: block; margin-top: 2px; overflow-wrap: anywhere;
                   color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .proj-head button.link { margin-left: 0; }
      .proj-note { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
      .proj-note input { flex: 1; min-width: 0; }
      .proj-note button.link { margin-left: 0; white-space: nowrap; }
      #projects-status { margin: 8px 0 4px; }
      /* Skills (skills-globales): una tarjeta por skill y una fila por destino, con el
         mismo filete que los proyectos. El estado va en una pastilla: "instalada" con texto
         pleno y filete, "desactualizada" en --accent como lo que espera algo, sin colores
         que la allowlist no trae. */
      .skill + .skill { margin-top: 14px; }
      .skill-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
      .skill-head b { font-weight: 600; font-family: ui-monospace, Menlo, monospace;
                      font-size: 12px; }
      .skill-desc { margin: 4px 0 6px; }
      .sk-row { padding: 9px 0; border-top: 1px solid var(--border, var(--fb-border)); }
      .sk-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .sk-line .sk-where { font-weight: 500; overflow-wrap: anywhere; }
      .sk-line .sk-acts { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
      .sk-line .sk-acts button.link { margin-left: 0; }
      .sk-row .proj-path { font-size: 11px; margin-top: 6px; }
      .pill.sk-installed { border-color: var(--border, var(--fb-border));
                           color: var(--foreground, var(--fb-foreground)); }
      .pill.sk-outdated { background: var(--accent, var(--fb-accent));
                          color: var(--accent-foreground, var(--fb-accent-foreground)); }
      .pill.sk-foreign { border-color: var(--border, var(--fb-border)); }
      .sk-warn { color: var(--destructive, var(--fb-destructive)); }
      .sk-acts button.confirmar { border-color: var(--destructive, var(--fb-destructive));
                                  color: var(--destructive, var(--fb-destructive)); }
      @media (max-width: 420px) { .sk-line .sk-acts { margin-left: 0; width: 100%; } }
      #proposals-wrap { margin-top: 4px; }

      /* Vinculacion de WhatsApp (T4). Sin verde/ambar en la allowlist -mismo criterio
         que .pill-: conectado usa el texto pleno, caido usa --destructive. */
      .pairing-msg { font-size: 13px; font-weight: 500; margin: 0 0 2px;
                     color: var(--foreground, var(--fb-foreground)); }
      .pairing-msg.ok { color: var(--foreground, var(--fb-foreground)); }
      .pairing-msg.bad { color: var(--destructive, var(--fb-destructive)); }
      #pairing-detail[hidden] { display: none; }
      #pairing-detail { margin: 0 0 8px; }
      #qr-wrap[hidden] { display: none; }
      /* El QR necesita fondo claro y zona de quietud SIEMPRE, tambien en tema oscuro:
         un lector de camara pierde contraste contra el fondo oscuro del panel que
         queda detras del margen del modulo (docs/ENCARGO...§6). El fondo es fijo en
         #fff y no un token -es la unica superficie del panel que no seria del tema. */
      #qr-wrap { display: inline-block; background: #fff; padding: 14px;
                 border-radius: var(--radius-md); margin: 4px 0 8px;
                 border: 1px solid var(--border, var(--fb-border)); line-height: 0;
                 transition: opacity .15s; }
      #qr-canvas { display: block; }
      /* Un QR vencido en pantalla es inofensivo -WhatsApp lo rechaza y el telefono
         dice que el codigo no vale-. Un RECUADRO VACIO es peor: se ve como un plugin
         roto, no como uno que esta a punto de mostrar el siguiente. Se apaga, no se
         esconde. */
      #qr-wrap.vencido { opacity: .4; }
      #pairing-actions[hidden], #pairing-warn[hidden] { display: none; }
      /* Las lineas (varias lineas a la vez): una fila por numero, con su estado, su tipo y
         sus acciones. La de una linea nueva lleva su propio QR, con el mismo fondo fijo
         que el de la vinculacion principal. */
      .lineas { list-style: none; margin: 0; padding: 0; }
      .linea { padding: 10px 0; border-top: 1px solid var(--border, var(--fb-border)); }
      .linea:first-child { border-top: 0; padding-top: 2px; }
      .linea-cab { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
      .linea-num { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
      .linea-marca { font-size: 11px; padding: 1px 6px; border-radius: 999px;
                     border: 1px solid var(--border, var(--fb-border));
                     color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .linea-estado { font-size: 12px; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .linea-estado.ok { color: var(--foreground, var(--fb-foreground)); }
      .linea-estado.bad { color: var(--destructive, var(--fb-destructive)); }
      .linea-tipo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
                    margin-top: 8px; font-size: 12px; }
      .linea-tipo .hint { margin: 0; flex-basis: 100%; }
      .linea-qr { display: inline-block; background: #fff; padding: 12px; margin: 8px 0 0;
                  border-radius: var(--radius-md); line-height: 0;
                  border: 1px solid var(--border, var(--fb-border)); }
      .linea-qr.vencido { opacity: .4; }
      .linea .actions { margin-top: 8px; }
      .linea-aviso { color: var(--destructive, var(--fb-destructive)); margin: 6px 0 0; }
      #linea-vista-fila { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
                          margin: 0 0 12px; font-size: 12px; }
      #linea-vista-fila[hidden] { display: none; }
      /* El aviso de lo que se pierde va en --destructive y no apagado como las demas
         pistas: es lo unico de esta seccion que el usuario tiene que leer ANTES de
         apretar, no despues. */
      .pairing-warn { color: var(--destructive, var(--fb-destructive));
                      margin: 0 0 8px; max-width: 52ch; }
      /* Un numero de aprobacion cuyo chat no esta en Automatico no recibe nada (T14): se
         dice antes de guardar, en el mismo color que lo que hay que leer antes de apretar. */
      .approval-warn { color: var(--destructive, var(--fb-destructive)); }
      /* El primer mensaje (Beta): la marca en los dos modos del agente, y sus numeros. */
      .seg button .beta { display: inline-block; margin-left: 6px; padding: 0 6px;
                          border-radius: 999px; font-size: 10px; font-weight: 600;
                          letter-spacing: 0.04em; line-height: 16px; vertical-align: 1px;
                          border: 1px solid currentColor; opacity: 0.85; }
      .fr-nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                 gap: 8px 12px; margin-top: 8px; }
      .fr-nums[hidden], .fr-num[hidden] { display: none; }
      .fr-num { display: flex; flex-direction: column; min-width: 0; }
      .fr-num input { width: 100%; max-width: 120px; }
      .approval-warn[hidden] { display: none; }
      /* El boton que confirma el borrado se ve distinto del que lo ofrece: son dos
         clics del mismo boton y sin la diferencia visual el segundo se da sin mirar. */
      #pairing-unlink.confirmar, .linea-desvincular.confirmar {
        border-color: var(--destructive, var(--fb-destructive));
        color: var(--destructive, var(--fb-destructive)); }
      /* El aviso de Jev es lo que hay que leer ANTES de encender: tiene caja y filete,
         las cajas de Orca son para avisos. Sin tinte de color: no es un error. */
      .jev-aviso { margin: 0 0 12px; padding: 9px 11px; font-size: 12px; line-height: 1.5;
                   border: 1px solid var(--border, var(--fb-border));
                   border-radius: var(--radius-md);
                   color: var(--foreground, var(--fb-foreground)); }
      #jev-status { margin: 0 0 12px; }
      .jev-nota { color: var(--destructive, var(--fb-destructive)); margin: 8px 0 0; }
      .jev-nota[hidden] { display: none; }
      #jev-mirror-note code { overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- Sin titulo propio: en Ajustes el host ya pinta "WhatsApp Inbox" arriba de la
           pagina, asi que repetirlo lo dice dos veces. La bajada si aporta: explica que
           hace el panel, no como se llama. -->
      <p class="sub" data-t="sub"></p>
      <!-- El aviso general va FUERA de las pestanas: un plugin que no corre se tiene que
           ver desde cualquiera de ellas, no solo desde Estado. -->
      <div class="alert" id="alert" hidden></div>

      <!-- Seis pestanas (T17). Antes era una sola columna larga con diez botones de
           guardar; el dueno no encontraba nada. Cada control vive en UNA pestana y cada
           tarjeta tiene UN guardar. -->
      <div class="tabs" role="tablist" data-t-label="tabsLabel">
        <button class="tab" id="tab-estado" role="tab" aria-controls="view-estado"
                data-t="tabEstado"></button>
        <button class="tab" id="tab-chats" role="tab" aria-controls="view-chats"
                data-t="tabChats"></button>
        <button class="tab" id="tab-proyectos" role="tab" aria-controls="view-proyectos"
                data-t="tabProyectos"></button>
        <button class="tab" id="tab-aprobacion" role="tab" aria-controls="view-aprobacion"
                data-t="tabAprobacion"></button>
        <button class="tab" id="tab-agente" role="tab" aria-controls="view-agente"
                data-t="tabAgente"></button>
        <button class="tab" id="tab-skills" role="tab" aria-controls="view-skills"
                data-t="tabSkills"></button>
        <button class="tab" id="tab-avanzado" role="tab" aria-controls="view-avanzado"
                data-t="tabAvanzado"></button>
      </div>

      <!-- ───────── Estado ───────── -->
      <div id="view-estado" role="tabpanel" aria-labelledby="tab-estado">
        <!-- El transporte unico (T3/T4, docs/ENCARGO-TRANSPORTE-UNICO.md). Primera
             seccion a proposito: sin sesion nada mas de este panel importa todavia. -->
        <section>
          <h2 data-t="pairingLegend"></h2>
          <p class="pairing-msg" id="pairing-msg"></p>
          <p class="hint" id="pairing-detail" hidden></p>
          <!-- Lo que el panel de verdad leyo del worker y del sidecar, en frase y no en
               nombre de campo. Solo aparece cuando la espera ya deja de ser normal
               (`pairingDiagnostico`): antes de eso no hay nada raro que contar. -->
          <p class="hint" id="pairing-diag" hidden></p>
          <div id="qr-wrap" hidden>
            <canvas id="qr-canvas"></canvas>
          </div>
          <!-- "Me toca refrescar?" tenia que tener una respuesta en la pantalla. Va por
               el carril de USUARIO (`call(..., true)`), no por el del sondeo. -->
          <div class="actions">
            <button id="pairing-refresh" data-t="pairingRefresh"></button>
            <span class="said" id="said-pairing-refresh"></span>
          </div>
          <!-- Desvincular es irreversible desde aca y no hay modal donde preguntar
               (`surface` es un enum cerrado y `window.open` esta anulado, §6), asi que
               la confirmacion vive en el boton mismo. -->
          <p class="hint pairing-warn" id="pairing-warn" hidden></p>
          <div class="actions" id="pairing-actions" hidden>
            <button id="pairing-retry" hidden data-t="pairingRetry"></button>
            <button id="pairing-unlink" hidden data-t="pairingUnlink"></button>
            <button id="pairing-cancel" hidden data-t="pairingUnlinkCancel"></button>
            <span class="said" id="said-pairing"></span>
          </div>
        </section>

        <!-- Varias lineas a la vez (odd/tasks/varias-lineas-y-segundo-cerebro.md, L4/L5):
             cada numero vinculado, con su estado, su tipo y como soltarlo, y la forma de
             vincular otro al lado. La primera es la principal, la de la seccion de arriba. -->
        <section id="lineas-card">
          <h2 data-t="linesLegend"></h2>
          <p class="hint lead" data-t="linesHelp"></p>
          <ul class="lineas" id="lineas-lista"></ul>
          <p class="hint" data-t="linesPersonalLater"></p>
          <p class="hint" id="lineas-espera" hidden data-t="linesWaitingOne"></p>
          <div class="actions">
            <button id="linea-vincular" data-t="linesLink"></button>
            <span class="said" id="said-lineas"></span>
          </div>
        </section>

        <!-- Lo que falta para que el agente trabaje, con un boton a la pestana donde se
             arregla cada cosa. Se arma con lo que el panel YA lee: no gasta cupo. -->
        <section>
          <h2 data-t="checkLegend"></h2>
          <ul class="checklist" id="checklist"></ul>
        </section>

        <div id="opcionales" hidden></div>
      </div>

      <!-- ───────── Conversaciones ───────── -->
      <div id="view-chats" role="tabpanel" aria-labelledby="tab-chats" hidden>
        <section>
          <h2 data-t="scopeLegend"></h2>
          <p class="hint lead" data-t="scopeHelp"></p>
          <!-- Con dos lineas o mas, de cual son las conversaciones que se ven y se guardan. -->
          <div id="linea-vista-fila" hidden>
            <span id="linea-vista-label" data-t="linesView"></span>
            <div class="seg" id="linea-vista" role="group" aria-labelledby="linea-vista-label"></div>
          </div>
          <div id="scope-wrap"></div>
          <span class="said" id="said-scope-rm"></span>
        </section>

        <!-- Agregar o cambiar una conversacion: un buscador que filtra mientras se
             escribe, el proyecto con el mismo buscador, y el modo con botones. -->
        <section class="card" id="scope-form">
          <h2 id="scope-form-title" data-t="formLegend"></h2>
          <label for="chat-search" data-t="chatLabel"></label>
          <div class="combo-row">
            <div class="combo">
              <input id="chat-search" type="text" autocomplete="off" spellcheck="false"
                     role="combobox" aria-autocomplete="list" aria-expanded="false"
                     aria-controls="chat-list" data-t-ph="chatSearchPh" />
              <div class="combo-list" id="chat-list" role="listbox" hidden
                   data-t-label="chatLabel"></div>
            </div>
            <!-- Traer la libreta a mano. Las personas llegan por `resyncAppState`, que
                 Baileys corre UNA sola vez; si la sincronizacion inicial no se completo,
                 la lista sale sin ninguna persona y no hay otra forma de pedirla. -->
            <button id="chat-fetch" data-t="chatFetch"></button>
          </div>
          <span class="said" id="said-chat-fetch"></span>
          <!-- Que conversacion quedo elegida, por su LLAVE. El nombre visible no es
               identidad: cambia y se repite (§11-A1). -->
          <p class="hint" id="chat-id"></p>
          <p class="hint" id="chat-count"></p>
          <!-- Lo que paso de verdad con la busqueda. Un "Buscando…" que no caduca nunca
               deja al usuario sin nada que apretar si el sync fallo. -->
          <div id="sync-state" hidden>
            <p class="hint" id="sync-msg"></p>
            <p class="hint" id="sync-detail" hidden></p>
            <div class="actions">
              <button id="sync-retry" data-t="syncRetry"></button>
              <span class="said" id="said-sync"></span>
            </div>
          </div>
          <input id="chat" type="hidden" />

          <!-- Los proyectos de la conversacion, en orden (proyectos-por-chat, M6): una fila por
               proyecto, cada una con el mismo autocompletar. La primera es la de siempre
               (`#workspace`); las demas se agregan con el boton y se quitan con el suyo o
               con Retroceso en una fila vacia. -->
          <label for="workspace-search" data-t="workspaceLabel"></label>
          <div class="ws-fila">
            <div class="combo">
              <input id="workspace-search" type="text" autocomplete="off" spellcheck="false"
                     role="combobox" aria-autocomplete="list" aria-expanded="false"
                     aria-controls="workspace-list" data-t-ph="workspaceSearchPh" />
              <div class="combo-list" id="workspace-list" role="listbox" hidden
                   data-t-label="workspaceLabel"></div>
            </div>
            <button type="button" class="link ws-quitar" id="workspace-rm" hidden
                    data-t="remove"></button>
          </div>
          <input id="workspace" type="hidden" />
          <div id="workspace-more"></div>
          <button type="button" class="link ws-agregar" id="workspace-add" hidden
                  data-t="workspaceAdd"></button>
          <p class="hint" id="workspace-hint"></p>
          <!-- A quien pregunta el agente "A o B?" cuando duda (M5): solo con dos o mas. -->
          <div id="project-question-wrap" hidden>
            <span class="label" id="chat-project-question-label" data-t="pqLabel"></span>
            <div class="seg" id="chat-project-question" role="group"
                 aria-labelledby="chat-project-question-label">
              <button type="button" data-value="auto" data-t="pqAuto"></button>
              <button type="button" data-value="writer" data-t="pqWriter"></button>
              <button type="button" data-value="owner" data-t="pqOwner"></button>
            </div>
            <p class="hint" data-t="pqHelp"></p>
          </div>

          <!-- Las personas de la conversacion y su rol (roles-por-numero, M11). El rol sale
               del NUMERO que el dueno marca aqui, nunca de lo que diga un mensaje, y vale solo
               en esta conversacion. En un directo, la persona del chat; en un grupo, la lista
               que deja wa-scope sync en `groupMembers`. Los numeros de confianza son Super
               admin en todas partes: aqui solo se muestran. Grupos de botones, como el modo. -->
          <div class="people" id="people-wrap" hidden>
            <span class="people-titulo" id="people-legend" data-t="peopleLegend"></span>
            <p class="hint" id="people-help"></p>
            <div id="people-search-wrap" hidden>
              <label for="people-search" data-t="peopleSearchLabel"></label>
              <input id="people-search" type="search" autocomplete="off" spellcheck="false"
                     aria-describedby="people-count" data-t-ph="peopleSearchPh" />
              <p class="hint" id="people-count" aria-live="polite"></p>
            </div>
            <div id="people-list" role="list" aria-labelledby="people-legend"></div>
            <p class="empty" id="people-empty" hidden></p>
          </div>

          <span class="label" id="mode-label" data-t="permLabel"></span>
          <div class="seg" id="mode" role="group" aria-labelledby="mode-label">
            <button type="button" data-value="off" data-t="modeOff"></button>
            <button type="button" data-value="observar" data-t="modeObserve"></button>
            <button type="button" data-value="borrador" data-t="modeDraft"></button>
            <button type="button" data-value="responder" data-t="modeReply"></button>
          </div>
          <p class="hint" id="mode-desc"></p>

          <label for="chat-tone" data-t="chatToneLabel"></label>
          <input id="chat-tone" data-t-ph="chatTonePh" />
          <label for="chat-instructions" data-t="chatInstrLabel"></label>
          <textarea id="chat-instructions" rows="3" data-t-ph="chatInstrPh"></textarea>
          <p class="hint" data-t="chatInstrHelp"></p>
          <span class="label" id="chat-ack-label" data-t="ackLabel"></span>
          <div class="seg" id="chat-ack" role="group" aria-labelledby="chat-ack-label">
            <button type="button" data-value="default" data-t="autoDefault"></button>
            <button type="button" data-value="on" data-t="autoOn"></button>
            <button type="button" data-value="off" data-t="autoOff"></button>
          </div>
          <input id="chat-ack-text" data-t-ph="ackPh" />
          <span class="label" id="chat-greeting-label" data-t="greetingLabel"></span>
          <div class="seg" id="chat-greeting" role="group" aria-labelledby="chat-greeting-label">
            <button type="button" data-value="default" data-t="autoDefault"></button>
            <button type="button" data-value="on" data-t="autoOn"></button>

      var LANG = (function () {

        if (tag.indexOf('pt') === 0) return 'pt'
        return 'en'
      })()
      function t(key) { return (STRINGS[LANG] && STRINGS[LANG][key]) || STRINGS.en[key] || key }

      var el = function (id) { return document.getElementById(id) }

      function applyStrings() {
        var q = document.querySelectorAll.bind(document)
        Array.prototype.forEach.call(q('[data-t]'), function (n) {
          n.innerHTML = t(n.dataset.t)
        })
        Array.prototype.forEach.call(q('[data-t-ph]'), function (n) { n.placeholder = t(n.dataset.tPh) })
        Array.prototype.forEach.call(q('[data-t-title]'), function (n) {
          n.title = t(n.dataset.tTitle); n.setAttribute('aria-label', t(n.dataset.tTitle))
        })
        Array.prototype.forEach.call(q('[data-t-label]'), function (n) {
          n.setAttribute('aria-label', t(n.dataset.tLabel))
        })
        repintarProyectos()
        renderSkills()
      }

      var seq = 0, pending = {}

      // El host admite 30 mensajes por 10 s y contesta `rate_limited` al resto
      // (PANEL_MESSAGE_RATE_LIMIT). Una vuelta del sondeo gasta 19 y tomar foco dispara
      // otra: medido, arranque 21 + foco 19 = 40 en la misma ventana, y el
      // `storage.set` del clic llegaba en el puesto 31. El panel lo contaba como "el
      // plugin no contesto" y el usuario apretaba de nuevo — el segundo clic entraba
      // porque la ventana ya se habia vaciado. Por eso la ventana se lleva tambien de
      // este lado: lo que nace de un clic tiene cupo reservado y prioridad, y lo que no
      // entra espera su turno en vez de perderse.
      var CUPO = { max: 30, ventanaMs: 10000, reserva: 4 }
      var gastados = [], cola = [], colaTimer = null, frenoHasta = 0
      var RECHAZADO = { ok: false, errorCode: 'rate_limited' }

      // Solo el sondeo se auto-frena. Lo del usuario sale ya: si el host lo rechaza no
      // se pierde nada —un rechazo no gasta cupo— y el reintento lo pone igual. Frenar
      // un clic para no molestar al host seria cambiar un defecto por otro mas lento.
      function hayLugarDeSondeo() {
        var corte = Date.now() - CUPO.ventanaMs
        while (gastados.length && gastados[0] <= corte) gastados.shift()
        return gastados.length < CUPO.max - CUPO.reserva
      }
      function proximoHueco() {
        var ahora = Date.now()
        // Lo del usuario espera SU reintento y nada mas: hacerlo esperar a que se
        // vacie la ventana del sondeo lo dejaba diez segundos quieto, que es el mismo
        // "no paso nada" que esto viene a sacar.
        if (cola[0] && cola[0].usuario) return Math.max(60, (cola[0].desde || 0) - ahora)
        var falta = frenoHasta - ahora
        if (gastados.length) falta = Math.max(falta, gastados[0] + CUPO.ventanaMs - ahora)
        return Math.max(60, Math.min(falta, CUPO.ventanaMs))
      }
      function despachar(it) {
        var requestId = 'req-' + ++seq
        pending[requestId] = function (d) {
          if (!(d && d.errorCode === 'rate_limited')) return it.resolve(d)
          // El espejo local no ve lo que el host cobra por su cuenta —los pongs del
          // watchdog, el alto del panel—, asi que un rechazo sigue siendo posible.
          frenoHasta = Date.now() + 1000
          // Solo reintenta lo del usuario. Una lectura del sondeo ya tiene su memoria
          // y la vuelta siguiente la vuelve a pedir; reintentarlas en manada era lo
          // que dejaba el clic esperando detras de catorce lecturas.
          if (!it.usuario || Date.now() >= it.vence) return it.resolve(d)
          it.espera = Math.min((it.espera || 300) * 2, 2500)
          it.desde = Date.now() + it.espera
          encolar(it)
        }
        // Origen opaco: '*' es el unico targetOrigin usable; el host valida la ventana.
        window.parent.postMessage(
          { type: 'orca-panel-action', requestId: requestId, action: it.action,
            params: it.params }, '*')
      }
      function drenar() {
        if (colaTimer) { clearTimeout(colaTimer); colaTimer = null }
        var ahora = Date.now()
        while (cola.length) {
          var it = cola[0]
          if (it.vence <= ahora) { cola.shift(); it.resolve(RECHAZADO); continue }
          if (it.usuario ? (it.desde || 0) > ahora
                         : (ahora < frenoHasta || !hayLugarDeSondeo())) break
          cola.shift()
          // Se cuenta el sondeo y no el clic: el espejo esta para que las lecturas de
          // fondo no se coman la ventana, no para adivinar la cuenta exacta del host
          // —que cobra ademas sus pongs y el alto del panel, invisibles desde aca—. Un
          // clic que igual sea rechazado se reintenta; uno frenado aca no se reintenta
          // nunca, porque nadie lo mando.
          if (!it.usuario) gastados.push(ahora)
          despachar(it)
        }
        if (cola.length) colaTimer = setTimeout(drenar, proximoHueco())
      }
      function encolar(it) {
        // El clic va antes que el sondeo: una vuelta de lecturas no puede dejar
        // esperando lo que el usuario acaba de apretar.
        var i = cola.length
        if (it.usuario) { i = 0; while (i < cola.length && cola[i].usuario) i++ }

      function call(action, params, usuario) {

          encolar({ action: action, params: params, usuario: !!usuario,

        if (!d || d.type !== 'orca-panel-action-result') return
        var resolve = pending[d.requestId]
        if (!resolve) return
        delete pending[d.requestId]
        resolve(d)
      })

      // `null` es lo que hacia parpadear el panel: con la vuelta costando 19 de los 30
      // mensajes por 10 s, la COLA del lote volvia `rate_limited`, y con `syncMinutes`
      // ahi adentro el select volvia a su defecto.
      var SIN_RESPUESTA = { sinRespuesta: true }

      function stored(result) {
        if (!result || !result.ok) return SIN_RESPUESTA

        return result.value.value === undefined ? null : result.value.value

      // defecto: sin respuesta el panel no sabe nada nuevo, y no saber no es "vacio".
      var ultimaLectura = {}
      // CUANDO fue la ultima vez que el host contesto por esa clave. Repintar el valor
      // memorizado esta bien para un select o una lista -el dato de hace un rato sigue
      // siendo el ultimo que se sabe-, pero NO para decidir si un QR vencio: eso es una
      // afirmacion sobre AHORA, y el valor memorizado llega indistinguible de uno
      // fresco (`hayRespuesta` da true igual, porque es un objeto normal). Con el reloj
      // avanzando y el `qr.ts` congelado, el panel se clavaba en 'expired' para siempre
      // y no salia solo, porque nada invalida el memorizado. Quien decide algo sensible
      // al tiempo tiene que poder preguntar de cuando es el dato.
      var lecturaFrescaAt = {}
      function read(key, usuario) {
        return call('storage.get', { key: key }, usuario).then(function (r) {
          var v = stored(r)
          if (hayRespuesta(v)) {

      function edadLectura(key) {
        var at = lecturaFrescaAt[key]

      function write(key, value) {
        return call('storage.set', { key: key, value: value }, true)
      }

          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      }

      }

        // Lo de antes de T9 paso al numero de su linea (bin/wa-read, `cmd_doctor`).
        'store-rekeyed': 'hStoreRekeyed',
        // Lo de antes que NO se pudo atribuir con certeza: pide una decision (T9f).
        'store-rekey-pending': 'hStoreRekeyPending',
        unknown: 'hUnknown'
      }
      // Aca solo entran codigos cuyo detalle es una FRASE. Un detalle que es dato crudo
      // —una ruta, un tamano, el error de un proceso— no se traduce: se muestra.
      var HEALTH_HOW_KEY = {
        'no-transport': 'hNoTransportHow',
        'transport-silent': 'hTransportSilentHow',
        'transcribe-missing-tool': 'howTranscribeMissingTool',
        'transcribe-unknown': 'howTranscribeUnknown',
        'transcribe-orca-outdated': 'howTranscribeOrcaOutdated',
        'transcribe-no-engine': 'howTranscribeNoEngine',
        'transcribe-no-model': 'howTranscribeNoModel',
        'retention-evicted': 'howRetentionEvicted',
        'store-migrated-dropped': 'howStoreMigratedDropped',
        // Una subida que no borro ningun mensaje (T10): decir "se borro" asustaba.
        'store-migrated-clean': 'howStoreMigratedClean',
        'store-rekeyed-line': 'howStoreRekeyedLine',
        'store-rekey-decide': 'howStoreRekeyDecide'
      }
      function porCodigo(mapa, code, respaldo) {
        var key = mapa[code]
        return key ? t(key) : (respaldo || '')
      }

      // Los motivos de "sesion caida" pueden venir del WORKER -que el sidecar no
      // arranco, o que se cayo estando vivo- o del propio SIDECAR -su `MOTIVO`,
      // sidecar/src/index.js-, porque el worker los espeja tal cual. Una sola tabla
      // para los dos, igual que HEALTH_KEY hace con el CLI.
      var SIDECAR_HOW_KEY = {
        'sidecar-sin-authdir': 'pairingHowNoAuthDir',
        // Tres codigos y no uno porque el arreglo es distinto en cada uno: aprobar el
        // plugin, mirar donde guarda Orca sus datos, o leer el log. Mandarlos todos a
        // `pairingHowNoAuthDir` le decia a quien tenia el plugin sin aprobar que
        // buscara una carpeta que estaba perfecta.
        'sidecar-sin-permiso': 'pairingHowNoPermission',
        'sidecar-authdir-fallo': 'pairingHowAuthDirFailed',
        'sidecar-no-arranco': 'pairingHowNoStart',
        'sidecar-cayo': 'pairingHowCrashed',
        'sesion-cerrada': 'pairingHowLoggedOut',
        // Los tres cierres que el sidecar reintenta un poco y despues no
        // (`decidirTrasCierre`): cada uno con lo que el dueno tiene que hacer.
        'sesion-reemplazada': 'pairingHowReplaced',
        'acceso-denegado': 'pairingHowForbidden',
        multidispositivo: 'pairingHowMultidevice',
        'sin-sesion': 'pairingHowNoAuthDir',
        'socket-caido': 'pairingHowSocketDown',
        'reinicio-requerido': 'pairingHowRestart',
        desconocido: 'pairingHowUnknown',
        // Varias lineas a la vez: lo que el worker contesta sobre una linea.
        'sin-lineas': 'linesHowNoLines',
        'linea-desconocida': 'linesHowUnknown',
        'tipo-no-disponible': 'linesHowTypeLater',
        'tipo-invalido': 'linesHowTypeLater'
      }

      // El permiso y el servicio se guardan con estos valores y no se traducen nunca en
      // el storage; lo que se traduce es como se leen. La tabla decia el valor crudo
      // mientras el select de al lado ya lo decia en el idioma del usuario: dos formas
      // de nombrar lo mismo en la misma pantalla.
      var MODE_KEY = { off: 'modeOff', observar: 'modeObserve', borrador: 'modeDraft',
                       responder: 'modeReply' }
      var PROV_KEY = { ninguno: 'provNone', plane: 'provPlane', linear: 'provLinear',
                       github: 'provGithub' }

      // Se muestran los requisitos que el usuario puede activar, con su accion.
      // Separados de la alerta a proposito: una funcion que falta no es una rotura.
      function renderOpcionales(lista) {
        var caja = el('opcionales')
        if (!lista || !lista.length) { caja.hidden = true; caja.innerHTML = ''; return }
        caja.innerHTML = '<p class="hint" style="margin:0 0 4px">' + t('optionalTitle') +
          '</p>' + lista.map(function (o) {
            return '<div class="opcional"><span>\u25CB</span><span><b>' +
              esc(porCodigo(HEALTH_KEY, o.code, o.que)) + '</b> &mdash; <code>' +
              esc(porCodigo(HEALTH_HOW_KEY, o.howCode, o.como)) + '</code></span></div>'
          }).join('')
        caja.hidden = false
      }

      // Cuanto puede tardar un latido antes de darlo por ido. El worker late cada 5 s
      // y una llamada a la CLI de Orca lo puede tener ocupado 30: por debajo de eso se
      // marcaria muerto a un worker que solo estaba trabajando.
      var LATIDO_VENCE_MS = 30000

      /** Si no hay nadie corriendo, y decirlo. Devuelve true cuando tomo el aviso.
       *
       *  `null` es "el worker nunca escribio": o no arranco nunca, o Orca no lo arranco
       *  porque el plugin espera aprobacion. Es el caso que se veia como un silencio de
       *  45 s indistinguible de una maquina lenta. SIN_RESPUESTA es otra cosa —el host
       *  no contesto— y ahi no se afirma nada. */
      /** Apaga lo que NECESITA al worker. Guardar no: el valor queda escrito y se
       *  aplica cuando el worker arranque. Lo que se apaga es lo que deja un pedido
       *  esperando respuesta — apretarlo sin nadie del otro lado es el silencio de 45 s
       *  que este aviso viene justamente a reemplazar. */
      function apagarLoQueNecesitaWorker(sinWorker) {
        // Desvincular y reintentar dejan un pedido que solo el worker puede atender: sin
        // nadie del otro lado son el mismo silencio de 45 s que este aviso reemplaza.
        var dependen = ['sync-retry', 'pairing-unlink', 'pairing-retry', 'jev-save-key',
          'jev-remove-key', 'jev-use-saved', 'jev-enabled', 'chat-fetch']
        dependen.forEach(function (id) {
          var b = el(id)
          if (b) b.disabled = !!sinWorker
        })
      }

      // Lo unico que se sabe con certeza del worker: si el ultimo latido lo dice VIVO
      // o AUSENTE. `null` es "todavia no se sabe" (antes del primer `pintarLatido`) y
      // no se afirma nada en ese caso — no saber no es lo mismo que saber que no esta.
      // Lo usa `pairingDiagnostico` para decir, en la vinculacion, si el plugin
      // contesta o no — sin repetir el aviso grande de `workerGone`, que ya esta en
      // pantalla, y sin inventar una causa que este latido no prueba.
      var workerAusente = null

      function pintarLatido(beat) {
        if (!hayRespuesta(beat)) return false
        if (!beat || typeof beat !== 'object' || !beat.at) {
          workerAusente = true
          showAlert(esc(t('workerGone')), esc(t('workerGoneHow')),
            esc(t('workerGoneWhy')))
          return true
        }
        var edad = Date.now() - Date.parse(beat.at)
        if (!(edad >= 0) || edad <= LATIDO_VENCE_MS) { workerAusente = false; return false }
        workerAusente = true
        showAlert(esc(t('workerStale')),
          esc(fmt('workerStaleHow', { s: Math.round(edad / 1000) })))
        return true
      }

      function showAlert(what, how, why) {
        el('alert').innerHTML = '<span>&#9888;</span><span><b>' + what + '</b>' +
          (how ? ' <span>' + how + '</span>' : '') +
          (why ? '<span class="alert-why">' + why + '</span>' : '') + '</span>'
        el('alert').hidden = false
      }

      // ---------- grupos de botones (T17) ----------
      // La lista de un select nativo no se abre en el panel de Orca: el iframe tiene
      // sandbox y Electron no dibuja el desplegable (el plugin hermano lo documenta en
      // orca-jev-advisor-dev/adapters/orca/panels/config.html). Con pocas opciones, un
      // grupo de botones con `aria-pressed`; el valor viaja en `data-value`, el mismo que
      // escribia el select.
      function apretar (boton, si) {
        boton.setAttribute('aria-pressed', si ? 'true' : 'false')
      }
      function valorSeg (id) {
        var on = el(id).querySelector('button[aria-pressed="true"]')
        return on ? on.getAttribute('data-value') : ''
      }
      /** Deja el grupo mostrando lo que rige. La terminal puede fijar un valor que el
       *  grupo no ofrece (`wa-scope config inbox_days 45`): se agrega un boton con ese
       *  valor tal cual, porque un grupo sin ninguno apretado miente sobre lo que rige. */
      function ponerSeg (id, valor, porDefecto) {
        var grupo = el(id)
        var v = valor === null || valor === undefined || valor === '' ? porDefecto : String(valor)
        var botones = grupo.querySelectorAll('button')
        var hay = Array.prototype.some.call(botones, function (b) {
          return b.getAttribute('data-value') === v
        })
        if (!hay) {
          var b = document.createElement('button')
          b.type = 'button'
          b.setAttribute('data-value', v)
          b.textContent = v
          grupo.appendChild(b)
          cablearBoton(grupo, b)
          botones = grupo.querySelectorAll('button')
        }
        Array.prototype.forEach.call(botones, function (x) {
          apretar(x, x.getAttribute('data-value') === v)
        })
      }
      function cablearBoton (grupo, b) {
        b.addEventListener('click', function () {
          Array.prototype.forEach.call(grupo.querySelectorAll('button'), function (x) {
            apretar(x, x === b)
          })
          // Un `change` del grupo, como el del select: lo escuchan la marca de "sucio" y
          // quien muestra la descripcion de lo elegido.
          grupo.dispatchEvent(new Event('change'))
        })
      }
      Array.prototype.forEach.call(document.querySelectorAll('.seg'), function (grupo) {
        Array.prototype.forEach.call(grupo.querySelectorAll('button'), function (b) {
          apretar(b, false)
          cablearBoton(grupo, b)
        })
      })

      // ---------- que puede pisar el sondeo, y que no ----------
      // El sondeo LEE y PINTA en dos momentos distintos: sus lecturas se contestan con
      // lo que hay, y recien pinta cuando llega la ultima — `chats` son 52 KB y es
      // siempre la ultima. Un guardado que aterriza en ese hueco queda pisado por el
      // valor de ANTES, y el usuario ve su eleccion deshacerse sola. Medido sobre el
      // interruptor de fuentes que ya no existe: guardado en on, select en off 700 ms
      // despues.
      //
      // Dos guardias, porque son dos carreras distintas:
      //  - `sucios`: lo que el usuario cambio y todavia no guardo. Sin esto el repintado
      //    le deshace la eleccion ANTES del clic, y el boton manda el valor viejo: una
      //    accion con un valor que el usuario no vio.
      //  - `guardadoSeq`: el sello de la lectura. Una pintura cuyo sello quedo atras
      //    nacio de una lectura anterior al guardado y no puede pisarlo.
      var sucios = {}
      var guardadoSeq = 0
      function vigente (s) { return s === undefined || s === guardadoSeq }
      function ensuciar (id) {
        var marcar = function () { sucios[id] = true }
        el(id).addEventListener('input', marcar)
        el(id).addEventListener('change', marcar)
      }

      // Que control pinta cada clave y con que valor cuando no hay nada guardado. Una
      // sola tabla para el sondeo y para la relectura del guardado: dos listas se
      // desincronizan y una de las dos termina pintando otra cosa.
      var CONTROLES = {
        agentName: ['agent', ''],
        tone: ['tone', ''],
        ownerName: ['owner', ''],
        transcribe: ['transcribe', 'local'],
        transcribeLang: ['lang', 'auto'],
        transcribeQuality: ['quality', 'optima'],
        // 7 dias y no 1: una mencion del viernes tiene que seguir a la vista el lunes.
        inboxDays: ['inbox-days', '7'],
        syncMinutes: ['sync-minutes', '5'],
        ackMode: ['ack-mode', 'on'],
        ackText: ['ack-text', ''],
        // Los minutos sin acuse despues de que la linea escribio en el chat (0 = siempre sale).
        ackQuietMinutes: ['ack-quiet', '30'],
        greetingMode: ['greeting-mode', 'on'],
        greetingText: ['greeting-text', ''],
        botClaudeAccount: ['bot-account', 'auto'],
        // La meta del primer contacto, en minutos (informes-tablero, I4).
        slaMinutes: ['sla-minutes', '15'],
        // Cuantas horas espera la pregunta "A o B?" a quien escribio (proyectos-por-chat, M5).
        projectQuestionHours: ['pq-hours', '24']
      }
      Object.keys(CONTROLES).forEach(function (k) { ensuciar(CONTROLES[k][0]) })

      /** El valor que muestra un control de la tabla, sea campo o grupo de botones. */
      function valorDe (id) {
        var n = el(id)
        return n.classList.contains('seg') ? valorSeg(id) : n.value.trim()
      }

      // ---------- el ritmo del triage en Orca (ritmo-triage) ----------
      var minutosGuardados = null
      var ritmoTriage = null
      var ETIQUETA_RITMO = { 2: 'sync2', 5: 'sync5', 10: 'sync10', 15: 'sync15', 30: 'sync30',
                             60: 'sync60' }
      /** Lo que el worker dijo que dejo en Orca, frente a lo guardado en el selector. Sin
       *  lo que dijo el worker no se afirma nada. */
      function pintarRitmo () {
        var linea = el('triage-pace')
        var r = ritmoTriage
        if (!r || typeof r !== 'object' || typeof r.minutes !== 'number') {
          linea.hidden = true
          return
        }
        var guardado = parseInt(String(minutosGuardados || '5'), 10)
        var texto
        var mal = false
        if (!r.ok) {
          mal = true
          texto = t(r.code === 'sin-triage' ? 'triagePaceMissing' : 'triagePaceFail')
        } else if (guardado !== r.minutes) {
          texto = t('triagePacing')
        } else {
          var etiqueta = ETIQUETA_RITMO[r.minutes] ? t(ETIQUETA_RITMO[r.minutes]) : r.minutes + ' min'
          texto = t('triagePace').replace('{ritmo}', etiqueta)
        }
        linea.textContent = texto
        linea.className = mal ? 'hint mal' : 'hint'
        linea.hidden = false
      }

      // ---------- el primer mensaje (Beta) ----------
      // UNA clave, `firstReply`: { mode, fallbackMinutes, everyMinutes, max }, en texto como
      // el resto de los ajustes. Lo que falta o no sirve se pinta con el de fabrica.
      var PRIMER_DEFECTO = { mode: 'ack', fallbackMinutes: '5', everyMinutes: '10', max: '3' }
      var PRIMER_MODOS = ['ack', 'model', 'model_with_ack_fallback']
      var PRIMER_NUMEROS = [['fallbackMinutes', 'fr-fallback', 1, 60],
        ['everyMinutes', 'fr-every', 1, 120], ['max', 'fr-max', 1, 10]]
      var PRIMER_IDS = ['first-reply', 'fr-fallback', 'fr-every', 'fr-max']
      PRIMER_IDS.forEach(ensuciar)
      function pintarPrimer (valor, s) {
        if (!hayRespuesta(valor) || !vigente(s)) return
        var v = valor && typeof valor === 'object' ? valor : {}
        if (!sucios['first-reply'] && !el('first-reply').contains(document.activeElement)) {
          ponerSeg('first-reply', PRIMER_MODOS.indexOf(v.mode) !== -1 ? v.mode : 'ack', 'ack')
        }
        PRIMER_NUMEROS.forEach(function (n) {
          if (sucios[n[1]] || document.activeElement === el(n[1])) return
          var x = v[n[0]]
          el(n[1]).value = x !== undefined && x !== null && String(x).trim() !== ''
            ? String(x) : PRIMER_DEFECTO[n[0]]
        })
        pintarPrimerVista()
      }
      /** Lo que la tarjeta guardaria, o null si un numero esta fuera de su rango. */
      function primerDelFormulario () {
        var salida = { mode: valorSeg('first-reply') || 'ack' }
        var bien = true
        PRIMER_NUMEROS.forEach(function (n) {
          var texto = el(n[1]).value.trim() || PRIMER_DEFECTO[n[0]]
          var x = Number(texto)
          if (!/^\d+$/.test(texto) || x < n[2] || x > n[3]) bien = false
          salida[n[0]] = String(x)
        })
        return bien ? salida : null
      }
      /** Los numeros solo cuando cuentan, y el aviso solo en `model` (sin respaldo). */
      function pintarPrimerVista () {
        var modo = valorSeg('first-reply') || 'ack'
        el('fr-nums').hidden = modo === 'ack'
        el('fr-fallback-row').hidden = modo !== 'model_with_ack_fallback'
        el('first-reply-warn').hidden = modo !== 'model'
        el('chat-first-reply-warn').hidden = valorSeg('chat-first-reply') !== 'model'
      }
      el('first-reply').addEventListener('change', pintarPrimerVista)
      el('chat-first-reply').addEventListener('change', pintarPrimerVista)
      ponerSeg('first-reply', 'ack', 'ack')
      PRIMER_NUMEROS.forEach(function (n) { el(n[1]).value = PRIMER_DEFECTO[n[0]] })

      function pintarClave (key, valor, s) {
        if (key === 'firstReply') return pintarPrimer(valor, s)
        if (key === 'orcaNotices') return pintarOrca(valor, s)
        var c = CONTROLES[key]
        if (!c || !hayRespuesta(valor) || !vigente(s) || sucios[c[0]]) return
        var n = el(c[0])
        // `contains` y no `===`: en un grupo el foco queda en uno de sus botones.
        if (n.contains(document.activeElement)) return
        if (n.classList.contains('seg')) ponerSeg(c[0], valor, c[1])
        else n.value = typeof valor === 'string' ? valor : c[1]
        if (key === 'agentName') nombreAgente = typeof valor === 'string' ? valor : ''
      }

      /** Guarda y deja el control mostrando lo que quedo GUARDADO.
       *
       *  `pares` es [[clave, valor]]. Devuelve las claves que el host rechazo.
       *
       *  Se RELEE en vez de dar por bueno lo que se mando: afirmar el valor optimista
       *  hace que un host que guarde otra cosa no se note nunca. Y el sello se toma
       *  antes de escribir, asi que el sondeo que ya estaba en vuelo no puede pintar
       *  encima el valor de antes. */
      function guardar (pares) {
        var s = ++guardadoSeq
        return Promise.all(pares.map(function (p) {
          return write(p[0], p[1]).then(function (r) {
            var bien = !!(r && r.ok)
            var c = CONTROLES[p[0]]
            if (bien && c) delete sucios[c[0]]
            return { key: p[0], ok: bien }
          })
        })).then(function (rs) {
          var buenas = rs.filter(function (r) { return r.ok })
          return Promise.all(buenas.map(function (r) {
            return read(r.key, true).then(function (v) { return [r.key, v] })
          })).then(function (leidos) {
            if (s === guardadoSeq) {
              leidos.forEach(function (x) { pintarClave(x[0], x[1]) })
            }
            return rs.filter(function (r) { return !r.ok }).map(function (r) { return r.key })
          })
        })
      }

      // ---------- un guardar por tarjeta (T17) ----------
      // Antes eran diez botones, uno por campo, y el dueno no sabia cual habia apretado.
      // Cada tarjeta guarda TODOS sus campos con un clic: escribir uno que no cambio es
      // inofensivo, y olvidar uno que si cambio era el defecto.
      var nombreAgente = ''
      function guardarTarjeta (boton, saidId, claves) {
        var pares = claves.map(function (k) { return [k, valorDe(CONTROLES[k][0])] })
        return busy(boton, guardar(pares).then(function (mal) {
          said(saidId, mal.length ? t('saveFailed') : '✓ ' + t('savedOk'), !!mal.length)
          pintarChecklist()
        }))
      }

      // El nombre del agente firma cada mensaje y no puede quedar vacio. El dueno (su
      // nombre) y el tono si: vacios, el prompt usa los de fabrica.
      el('save-agent').addEventListener('click', function (event) {
        if (!el('agent').value.trim()) { said('said-agent', t('needName'), true); return }
        guardarTarjeta(event.currentTarget, 'said-agent', ['agentName', 'ownerName', 'tone'])
      })
      el('save-bot-account').addEventListener('click', function (event) {
        guardarTarjeta(event.currentTarget, 'said-bot-account', ['botClaudeAccount'])
      })
      el('bot-account-refresh').addEventListener('click', function (event) {
        leerCuentasBot(event.currentTarget)
      })

      // ---------- la cuenta de Claude del bot ----------
      // Las cuentas las lee el worker (`orca account list`): el panel no ejecuta nada. Se
      // piden al abrir la pestana Agente y con su boton, nunca en el sondeo: cada pedido
      // es un viaje al worker. La guardada que Orca ya no lista se muestra igual, apretada
      // y dicha: un grupo sin nada apretado mentiria sobre lo que rige.
      var cuentasBot = []
      var cuentasLeyendo = false
      function opcionCuenta (valor, nombre, nota) {
        var b = document.createElement('button')
        b.type = 'button'
        b.setAttribute('data-value', valor)
        var n = document.createElement('span')
        n.className = 'cuenta-nombre'
        n.textContent = nombre
        b.appendChild(n)
        if (nota) {
          var m = document.createElement('span')
          m.className = 'cuenta-nota'
          m.textContent = nota
          b.appendChild(m)
        }
        return b
      }
      function pintarCuentasBot (guardada, leidas) {
        var grupo = el('bot-account')
        var elegida = sucios['bot-account'] ? valorSeg('bot-account') : guardada
        grupo.textContent = ''
        var opciones = [opcionCuenta('auto', t('botAccountAuto'), t('botAccountAutoHint'))]
        var ids = { auto: true }
        cuentasBot.forEach(function (c) {
          var notas = []
          if (!c.authenticated) notas.push(t('botAccountNoSession'))
          if (c.active) notas.push(t('botAccountActive'))
          if (typeof c.used === 'number') notas.push(fmt('botAccountUsed', { n: c.used }))
          opciones.push(opcionCuenta(c.id, c.email || c.id, notas.join(' · ')))
          ids[c.id] = true
        })
        if (guardada && !ids[guardada]) {
          // Sin la lista no se sabe si Orca la tiene: no se dice que falta.
          opciones.push(opcionCuenta(guardada, guardada, leidas ? t('botAccountMissing') : ''))
        }
        opciones.forEach(function (b) {
          grupo.appendChild(b)
          cablearBoton(grupo, b)
        })
        ponerSeg('bot-account', elegida || 'auto', 'auto')
      }
      function leerCuentasBot (boton) {
        if (cuentasLeyendo) return
        cuentasLeyendo = true
        el('bot-account-status').textContent = t('botAccountLoading')
        var pedir = Promise.all([
          read('botClaudeAccount', true),
          pedirAlWorker('scopeRequest', 'scopeResult', { action: 'cuentas-claude' })
        ]).then(function (rs) {
          var guardada = hayRespuesta(rs[0]) && typeof rs[0] === 'string' && rs[0] ? rs[0] : 'auto'
          var v = rs[1]
          var leidas = !!(v && v.ok === true && Array.isArray(v.accounts))
          if (leidas) {
            cuentasBot = v.accounts.filter(function (c) {
              return c && typeof c.id === 'string' && c.id
            })
            el('bot-account-status').textContent = cuentasBot.length ? '' : t('botAccountNone')
          } else {
            el('bot-account-status').textContent = t('botAccountFail')
          }
          pintarCuentasBot(guardada, leidas)
        }, function () {
          el('bot-account-status').textContent = t('botAccountFail')
        }).then(function () { cuentasLeyendo = false })
        return boton ? busy(boton, pedir) : pedir
      }

      el('save-voice').addEventListener('click', function (event) {
        guardarTarjeta(event.currentTarget, 'said-voice',
          ['transcribe', 'transcribeLang', 'transcribeQuality'])
      })
      // El silencio del acuse: un entero de 0 a 240, el mismo rango que valida wa-scope. Fuera
      // de rango no se guarda nada de la tarjeta y se dice.
      var SILENCIO_MIN = 0, SILENCIO_MAX = 240
      el('ack-quiet').value = CONTROLES.ackQuietMinutes[1]
      el('save-auto').addEventListener('click', function (event) {
        var primer = primerDelFormulario()
        if (!primer) { said('said-auto', t('frRange'), true); return }
        var silencio = el('ack-quiet').value.trim()
        if (!/^\d+$/.test(silencio) || Number(silencio) < SILENCIO_MIN ||
            Number(silencio) > SILENCIO_MAX) {
          said('said-auto', t('ackQuietRange'), true)
