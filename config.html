      function idSinDispositivo(jid) {
        var t = String(jid || '')
        var i = t.indexOf('@')
        if (i <= 0) return ''
        return t.slice(0, i).split(':')[0] + t.slice(i)
      }
      function listaDeDuenos(lista) {
        var vistos = {}
        return (Array.isArray(lista) ? lista : []).filter(function (d) {
          var id = d && idSinDispositivo(d.id)
          if (!id || vistos[id]) return false
          vistos[id] = true
          return true
        }).map(function (d) {
          return { id: idSinDispositivo(d.id), name: typeof d.name === 'string' ? d.name : '' }
        })
      }
      function duenosVisibles() { return duenosEnEdicion || duenosGuardados }
      function renderOwners(lista) {
        duenosGuardados = listaDeDuenos(lista)
        if (!duenosEnEdicion) pintarDuenos()
        // Un numero de confianza se ve fijo en las personas de cada conversacion.
        pintarPersonas()
      }
      function renderSenders(lista) {
        remitentes = Array.isArray(lista) ? lista.filter(function (r) {
          return r && typeof r.id === 'string' && r.id.indexOf('@') > 0
        }) : []
        comboDuenos.refrescar()
      }
      function pintarDuenos() {
        var lista = duenosVisibles()
        var caja = el('owners-wrap')
        pintarNumero()
        if (!lista.length) {
          caja.innerHTML = '<p class="empty">' + esc(t('ownersEmpty')) + '</p>'
          return
        }
        caja.innerHTML = '<table><tbody>' + lista.map(function (d) {
          return '<tr><td>' + esc(d.name || d.id) + '<span class="owner-id">' + esc(d.id) +
            '</span></td><td class="acts"><button class="link" data-orm="' + escAttr(d.id) +
            '">' + t('remove') + '</button></td></tr>'
        }).join('') + '</tbody></table>'
        Array.prototype.forEach.call(caja.querySelectorAll('[data-orm]'), function (b) {
          b.addEventListener('click', function () {
            duenosEnEdicion = duenosVisibles().filter(function (d) { return d.id !== b.dataset.orm })
            pintarDuenos()
          })
        })
      }
      /** Las personas que se pueden elegir: quienes escribieron y los chats directos, sin
       *  los grupos, sin el chat de la linea consigo misma (ya es del dueno) y sin las ya
       *  elegidas. */
      function candidatosDeDueno() {
        var porId = {}
        var orden = []
        function sumar(id, nombre, sub) {
          id = idSinDispositivo(id)
          if (!id || /@g\.us$/.test(id)) return
          if (!porId[id]) { porId[id] = { id: id, name: '', subs: [] }; orden.push(id) }
          if (!porId[id].name && nombre) porId[id].name = nombre
          if (sub && porId[id].subs.indexOf(sub) === -1) porId[id].subs.push(sub)
        }
        remitentes.forEach(function (r) {
          var chats = Array.isArray(r.chats) ? r.chats.filter(Boolean).slice(0, 3) : []
          sumar(r.id, r.name, chats.length ? t('ownersSeenIn').replace('{chats}', chats.join(', ')) : '')
        })
        chatsTodos.forEach(function (c) {
          if (c.kind === 'directo' && !c.own) sumar(c.jid, c.name, t('ownersDirect'))
        })
        var elegidos = {}
        duenosVisibles().forEach(function (d) { elegidos[d.id] = true })
        return orden.filter(function (id) { return !elegidos[id] }).map(function (id) { return porId[id] })
      }
      var comboDuenos = crearCombo({
        input: 'owner-search', lista: 'owner-list',
        opciones: function (terminos) {
          var todos = candidatosDeDueno()
          if (!todos.length) return { items: [], vacio: t('ownersNoCandidates') }
          var visibles = terminos.length ? todos.filter(function (c) {
            var texto = aplanar(c.name + ' ' + c.id)
            return terminos.every(function (x) { return texto.indexOf(x) !== -1 })
          }) : todos
          if (!visibles.length) return { items: [], vacio: t('ownersNoMatch') }
          return { items: visibles.map(function (c) {
            return { value: c.id, nombre: c.name || c.id, real: c.name,
              kind: t('ownersKindContact'), sub: c.subs.join(' · ') }
          }) }
        },
        elegir: function (item) {
          duenosEnEdicion = duenosVisibles().concat([{ id: item.value, name: item.real || '' }])
          el('owner-search').value = ''
          pintarDuenos()
        }
      })
      // ---------- el numero de aprobacion (T14) ----------
      // Uno de los numeros de confianza, o ninguno: ahi escribe el plugin cuando un caso
      // espera al dueno, y de ahi lee lo que contesta. Nunca se escribe a mano. Si sale de
      // la lista de confianza, el selector vuelve a "No avisar" y guardar lo apaga.
      var numeroGuardado = ''
      var numeroEnEdicion = null
      function numeroVisible() {
        var v = numeroEnEdicion !== null ? numeroEnEdicion : numeroGuardado
        return duenosVisibles().some(function (d) { return d.id === v }) ? v : ''
      }
      function renderApproval(valor) {
        numeroGuardado = typeof valor === 'string' ? idSinDispositivo(valor) : ''
        if (numeroEnEdicion === null) pintarNumero()
      }
      function pintarNumero() {
        var grupo = el('approval-number')
        var actual = numeroVisible()
        var opciones = [{ id: '', name: t('approvalNumberOff') }].concat(duenosVisibles())
        grupo.innerHTML = opciones.map(function (d) {
          return '<button type="button" data-value="' + escAttr(d.id) + '">' +
            esc(d.name || d.id) + '</button>'
        }).join('')
        Array.prototype.forEach.call(grupo.querySelectorAll('button'), function (b) {
          apretar(b, b.getAttribute('data-value') === actual)
          cablearBoton(grupo, b)
        })
        pintarAvisoNumero()
        pintarOrcaNumero()
      }
      /** Un numero cuyo chat no esta en Automatico no recibe los avisos ni manda las
       *  respuestas: `wa-send` solo escribe ahi, y el almacen solo guarda lo de ahi. */
      function pintarAvisoNumero() {
        var v = numeroVisible()
        var entrada = v && alcancePorJid ? alcancePorJid[v] : null
        var aviso = el('approval-warn')
        aviso.textContent = t('approvalWarn')
        aviso.hidden = !v || !!(entrada && entrada.mode === 'responder')
      }
      el('approval-number').addEventListener('change', function () {
        numeroEnEdicion = valorSeg('approval-number')
        pintarAvisoNumero()
      })
      el('save-owners').addEventListener('click', function (event) {
        var lista = duenosVisibles().slice()
        var numero = numeroVisible()
        busy(event.currentTarget, write('owners', lista).then(function (r) {
          if (r && r.ok === false) return r
          // El idioma del panel viaja con el numero: es en el que salen los avisos.
          return write('approvalNumber', numero).then(function (r2) {
            if (r2 && r2.ok === false) return r2
            return write('approvalLang', LANG)
          })
        }).then(function (r) {
          if (r && r.ok === false) { said('said-owners', t('saveFail'), true); return }
          duenosGuardados = lista
          duenosEnEdicion = null
          numeroGuardado = numero
          numeroEnEdicion = null
          pintarDuenos()
          said('said-owners', '✓ ' + t('ownersSaved'))
        }))
      })
      pintarDuenos()

      // ---------- reglas de ruteo ----------
      function renderRoutes(rules) {
        rules = rules || []
        reglasCrudas = rules
        el('routes-legacy-help').hidden = !rules.some(function (r) { return r && !r.workspace })
        if (!rules.length) {
          el('routes-wrap').innerHTML = '<p class="empty">' + t('noRoutes') + '</p>'
          return
        }
        el('routes-wrap').innerHTML =
          '<table><thead><tr><th>' + t('colWhen') + '</th><th>' + t('colGoes') +
          '</th><th></th></tr></thead><tbody>' +
          rules.map(function (r, i) {
            // Una regla de antes (sin proyecto) se sigue viendo con su destino viejo y
            // MARCADA como vieja: ya no se usa, pero borrarla callado seria perder lo que
            // el dueno configuro, y sin la marca no sabria que esta no hace nada.
            var vieja = !r.workspace
            return '<tr' + (vieja ? ' class="vieja"' : '') + '><td>' + esc(r.pattern) +
              '</td><td>' +
              (vieja ? esc(porCodigo(PROV_KEY, r.provider || 'plane', r.provider)) + ' / ' +
                  esc(r.target || '—') + '<span class="legacy">' + esc(t('routeLegacy')) +
                  '</span>'
                : nombreDeProyecto(r.workspace)) + '</td>' +
              '<td class="acts"><button class="link" data-rrm="' + i + '">' +
              t('remove') + '</button></td></tr>'
          }).join('') + '</tbody></table>'

        Array.prototype.forEach.call(el('routes-wrap').querySelectorAll('[data-rrm]'), function (b) {
          b.addEventListener('click', function () {
            var gone = rules[Number(b.dataset.rrm)]
            if (gone) removeRoute(gone.pattern, b)
          })
        })
      }

      var ROUTE_HOW_KEY = {
        'sin-herramientas': 'syncNoTools',
        'sin-permiso': 'syncNoPerm',
        'patron-invalido': 'routeRmBadPattern'
      }

      /** Quitar una regla de texto. NO la borra el panel: se la pide al worker.
       *
       *  Las reglas creadas con el CLI viven en `scope.db` y cada sync las vuelve a empujar
       *  al `routes` del panel: borrar solo de ahi las dejaba reaparecer ("plane / ATTUS
       *  regla vieja" no se iba nunca). `wa-scope route --remove` borra la de la base y el
       *  worker, la del storage. Y no se dice nada hasta que contesta: el veredicto que
       *  llega antes que el trabajo no es un veredicto. */
      function removeRoute (pattern, boton) {
        var pedir = pedirAlWorker('scopeRequest', 'scopeResult',
          { action: 'regla-quitar', pattern: pattern }).then(function (v) {
          if (!v) { said('said-route', t('pairingNoAnswer'), true); return }
          if (!v.ok) {
            said('said-route', porCodigo(ROUTE_HOW_KEY, v.code, '') || t('routeRmFail'), true)
            return
          }
          said('said-route', '✓ ' + t('removedOk') + ': ' + pattern)
          // El worker ya dejo el storage sin la regla: se relee y se repinta con eso, no
          // con la copia de antes, que la dejaria en pantalla.
          return read('routes', true).then(function (v2) {
            if (hayRespuesta(v2)) renderRoutes(v2 || [])
          })
        })
        return boton ? busy(boton, pedir) : pedir
      }

      el('save-route').addEventListener('click', function (event) {
        var match = el('r-match').value.trim().toLowerCase()
        var workspace = el('r-workspace').value
        if (!match || !workspace) { said('said-route', t('needMatch'), true); return }
        busy(event.currentTarget, read('routes').then(function (rules) {
          rules = (rules || []).filter(function (r) { return r.pattern !== match })
          rules.push({ pattern: match, workspace: workspace })
          rules.sort(function (a, b) { return a.pattern < b.pattern ? -1 : 1 })
          return write('routes', rules).then(function () {
            renderRoutes(rules)
            el('r-match').value = ''
            said('said-route', '✓ ' + t('savedOk') + ': ' + match + ' → ' +
              (proyectos.filter(function (p) { return p.id === workspace })[0] || { name: workspace }).name)
          })
        }))
      })

      // Un texto con huecos: `{s}` y compania salen de `vals`. Vive suelto y no
      // dentro de quien lo usa porque lo llaman applyStrings y el aviso de latido,
      // que no se conocen entre si.
      function fmt (key, vals) {
        return String(t(key)).replace(/\{(\w+)\}/g, function (_, k) {
          return vals && vals[k] != null ? vals[k] : ''
        })
      }

      // ---------- vinculacion de WhatsApp: el QR (T3/T4) ----------
      // El CSP del panel prohibe `<script src>` (docs/ENCARGO...§6): el codificador va
      // INCRUSTADO, no cargado. Es qrcode-generator de Kazuhiko Arase, MIT, minificado
      // con esbuild (`sidecar/build.mjs` usa el mismo esbuild) desde
      // qrcode-generator@2.0.4 (dist/qrcode.js). Su UMD final revisa `exports`/`module`
      // -que ninguno existe en un <script> de pagina- y no hace nada: `qrcode` queda
      // como variable del scope de este bloque, tal como la usa `dibujarQr` mas abajo.
      //
      // Licencia (se conserva sin minificar, tal como pide el proyecto):
      //   Copyright (c) 2009 Kazuhiko Arase

      //
      // `edadDato` es hace cuanto que el host contesto por la clave `sidecar`. Va como
      // argumento y no leyendo `lecturaFrescaAt` adentro para que la funcion siga
      // siendo pura y probable sin montar el panel entero.
      function estadoSidecar (d, edadDato) {
        if (!d || typeof d !== 'object') return 'waiting'
        if (d.exited) return 'down'
        if (d.connection === 'close' && codigoSidecar(d) === 'sesion-cerrada') return 'down'
        // "Conectado" es una afirmacion sobre AHORA y la foto guardada no caduca: con
        // el worker o el sidecar muertos seguia diciendo "conectado" una semana despues
        // (medido en la maquina del dueno, 2026-10-01). Sin latido fresco, 'silent'.
        if (d.connection === 'open') return latidoFresco(d) ? 'connected' : 'silent'
        // El TTL lo manda el sidecar con cada QR; QR_VIGENCIA_MS solo cubre a uno
        // viejo que llego sin el.
        if (d.qr && !qrVencido(d.qr.ts, null, d.qr.ttlMs)) return 'live'
        // "Vencido" es una afirmacion sobre AHORA, y con un dato rancio no hay con que
        // sostenerla: este `d` es el que memorizo `read`, su `ts` se quedo quieto y el
        // reloj no. Decir 'expired' aca dejaba el panel clavado ahi para siempre —el
        // sintoma era un QR muerto, atenuado, que no se renovaba nunca— cuando lo unico
        // cierto es que el panel no esta leyendo.
        //
        // Es el mismo principio que el resto del panel aplica a SIN_RESPUESTA ("no
        // saber no es vacio"); faltaba aplicarlo al memorizado, que es justo la via por
        // la que el "no se" entraba disfrazado de "si se".
        //
        // Tiene estado propio y no reusa 'waiting' porque los dos hacen cosas
        // distintas con lo que hay en pantalla: 'waiting' no tiene QR que mostrar y
        // esconde el recuadro, y esconderlo aca seria volver al recuadro vacio que se
        // arreglo en 4.1.0. En 'stale' el QR se queda a la vista —es el ultimo que
        // llego, y si las lecturas se cortaron hace tres segundos lo mas probable es
        // que siga sirviendo— pero atenuado y sin prometer que se puede escanear.
        if (d.qr && edadDato > DATO_RANCIO_MS) return 'stale'
        if (d.qr) return 'expired'
        return 'waiting'
      }

      // Cuanto vale el latido de la linea (`LATIDO_LINEA_MS` en sidecar/src/index.js,
      // 60 s). Dos latidos y medio: uno perdido o una escritura demorada por el cupo del
      // host no apagan el "conectado", y una linea muerta deja de decirlo en minutos y
      // no en una semana. El MISMO numero vive en activity.html y la prueba de paneles
      // compara los dos.
      var LATIDO_LINEA_VENCE_MS = 150000

      /** Si la linea dio senales de vida hace poco. Lee el latido que el worker copia
       *  del sidecar (`sidecar.latido.ts`, la hora del SIDECAR). */
      function latidoFresco (d) {
        var ts = d && d.latido && Number(d.latido.ts)
        if (!ts) return false
        var edad = Date.now() - ts
        return edad >= 0 && edad <= LATIDO_LINEA_VENCE_MS
      }

      /** La hora del ultimo latido, o de la ultima escritura si nunca hubo latido. Es
       *  lo que se le dice al dueno: "sin senal desde las 17:44". */
      function horaUltimaSenal (d) {
        var ms = (d && d.latido && Number(d.latido.ts)) || Date.parse((d && d.at) || '')
        if (!ms) return '—'
        var f = new Date(ms)
        var hora = ('0' + f.getHours()).slice(-2) + ':' + ('0' + f.getMinutes()).slice(-2)
        // Pasado un dia la hora sola ya no ubica: "17:44" de anteayer se lee como de
        // hace un rato.
        return Date.now() - ms > 20 * 3600 * 1000
          ? f.getFullYear() + '-' + ('0' + (f.getMonth() + 1)).slice(-2) + '-' +
            ('0' + f.getDate()).slice(-2) + ' ' + hora
          : hora
      }

      // Lo ultimo BUENO conocido: una lectura rechazada (SIN_RESPUESTA) no es una clave
      // vacia (docs/ENCARGO...§H5 en el proyecto en general) y no puede apagar el QR que
      // ya estaba en pantalla.
      var sidecarUlt = null
      var qrPintado = null // { ts, tam }: para no volver a dibujar el mismo QR cada 2 s

      // Desde cuando el panel esta en 'waiting' SIN CORTE: se pone en el primer render
      // que lo ve y se borra en cuanto el estado cambia a otra cosa. Sin esto no hay
      // forma de saber si "esperando el QR" lleva dos segundos o veintiseis minutos —
      // que es exactamente lo que le paso al dueno: el panel prometia "unos segundos"
      // sin importar cuanto llevara.
      var esperandoDesde = null

      // Cuando dejar de prometer "unos segundos" y cuando decir que esto ya es raro.
      // El sidecar rota el QR cada QR_VIGENCIA_MS (60 s, sidecar/src/index.js): un
      // primer arranque normal deja de estar en 'waiting' bastante antes de que se
      // cumpla UNA rotacion entera, asi que a partir de ahi "unos segundos" ya seria
      // falso y se cambia por el tiempo real. A las TRES rotaciones (180 s) sin QR ni
      // conexion ya no es variacion normal — es el mismo cuadro que dejo el panel 26
      // minutos diciendo lo mismo — y ahi se nombra el siguiente paso en vez de seguir
      // esperando en silencio. Las dos quedan comodas arriba del sondeo dedicado de la
      // vinculacion (2 s, `VEREDICTO_SONDEO_MS`/`vigilarSidecar`), que sigue siendo lo
      // bastante fino para notar el cambio de estado sin que estos umbrales titilen.
      // Van con la ROTACION, no con la vigencia: lo que describe el parrafo de arriba
      // es "una rotacion entera" y "tres rotaciones", y desde que las dos constantes
      // dejaron de valer lo mismo colgarlas de la vigencia movia los dos umbrales sin
      // que nadie lo pidiera.
      var UMBRAL_ESPERA_REPORTA_MS = QR_ROTACION_MS
      var UMBRAL_ESPERA_LARGA_MS = QR_ROTACION_MS * 3

      /** Que sidecar y worker contestaron de verdad, en una frase sin nombres de campo.
       *  Reemplaza la adivinanza del dueno ("se esta generando? me toca refrescar?")
       *  por lo unico que el panel puede afirmar: si el plugin responde, y que dice el
       *  sidecar de su conexion. Nunca inventa una causa que no leyo. */
      function pairingDiagnostico (d) {
        var partes = []
        if (workerAusente === true) partes.push(t('pairingKnownWorkerDown'))
        else if (workerAusente === false) partes.push(t('pairingKnownWorkerUp'))
        var conexion = d && typeof d === 'object' ? d.connection : null
        partes.push(conexion === 'connecting'
          ? t('pairingKnownConnConnecting') : t('pairingKnownConnSilent'))
        return partes.join(' ')
      }

      function renderPairing (d) {
        if (hayRespuesta(d)) sidecarUlt = d
        else d = sidecarUlt
        var estado = estadoSidecar(d, edadLectura('sidecar'))
        estadoLinea = estado
        var msg = el('pairing-msg')
        var detalle = el('pairing-detail')
        var diag = el('pairing-diag')
        var wrap = el('qr-wrap')
        msg.className = 'pairing-msg' +
          (estado === 'connected' ? ' ok' : estado === 'down' || estado === 'silent' ? ' bad' : '')
        msg.textContent = estado === 'silent'
          ? fmt('pairingSilent', { hora: horaUltimaSenal(d) })
          : t('pairing' + estado.charAt(0).toUpperCase() + estado.slice(1))
        esperandoDesde = estado === 'waiting' ? (esperandoDesde || Date.now()) : null
        var como = ''
        var comoDiag = ''
        if (estado === 'down') {
          como = porCodigo(SIDECAR_HOW_KEY, codigoSidecar(d),
            (d && d.error && d.error.detail) || '')
        } else if (estado === 'silent') {
          como = t('pairingSilentHow')
        } else if (estado === 'waiting') {
          // Un cierre transitorio con backoff (`socket-caido`/`reinicio-requerido`) no
          // es 'down' -se cura solo, `estadoSidecar` lo deja aca a proposito- pero es
          // una CAUSA REAL que el sidecar ya conto: contarla es mejor que taparla con
          // el generico "conectando", y las dos claves ya existian sin que nada las
          // disparara.
          var codigoCierre = d && d.connection === 'close' ? codigoSidecar(d) : null
          var causaConocida = codigoCierre === 'socket-caido' || codigoCierre === 'reinicio-requerido'
          var esperaMs = Date.now() - esperandoDesde
          if (causaConocida) {
            como = porCodigo(SIDECAR_HOW_KEY, codigoCierre, '')
          } else if (esperaMs >= UMBRAL_ESPERA_LARGA_MS) {
            como = t('pairingWaitingLong')
            comoDiag = pairingDiagnostico(d)
          } else if (esperaMs >= UMBRAL_ESPERA_REPORTA_MS) {
            como = fmt('pairingWaitingElapsed', { s: Math.round(esperaMs / 1000) })
            comoDiag = pairingDiagnostico(d)
          } else {
            como = t('pairingWaitingHow')
          }
        } else if (estado === 'expired') {
          como = t('pairingExpiredHow')
        } else if (estado === 'stale') {
          // Aca el diagnostico es el dato util: lo que falla no es la vinculacion, es
          // la lectura, y `pairingDiagnostico` dice si el plugin contesta o no.
          como = t('pairingStaleHow')
          comoDiag = pairingDiagnostico(d)
        }
        detalle.textContent = como
        detalle.hidden = !como
        diag.textContent = comoDiag
        diag.hidden = !comoDiag
        // Un QR vencido sigue siendo una IMAGEN valida -la rechaza WhatsApp, no el
        // navegador-, y esconderla deja un recuadro vacio que se ve como un plugin
        // roto. Solo se esconde de verdad en los estados que NO tienen QR para
        // mostrar; `d.qr` puede quedar pisado en 'down' -`escribir()` en main.mjs
        // mezcla el estado, no lo reemplaza- y por eso la condicion mira el ESTADO,
        // no solo si `d.qr` existe.
        //
        // 'stale' entra en la misma lista y se pinta atenuado por el mismo motivo que
        // 'expired': hay un QR para mostrar y esconderlo deja el recuadro vacio, pero
        // no se puede prometer que sirva.
        if ((estado === 'live' || estado === 'expired' || estado === 'stale') && d && d.qr) {
          wrap.hidden = false
          wrap.classList.toggle('vencido', estado !== 'live')
          var tam = tamanoQrPx()
          if (!qrPintado || qrPintado.ts !== d.qr.ts || qrPintado.tam !== tam) {
            dibujarQr(d.qr.qr, tam)
            qrPintado = { ts: d.qr.ts, tam: tam }
          }
        } else {
          wrap.hidden = true
          wrap.classList.remove('vencido')
          qrPintado = null
        }
        pintarAccionesPairing(estado, d)
        // Sondeo dedicado de 2 s SOLO mientras no este conectado, y solo el mientras:
        // una vez emparejado no hay QR que rotar y el sondeo de 12 s (CLAVES_VIVAS) ya
        // alcanza para notar una caida.
        vigilarSidecar(estado !== 'connected')
      }

      // ---------- desvincular y reintentar (§8.1) ----------
      // El auth state es una CREDENCIAL VIVA: quien lo tenga lee y escribe como esa
      // cuenta sin el telefono. Hasta aca el panel sabia vincular y no sabia soltar, y
      // quien escaneaba con el telefono equivocado solo salia borrando un directorio a
      // mano. Poder revocarlo desde la pantalla no es una comodidad, es el minimo.

      // Que fallas arregla un relanzamiento, y cuales no. `sidecar-sin-permiso` y
      // `sidecar-sin-authdir` no: el primero lo arregla aprobar el plugin y el segundo
      // no lo arregla nadie desde aca. Un boton que no puede funcionar es peor que
      // ningun boton — promete una salida y devuelve al mismo lugar.
      var REINTENTABLE = {
        'sidecar-no-arranco': true,
        'sidecar-authdir-fallo': true,
        'sidecar-cayo': true,
        'desvincular-fallo': true,
        // Otro equipo tenia la sesion: cerrado ese, reintentar SI la recupera.
        'sesion-reemplazada': true
      }

      // Los motivos donde hay una sesion que soltar. `sesion-cerrada` deja credenciales
      // muertas en el disco; los otros tres son cierres que el sidecar ya no reintenta
      // y donde volver a vincular es una salida real.
      var DESVINCULABLE = {
        'sesion-cerrada': true,
        'sesion-reemplazada': true,
        'acceso-denegado': true,
        multidispositivo: true
      }

      // Los `statusCode` de WhatsApp que significan "la sesion guardada murio" (401
      // loggedOut, 500 badSession). Mandan sobre cualquier codigo escrito encima: la
      // version anterior del worker pisaba `sesion-cerrada` con `sidecar-cayo` al salir
      // el proceso, y ese storage sigue en las maquinas que actualizan.
      var STATUS_SESION_MUERTA = { 401: true, 500: true }

      function codigoSidecar (d) {
        if (d && STATUS_SESION_MUERTA[d.statusCode]) return 'sesion-cerrada'
        return (d && d.error && d.error.code) || (d && d.motivo) || null
      }

      var confirmando = false
      function salirDeConfirmar () {
        confirmando = false
        el('pairing-warn').hidden = true
        el('pairing-cancel').hidden = true
        el('pairing-unlink').className = ''
        el('pairing-unlink').textContent = t('pairingUnlink')
      }

      /** Que botones ofrece cada estado. Ninguno de los dos aparece donde no tiene nada
       *  que hacer: ofrecer "desvincular" sin sesion, o "reintentar" sobre un permiso
       *  denegado, es mandar al usuario a apretar algo que no lo saca de donde esta. */
      function pintarAccionesPairing (estado, d) {
        var code = codigoSidecar(d)
        // Se ofrece soltar cuando hay algo que soltar: una sesion abierta, o una
        // cerrada desde el telefono — que deja las credenciales muertas en el disco y
        // no reconecta nunca sola (sidecar/src/index.js, `decidirTrasCierre`).
        var puedeDesvincular = estado === 'connected' || estado === 'silent' ||
          DESVINCULABLE[code] === true
        // Sin senal tambien: relanzar el sidecar es justo lo que revive una linea muda.
        var puedeReintentar = estado === 'silent' ||
          (estado === 'down' && REINTENTABLE[code] === true)
        if (!puedeDesvincular && confirmando) salirDeConfirmar()
        el('pairing-unlink').hidden = !puedeDesvincular
        el('pairing-retry').hidden = !puedeReintentar
        el('pairing-cancel').hidden = !(puedeDesvincular && confirmando)
        el('pairing-warn').hidden = !(puedeDesvincular && confirmando)
        if (puedeDesvincular && confirmando) el('pairing-warn').textContent = t('pairingUnlinkWarn')
        el('pairing-actions').hidden = !puedeDesvincular && !puedeReintentar
      }

      // Cuanto se espera el veredicto del worker. Desvincular son dos viajes a un
      // subproceso -borrar y relanzar-, y el vigia del worker mira cada 3 s.
      var VEREDICTO_ESPERA_MS = 30000
      var VEREDICTO_SONDEO_MS = 2000

      /** Espera el veredicto de ESE pedido, por id y en SU clave. Sin el id, el panel
       *  pintaria la respuesta que quedo del clic anterior como si fuera la de este; y
       *  sin la clave, el veredicto de la sesion y el del alcance se pisarian.
       *
       *  Va por `read()`, o sea por el carril del SONDEO: se auto-frena con CUPO igual
       *  que el vigia del QR. Son 1 mensaje cada 2 s mientras dura, ~5 de los 26 que el
       *  sondeo tiene de presupuesto, y solo mientras hay un pedido en vuelo. Dos
       *  pedidos a la vez no existen: los dos botones que lo usan quedan en "…" hasta
       *  que vuelve el suyo. */
      function esperarVeredicto (clave, id) {
        var fin = Date.now() + VEREDICTO_ESPERA_MS
        return new Promise(function (resolve) {
          ;(function vuelta () {
            read(clave).then(function (v) {
              if (hayRespuesta(v) && v && v.requestId === id) { resolve(v); return }
              if (Date.now() > fin) { resolve(null); return }
              setTimeout(vuelta, VEREDICTO_SONDEO_MS)
            })
          })()
        })
      }

      /** Deja el pedido donde el worker lo mira y espera SU respuesta. El id se arma
       *  aca porque es el panel el que tiene que poder reconocer la vuelta.
       *
       *  Lo usan los dos canales —la sesion de WhatsApp y el alcance— porque las dos
       *  cosas que viajan por aca las tiene que hacer un subproceso, y el panel no
       *  ejecuta nada. */
      function pedirAlWorker (claveP, claveR, pedido) {
        pedido.id = 'wa-' + Date.now().toString(36) + '-' +
          Math.random().toString(36).slice(2, 8)
        pedido.at = new Date().toISOString()
        return write(claveP, pedido).then(function (r) {
          // El host rechazo la escritura: no hay pedido, asi que no hay nada que
          // esperar. Decirlo es la diferencia entre un boton que fallo y uno que no hace
          // nada.
          if (!(r && r.ok)) return null
          return esperarVeredicto(claveR, pedido.id)
        })
      }

      // Traer la libreta: relanza la sesion, que al conectar pide `resyncAppState`.
      // Va por el canal del worker porque el panel no ejecuta nada, y tarda: el
      // veredicto se espera igual que el de desvincular.
      el('chat-fetch').addEventListener('click', function (event) {
        busy(event.currentTarget, pedirSidecar('libreta').then(function (v) {
          if (!v) { said('said-chat-fetch', t('pairingNoAnswer'), true); return }
          if (!v.ok) {
            said('said-chat-fetch', porCodigo(SIDECAR_HOW_KEY, v.code, v.detail || ''), true)
            return
          }
          said('said-chat-fetch', t('chatFetchDone'))
          return reload(true)
        }))
      })

      function pedirSidecar (accion) {
        return pedirAlWorker('sidecarRequest', 'sidecarResult', { action: accion })
      }

      function contarVeredicto (v, accion) {
        if (!v) { said('said-pairing', t('pairingNoAnswer'), true); return }
        if (v.ok) {
          said('said-pairing',
            t(accion === 'desvincular' ? 'pairingUnlinked' : 'pairingRetried'))
          return
        }
        // El veredicto trae CODIGO, no frase: el worker no sabe en que idioma esta el
        // usuario. Misma tabla que el resto de la seccion, con el detalle crudo de
        // respaldo para un codigo que este panel todavia no sepa decir.
        said('said-pairing', porCodigo(SIDECAR_HOW_KEY, v.code, v.detail || v.code || ''), true)
      }

      // El primer clic no desvincula: pide confirmacion. Es irreversible desde el panel
      // y no hay modal donde preguntar (§6), asi que la pregunta vive en el boton.
      el('pairing-unlink').addEventListener('click', function (event) {
        var boton = event.currentTarget
        if (!confirmando) {
          confirmando = true
          el('pairing-warn').textContent = t('pairingUnlinkWarn')
          el('pairing-warn').hidden = false
          el('pairing-cancel').hidden = false
          boton.className = 'confirmar'
          boton.textContent = t('pairingUnlinkConfirm')
          return
        }
        busy(boton, pedirSidecar('desvincular').then(function (v) {
          contarVeredicto(v, 'desvincular')
          // Se repinta con lo que haya quedado: el estado nuevo manda sobre el de antes,
          // y sin esto la pantalla seguiria diciendo "conectado" hasta la proxima vuelta
          // del sondeo.
          return reload(true)
        })).then(salirDeConfirmar, salirDeConfirmar)
      })

      el('pairing-cancel').addEventListener('click', salirDeConfirmar)

      // "Comprobar ahora": una lectura de ESTE momento, no la que traiga la proxima
      // vuelta del sondeo (12 s, o 2 s mientras empareja). Va por `read(key, true)` —
      // el carril de USUARIO, el mismo que abrir el panel — para no gastar el cupo del
      // sondeo (docs/ENCARGO...§H2-H3) ni quedar atras de el en la cola. `busy()` lo
      // apaga mientras esta en vuelo, igual que cualquier otro boton de esta pantalla.
      el('pairing-refresh').addEventListener('click', function (event) {
        busy(event.currentTarget, Promise.all([
          read('sidecar', true),
          read('workerBeat', true)
        ]).then(function (rs) {
          var sinWorker = pintarLatido(rs[1])
          apagarLoQueNecesitaWorker(sinWorker)
          renderPairing(rs[0])
          said('said-pairing-refresh', t('pairingChecked'))
        }))
      })

      // Reintentar no destruye nada: sale de un solo clic. Pedir confirmacion para algo
      // que no se pierde es ruido, y el ruido es lo que enseña a confirmar sin leer.
      el('pairing-retry').addEventListener('click', function (event) {
        busy(event.currentTarget, pedirSidecar('reintentar').then(function (v) {
          contarVeredicto(v, 'reintentar')
          return reload(true)
        }))
      })

      // ---------- Jev (opcional) ----------
      // La llave y el interruptor viajan por el canal del worker, como desvincular: el
      // panel no puede tocar `secrets` ni escribir el espejo. El estado que vuelve dice
      // solo SI hay llave y que paso con el archivo; la llave no vuelve nunca.
      var JEV_HOW_KEY = {
        'llave-invalida': 'jevErrInvalid',
        'boveda-fallo': 'jevErrVault',
        'espejo-fallo': 'jevMirrorFail'
      }

      function renderJev (st) {
        var s = st && typeof st === 'object' ? st : {}
        var enabled = s.enabled === true
        var keySet = s.keySet === true
        el('jev-status').textContent =
          t(enabled ? (keySet ? 'jevStOnYes' : 'jevStOnNo') : (keySet ? 'jevStOffYes' : 'jevStOffNo'))
        el('jev-remove-key').hidden = !keySet
        el('jev-key').placeholder = t(keySet ? 'jevKeyPhSet' : 'jevKeyPh')
        jevUltimo = s
        // Mientras viaja el pedido el interruptor muestra lo que el dueno apreto; el
        // estado que vuelve del worker manda en cuanto llega.
        if (!jevEnviando) {
          el('jev-enabled').setAttribute('aria-checked', enabled ? 'true' : 'false')
          el('jev-switch-text').textContent = t(enabled ? 'jevOn' : 'jevOff')
        }
        // Un archivo de llave que no escribio el plugin no se toca solo: el lector lo trata
        // como "sin llave", y el usuario tiene que saber por que no anda.
        var nota = el('jev-mirror-note')
        // Con la llave ya guardada no hay nada que reescribir: se ofrece usarla, que es lo
        // mismo que encender el interruptor (el worker reemplaza el archivo ajeno).
        var ajeno = s.mirror === 'ajeno'
        var clave = ajeno ? (keySet ? 'jevMirrorForeignSaved' : 'jevMirrorForeign')
          : s.mirror === 'fallo' ? 'jevMirrorFail' : ''
        nota.hidden = !clave
        nota.innerHTML = clave ? t(clave) : ''
        el('jev-use-saved').hidden = !(ajeno && keySet)
        pintarChecklist()
      }

      function jevRefrescar () {
        return read('jevStatus', true).then(function (v) { if (hayRespuesta(v)) renderJev(v) })
      }

      function pedirJev (pedido) {
        return pedirAlWorker('jevRequest', 'jevResult', pedido)
      }

      /** Dice el veredicto al lado del boton y devuelve si fue bueno. El worker contesta
       *  CODIGO; la frase la arma el panel, que sabe el idioma. */
      function jevDecir (id, v, okKey) {
        if (!v) { said(id, t('pairingNoAnswer'), true); return false }
        if (!v.ok) { said(id, t(JEV_HOW_KEY[v.code] || 'jevErrGeneric'), true); return false }
        said(id, '✓ ' + t(okKey))
        return true
      }

      el('jev-save-key').addEventListener('click', function (event) {
        var llave = el('jev-key').value.trim()
        if (!llave) { said('said-jev-key', t('jevKeyEmpty'), true); return }
        var pedido = { action: 'guardar-llave', value: llave }
        busy(event.currentTarget, pedirJev(pedido).then(function (v) {
          // Sin respuesta la llave seguiria escrita en storage, en claro, esperando a un
          // worker que no esta: se reemplaza por una lapida que ya no la lleva. Un panel
          // no puede borrar una clave, solo escribir encima.
          if (!v) {
            write('jevRequest', { id: pedido.id, at: new Date().toISOString(), tombstone: true })
          }
          // El campo se vacia solo si se guardo: ante un fallo la llave se queda para
          // corregirla, que es lo que el usuario necesita.
          if (jevDecir('said-jev-key', v, 'jevKeySaved')) el('jev-key').value = ''
          return jevRefrescar()
        }))
      })

      // Encender con la llave en la boveda es el gesto que reemplaza un archivo ajeno: el
      // boton manda exactamente ese pedido, sin llave (el panel nunca la tiene).
      el('jev-use-saved').addEventListener('click', function (event) {
        busy(event.currentTarget, pedirJev({ action: 'activar', enabled: true }).then(function (v) {
          jevDecir('said-jev-key', v, 'jevSaved')
          return jevRefrescar()
        }))
      })

      el('jev-remove-key').addEventListener('click', function (event) {
        busy(event.currentTarget, pedirJev({ action: 'quitar-llave' }).then(function (v) {
          jevDecir('said-jev-key', v, 'jevKeyRemoved')
          return jevRefrescar()
        }))
      })

      // El interruptor actua al apretarlo, como todo interruptor: el dueno no podia
      // encender Jev porque el select no abria, y un "Guardar" aparte despues de un
      // interruptor es un segundo paso que nadie espera. Manda el mismo pedido de antes.
      var jevEnviando = false, jevUltimo = null
      el('jev-enabled').addEventListener('click', function (event) {
        if (jevEnviando) return
        var sw = event.currentTarget
        var encender = sw.getAttribute('aria-checked') !== 'true'
        jevEnviando = true
        sw.setAttribute('aria-checked', encender ? 'true' : 'false')
        sw.setAttribute('aria-busy', 'true')
        sw.disabled = true
        el('jev-switch-text').textContent = t(encender ? 'jevOn' : 'jevOff')
        pedirJev({ action: 'activar', enabled: encender }).then(function (v) {
          jevDecir('said-jev-enabled', v, 'jevSaved')
          jevEnviando = false
          sw.removeAttribute('aria-busy')
          sw.disabled = workerAusente === true
          // Lo que dice el worker manda: sin respuesta, el interruptor vuelve a lo que rige.
          renderJev(jevUltimo)
          return jevRefrescar()
        })
      })


      var timerSidecar = null
      function vigilarSidecar (activo) {
        if (timerSidecar) { clearInterval(timerSidecar); timerSidecar = null }
        if (!activo) return
        timerSidecar = setInterval(function () {
          if (document.visibilityState !== 'visible') return
          // Va por `read()`, que pasa por CUPO como sondeo (no como clic): con 1 clave
          // cada 2 s son ~5 de los 26 que el sondeo tiene de presupuesto — encima de los
          // ~6 que ya gasta CLAVES_VIVAS a 12 s, sigue lejos del tope
          // (docs/ENCARGO...§H2-H3).
          read('sidecar').then(renderPairing)
        }, 2000)
      }


      // ---------- skills (skills-globales) ----------
      // El estado lo escribe el worker en `skillsStatus`; el panel lo pide al abrir la
      // pestana y despues de cada accion, nunca en el sondeo: cada lectura sale del mismo cupo
      // de 30 mensajes por 10 s que el clic del dueno.
      var SKILL_DESC_KEY = { 'whatsapp-avisos': 'skillDescAvisos' }
      var SKILL_HOW_KEY = {
        'skill-ajena': 'skillErrForeign', 'proyecto-no-existe': 'skillErrProject',
        'skill-no-existe': 'skillErrMissing', 'skill-sin-instalar': 'skillErrNotInstalled',
        'skills-fallo': 'skillErrFail', 'argumentos-invalidos': 'skillErrFail',
        'vencido': 'skillErrFail', 'accion-desconocida': 'skillErrFail'
      }
      var SKILL_DONE_KEY = { 'skill-instalada': 'skillInstalled',
        'skill-actualizada': 'skillUpdated', 'skill-quitada': 'skillRemoved' }
      var SKILL_STATE_KEY = { 'not-installed': 'skillStateNot', installed: 'skillStateYes',
        outdated: 'skillStateOld', foreign: 'skillStateForeign' }
      var skillsEstado = null
      // La fila que espera la confirmacion de quitar, con las secciones que se perderian.
      var skillConfirmar = null

      function claveDestino (t) {
        return t.scope === 'global' ? 'global' : 'project:' + t.project
      }

      function renderSkills (st) {
        if (st !== undefined) skillsEstado = st
        var caja = el('skills-wrap')
        st = skillsEstado
        if (!st || typeof st !== 'object' || !Array.isArray(st.skills)) {
          caja.innerHTML = '<p class="empty">' + esc(t('skillsReading')) + '</p>'
          return
        }
        if (!st.skills.length) {
          caja.innerHTML = '<p class="empty">' + esc(t('skillsNone')) + '</p>'
          return
        }
        caja.innerHTML = st.skills.map(function (sk) {
          var targets = Array.isArray(sk.targets) ? sk.targets : []
          var desc = SKILL_DESC_KEY[sk.name] ? t(SKILL_DESC_KEY[sk.name]) : (sk.description || '')
          var filas = targets.map(function (tg) { return filaSkill(sk.name, tg) }).join('')
          var sinProyectos = !targets.some(function (tg) { return tg.scope === 'project' })
          return '<div class="skill" data-skill="' + escAttr(sk.name) + '">' +
            '<div class="skill-head"><b>' + esc(sk.name) + '</b></div>' +
            '<p class="hint skill-desc">' + esc(desc) + '</p>' + filas +
            (sinProyectos ? '<p class="hint">' + esc(t('skillsNoProjects')) + '</p>' : '') +
            '</div>'
        }).join('')
        Array.prototype.forEach.call(caja.querySelectorAll('[data-sk-act]'), function (b) {
          b.addEventListener('click', function () { accionSkill(b) })
        })
      }

      function filaSkill (nombre, tg) {
        var clave = claveDestino(tg)
        var estado = SKILL_STATE_KEY[tg.state] ? tg.state : 'not-installed'
        var donde = tg.scope === 'global' ? t('skillTargetGlobal')
          : tg.accepted === false ? fmt('skillTargetGone', { name: tg.name || tg.project })
            : (tg.name || tg.project)
        var confirmando = skillConfirmar && skillConfirmar.skill === nombre &&
          skillConfirmar.clave === clave
        var acts = []
        var boton = function (act, texto, extra) {
          acts.push('<button class="link' + (extra || '') + '" data-sk-act="' + act +
            '" data-sk-skill="' + escAttr(nombre) + '" data-sk-target="' + escAttr(clave) + '">' +
            esc(t(texto)) + '</button>')
        }
        if (confirmando) {
          boton('force', 'skillRemoveAnyway', ' confirmar')
          boton('cancel', 'skillCancel')
        } else if (estado === 'not-installed') {
          if (tg.accepted !== false) {
            boton('install', tg.scope === 'global' ? 'skillInstallGlobal' : 'skillInstallProject')
          }
        } else if (estado === 'outdated') {
          boton('update', 'skillUpdate')
          boton('remove', 'skillRemove')
        } else if (estado === 'installed') {
          boton('remove', 'skillRemove')
        }
        var notas = []
        if (estado === 'installed' || estado === 'outdated') {
          if (tg.version) notas.push(esc(fmt('skillVersion', { v: tg.version })))
          if (Array.isArray(tg.yours) && tg.yours.length) {
            notas.push(esc(fmt('skillYours', { s: tg.yours.join(', ') })))
          }
        }
        return '<div class="sk-row" data-sk-target="' + escAttr(clave) + '">' +
          '<div class="sk-line"><span class="sk-where">' + esc(donde) + '</span>' +
          '<span class="pill sk-' + estado + '">' + esc(t(SKILL_STATE_KEY[estado])) + '</span>' +
          '<span class="sk-acts">' + acts.join('') + '</span></div>' +
          (estado !== 'not-installed' && tg.file
            ? '<code class="proj-path">' + esc(tg.file) + '</code>' : '') +
          (notas.length ? '<p class="hint">' + notas.join(' · ') + '</p>' : '') +
          (estado === 'foreign' ? '<p class="hint">' + esc(t('skillForeignHow')) + '</p>' : '') +
          (confirmando ? '<p class="hint sk-warn">' +
            esc(fmt('skillEditedWarn', { s: skillConfirmar.yours.join(', ') })) + '</p>' : '') +
          '</div>'
      }

      function leerSkills () {
        return pedirAlWorker('scopeRequest', 'scopeResult', { action: 'skills-estado' })
          .then(function () { return read('skillsStatus', true) })
          .then(function (v) { if (hayRespuesta(v)) renderSkills(v) })
      }

      /** Un clic de la pestana: el pedido lleva la skill y el destino (global o el id del
       *  proyecto), nunca una ruta; la ruta la pone el worker desde el catalogo. */
      function accionSkill (b) {
        var clave = b.dataset.skTarget
        var skill = b.dataset.skSkill
        if (b.dataset.skAct === 'cancel') { skillConfirmar = null; renderSkills(); return }
        var pedido = { skill: skill }
        if (clave === 'global') pedido.target = 'global'
        else pedido.project = clave.slice('project:'.length)
        if (b.dataset.skAct === 'install' || b.dataset.skAct === 'update') {
          pedido.action = 'skill-instalar'
        } else {
          pedido.action = 'skill-quitar'
          if (b.dataset.skAct === 'force') pedido.force = true
        }
        var veredicto = null
        var hecho = pedirAlWorker('scopeRequest', 'scopeResult', pedido).then(function (v) {
          veredicto = v
          skillConfirmar = v && !v.ok && v.code === 'skill-editada'
            ? { skill: skill, clave: clave, yours: Array.isArray(v.yours) ? v.yours : [] } : null
          return read('skillsStatus', true)
        }).then(function (st) {
          // Primero se repinta y despues se confirma: repintar borra lo que diga la fila.
          if (hayRespuesta(st)) renderSkills(st)
          else renderSkills()
          var v = veredicto
          if (!v) { said('said-skills', t('pairingNoAnswer'), true); return }
          if (v.ok) said('said-skills', '✓ ' + t(SKILL_DONE_KEY[v.code] || 'skillUpdated'))
          else if (v.code !== 'skill-editada') {
            said('said-skills', porCodigo(SKILL_HOW_KEY, v.code, '') || t('skillErrFail'), true)
          }
        })
        return busy(b, hecho)
      }

      // ---------- pestanas (T17) ----------
      // Seis vistas, una visible. Sin localStorage: en el iframe con sandbox el origen es
      // opaco y tocarlo tira una excepcion. La pestana no se recuerda entre aperturas, y
      // la de entrada se decide UNA vez, con lo que falta (`decidirPestana`).
      var PESTANAS = ['estado', 'chats', 'proyectos', 'aprobacion', 'agente', 'skills',
        'avanzado']
      var pestanaElegida = false
      function mostrarPestana (cual) {
        PESTANAS.forEach(function (p) {
          var activa = p === cual
          el('view-' + p).hidden = !activa
          el('tab-' + p).setAttribute('aria-selected', activa ? 'true' : 'false')
          el('tab-' + p).tabIndex = activa ? 0 : -1
        })
        // Una lista abierta en la pestana que se va quedaria flotando sobre la otra.
        comboChats.cerrar(); comboProyecto.cerrar(); comboRegla.cerrar()
        combosExtra.forEach(function (c) { c.cerrar() })
        if (activaAuto(cual)) leerAuto()
        if (cual === 'agente') leerCuentasBot()
        if (cual === 'skills') leerSkills()
      }
      // Las claves de las respuestas automaticas (y la meta del primer contacto) se leen al
      // abrir SU pestana y no en cada vuelta: el host admite 30 mensajes por 10 s y la vuelta entera ya gasta casi
      // todo el cupo que le queda al clic.
      function activaAuto (cual) { return cual === 'aprobacion' }
      function leerAuto () {
        var sello = guardadoSeq
        ;['ackMode', 'ackText', 'ackQuietMinutes', 'greetingMode', 'greetingText', 'firstReply',
          'slaMinutes', 'projectQuestionHours', 'orcaNotices'].forEach(function (k) {
          read(k, true).then(function (v) { pintarClave(k, v, sello) })
        })
      }
      PESTANAS.forEach(function (p, i) {
        el('tab-' + p).addEventListener('click', function () {
          pestanaElegida = true
          mostrarPestana(p)
        })
        // Flechas, Inicio y Fin entre pestanas, como pide el patron de tablist.
        el('tab-' + p).addEventListener('keydown', function (e) {
          var j = e.key === 'ArrowRight' ? i + 1 : e.key === 'ArrowLeft' ? i - 1
            : e.key === 'Home' ? 0 : e.key === 'End' ? PESTANAS.length - 1 : null
          if (j === null) return
          e.preventDefault()
          var otra = PESTANAS[(j + PESTANAS.length) % PESTANAS.length]
          pestanaElegida = true
          mostrarPestana(otra)
          el('tab-' + otra).focus()
        })
      })

      // ---------- lo que falta (Estado) ----------
      // Se arma con lo que el panel YA leyo: ni una lectura de mas contra el cupo del host.
      var estadoLinea = null
      function faltas () {
        var alcance = alcancePorJid || {}
        var jev = jevUltimo || {}
        return [
          { item: 'linea', ok: estadoLinea === 'connected', ir: 'estado', clave: 'chkLinea' },
          { item: 'agente', ok: !!nombreAgente, ir: 'agente', clave: 'chkAgente' },
          { item: 'chat', ok: Object.keys(alcance).some(function (j) {
              return alcance[j] && alcance[j].mode && alcance[j].mode !== 'off'
            }), ir: 'chats', clave: 'chkChat' },
          { item: 'proyectos', ok: proyectos.length > 0, ir: 'proyectos',
            clave: 'chkProyectos', nota: 'chkRecommended' },
          { item: 'jev', ok: jev.enabled === true && jev.keySet === true, ir: 'aprobacion',
            clave: 'chkJev', nota: 'chkOptional' }
        ]
      }
      /** Lo imprescindible para que el agente trabaje: linea, nombre y una conversacion.
       *  Los proyectos se recomiendan (sin ellos solo responde) y Jev es opcional. */
      function configuracionLista () {
        return faltas().filter(function (f) {
          return f.item === 'linea' || f.item === 'agente' || f.item === 'chat'
        }).every(function (f) { return f.ok })
      }
      function pintarChecklist () {
        var lista = faltas()
        var html = lista.map(function (f) {
          return '<li data-item="' + f.item + '" data-ok="' + f.ok + '"><span class="mark">' +
            (f.ok ? '✓' : '○') + '</span><span class="what">' + esc(t(f.clave)) +
            (f.nota ? ' <span class="tag">(' + esc(t(f.nota)) + ')</span>' : '') + '</span>' +
            (f.ok || f.ir === 'estado' ? ''
              : '<button class="link" data-ir="' + f.ir + '">' +
                esc(t('tab' + f.ir.charAt(0).toUpperCase() + f.ir.slice(1))) +
                ' →</button>') + '</li>'
        }).join('')
        if (configuracionLista()) html += '<li class="done">' + esc(t('chkAllDone')) + '</li>'
        el('checklist').innerHTML = html
        Array.prototype.forEach.call(el('checklist').querySelectorAll('[data-ir]'), function (b) {
          b.addEventListener('click', function () {
            pestanaElegida = true
            mostrarPestana(b.dataset.ir)
          })
        })
      }
      /** La pestana de entrada: Estado mientras falta lo imprescindible, Conversaciones
       *  cuando ya esta, que es donde se trabaja a diario. Una sola vez, y nunca encima de
       *  una que el dueno eligio: el sondeo no le cambia la pantalla a nadie. */
      function decidirPestana () {
        if (pestanaElegida) return
        pestanaElegida = true
        mostrarPestana(configuracionLista() ? 'chats' : 'estado')
      }

      // ---------- varias lineas a la vez (odd/tasks/varias-lineas-y-segundo-cerebro.md) ----------
      // El worker deja las lineas dentro de `sidecar.lineas`, en orden: la primera es la principal, la de
      // la seccion de vinculacion de arriba, con su estado en `sidecar`; el de cada una de
      // las demas va en `sidecars`, por carpeta. Lo que `wa-scope` sabe de una linea que no
      // es la principal vive aparte: su alcance en `alcancePorLinea`, y su lista de
      // conversaciones en `porLinea`.
      var registroLineas = []
      var estadosLineas = {}
      // La linea que mira la pestana Conversaciones: null es la principal.
      var lineaVista = null
      // La carpeta cuyo Desvincular espera el segundo clic.
      var confirmandoLinea = null
      // Lo ultimo que se pinto: el sondeo repinta solo si algo cambio, asi un clic no cae
      // sobre un boton que se reemplazo entre el `pointerdown` y el `click`.
      var firmaLineas = null
      var firmaVista = null
      // Los tipos que se pueden elegir hoy. `personal` existe pero espera a la parte 2: el
      // worker lo rechaza igual (`TIPOS_HABILITADOS` en main.mjs).
      var TIPOS_LINEA = ['support', 'personal']
      var TIPOS_HABILITADOS = ['support']
      var TIPO_TEXTO = { support: 'linesTypeSupport', personal: 'linesTypePersonal' }
      var LINEA_ESTADO = { connected: 'linesStConnected', waiting: 'linesStWaiting',
        down: 'linesStDown', live: 'pairingLive', expired: 'pairingExpired',
        stale: 'pairingStale' }

      function leerLineas (v) {
        return Array.isArray(v) ? v.filter(function (l) {
          return l && typeof l === 'object' && typeof l.carpeta === 'string'
        }) : []
      }
      function lineasVinculadas () {
        return registroLineas.filter(function (l) { return typeof l.cuenta === 'string' && l.cuenta })
      }
      /** La cuenta de la linea que mira Conversaciones si NO es la principal, o null. */
      function otraLineaVista () {
        var vinc = lineasVinculadas()
        if (!lineaVista || vinc.length < 2 || vinc[0].cuenta === lineaVista) return null
        return vinc.some(function (l) { return l.cuenta === lineaVista }) ? lineaVista : null
      }
      function estadoDeLinea (l) {
        return registroLineas[0] === l ? sidecarUlt : (estadosLineas[l.carpeta] || null)
      }
      function numeroDeLinea (l, d) {
        if (d && typeof d.me === 'string' && d.me) return d.me
        return l.cuenta ? '+' + String(l.cuenta).replace(/^pn:/, '') : t('linesNew')
      }
      function textoEstadoLinea (estado, d) {
        if (estado === 'silent') return fmt('pairingSilent', { hora: horaUltimaSenal(d) })
        return t(LINEA_ESTADO[estado] || 'linesStWaiting')
      }
      function nodo (tag, clase, texto) {
        var n = document.createElement(tag)
        if (clase) n.className = clase
        if (texto != null) n.textContent = texto
        return n
      }

      /** El alcance de la linea que se mira: el de siempre para la principal, o el suyo. */
      function leerAlcanceVisto (usuario) {
        var otra = otraLineaVista()
        if (!otra) return read('scope', usuario)
        return read('alcancePorLinea', usuario).then(function (v) {
          return hayRespuesta(v) ? ((v && v[otra]) || {}) : v
        })
      }
      /** Guarda el alcance de la linea que se mira. El de otra linea va en SU lugar de
       *  `alcancePorLinea`: el de la principal no se toca aunque tenga el mismo grupo. Sin
       *  poder leer lo que hay no se escribe, porque se perderian las demas lineas. */
      function escribirAlcanceVisto (next) {
        var otra = otraLineaVista()
        if (!otra) return write('scope', next)
        return read('alcancePorLinea', true).then(function (v) {
          if (!hayRespuesta(v)) return { ok: false }
          var todo = v && typeof v === 'object' ? Object.assign({}, v) : {}
          todo[otra] = next
          return write('alcancePorLinea', todo)
        })
      }
      function delOtraLinea (valor, cuenta, clave) {
        if (!hayRespuesta(valor)) return SIN_RESPUESTA
        var propio = valor && typeof valor === 'object' ? valor[cuenta] : null
        if (!clave) return propio || {}
        return propio && typeof propio === 'object' && clave in propio ? propio[clave] : null
      }

      function contarLinea (v, claveOk) {
        if (!v) { said('said-lineas', t('pairingNoAnswer'), true); return }
        if (!v.ok) {
          said('said-lineas', porCodigo(SIDECAR_HOW_KEY, v.code, v.detail || v.code || ''), true)
          return
        }
        said('said-lineas', t(claveOk))
      }
      function repintarLineas () {
        firmaLineas = null
        renderLineas()
      }

      function renderLineas () {
        el('lineas-card').hidden = !registroLineas.length
        var tam = Math.min(tamanoQrPx(), 220)
        var estados = registroLineas.map(function (l) {
          var d = estadoDeLinea(l)
          return estadoSidecar(d, edadLectura(registroLineas[0] === l ? 'sidecar' : 'sidecars'))
        })
        var firma = JSON.stringify([LANG, tam, confirmandoLinea, estados, registroLineas,
          registroLineas.map(function (l) {
            var d = estadoDeLinea(l)
            return d ? [d.me, d.qr && d.qr.ts, d.latido && d.latido.ts] : null
          })])
        if (firma !== firmaLineas) {
          firmaLineas = firma
          var lista = el('lineas-lista')
          lista.textContent = ''
          registroLineas.forEach(function (l, i) { lista.appendChild(filaDeLinea(l, i, estados[i], tam)) })
        }
        var esperando = registroLineas.some(function (l) { return !l.cuenta })
        el('linea-vincular').disabled = esperando || !liveStorage
        el('lineas-espera').hidden = !esperando
        renderVistaLineas()
      }

      function filaDeLinea (l, i, estado, tam) {
        var d = estadoDeLinea(l)
        var li = nodo('li', 'linea')
        li.setAttribute('data-carpeta', l.carpeta)
        var cab = nodo('div', 'linea-cab')
        cab.appendChild(nodo('span', 'linea-num', numeroDeLinea(l, d)))
        if (i === 0) cab.appendChild(nodo('span', 'linea-marca', t('linesPrincipal')))
        cab.appendChild(nodo('span', 'linea-estado' + (estado === 'connected' ? ' ok'
          : estado === 'down' || estado === 'silent' ? ' bad' : ''), textoEstadoLinea(estado, d)))
        li.appendChild(cab)
        // El QR de la principal ya esta en la seccion de arriba; el de otra, en su fila.
        if (i > 0 && d && d.qr && (estado === 'live' || estado === 'expired' || estado === 'stale')) {
          var caja = nodo('div', 'linea-qr' + (estado === 'live' ? '' : ' vencido'))
          var canvas = document.createElement('canvas')
          caja.appendChild(canvas)
          li.appendChild(caja)
          dibujarQrEn(canvas, d.qr.qr, tam)
        }
        var tipo = nodo('div', 'linea-tipo')
        var etiqueta = nodo('span', '', t('linesType'))
        etiqueta.id = 'linea-tipo-' + i
        var seg = nodo('div', 'seg')
        seg.setAttribute('role', 'group')
        seg.setAttribute('aria-labelledby', etiqueta.id)
        TIPOS_LINEA.forEach(function (valor) {
          var b = nodo('button', '', t(TIPO_TEXTO[valor]))
          b.type = 'button'
          b.setAttribute('data-value', valor)
          apretar(b, (l.tipo || 'support') === valor)
          if (TIPOS_HABILITADOS.indexOf(valor) < 0) b.disabled = true
          b.addEventListener('click', function () { cambiarTipoLinea(l, valor, b) })
          seg.appendChild(b)
        })
        tipo.appendChild(etiqueta)
        tipo.appendChild(seg)
        li.appendChild(tipo)
        var confirmando = confirmandoLinea === l.carpeta
        // Una linea nueva que todavia espera su codigo no tiene sesion que soltar:
        // cancelarla es un clic y no pide confirmacion.
        var pendiente = i > 0 && !l.cuenta
        if (confirmando) li.appendChild(nodo('p', 'hint linea-aviso', t('linesUnlinkWarn')))
        var acciones = nodo('div', 'actions')
        var quitar = nodo('button', 'linea-desvincular' + (confirmando ? ' confirmar' : ''),
          t(pendiente ? 'linesCancelLink' : confirmando ? 'pairingUnlinkConfirm' : 'linesUnlink'))
        quitar.type = 'button'
        quitar.disabled = !liveStorage
        quitar.addEventListener('click', function () { desvincularLinea(l, quitar) })
        acciones.appendChild(quitar)
        if (confirmando) {
          var cancelar = nodo('button', '', t('pairingUnlinkCancel'))
          cancelar.type = 'button'
          cancelar.addEventListener('click', function () {
            confirmandoLinea = null
            repintarLineas()
          })
          acciones.appendChild(cancelar)
        }
        // La principal que todavia espera su codigo no tiene nada que soltar: su QR esta en
        // la seccion de arriba, y cancelarla solo abriria otra igual.
        if (i > 0 || l.cuenta) li.appendChild(acciones)
        return li
      }

      /** El tipo de una linea se lo pide al worker, que es quien guarda el registro. */
      function cambiarTipoLinea (l, tipo, boton) {
        if ((l.tipo || 'support') === tipo) return
        busy(boton, pedirAlWorker('sidecarRequest', 'sidecarResult',
          { action: 'tipo', carpeta: l.carpeta, tipo: tipo }).then(function (v) {
          contarLinea(v, 'linesTypeSaved')
          return reload()
        })).then(repintarLineas, repintarLineas)
      }

      /** Desvincular una linea es irreversible desde aca, como el de la principal: el
       *  primer clic pide confirmacion en el mismo boton, y el pedido nombra la carpeta. */
      function desvincularLinea (l, boton) {
        var pendiente = registroLineas[0] !== l && !l.cuenta
        if (!pendiente && confirmandoLinea !== l.carpeta) {
          confirmandoLinea = l.carpeta
          repintarLineas()
          return
        }
        confirmandoLinea = null
        busy(boton, pedirAlWorker('sidecarRequest', 'sidecarResult',
          { action: 'desvincular', carpeta: l.carpeta }).then(function (v) {
          contarLinea(v, 'linesUnlinked')
          return reload()
        })).then(repintarLineas, repintarLineas)
      }

      el('linea-vincular').addEventListener('click', function (event) {
        busy(event.currentTarget, pedirAlWorker('sidecarRequest', 'sidecarResult',
          { action: 'vincular' }).then(function (v) {
          contarLinea(v, 'linesLinking')
          return reload()
        })).then(repintarLineas, repintarLineas)
      })

      /** El selector de linea de Conversaciones: solo con dos lineas vinculadas o mas. */
      function renderVistaLineas () {
        var vinc = lineasVinculadas()
        var fila = el('linea-vista-fila')
        if (vinc.length < 2) {
          fila.hidden = true
          lineaVista = null
          return
        }
        var grupo = el('linea-vista')
        var firma = JSON.stringify([LANG, vinc.map(function (l) {
          return [l.cuenta, numeroDeLinea(l, estadoDeLinea(l))]
        })])
        if (firma !== firmaVista) {
          firmaVista = firma
          grupo.textContent = ''
          vinc.forEach(function (l) {
            var b = nodo('button', '', numeroDeLinea(l, estadoDeLinea(l)))
            b.type = 'button'
            b.setAttribute('data-value', l.cuenta)
            b.addEventListener('click', function () { elegirLineaVista(l.cuenta) })
            grupo.appendChild(b)
          })
        }
        var actual = otraLineaVista() || vinc[0].cuenta
        Array.prototype.forEach.call(grupo.querySelectorAll('button'), function (b) {
          apretar(b, b.getAttribute('data-value') === actual)
        })
        fila.hidden = false
      }
      function elegirLineaVista (cuenta) {
        var vinc = lineasVinculadas()
        var nueva = vinc.length && vinc[0].cuenta === cuenta ? null : cuenta
        if (nueva === lineaVista) return
        lineaVista = nueva
        resetScopeForm()
        renderVistaLineas()
        reload()
      }

      // ---------- carga y refresco ----------
      var liveStorage = null

      // Las 15 claves que pinta el panel, y las 5 que cambian solas. El sondeo pide
      // solo las vivas: las otras 10 las mueve el usuario desde este mismo panel, y
      // pedirlas cada 12 s gastaba mensajes de los 30 que el host admite por 10 s
      // — justo el cupo que le faltaba al clic. `sidecar` entra a las vivas para que
      // una caida se note aunque nadie este mirando el QR (docs/ENCARGO...§6); mientras
      // se empareja, ademas, `vigilarSidecar` la sondea aparte cada 2 s.
      var CLAVES = ['scope', 'agentName', 'health', 'routes', 'tone', 'chats',
                    'chatsAccount', 'transcribeQuality', 'inboxDays', 'ownerName',
                    'transcribe', 'transcribeLang', 'syncStatus', 'syncMinutes',
                    'workerBeat', 'sidecar', 'jevStatus', 'projects', 'projectsStatus',
                    'owners', 'senders', 'approvalNumber']
      var CLAVES_VIVAS = ['chats', 'chatsAccount', 'health', 'syncStatus', 'workerBeat',
                          'sidecar']
      // Varias lineas a la vez, sin gastar cupo con una sola: la lista de lineas viaja
      // dentro de `sidecar` (el worker la pone ahi), y el estado de las demas, `sidecars`,
      // se pide solo con dos lineas o mas. Con una sola el panel pide lo mismo que antes.
      var CLAVES_VARIAS = ['sidecars']
      // Lo de una linea que no es la principal: solo se pide mientras se la mira.
      var CLAVES_OTRA_LINEA = ['alcancePorLinea', 'porLinea']
      function clavesDeLaVuelta (soloVivas) {
        var varias = registroLineas.length > 1
        var claves = (soloVivas ? CLAVES_VIVAS : CLAVES).concat(varias ? CLAVES_VARIAS : [])
        claves = claves.filter(function (k, i) { return claves.indexOf(k) === i })
        return claves.concat(otraLineaVista() ? CLAVES_OTRA_LINEA : [])
      }

      function reload(soloVivas) {
        if (!liveStorage) return Promise.resolve()
        // El sello se toma ANTES de pedir nada: lo que llegue es de este momento, y un
        // guardado posterior lo invalida. Sin esto el sondeo pintaba el valor de antes
        // encima del que el usuario acababa de guardar.
        var sello = guardadoSeq
        var claves = clavesDeLaVuelta(soloVivas)
        // La vuelta entera solo la dispara el usuario —abrir el panel, volver a el,
        // guardar algo—, asi que no se auto-frena: se manda y, si el host la rechaza,
        // se reintenta. Lo que si se frena es el sondeo, que no lo pidio nadie.
        return Promise.all(claves.map(function (k) { return read(k, !soloVivas) }))
          .then(function (rs) {
            var leido = {}
            claves.forEach(function (k, i) { leido[k] = rs[i] })
            // Lo que esta vuelta no pidio se pinta con lo ultimo que el host CONTESTO,
            // que es lo que `read` memoriza. Nunca con un defecto: no saber no es vacio.
            function v(k) {
              if (k in leido) return leido[k]
              return k in ultimaLectura ? ultimaLectura[k] : SIN_RESPUESTA
            }
            // La linea vinculada, ANTES de pintar nada: decide que conversaciones y que
            // autorizaciones son de este numero (T9).
            var sc0 = v('sidecar')
            if (hayRespuesta(sc0) && sc0 && typeof sc0.cuenta === 'string' && sc0.cuenta) {
              cuentaVinculada = sc0.cuenta
            }
            // Las lineas, antes que lo que depende de cual se mira.
            if (hayRespuesta(sc0) && sc0 && Array.isArray(sc0.lineas)) {
              registroLineas = leerLineas(sc0.lineas)
            }
            // La primera vez que aparecen dos lineas esta vuelta no pidio sus estados (con
            // una sola no se piden): se piden aparte, una vez, y se repinta la lista.
            if (registroLineas.length > 1 && claves.indexOf('sidecars') < 0) {
              read('sidecars', !soloVivas).then(function (s) {
                if (!hayRespuesta(s)) return
                estadosLineas = s && typeof s === 'object' ? s : {}
                renderLineas()
              })
            }
            if (hayRespuesta(v('sidecars'))) {
              estadosLineas = v('sidecars') && typeof v('sidecars') === 'object' ? v('sidecars') : {}
            }
            // Mirando otra linea, sus conversaciones y sus autorizaciones son las de ESA.
            var otra = otraLineaVista()
            if (otra) cuentaVinculada = otra
            var chatsVistos = otra ? delOtraLinea(v('porLinea'), otra, 'chats') : v('chats')
            var cuentaChats = otra ? delOtraLinea(v('porLinea'), otra, 'chatsAccount')
              : v('chatsAccount')
            if (hayRespuesta(cuentaChats)) chatsCuenta = cuentaChats
            // Los proyectos ANTES del alcance y de las reglas: sus tablas y selectores
            // nombran el proyecto, y pintarlos con el catalogo de antes mostraria un id
            // pelado donde el dueno ya agrego el proyecto.
            if (hayRespuesta(v('projects'))) renderProjects(v('projects'))
            if (hayRespuesta(v('projectsStatus'))) renderProposals(v('projectsStatus'))
            var alcanceVisto = otra ? delOtraLinea(v('alcancePorLinea'), otra) : v('scope')
            if (hayRespuesta(alcanceVisto)) renderScope(alcanceVisto)
            pintarClave('tone', v('tone'), sello)
            pintarClave('transcribeQuality', v('transcribeQuality'), sello)
            pintarClave('inboxDays', v('inboxDays'), sello)
            pintarClave('ownerName', v('ownerName'), sello)
            pintarClave('transcribe', v('transcribe'), sello)
            pintarClave('transcribeLang', v('transcribeLang'), sello)
            pintarClave('syncMinutes', v('syncMinutes'), sello)
            if (hayRespuesta(v('syncMinutes'))) minutosGuardados = v('syncMinutes')
            // El ritmo del triage viaja en el latido: el worker lo escribe ahi.
            var latido = v('workerBeat')
            if (hayRespuesta(latido)) ritmoTriage = latido && typeof latido === 'object' ? latido.triage : null
            pintarRitmo()
            if (hayRespuesta(v('jevStatus'))) renderJev(v('jevStatus'))
            // Sin guardia de foco: renderChats no toca el buscador — reconstruye el
            // select y pintarChats ya conserva el texto filtrado y lo elegido. La
            // guardia solo lograba que, con el cursor en el buscador, la lista nunca
            // se llenara: era justo donde esta el cursor de quien mira "Buscando…".
            if (hayRespuesta(v('syncStatus'))) {
              estadoSync = v('syncStatus') && typeof v('syncStatus') === 'object'
                ? v('syncStatus') : null
            }
            if (hayRespuesta(chatsVistos)) renderChats(chatsVistos)
            if (hayRespuesta(v('senders'))) renderSenders(v('senders'))
            if (hayRespuesta(v('owners'))) renderOwners(v('owners'))
            // Los participantes de los grupos se leen solo con un grupo en el formulario, en
            // cada vuelta mientras siga abierto: una lectura, y la lista de un grupo recien
            // autorizado aparece sola. Fuera de eso no gastan el cupo del host (ver CLAVES).
            leerMiembrosSiHaceFalta()
            if (hayRespuesta(v('approvalNumber'))) renderApproval(v('approvalNumber'))
            pintarClave('agentName', v('agentName'), sello)
            // El latido manda sobre todo lo demas: si nadie esta corriendo, el health
            // que haya es de otra sesion y "todo bien" seria mentira. Un rechazo del
            // host NO cuenta como worker ausente — no saber no es saber que no esta.
            var sinWorker = pintarLatido(v('workerBeat'))
            var salud = v('health')
            if (sinWorker) { /* el aviso ya quedo puesto */ }
            // El health ya trae QUE falla y su detalle: mostrarlo es mejor que mandar
            // a correr un comando, que es justo lo que se saco del resto del panel.
            else if (hayRespuesta(salud) && salud && salud.ok === false) {
              var q = salud.problem
                ? esc(porCodigo(HEALTH_KEY, salud.problemCode, salud.problem))
                : t('notReady')
              // El detalle del CLI es normalmente el dato crudo —una ruta, un tamano,
              // un error de sqlite— y ese se muestra tal cual. Pero cuando es una FRASE,
              // mostrarlo crudo pone ingles del CLI en un panel en espanol: es lo que
              // paso con "both routes are off: turn the desktop app or WhatsApp Web back
              // on". Por eso el codigo manda si el panel lo conoce, y el crudo queda de
              // respaldo para uno que este panel todavia no sepa decir.
              var c = porCodigo(HEALTH_HOW_KEY, salud.problemCode,
                salud.detail ? esc(salud.detail) : t('notReadyHow'))
              // `no-transport` es cierto en dos situaciones que le piden al usuario
              // cosas opuestas: sin linea enlazada tiene algo que hacer -escanear-, y
              // con la linea ya enlazada no tiene nada que hacer. Pedirle que enlace
              // una linea que YA enlazo, justo encima de un "WhatsApp esta conectado",
              // es un panel discutiendo consigo mismo.
              var sc = v('sidecar')
              if (salud.problemCode === 'no-transport' &&
                  hayRespuesta(sc) && sc && sc.connection === 'open') {
                q = esc(t('hNoTransportLinked'))
                c = esc(t('hNoTransportLinkedHow'))
              }
              showAlert(q, c)
            }
            else if (hayRespuesta(salud) && salud) el('alert').hidden = true
            if (hayRespuesta(salud)) renderOpcionales(salud && salud.optional)
            if (hayRespuesta(v('routes'))) renderRoutes(v('routes'))
            renderPairing(v('sidecar'))
            renderLineas()
            apagarLoQueNecesitaWorker(sinWorker)
            pintarChecklist()
            if (!soloVivas) decidirPestana()
          })
      }

      var timer = null
      // Volver al panel es el momento de pedirlo todo: puede haber cambiado algo por
      // terminal mientras el usuario no estaba. El sondeo de cada 12 s, en cambio,
      // pide solo lo que cambia solo — con las 19 en cada vuelta, entrar al panel
      // (foco) justo despues de una ponia 38 mensajes en la misma ventana de 10 s y el
      // clic que venia atras llegaba al rechazo.
      var ultimaCompleta = 0
      function reloadDeUsuario() {
        var completa = Date.now() - ultimaCompleta >= 10000
        if (completa) ultimaCompleta = Date.now()
        return reload(!completa)
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') reloadDeUsuario()
      })
      window.addEventListener('focus', reloadDeUsuario)

      applyStrings()
      mostrarPestana('estado')
      renderJev(null)
      resetScopeForm()
      pintarChecklist()
      call('storage.get', { key: 'scope' }).then(function (r) {
        // Un `rate_limited` es prueba de que el puente CONTESTO: es el host poniendo
        // limite, no un Orca sin storage. Tomarlo por lo segundo apagaba TODOS los
        // botones y mandaba a actualizar Orca por una sola lectura rechazada.
        liveStorage = !!r.ok || r.errorCode === 'rate_limited'
        if (!liveStorage) {
          showAlert(t('needsUpdate'), t('needsUpdateHow'))
          // Las pestanas no: sin poder guardar, mirar sigue sirviendo.
          Array.prototype.forEach.call(document.querySelectorAll('button:not(.tab)'), function (b) {
            b.disabled = true
          })
          return
        }
        ultimaCompleta = Date.now()
        reload()
        // No hay evento de storage, asi que se sondea mientras el panel esta a la vista.
        // 12 s y 6 claves: la vuelta entera son 19 de los 30 mensajes por 10 s que el
        // host admite, y asi no queda cupo para el clic del usuario.
        timer = setInterval(function () {
          if (document.visibilityState === 'visible') reload(true)
        }, 12000)
      })
    </script>
  </body>
</html>
