      /** Pinta los informes si algo de lo que se ve cambio. Como el tablero: si nada cambio
       *  el DOM se queda, para que un clic no caiga en un nodo que ya no esta. */
      function renderInformes (forzar) {
        var r = informesActual
        // Cada numero, su linea (T9): el informe de la linea anterior, hasta que el sync
        // escriba el de la vinculada, no se pinta como de esta. Se ve como que no hay.
        if (esObjeto(r) && !deEstaLinea(r.account)) r = null
        var sello = el('reports-synced')
        sello.textContent = ''
        if (esObjeto(r) && r.updated_at) {
          var edad = haceAhora(r.updated_at)
          if (edad) {
            var texto = fmt('repUpdated', { cuando: edad })
            if (viejoAhora(r.updated_at)) sello.appendChild(crear('span', 'vieja', texto))
            else sello.textContent = texto
          }
        }
        var firma
        // El aviso de Copiar CSV no esta en la firma: el clic lo escribe en su lugar, y
        // repintar por el se llevaria el foco del boton.
        try { firma = JSON.stringify([r, cuentaVinculada, informesLeidos, periodo, desdePeriodo(periodo)]) } catch (e) { firma = null }
        if (!forzar && firma !== null && firma === firmaInformes) return
        pintarInformes(r)
        // La firma se anota DESPUES de pintar: si algo fallara a mitad, la proxima lectura
        // vuelve a intentarlo en vez de dejar la pestana a medias.
        firmaInformes = firma
      }

      function pintarInformes (r) {
        var cuerpo = el('reports-body')
        cuerpo.textContent = ''
        el('reports-empty').hidden = true
        if (!esObjeto(r)) {
          if (informesLeidos) mostrarVacioInformes(t('repNoDataTitle'), t('repNoDataBody'), false)
          return
        }
        if (r.v !== 1) {
          mostrarVacioInformes(t('repNoDataTitle'), fmt('repVersion', { v: r.v == null ? '?' : r.v }), true)
          return
        }
        var p = esObjeto(r.periods) && esObjeto(r.periods[periodo]) ? r.periods[periodo] : null
        cuerpo.appendChild(bloqueAhora(r.live))
        if (!p) {
          mostrarVacioInformes(t('repNoDataTitle'), t('repNoDataBody'), false)
          return
        }
        cuerpo.appendChild(bloqueTrafico(p))
        cuerpo.appendChild(bloqueTiempos(p))
        cuerpo.appendChild(bloqueVolumen(p))
        cuerpo.appendChild(bloqueSla(p, r.sla_minutes))
        cuerpo.appendChild(bloqueProyectos(p))
        cuerpo.appendChild(bloqueCsv(p, r))
      }

      function mostrarPestana (cual) {
        if (PESTANAS.indexOf(cual) < 0) return
        pestana = cual
        PESTANAS.forEach(function (p) {
          var activa = p === cual
          el('view-' + p).hidden = !activa
          el('tab-' + p).setAttribute('aria-selected', activa ? 'true' : 'false')
          el('tab-' + p).tabIndex = activa ? 0 : -1
        })
        if (cual === 'reports') {
          renderInformes(true)
          reload()
        } else {
          repintar()
        }
      }
      PESTANAS.forEach(function (p, i) {
        el('tab-' + p).addEventListener('click', function () { mostrarPestana(p) })
        el('tab-' + p).addEventListener('keydown', function (e) {
          var j = e.key === 'ArrowRight' ? i + 1 : e.key === 'ArrowLeft' ? i - 1
            : e.key === 'Home' ? 0 : e.key === 'End' ? PESTANAS.length - 1 : null
          if (j === null) return
          e.preventDefault()
          var otra = PESTANAS[(j + PESTANAS.length) % PESTANAS.length]
          mostrarPestana(otra)
          el('tab-' + otra).focus()
        })
      })

      // ── Varias lineas a la vez (odd/tasks/varias-lineas-y-segundo-cerebro.md, L4) ──
      // El worker deja las lineas dentro de `sidecar.lineas` (la primera es la principal) y
      // el estado de cada una que no es la principal en `sidecars`. Lo que `wa-scope` sabe de ellas vive
      // aparte: su tablero, su actividad y su lista en `porLinea`, y sus informes en
      // `informesPorLinea`. Con una sola linea nada de esto se ve ni se lee de mas.
      var registroLineas = []
      var lineaVista = null
      var firmaVista = null
      function lineasVinculadas () {
        return registroLineas.filter(function (l) { return typeof l.cuenta === 'string' && l.cuenta })
      }
      /** La linea que se mira, si NO es la principal; null si es la principal. */
      function otraLineaVista () {
        var vinc = lineasVinculadas()
        if (!lineaVista || vinc.length < 2 || vinc[0].cuenta === lineaVista) return null
        for (var i = 0; i < vinc.length; i++) if (vinc[i].cuenta === lineaVista) return vinc[i]
        return null
      }
      function numeroDeLinea (l, sc) {
        if (sc && typeof sc.me === 'string' && sc.me) return sc.me
        return '+' + String(l.cuenta).replace(/^pn:/, '')
      }
      function renderVistaLineas (sc, estados) {
        var vinc = lineasVinculadas()
        var fila = el('linea-vista-fila')
        if (vinc.length < 2) { fila.hidden = true; lineaVista = null; return }
        var nombres = vinc.map(function (l, i) {
          return numeroDeLinea(l, i === 0 ? sc : (estados || {})[l.carpeta])
        })
        var grupo = el('linea-vista')
        var firma = JSON.stringify([vinc.map(function (l) { return l.cuenta }), nombres])
        if (firma !== firmaVista) {
          firmaVista = firma
          grupo.textContent = ''
          vinc.forEach(function (l, i) {
            var b = document.createElement('button')
            b.type = 'button'
            b.setAttribute('data-value', l.cuenta)
            b.textContent = nombres[i]
            b.addEventListener('click', function () {
              var nueva = vinc[0].cuenta === l.cuenta ? null : l.cuenta
              if (nueva === lineaVista) return
              lineaVista = nueva
              renderVistaLineas(sc, estados)
              reload()
            })
            grupo.appendChild(b)
          })
        }
        var actual = otraLineaVista() ? lineaVista : vinc[0].cuenta
        Array.prototype.forEach.call(grupo.querySelectorAll('button'), function (b) {
          b.setAttribute('aria-pressed', b.getAttribute('data-value') === actual ? 'true' : 'false')
        })
        fila.hidden = false
      }

      function reload() {
        // Mirando otra linea, lo suyo sale de `porLinea` en una sola lectura y no de las
        // claves de la principal.
        var otra = otraLineaVista()
        var lee = function (k) { return call('storage.get', { key: k }) }
        var nada = Promise.resolve(null)
        return Promise.all([
          otra ? nada : lee('activity'),
          lee('projects'),
          lee('sidecar'),
          otra ? nada : lee('chats'),
          otra ? nada : lee('chatsAccount'),
          otra ? nada : lee('board'),
          // El periodo guardado, solo hasta tenerlo: despues manda lo que se elige aca.
          periodoLeido ? Promise.resolve(null) : call('storage.get', { key: 'boardPeriod' }),
          // Los informes solo con su pestana a la vista: es la clave mas grande.
          pestana === 'reports' ? lee(otra ? 'informesPorLinea' : 'reports') : nada,
          nada,
          // Con una sola linea no se pide: el sondeo no gasta cupo de mas.
          registroLineas.length > 1 ? lee('sidecars') : nada,
          otra ? lee('porLinea') : nada
        ]).then(function (results) {
          var principalLeida = stored(results[2])
          var lineasLeidas = principalLeida && principalLeida.lineas
          if (Array.isArray(lineasLeidas)) {
            registroLineas = lineasLeidas.filter(function (l) {
              return esObjeto(l) && typeof l.carpeta === 'string'
            })
          }
          var estados = esObjeto(stored(results[9])) ? stored(results[9]) : {}
          renderVistaLineas(stored(results[2]), estados)
          // La linea que se eligio pudo dejar de estar entre una vuelta y otra.
          var sigue = otraLineaVista()
          if (otra && (!sigue || sigue.cuenta !== otra.cuenta)) return reload()
          if (otra) otra = sigue
          if (otra) {
            var propio = esObjeto(stored(results[10])) ? stored(results[10])[otra.cuenta] : null
            propio = esObjeto(propio) ? propio : {}
            var sobre = function (v) { return { ok: true, value: { value: v } } }
            results[0] = sobre(propio.activity)
            results[2] = sobre(estados[otra.carpeta] || null)
            results[3] = sobre(propio.chats)
            results[4] = sobre(propio.chatsAccount)
            results[5] = sobre(propio.board)
            if (results[7]) {
              var informes = stored(results[7])
              results[7] = sobre(esObjeto(informes) ? informes[otra.cuenta] : null)
            }
            cuentaVinculada = otra.cuenta
          }
          var sc = stored(results[2])
          if (sc && typeof sc.cuenta === 'string' && sc.cuenta) cuentaVinculada = sc.cuenta
          var a = stored(results[0]) || {}
          if (!deEstaLinea(a.account)) {
            a = { account: cuentaVinculada, pending: [], recent: [], running: false,
              syncedAt: null, esperandoLinea: true, mapped: 0, authorized: 0,
              run: { state: 'never', startedAt: null, endedAt: null } }
          }
          var chats = deEstaLinea(stored(results[4])) ? stored(results[3]) : null
          // El catalogo de proyectos aceptados: lo que ofrece "Cambiar proyecto".
          var cat = stored(results[1])
          proyectosAceptados = Array.isArray(cat) ? cat.filter(function (p) {
            return esObjeto(p) && typeof p.id === 'string' && p.id
          }) : []
          var tablero = stored(results[5])
          var guardado = periodoLeido ? null : stored(results[6])
          alSoltar(function () {
            // Un rechazo del host no es "no hay nada guardado": se vuelve a pedir.
            if (!periodoLeido && results[6] && results[6].ok) {
              periodoLeido = true
              if (PERIODOS.indexOf(guardado) >= 0) periodo = guardado
              pintarPeriodo()
            }
            actividadActual = a
            renderSynced(a)
            renderLinea(sc)
            renderCobertura(a, chats)
            renderRun(a, esObjeto(tablero) ? tablero : null)
            renderBoard(tablero)
            ajustarAlto()
            // Un rechazo del host no borra lo que ya se ve.
            if (results[7] && results[7].ok) {
              informesActual = stored(results[7])
              informesLeidos = true
            }
            if (pestana === 'reports') renderInformes()
          })
        })
      }

      // Con el puntero apretado dentro del panel, lo que trae una relectura espera a que se
      // suelte. Apretar en el panel desde otra parte de Orca le da foco a la ventana y el
      // foco relee: si el tablero se repinta entre el `pointerdown` y el `pointerup`, el
      // elemento apretado ya no es el que se suelta y el navegador no manda el `click`.
      // Solo se guarda la ultima pintura (es la mas nueva) y nunca se descarta. Un repintado
      // forzado que llega en el medio (el veredicto de una accion) va despues de ella, para
      // que pinte el tablero nuevo y no el que habia.
      var apretado = false
      var pintarAlSoltar = null
      var repintarPendiente = false
      function alSoltar (pintar) {
        if (apretado) { pintarAlSoltar = pintar; return }
        pintar()
      }
      function repintarAlSoltar () {
        if (apretado) { repintarPendiente = true; return }
        repintar()
      }
      function soltar () {
        if (!apretado) return
        apretado = false
        // Despues del `click`, que el navegador manda en la misma tanda que el `pointerup`.
        setTimeout(function () {
          if (apretado) return
          var pintar = pintarAlSoltar
          var forzar = repintarPendiente
          pintarAlSoltar = null
          repintarPendiente = false
          if (pintar) pintar()
          if (forzar) repintar()
        }, 0)
      }
      window.addEventListener('pointerdown', function () { apretado = true }, true)
      window.addEventListener('pointerup', soltar, true)
      window.addEventListener('pointercancel', soltar, true)
      // Si el puntero se suelta fuera del panel no llega `pointerup`: perder el foco tambien
      // suelta, o el tablero quedaria congelado.
      window.addEventListener('blur', soltar)

      var timer = null
      function startPolling() {
        if (timer) return
        timer = setInterval(function () {
          if (document.visibilityState === 'visible') reload()
        }, 8000)
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') { reload(); startPolling() }
        else if (timer) { clearInterval(timer); timer = null }
      })
      window.addEventListener('focus', reload)

      el('refresh').addEventListener('click', function (event) {
        // Solo relee lo que ya esta guardado. El panel no puede ejecutar nada, asi que
        // los datos los refresca `wa-scope sync` desde afuera (el precheck, cada 2 min).
        // Por eso al lado esta el sello de hora: dice que tan vieja es esta foto.
        var b = event.currentTarget
        b.disabled = true
        Promise.resolve(reload()).then(function () {
          setTimeout(function () { b.disabled = false }, 400)
        })
      })

      applyStrings()
      reload().then(startPolling)
    </script>
  </body>
</html>
