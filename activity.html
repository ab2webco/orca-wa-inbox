<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WhatsApp</title>
    <style>
      /* El host inyecta una lista corta de tokens en el <style> del shell
         (PANEL_DESIGN_TOKEN_ALLOWLIST, orca-oss src/shared/plugins/plugin-panel-shell.ts:34)
         y pone light/dark en <html>. Nada mas llega aca: ni utilidades de Tailwind,
         ni --radius-md, ni la tipografia de la app. */
      :root {
        color-scheme: light dark;
        /* De los radios solo viene --radius; md se calcula con el mismo factor que
           main.css:122, para no inventar un radio por elemento. */
        --radius-md: calc(var(--radius, 0.625rem) * 0.8);
        /* Respaldos para cuando el host no inyecta nada (host viejo, o el arnes
           jsdom). Son los valores reales de main.css, no un gris inventado: antes
           eran solo oscuros y el panel salia ilegible en cuanto el tema era claro. */
        --fb-background: #fff; --fb-foreground: #0a0a0a;
        --fb-primary: #171717;
        --fb-secondary: #f5f5f5; --fb-secondary-foreground: #171717;
        --fb-muted-foreground: #737373;
        --fb-accent: #f5f5f5; --fb-accent-foreground: #171717;
        --fb-destructive: #e40014;
        --fb-border: #e5e5e5; --fb-ring: #a1a1a1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fb-background: #0a0a0a; --fb-foreground: #fafafa;
          --fb-primary: #e5e5e5;
          --fb-secondary: #262626; --fb-secondary-foreground: #fafafa;
          --fb-muted-foreground: #a1a1a1;
          --fb-accent: #404040; --fb-accent-foreground: #fafafa;
          --fb-destructive: #ff6568;
          --fb-border: rgb(255 255 255 / 0.07); --fb-ring: #737373;
        }
      }
      /* Los widgets nativos siguen al tema real del host, no a la preferencia del
         sistema. */
      html.light { color-scheme: light; }
      html.dark { color-scheme: dark; }
      * { box-sizing: border-box; }
      /* Sin padding en el body: el iframe se monta a sangre (PluginPanel.tsx:231,
         h-full w-full) y los paneles nativos de Orca ponen el relleno adentro de
         cada bloque, para que los filetes lleguen a los bordes. El horizontal es
         12 px, el px-3 de la casa (PortsPanel.tsx:335). */
      body {
        margin: 0; padding: 0 0 16px;
        /* Geist es la fuente de la app, pero el iframe no ve sus @font-face: pedirla
           solo daria un fallback distinto en cada maquina. Se queda el del sistema. */
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px; letter-spacing: 0.01em;
        color: var(--foreground, var(--fb-foreground));
        background: var(--background, var(--fb-background));
      }
      /* Cabecera del panel como las nativas: px-3 py-2 y un filete abajo. */
      header { display: flex; align-items: center; justify-content: space-between;
               gap: 8px; margin: 0 0 8px; padding: 8px 12px;
               border-bottom: 1px solid var(--border, var(--fb-border)); }
      header .meta { margin-left: auto; }
      header button {
        font: inherit; font-size: 13px; line-height: 1; padding: 3px 8px; cursor: pointer;
        border: 1px solid var(--border, var(--fb-border));
        border-radius: var(--radius-md);
        background: var(--secondary, var(--fb-secondary));
        color: var(--muted-foreground, var(--fb-muted-foreground));
        transition: background-color 90ms ease, color 90ms ease;
      }
      /* Hover por --accent, que es el token de superficie de hover; el filete se
         queda en --border porque --ring es enfasis fuerte, no decoracion. */
      header button:hover { background: var(--accent, var(--fb-accent));
                            color: var(--accent-foreground, var(--fb-accent-foreground)); }
      header button:active { transform: translateY(1px); }
      header button[disabled] { opacity: 0.5; cursor: default; }
      h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
      .meta { font-size: 11px; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      /* Parrafos de servicio: mismo relleno horizontal que las filas. */
      .nota { margin: 0 0 8px; padding: 0 12px; }
      .nota:empty { display: none; }
      /* "corriendo" ya lo dice la palabra de al lado; el punto solo tiene que pesar,
         y --primary es el token de enfasis. La allowlist no tiene color de exito. */
      .dot { display: inline-block; width: 6px; height: 6px; border-radius: 9999px;
             background: var(--primary, var(--fb-primary));
             margin-right: 5px; vertical-align: middle; }
      /* Etiqueta meta de 11 px: el STYLEGUIDE la fija en 600 y 0.05em, igual que
         PortsPanel.tsx:336. */
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
           color: var(--muted-foreground, var(--fb-muted-foreground));
           margin: 14px 0 6px; padding: 0 12px; font-weight: 600; }
      h2:first-of-type { margin-top: 0; }
      .item { padding: 7px 12px; border-bottom: 1px solid var(--border, var(--fb-border)); }
      .item:last-child { border-bottom: 0; }
      .line1 { display: flex; gap: 6px; align-items: baseline; }
      .who { font-weight: 500; }
      .chat { color: var(--muted-foreground, var(--fb-muted-foreground)); font-size: 11px; }
      .when { margin-left: auto; color: var(--muted-foreground, var(--fb-muted-foreground));
              font-size: 11px; white-space: nowrap; }
      /* Un mensaje sin cuerpo no se puede confundir con uno cuyo cuerpo si se leyo. */
      .text { color: var(--muted-foreground, var(--fb-muted-foreground)); margin-top: 2px;
              line-height: 1.4; overflow-wrap: anywhere; }
      /* Las tres clases de aviso, sin tres tonos: la allowlist no los tiene. Se
         separan por peso y superficie — mencion en texto pleno y 600, directo como
         superficie --accent, media con filete punteado. */
      .tag { font-size: 10px; border: 1px solid var(--border, var(--fb-border));
             border-radius: 9999px; padding: 0 6px;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .tag.mencion { color: var(--foreground, var(--fb-foreground)); font-weight: 600; }
      .tag.directo { background: var(--accent, var(--fb-accent));
                     color: var(--accent-foreground, var(--fb-accent-foreground));
                     border-color: transparent; }
      .tag.media { border-style: dashed; }
      .empty { color: var(--muted-foreground, var(--fb-muted-foreground)); padding: 8px 12px; }
      .acts { display: flex; gap: 10px; margin-top: 5px; }
      .acts button {
        font: inherit; font-size: 11px; padding: 3px 10px; cursor: pointer;
        border: 1px solid var(--border, var(--fb-border));
        border-radius: var(--radius-md);
        background: var(--secondary, var(--fb-secondary));
        color: var(--secondary-foreground, var(--fb-secondary-foreground));
        transition: background-color 90ms ease, color 90ms ease;
      }
      .acts button:hover { background: var(--accent, var(--fb-accent));
                           color: var(--accent-foreground, var(--fb-accent-foreground));
                           text-decoration: underline; }
      .acts button:active { transform: translateY(1px); }
      .acts button[disabled] { opacity: 0.5; cursor: default; }
      .acts button.mute { color: var(--muted-foreground, var(--fb-muted-foreground)); }
      header button:focus-visible, .acts button:focus-visible {
        outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px;
      }
      /* Tomado = enfasis, no color de exito: la barra va en --primary. El relleno
         izquierdo compensa los 2 px para que el texto no se corra. */
      .item.taken { border-left: 2px solid var(--primary, var(--fb-primary));
                    padding-left: 10px; }
      .done { font-size: 11px; font-weight: 500;
              color: var(--foreground, var(--fb-foreground)); margin-top: 4px; }
      /* El renglon de la corrida contesta "por que no hace nada": tiene que leerse
         ANTES que la pista de abajo, que es texto de servicio. Sin color propio —la
         allowlist no tiene uno de exito—, la jerarquia la dan el texto pleno y el 500,
         que es lo mismo que hace `.done`. */
      .run { color: var(--foreground, var(--fb-foreground)); font-weight: 500; }
      /* Dos grados de mala noticia, con los dos unicos tokens que hay para eso. Una
         sincronizacion vieja no es un error: solo avisa que lo de abajo puede estar
         desactualizado, asi que va en texto pleno y 600 dentro de una linea apagada.
         La allowlist no tiene warning/ambar y no se fabrica uno: pintarla de rojo
         gritaba un fallo que no existe. */
      .vieja { color: var(--foreground, var(--fb-foreground)); font-weight: 600; }
      /* "sin datos" y el error de una accion si son fallos: --destructive. */
      .stale { color: var(--destructive, var(--fb-destructive)); }
      code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
    </style>
  </head>
  <body>
    <header>
      <h1 data-t="title">WhatsApp</h1>
      <span class="meta" id="synced"></span>
      <button id="refresh" data-t-title="refreshTitle">&#8635;</button>
    </header>

    <p class="meta nota" id="note"></p>

    <!-- Lo primero que hay que poder contestar de un vistazo: esta viva la linea, y
         sobre cuanto puede actuar el agente. Sin esto, "no hay nada pendiente" y "no
         estoy conectado" se leen igual. -->
    <p class="meta nota" id="linea"></p>
    <p class="meta nota" id="cobertura"></p>

    <h2 data-t="pending">Esperando respuesta</h2>
    <!-- Una sola linea, arriba de la lista: sobre cuantas conversaciones reviso el
         agente y que encontro — o por que no reviso. Sin ella, "no hay nada que
         hacer", "nunca corrio" y "se murio a medias" se ven exactamente iguales. -->
    <p class="meta nota" id="runline"></p>
    <p class="meta nota" data-t="hint"></p>
    <div id="pending"><p class="empty" data-t="loading">Cargando…</p></div>

    <h2 data-t="recent">Lo ultimo que hizo</h2>
    <div id="recent"><p class="empty" data-t="nothingYet">Nada todavia.</p></div>

    <script>
      'use strict'
      // El shell del panel no inyecta el idioma, asi que sale de navigator.language,
      // que en el renderer de Electron refleja el idioma del app.
      var STRINGS = {
        es: {"title": "WhatsApp", "pending": "Esperando respuesta", "recent": "Lo ultimo que hizo", "loading": "Cargando…", "nothingYet": "Nada todavia.", "nothingPending": "Nada pendiente en las conversaciones que tiene autorizadas.", "nothingAuthorized1": "Tiene 1 conversacion configurada y esta en off.", "nothingAuthorized": "Tiene {n} conversaciones configuradas y todas en off.", "nothingMapped": "Todavia no ha autorizado ninguna conversacion.", "runNever": "Su agente todavia no ha revisado.", "runNow": "Revisando ahora…", "runCut": "La revision arranco y no volvio", "runFailed": "La ultima revision fallo", "runChecked1": "Reviso 1 conversacion", "runChecked": "Reviso {n} conversaciones", "runNone": "nada pendiente", "runWaiting1": "1 esperando", "runWaiting": "{n} esperando", "noData": "sin datos — corra <code>wa-scope sync</code>", "running": "corriendo", "image": "imagen", "mediaImage": "imagen", "mediaVideo": "video", "mediaPtt": "nota de voz", "mediaAudio": "audio", "mediaDocument": "documento", "mediaOther": "adjunto", "take": "Tomar", "ignore": "Ignorar", "taken": "lo toma tu agente", "hint": "Su agente atiende esto solo en su proxima corrida, hasta donde le permita cada conversacion. Marque solo para adelantarlo o para que no lo toque.", "refreshTitle": "Releer lo guardado",
              "kindDirecto": "directo", "kindMencion": "mencion", "kindRespuesta": "respuesta", "kindGrupo": "del grupo",
              "actTriage": "triage", "actIssue": "tarjeta abierta", "actDraft": "borrador",
              "actSent": "enviado", "actSkipped": "saltado", "actDenied": "denegado",
              "actClosed": "cierre avisado", "actFailed": "fallo", "actAlert": "aviso",
              "errNoId": "sin id de mensaje", "errRead": "no pude leer",
              "errSave": "no pude guardar", "lineaConectada": "Linea conectada", "lineaConectando": "Conectando la linea\u2026", "lineaSinVincular": "Falta escanear el codigo QR en Ajustes", "lineaCaida": "La linea esta caida", "cobertura": "El agente actua sobre {n} de {total} conversaciones", "coberturaSinTotal": "El agente actua sobre {n} conversaciones"},
        en: {"title": "WhatsApp", "pending": "Waiting on you", "recent": "Latest actions", "loading": "Loading…", "nothingYet": "Nothing yet.", "nothingPending": "Nothing pending in the conversations you allowed.", "nothingAuthorized1": "You have 1 conversation set up and it is off.", "nothingAuthorized": "You have {n} conversations set up and all of them are off.", "nothingMapped": "No conversation is authorized yet.", "runNever": "Your agent has not checked yet.", "runNow": "Checking now…", "runCut": "The run started and never came back", "runFailed": "Last run failed", "runChecked1": "Checked 1 conversation", "runChecked": "Checked {n} conversations", "runNone": "nothing pending", "runWaiting1": "1 waiting", "runWaiting": "{n} waiting", "noData": "no data — run <code>wa-scope sync</code>", "running": "running", "image": "image", "mediaImage": "image", "mediaVideo": "video", "mediaPtt": "voice note", "mediaAudio": "audio", "mediaDocument": "document", "mediaOther": "attachment", "take": "Take", "ignore": "Ignore", "taken": "your agent takes it", "hint": "Your agent handles this on its own on its next run, as far as each conversation allows. Mark only to move it up or to keep it away.", "refreshTitle": "Re-read what is stored",
              "kindDirecto": "direct", "kindMencion": "mention", "kindRespuesta": "reply", "kindGrupo": "in the group",
              "actTriage": "triage", "actIssue": "card opened", "actDraft": "draft",
              "actSent": "sent", "actSkipped": "skipped", "actDenied": "denied",
              "actClosed": "closing announced", "actFailed": "failed", "actAlert": "alert",
              "errNoId": "no message id", "errRead": "could not read",
              "errSave": "could not save", "lineaConectada": "Line connected", "lineaConectando": "Connecting the line\u2026", "lineaSinVincular": "The QR code still has to be scanned in Settings", "lineaCaida": "The line is down", "cobertura": "Your agent acts on {n} of {total} conversations", "coberturaSinTotal": "Your agent acts on {n} conversations"},
        pt: {"title": "WhatsApp", "pending": "Aguardando voce", "recent": "Ultimas acoes", "loading": "Carregando…", "nothingYet": "Nada ainda.", "nothingPending": "Nada pendente nas conversas que voce autorizou.", "nothingAuthorized1": "Voce tem 1 conversa configurada e ela esta em off.", "nothingAuthorized": "Voce tem {n} conversas configuradas e todas em off.", "nothingMapped": "Nenhuma conversa autorizada ainda.", "runNever": "Seu agente ainda nao revisou.", "runNow": "Revisando agora…", "runCut": "A revisao comecou e nao voltou", "runFailed": "A ultima revisao falhou", "runChecked1": "Revisou 1 conversa", "runChecked": "Revisou {n} conversas", "runNone": "nada pendente", "runWaiting1": "1 aguardando", "runWaiting": "{n} aguardando", "noData": "sem dados — rode <code>wa-scope sync</code>", "running": "rodando", "image": "imagem", "mediaImage": "imagem", "mediaVideo": "video", "mediaPtt": "nota de voz", "mediaAudio": "audio", "mediaDocument": "documento", "mediaOther": "anexo", "take": "Assumir", "ignore": "Ignorar", "taken": "seu agente assume", "hint": "Seu agente cuida disso sozinho na proxima rodada, ate onde cada conversa permitir. Marque apenas para adiantar ou para que nao toque.", "refreshTitle": "Reler o que esta salvo",
              "kindDirecto": "direto", "kindMencion": "mencao", "kindRespuesta": "resposta", "kindGrupo": "do grupo",
              "actTriage": "triagem", "actIssue": "cartao aberto", "actDraft": "rascunho",
              "actSent": "enviado", "actSkipped": "pulado", "actDenied": "negado",
              "actClosed": "fecho avisado", "actFailed": "falhou", "actAlert": "alerta",
              "errNoId": "sem id da mensagem", "errRead": "nao consegui ler",
              "errSave": "nao consegui salvar", "lineaConectada": "Linha conectada", "lineaConectando": "Conectando a linha\u2026", "lineaSinVincular": "Falta escanear o codigo QR em Ajustes", "lineaCaida": "A linha esta fora do ar", "cobertura": "Seu agente atua em {n} de {total} conversas", "coberturaSinTotal": "Seu agente atua em {n} conversas"}
      }
      var LANG = (function () {
        var tag = String(navigator.language || 'en').toLowerCase()
        if (tag.indexOf('es') === 0) return 'es'
        if (tag.indexOf('pt') === 0) return 'pt'
        return 'en'
      })()
      function t(key) { return (STRINGS[LANG] && STRINGS[LANG][key]) || STRINGS.en[key] || key }
      // `kind` y `action` son codigos estables que escribe el CLI, no frases: renombrar
      // uno rompe el panel en silencio. El texto que se ve sale de aca, en el idioma del
      // usuario; un codigo que este panel no conozca se pinta tal cual y no desaparece.
      var KIND_KEY = { directo: 'kindDirecto', mencion: 'kindMencion',
        respuesta: 'kindRespuesta', grupo: 'kindGrupo' }
      // Del adjunto se dice su TIPO: decir "imagen" de un audio seria peor que no
      // decir nada, y el tipo es lo que siempre se sabe.
      var MEDIA_KEY = { image: 'mediaImage', video: 'mediaVideo', ptt: 'mediaPtt',
                        audio: 'mediaAudio', document: 'mediaDocument' }
      var ACTION_KEY = {
        triage: 'actTriage', issue: 'actIssue', draft: 'actDraft', sent: 'actSent',
        skipped: 'actSkipped', denied: 'actDenied', closed: 'actClosed',
        failed: 'actFailed', alert: 'actAlert'
      }
      // Sin respaldo el codigo crudo es el respaldo: un valor que este panel todavia no
      // conoce se ve feo pero no miente, que es lo que importa en una lista de pendientes.
      function porCodigo(mapa, code, respaldo) {
        var key = mapa[code]
        if (key) return t(key)
        if (respaldo !== undefined) return respaldo
        return String(code == null ? '' : code)
      }

      function applyStrings() {
        Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (node) {
          node.innerHTML = t(node.dataset.t)
        })
        Array.prototype.forEach.call(document.querySelectorAll('[data-t-ph]'), function (node) {
          node.placeholder = t(node.dataset.tPh)
        })
        Array.prototype.forEach.call(document.querySelectorAll('[data-t-title]'), function (node) {
          node.title = t(node.dataset.tTitle)
          node.setAttribute('aria-label', t(node.dataset.tTitle))
        })
      }

      var seq = 0, pending = {}
      var el = function (id) { return document.getElementById(id) }

      function call(action, params) {
        return new Promise(function (resolve) {
          var requestId = 'req-' + ++seq
          pending[requestId] = resolve
          window.parent.postMessage(
            { type: 'orca-panel-action', requestId: requestId, action: action, params: params },
            '*')
        })
      }

      window.addEventListener('message', function (event) {
        var d = event.data
        if (!d || d.type !== 'orca-panel-action-result') return
        var resolve = pending[d.requestId]
        if (!resolve) return
        delete pending[d.requestId]
        resolve(d)
      })

      // storage.get devuelve { value: <dato> } y el bridge lo envuelve otra vez.
      function stored(result) {
        if (!result || !result.ok || !result.value) return null
        return result.value.value === undefined ? null : result.value.value
      }

      function esc(text) {
        return String(text == null ? '' : text)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      }

      function hora(stamp) {
        var m = /\d{2}:\d{2}/.exec(String(stamp || ''))
        return m ? m[0] : esc(stamp)
      }

      // Los textos con {n} se arman aca y no concatenando: en portugues y en ingles el
      // numero no cae en el mismo lugar de la frase.
      // Acepta un numero suelto -el caso de siempre- o un objeto con varios huecos.
      // Un texto con dos cifras ("1 de 298") no se puede armar con un solo {n}.
      function fmt(key, n) {
        var texto = t(key)
        if (n !== null && typeof n === 'object') {
          for (var k in n) {
            if (Object.prototype.hasOwnProperty.call(n, k)) {
              texto = texto.split('{' + k + '}').join(String(n[k]))
            }
          }
          return texto
        }
        return texto.replace('{n}', String(n))
      }

      /** Que decir con la lista vacia. Tres finales distintos y hasta hoy uno solo:
       *  no hay nada pendiente, todo quedo en `off` — que es configuracion y no
       *  ausencia de trabajo — o todavia no se autorizo ni una conversacion. */
      function vacioTexto(activity) {
        var mapped = activity && activity.mapped
        var authorized = activity && activity.authorized
        if (typeof mapped === 'number' && typeof authorized === 'number') {
          if (!mapped) return t('nothingMapped')
          if (!authorized) {
            return mapped === 1 ? t('nothingAuthorized1')
              : fmt('nothingAuthorized', mapped)
          }
        }
        return t('nothingPending')
      }

      function renderPending(items, activity) {
        if (!items || !items.length) {
          el('pending').innerHTML = '<p class="empty">' + vacioTexto(activity) + '</p>'
          return
        }
        el('pending').innerHTML = items.map(function (m) {
          var taken = m.decision === 'take'
          return '<div class="item' + (taken ? ' taken' : '') + '"><div class="line1">' +
            '<span class="who">' + esc(m.sender) + '</span>' +
            '<span class="tag ' + esc(m.kind) + '">' +
            esc(porCodigo(KIND_KEY, m.kind)) + '</span>' +
            (m.hasMedia
              ? '<span class="tag media">' +
                esc(m.mediaKind ? porCodigo(MEDIA_KEY, m.mediaKind, t('mediaOther'))
                                : t('image')) + '</span>'
              : '') +
            '<span class="when">' + hora(m.date) + '</span></div>' +
            '<div class="chat">' + esc(m.chat) + '</div>' +
            '<div class="text">' + esc(m.text) + '</div>' +
            (taken
              ? '<div class="done">&#10003; ' + t('taken') + '</div>'
              : '<div class="acts">' +
                '<button data-take="' + esc(m.stanzaId) + '">' + t('take') + '</button>' +
                '<button class="mute" data-ignore="' + esc(m.stanzaId) + '">' + t('ignore') +
                '</button></div>') +
            '</div>'
        }).join('')

        Array.prototype.forEach.call(el('pending').querySelectorAll('[data-take]'), function (b) {
          b.addEventListener('click', function () { decide(b.dataset.take, 'take', b) })
        })
        Array.prototype.forEach.call(el('pending').querySelectorAll('[data-ignore]'), function (b) {
          b.addEventListener('click', function () { decide(b.dataset.ignore, 'ignore', b) })
        })
      }

      function renderRecent(items) {
        if (!items || !items.length) {
          // Se pinta con t(): un data-t inyectado despues de applyStrings no lo traduce
          // nadie, y el panel se quedaba en espanol en los otros dos idiomas.
          el('recent').innerHTML = '<p class="empty">' + t('nothingYet') + '</p>'
          return
        }
        el('recent').innerHTML = items.map(function (r) {
          return '<div class="item"><div class="line1">' +
            '<span class="who">' + esc(porCodigo(ACTION_KEY, r.action)) + '</span>' +
            (r.issue ? '<span class="tag">' + esc(r.issue) + '</span>' : '') +
            '<span class="when">' + hora(r.ts) + '</span></div>' +
            (r.chat ? '<div class="chat">' + esc(r.chat) + '</div>' : '') +
            (r.detail ? '<div class="text">' + esc(r.detail) + '</div>' : '') +
            '</div>'
        }).join('')
      }

      // La actividad la arma `wa-scope sync`, no el panel: un panel no puede ejecutar
      // nada, solo leer storage. Si el sello de tiempo esta viejo, decirlo es mas
      // honesto que mostrar una lista que parece viva y no lo esta.
      function viejo(stamp) {
        var ms = Date.parse(String(stamp || '').replace(' ', 'T'))
        return !ms || (Date.now() - ms) > 30 * 60000
      }

      // Pasada media hora la hora sola ya no ubica: "09:33" de anteayer se lee como de
      // hace un rato, asi que ahi se muestra la marca entera.
      function cuando(stamp) {
        var s = String(stamp == null ? '' : stamp)
        if (viejo(s)) return s
        var m = /\d{2}:\d{2}/.exec(s)
        return m ? m[0] : s
      }

      function renderSynced(activity) {
        var when = activity && activity.syncedAt
        if (!when) {
          el('synced').innerHTML = '<span class="stale">' + t('noData') + '</span>'
          return
        }
        el('synced').innerHTML =
          (activity.running ? '<span class="dot"></span>' + t('running') + ' · ' : '') +
          (viejo(when) ? '<span class="vieja">' + esc(when) + '</span>' : esc(when))
      }

      /** Si la linea esta viva, y cual. "No hay nada pendiente" y "no estoy conectado"
       *  se leian exactamente igual: una lista vacia. Son lo contrario, y cual de las
       *  dos es decide si el dueno tiene que hacer algo o no.
       *
       *  El numero va porque el dueno puede tener mas de una linea y porque, tras
       *  escanear un QR, saber CUAL quedo vinculada es la unica forma de notar que se
       *  escaneo con el telefono equivocado. */
      function renderLinea (sc) {
        var nodo = el('linea')
        if (!sc || typeof sc !== 'object') { nodo.textContent = ''; return }
        var clase = 'meta nota'
        var texto
        if (sc.connection === 'open') {
          texto = t('lineaConectada')
          var yo = sc.me || null
          if (yo) texto += ' · ' + esc(yo)
        } else if (sc.exited || sc.motivo === 'sesion-cerrada') {
          texto = t('lineaCaida')
          clase += ' stale'
        } else if (sc.qr) {
          texto = t('lineaSinVincular')
          clase += ' vieja'
        } else {
          texto = t('lineaConectando')
          clase += ' vieja'
        }
        nodo.textContent = texto
        nodo.className = clase
      }

      /** Sobre cuanto puede actuar el agente. Un "revise 1 conversacion" sin decir de
       *  cuantas no informa nada: 1 de 1 es cobertura completa y 1 de 298 es un agente
       *  que casi no ve. Es el mismo numero y significan lo contrario. */
      function renderCobertura (a, chats) {
        var nodo = el('cobertura')
        var total = Array.isArray(chats) ? chats.length : null
        var vivas = a && a.authorized != null ? a.authorized : null
        if (vivas == null) { nodo.textContent = ''; return }
        nodo.className = 'meta nota' + (vivas === 0 ? ' vieja' : '')
        nodo.textContent = total == null
          ? fmt('coberturaSinTotal', vivas)
          : fmt('cobertura', { n: vivas, total: total })
      }

      /** La linea honesta, arriba de la lista. Cinco finales y ninguno se parece a
       *  otro: reviso y no habia nada, reviso y hay tanto, nunca reviso, arranco y no
       *  volvio, o fallo por algo. Sin ella los cinco eran una lista vacia, y el dueno
       *  concluia lo unico que se puede concluir mirando eso: que no funciona.
       *
       *  Sin color propio: la allowlist del host no trae ni exito ni advertencia. El
       *  peso lo dan las dos clases que ya existen — `vieja` para lo que pide atencion
       *  y `stale` (--destructive) para lo que si es un fallo. */
      function renderRun(activity, pendientesAhora) {
        var nodo = el('runline')
        var r = activity && activity.run
        var clase = 'meta nota run'
        var texto = ''
        if (!r) {
          // Un CLI viejo no manda `run`. Callarse es lo honesto: afirmar que nunca
          // corrio seria decir algo que ese CLI no cuenta.
          nodo.textContent = ''
          nodo.className = 'meta nota'
          return
        }
        if (r.state === 'running') {
          texto = t('runNow')
        } else if (r.state === 'never') {
          texto = t('runNever')
          clase += ' vieja'
        } else if (r.state === 'interrupted') {
          texto = t('runCut') + (r.startedAt ? ' · ' + cuando(r.startedAt) : '')
          clase += ' vieja'
        } else if (r.state === 'failed') {
          // El motivo va tal cual: lo escribio quien fallo y es el unico dato que
          // dice que paso de verdad. Traducirlo seria inventarlo.
          texto = t('runFailed') + (r.reason ? ': ' + r.reason : '') +
            (r.endedAt ? ' · ' + cuando(r.endedAt) : '')
          clase += ' stale'
        } else {
          var n = r.looked == null ? 0 : r.looked
          // El pendiente de AHORA, no el que dejo anotado la corrida. Se contradecian
          // en pantalla: la cabecera decia "nada pendiente" con dos mensajes listados
          // justo debajo, porque `r.pending` es de la ultima corrida y la lista se
          // pinta con `activity.pending`, que se actualiza en cada sync. Un panel que
          // se contradice consigo mismo no se cree ni cuando acierta.
          var p = pendientesAhora == null
            ? (r.pending == null ? 0 : r.pending)
            : pendientesAhora
          texto = (n === 1 ? t('runChecked1') : fmt('runChecked', n)) + ' · ' +
            (p === 0 ? t('runNone')
              : p === 1 ? t('runWaiting1') : fmt('runWaiting', p)) +
            (r.endedAt ? ' · ' + cuando(r.endedAt) : '')
          if (viejo(r.endedAt)) clase += ' vieja'
        }
        nodo.textContent = texto
        nodo.className = clase
      }

      // El panel no puede ejecutar nada; lo unico que puede hacer es dejar la decision
      // escrita en storage. `wa-scope` la lee y el agente la respeta en su proxima
      // corrida: tomar = lo atiende hasta donde le permita esa conversacion, ignorar = no
      // vuelve a aparecer.
      function decide(stanzaId, decision, button) {
        if (!stanzaId) { note(t('errNoId'), true); return }
        if (button) { button.disabled = true; button.textContent = '…' }
        return call('storage.get', { key: 'decisions' }).then(function (r) {
          if (!r.ok) throw new Error(r.error || r.errorCode || t('errRead'))
          var next = stored(r) || {}
          next[stanzaId] = { decision: decision, at: new Date().toISOString() }
          return call('storage.set', { key: 'decisions', value: next })
        }).then(function (r) {
          // Sin esto una escritura rechazada se ve identica a una exitosa: nada pasa.
          if (!r || !r.ok) throw new Error((r && (r.error || r.errorCode)) || t('errSave'))
          note('')
          return reload()
        }).catch(function (error) {
          if (button) { button.disabled = false }
          note(String(error && error.message || error), true)
        })
      }

      function note(text, bad) {
        var node = el('note')
        node.textContent = text || ''
        node.className = 'meta' + (bad ? ' stale' : '')
      }

      function reload() {
        return Promise.all([
          call('storage.get', { key: 'activity' }),
          call('storage.get', { key: 'decisions' }),
          call('storage.get', { key: 'sidecar' }),
          call('storage.get', { key: 'chats' })
        ]).then(function (results) {
          var a = stored(results[0]) || {}
          var decided = stored(results[1]) || {}
          var vivos = (a.pending || []).filter(function (m) {
            var d = decided[m.stanzaId]
            return !d || d.decision !== 'ignore'
          })
          renderSynced(a)
          renderLinea(stored(results[2]))
          renderCobertura(a, stored(results[3]))
          renderRun(a, vivos.length)
          // Lo marcado se ve al instante, sin esperar al proximo `wa-scope sync`.
          renderPending(vivos.map(function (m) {
            var d = decided[m.stanzaId]
            return d ? Object.assign({}, m, { decision: d.decision }) : m
          }), a)
          renderRecent(a.recent)
        })
      }

      var timer = null
      function startPolling() {
        if (timer) return
        timer = setInterval(function () {
          if (document.visibilityState === 'visible') reload()
        }, 8000)
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') { reload(); startPolling() }
        else if (timer) { clearInterval(timer); timer = null }
      })
      window.addEventListener('focus', reload)

      el('refresh').addEventListener('click', function (event) {
        // Solo relee lo que ya esta guardado. El panel no puede ejecutar nada, asi que
        // los datos los refresca `wa-scope sync` desde afuera (el precheck, cada 2 min).
        // Por eso al lado esta el sello de hora: dice que tan vieja es esta foto.
        var b = event.currentTarget
        b.disabled = true
        Promise.resolve(reload()).then(function () {
          setTimeout(function () { b.disabled = false }, 400)
        })
      })

      applyStrings()
      reload().then(startPolling)
    </script>
  </body>
</html>
