<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WhatsApp</title>
    <style>
      /* El host inyecta una lista corta de tokens en el <style> del shell
         (PANEL_DESIGN_TOKEN_ALLOWLIST, orca-oss src/shared/plugins/plugin-panel-shell.ts:34)
         y pone light/dark en <html>. Nada mas llega aca: ni utilidades de Tailwind,
         ni --radius-md, ni la tipografia de la app. */
      :root {
        color-scheme: light dark;
        /* De los radios solo viene --radius; md se calcula con el mismo factor que
           main.css:122, para no inventar un radio por elemento. */
        --radius-md: calc(var(--radius, 0.625rem) * 0.8);
        /* Respaldos para cuando el host no inyecta nada (host viejo, o el arnes
           jsdom). Son los valores reales de main.css, no un gris inventado: antes
           eran solo oscuros y el panel salia ilegible en cuanto el tema era claro. */
        --fb-background: #fff; --fb-foreground: #0a0a0a;
        --fb-primary: #171717; --fb-primary-foreground: #fafafa;
        --fb-secondary: #f5f5f5; --fb-secondary-foreground: #171717;
        --fb-muted-foreground: #737373;
        --fb-accent: #f5f5f5; --fb-accent-foreground: #171717;
        --fb-destructive: #e40014;
        --fb-border: #e5e5e5; --fb-ring: #a1a1a1;
        --fb-card: #fff; --fb-muted: #f5f5f5;
        /* Los dos tonos de getPlaneStateTone (orca-oss TaskPage.tsx) que la allowlist no
           trae: emerald-500 y sky-500 de Tailwind. Y el texto de prioridad alta, el
           amber-700/amber-200 de los carriles de Orca (workspace-status.ts). */
        --tone-emerald: #10b981; --tone-sky: #0ea5e9; --tone-amber-text: #b45309;
        /* Los informes (I5). El mapa de calor es UNA rampa azul de la paleta validada
           (dataviz, references/palette.md: pasos 150/300/450/600 en claro y 650/500/350/200
           en oscuro), y el cero es una celda visible, no el fondo. Las dos series de barras
           son los dos primeros colores categoricos de esa paleta, cada tema con su paso. Lo
           "mejor" de una comparacion va en un verde de texto legible (emerald-700/300). */
        --rep-hm-0: #e8e8e6; --rep-hm-1: #b7d3f6; --rep-hm-2: #6da7ec; --rep-hm-3: #2a78d6;
        --rep-hm-4: #184f95; --rep-serie-1: #2a78d6; --rep-serie-2: #eb6834;
        --rep-mejor: #047857;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fb-background: #0a0a0a; --fb-foreground: #fafafa;
          --fb-primary: #e5e5e5; --fb-primary-foreground: #171717;
          --fb-secondary: #262626; --fb-secondary-foreground: #fafafa;
          --fb-muted-foreground: #a1a1a1;
          --fb-accent: #404040; --fb-accent-foreground: #fafafa;
          --fb-destructive: #ff6568;
          --fb-border: rgb(255 255 255 / 0.07); --fb-ring: #737373;
          --fb-card: #171717; --fb-muted: #262626;
          --tone-amber-text: #fde68a;
          --rep-hm-0: #2a2a2a; --rep-hm-1: #104281; --rep-hm-2: #256abf; --rep-hm-3: #5598e7;
          --rep-hm-4: #9ec5f4; --rep-serie-1: #3987e5; --rep-serie-2: #d95926;
          --rep-mejor: #6ee7b7;
        }
      }
      html.light { --tone-amber-text: #b45309;
        --rep-hm-0: #e8e8e6; --rep-hm-1: #b7d3f6; --rep-hm-2: #6da7ec; --rep-hm-3: #2a78d6;
        --rep-hm-4: #184f95; --rep-serie-1: #2a78d6; --rep-serie-2: #eb6834;
        --rep-mejor: #047857; }
      html.dark { --tone-amber-text: #fde68a;
        --rep-hm-0: #2a2a2a; --rep-hm-1: #104281; --rep-hm-2: #256abf; --rep-hm-3: #5598e7;
        --rep-hm-4: #9ec5f4; --rep-serie-1: #3987e5; --rep-serie-2: #d95926;
        --rep-mejor: #6ee7b7; }
      /* Los widgets nativos siguen al tema real del host, no a la preferencia del
         sistema. */
      html.light { color-scheme: light; }
      html.dark { color-scheme: dark; }
      * { box-sizing: border-box; }
      /* Sin padding en el body: el iframe se monta a sangre (PluginPanel.tsx:231,
         h-full w-full) y los paneles nativos de Orca ponen el relleno adentro de
         cada bloque, para que los filetes lleguen a los bordes. El horizontal es
         12 px, el px-3 de la casa (PortsPanel.tsx:335). */
      body {
        margin: 0; padding: 0 0 16px;
        /* La fuente de la app: el shell del host la embebe y la publica en --font-sans
           (plugin-panel-shell.ts, PANEL_BASE_STYLE). Sin host, la del sistema. */
        font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
        font-size: 13px; letter-spacing: 0.01em;
        color: var(--foreground, var(--fb-foreground));
        background: var(--background, var(--fb-background));
      }
      /* Cabecera del panel como las nativas: px-3 py-2 y un filete abajo. */
      header { display: flex; align-items: center; justify-content: space-between;
               gap: 8px; margin: 0 0 8px; padding: 8px 12px;
               border-bottom: 1px solid var(--border, var(--fb-border)); }
      header .meta { margin-left: auto; }
      header button {
        font: inherit; font-size: 13px; line-height: 1; padding: 3px 8px; cursor: pointer;
        border: 1px solid var(--border, var(--fb-border));
        border-radius: var(--radius-md);
        background: var(--secondary, var(--fb-secondary));
        color: var(--muted-foreground, var(--fb-muted-foreground));
        transition: background-color 90ms ease, color 90ms ease;
      }
      /* Hover por --accent, que es el token de superficie de hover; el filete se
         queda en --border porque --ring es enfasis fuerte, no decoracion. */
      header button:hover { background: var(--accent, var(--fb-accent));
                            color: var(--accent-foreground, var(--fb-accent-foreground)); }
      header button:active { transform: translateY(1px); }
      header button[disabled] { opacity: 0.5; cursor: default; }
      h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
      .meta { font-size: 11px; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      /* Parrafos de servicio: mismo relleno horizontal que las filas. */
      .nota { margin: 0 0 8px; padding: 0 12px; }
      .nota:empty { display: none; }
      /* Con dos lineas o mas: de cual es lo que se ve. Los botones se envuelven a 320 px:
         un numero entero no cabe dos veces en un renglon tan angosto. */
      #linea-vista-fila { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
      #linea-vista-fila[hidden] { display: none; }
      #linea-vista { flex-wrap: wrap; max-width: 100%; }
      /* "corriendo" ya lo dice la palabra de al lado; el punto solo tiene que pesar,
         y --primary es el token de enfasis. La allowlist no tiene color de exito. */
      .dot { display: inline-block; width: 6px; height: 6px; border-radius: 9999px;
             background: var(--primary, var(--fb-primary));
             margin-right: 5px; vertical-align: middle; }
      .when { margin-left: auto; color: var(--muted-foreground, var(--fb-muted-foreground));
              font-size: 11px; white-space: nowrap; }
      header button:focus-visible {
        outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px;
      }
      /* El renglon de la corrida contesta "por que no hace nada". Sin color propio —la
         allowlist no tiene uno de exito—, la jerarquia la dan el texto pleno y el 500. */
      .run { color: var(--foreground, var(--fb-foreground)); font-weight: 500; }
      /* Dos grados de mala noticia, con los dos unicos tokens que hay para eso. Una
         sincronizacion vieja no es un error: solo avisa que lo de abajo puede estar
         desactualizado, asi que va en texto pleno y 600 dentro de una linea apagada.
         La allowlist no tiene warning/ambar y no se fabrica uno: pintarla de rojo
         gritaba un fallo que no existe. */
      .vieja { color: var(--foreground, var(--fb-foreground)); font-weight: 600; }
      /* "sin datos" y el error de una accion si son fallos: --destructive. */
      .stale { color: var(--destructive, var(--fb-destructive)); }
      code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; }

      [hidden] { display: none !important; }
      /* ── El tablero ──────────────────────────────────────────────────────────────
         Copia el tablero de Plane en Orca (orca-oss/src/renderer/src/components):
         la barra de TaskPage.tsx, la fila de etapas de plane-board-minimap.tsx, la
         columna de plane-board-column.tsx y la tarjeta de plane-board-card.tsx. Las
         clases de Tailwind de alla se traducen a CSS con los tokens que el host inyecta;
         cada bloque nombra la clase que imita. */

      /* Los puntos de etapa: getPlaneStateTone (TaskPage.tsx) pinta lo terminado en
         esmeralda, lo empezado en cielo, lo cancelado en --destructive y el resto en
         apagado. La allowlist no trae esos dos tonos, asi que van los de la paleta de
         Tailwind que usa la app (emerald-500, sky-500). "Su decision" va en --primary:
         es la columna del dueno. */
      .dot-etapa { flex: none; display: inline-block; width: 8px; height: 8px;
                   border-radius: 9999px; border: 1px solid transparent;
                   background: var(--muted-foreground, var(--fb-muted-foreground)); }
      .dot-etapa.t-recibido { background: transparent;
                   border-color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .dot-etapa.t-decision { background: var(--primary, var(--fb-primary)); }
      .dot-etapa.t-trabajo, .dot-etapa.t-listo { background: var(--tone-sky); }
      .dot-etapa.t-listo { background: transparent; border-color: var(--tone-sky);
                   box-shadow: inset 0 0 0 2px var(--tone-sky); }
      .dot-etapa.t-respondido, .dot-etapa.t-cerrado { background: var(--tone-emerald); }
      .dot-etapa.t-cerrado { opacity: 0.55; }
      .dot-etapa.t-bloqueado { background: var(--destructive, var(--fb-destructive)); }

      /* La barra: `rounded-md border border-border/50 bg-muted/50 px-3 pt-2`. */
      .board-bar { margin: 0 12px 8px; padding: 8px 12px;
                   border: 1px solid var(--border, var(--fb-border));
                   border-radius: var(--radius-md);
                   background: color-mix(in srgb, var(--muted, var(--fb-muted)) 50%, transparent); }
      /* La fila de etapas (plane-board-minimap.tsx): `px-2 py-1 text-[11px] rounded-md`,
         elegida `border-border/60 bg-accent text-foreground`. Se desplaza dentro de si
         misma; la pagina nunca. */
      .chips { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin;
               margin: 0 -4px; padding: 0 4px 2px; }
      .chip { flex: none; display: inline-flex; align-items: center; gap: 6px;
              padding: 4px 8px; font: inherit; font-size: 11px; line-height: 16px;
              border: 1px solid transparent; border-radius: var(--radius-md);
              background: none; cursor: pointer;
              color: var(--muted-foreground, var(--fb-muted-foreground));
              transition: background-color 90ms ease, color 90ms ease; }
      .chip:hover { color: var(--foreground, var(--fb-foreground));
              background: color-mix(in srgb, var(--accent, var(--fb-accent)) 60%, transparent); }
      .chip[aria-pressed="true"] { color: var(--foreground, var(--fb-foreground));
              background: var(--accent, var(--fb-accent));
              border-color: var(--border, var(--fb-border)); }
      .chip:focus-visible { outline: 1px solid var(--ring, var(--fb-ring)); outline-offset: 0; }
      .chip-name { font-weight: 500; white-space: nowrap; }
      .chip-count { font-variant-numeric: tabular-nums; }
      /* Lo que espera al dueno pesa mas: la cuenta en pastilla, como la de la pestana. */
      .chip.fuerte .chip-name { color: var(--foreground, var(--fb-foreground)); font-weight: 600; }
      .chip.fuerte .chip-count { min-width: 18px; padding: 0 5px; border-radius: 9999px;
              text-align: center; font-weight: 600; font-size: 10px; line-height: 16px;
              background: var(--primary, var(--fb-primary));
              color: var(--primary-foreground, var(--fb-primary-foreground)); }

      .bar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
                 margin-top: 8px; }
      /* El buscador: `h-8 rounded-md border-border/50 bg-background pl-8 text-xs`, con la
         lupa `size-3.5` a la izquierda. */
      .search { position: relative; flex: 1 1 240px; min-width: 0; }
      .search > svg { position: absolute; left: 10px; top: 50%; width: 14px; height: 14px;
              transform: translateY(-50%); pointer-events: none;
              color: var(--muted-foreground, var(--fb-muted-foreground)); }
      svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round;
            stroke-linejoin: round; }
      .search input { display: block; width: 100%; height: 32px; padding: 0 32px;
              font: inherit; font-size: 12px; border-radius: var(--radius-md);
              border: 1px solid var(--input, var(--fb-border));
              background: var(--background, var(--fb-background));
              color: var(--foreground, var(--fb-foreground)); }
      .search input::placeholder { color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .search input:focus-visible { outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: -1px; }
      .search-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
              display: inline-flex; align-items: center; justify-content: center;
              width: 22px; height: 22px; padding: 0; border: 0; border-radius: var(--radius-md);
              background: none; cursor: pointer;
              color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .search-clear:hover { color: var(--foreground, var(--fb-foreground)); }
      .search-clear svg { width: 14px; height: 14px; }
      /* Lista/Tablero: el ToggleGroup `outline sm`, cada boton `h-7 px-2 text-[11px]`. */
      .seg { flex: none; display: inline-flex; overflow: hidden;
             border: 1px solid var(--border, var(--fb-border)); border-radius: var(--radius-md); }
      .seg button { display: inline-flex; align-items: center; gap: 6px; height: 28px;
             padding: 0 8px; font: inherit; font-size: 11px; border: 0; cursor: pointer;
             background: transparent; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .seg button + button { border-left: 1px solid var(--border, var(--fb-border)); }
      .seg button:hover { color: var(--foreground, var(--fb-foreground)); }
      .seg button[aria-pressed="true"] { background: var(--accent, var(--fb-accent));
             color: var(--accent-foreground, var(--fb-accent-foreground)); }
      .seg button:focus-visible { outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: -2px; }
      .seg svg { width: 14px; height: 14px; }
      #board-shown { white-space: nowrap; }

      /* Un solo estado vacio y en calma, como el de Plane: `px-4 py-10 text-center`. */
      .board-empty { margin: 8px 12px; padding: 40px 16px; text-align: center; }
      .board-empty .t { margin: 0; font-size: 13px; font-weight: 500;
              color: var(--foreground, var(--fb-foreground)); }
      .board-empty .b { margin: 6px auto 0; max-width: 360px; font-size: 12px;
              color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .board-empty.error .t { color: var(--destructive, var(--fb-destructive)); }
      .board-nada { margin: 0; padding: 32px 16px; text-align: center; font-size: 12px;
              color: var(--muted-foreground, var(--fb-muted-foreground)); }

      .board-body { display: flex; align-items: flex-start; gap: 12px; padding: 0 12px; }
      .board-main { flex: 1 1 auto; min-width: 0; }

      /* Las columnas: `flex gap-3 overflow-x-auto p-3`. Se desplazan DENTRO de su
         contenedor; la pagina nunca. Todas a la altura de la mas alta. */
      .board-cols { display: flex; gap: 12px; overflow-x: auto; align-items: stretch;
              padding-bottom: 8px; scrollbar-width: thin;
              /* El tope (I2): lo que queda de la ventana debajo de la fila de columnas, que
                 `ajustarAlto` mide. Las columnas se estiran a la mas alta hasta ahi y cada una
                 se desplaza adentro: la pagina ya no crece con las tarjetas. */
              max-height: var(--alto-tablero, calc(100vh - 16px)); }
      /* La columna: `w-72 rounded-md border border-border/50 bg-muted/20`. */
      .col { flex: 0 0 272px; min-width: 0; min-height: 240px; display: flex;
             flex-direction: column; border: 1px solid var(--border, var(--fb-border));
             border-radius: var(--radius-md);
             background: color-mix(in srgb, var(--muted, var(--fb-muted)) 20%, transparent); }
      /* Su cabecera: `gap-2 border-b px-3 py-2`, nombre `text-[12px] font-medium`, cuenta
         `ml-auto text-[11px] text-muted-foreground`. */
      .col-head { display: flex; align-items: center; gap: 8px; margin: 0; padding: 8px 12px;
             border-bottom: 1px solid var(--border, var(--fb-border));
             font-size: 12px; font-weight: 500; color: var(--foreground, var(--fb-foreground)); }
      .col-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .col-count { flex: none; margin-left: auto; font-size: 11px; font-weight: 400;
             font-variant-numeric: tabular-nums;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .col-body { display: flex; flex-direction: column; gap: 8px; padding: 8px;
             flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
      /* "Mostrar 20 mas": el boton apagado de la casa, a lo ancho de la columna. */
      .col-mas { flex: none; width: 100%; }
      .grupo .col-mas { width: auto; margin: 6px 12px 8px; }
      /* La columna sin casos se pliega a su cabecera, en vertical: dice su nombre y su
         cero sin ocupar el ancho de una columna llena. */
      .col.vacia { flex: 0 0 40px; }
      .col.vacia .col-head { flex-direction: column; gap: 10px; padding: 12px 0;
             border-bottom: 0; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .col.vacia .col-name { writing-mode: vertical-rl; overflow: visible; }
      .col.vacia .col-count { margin-left: 0; }
      /* "Su decision" con casos: un tinte de --primary, sin gritar. */
      .col.decision.con-casos { border-color: color-mix(in srgb, var(--primary, var(--fb-primary)) 35%, var(--border, var(--fb-border)));
             background: color-mix(in srgb, var(--primary, var(--fb-primary)) 4%, transparent); }
      /* Bloqueado: distinto pero no a gritos. El tinte de 4 % de los carriles de Orca
         (workspace-status.ts, `laneTint`) en --destructive, y el filete punteado. */
      .col.lane { border-style: dashed;
             background: color-mix(in srgb, var(--destructive, var(--fb-destructive)) 4%, transparent); }
      .col-more, .col-nada { margin: 0; padding: 2px 4px; font-size: 11px;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }

      /* La tarjeta: `flex flex-col gap-2 rounded-md border border-border/60 bg-card
         px-2.5 py-2 shadow-xs hover:bg-accent`. */
      .card { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px;
              font-size: 12px; line-height: 1.4; text-align: left; cursor: pointer;
              border: 1px solid var(--border, var(--fb-border));
              border-radius: var(--radius-md);
              background: var(--card, var(--fb-card));
              color: var(--card-foreground, var(--foreground, var(--fb-foreground)));
              box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
              transition: background-color 90ms ease, border-color 90ms ease; }
      .card:hover { background: color-mix(in srgb, var(--accent, var(--fb-accent)) 60%, var(--card, var(--fb-card))); }
      .card:focus-visible { outline: 1px solid var(--ring, var(--fb-ring)); outline-offset: 0; }
      .card.elegida { background: color-mix(in srgb, var(--accent, var(--fb-accent)) 55%, var(--card, var(--fb-card)));
              border-color: color-mix(in srgb, var(--ring, var(--fb-ring)) 60%, transparent); }
      /* Arriba: el numero `font-mono text-[11px] text-muted-foreground` y la prioridad
         `ml-auto text-[11px]`. Color solo para urgente y alta. */
      .card-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .card-id { flex: none; font-family: var(--font-mono, ui-monospace, Menlo, monospace);
              font-size: 11px; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .card-prio { flex: none; margin-left: auto; font-size: 11px;
              color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .card-prio.alta { color: var(--tone-amber-text); font-weight: 500; }
      .card-prio.urgente { color: var(--destructive, var(--fb-destructive)); font-weight: 600; }
      /* El titulo: `line-clamp-2 text-[13px] font-medium text-foreground`. */
      .card-title { margin: 0; font-size: 13px; font-weight: 500; line-height: 1.35;
              overflow-wrap: anywhere; color: var(--foreground, var(--fb-foreground)); }
      .clamp1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
      .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
      /* La linea apagada: `text-[11px] text-muted-foreground`; el chat se corta, la hora no. */
      .card-meta, .det-meta { display: flex; align-items: baseline; gap: 6px; min-width: 0;
              font-size: 11px; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .card-meta .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .card-meta .when, .det-meta .when { flex: none; margin-left: 0; }
      .card-meta .sep, .det-meta .sep { flex: none; }
      .card-exc { font-size: 11px; font-weight: 500; overflow-wrap: anywhere;
              color: var(--foreground, var(--fb-foreground)); }
      .card-blocked { font-size: 11px; overflow-wrap: anywhere;
              color: var(--destructive, var(--fb-destructive)); }
      .card-aprobada { font-size: 11px; font-weight: 500;
              color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .card-aprobada::before { content: "\2713  "; }
      /* El despacho al agente del proyecto: la linea de la etapa y, debajo, la que dice a
         quien se espera. Mismo peso que lo aprobado: es lo que paso con eso. */
      .card-despacho { font-size: 11px; font-weight: 500; overflow-wrap: anywhere;
              color: var(--foreground, var(--fb-foreground)); }
      .card-despacho > :first-child::before { content: "\2192  "; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .card-despacho-sub { font-weight: 400; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      /* La respuesta que se manda: entera y aparte, con el filete de una cita. */
      .card-prop { padding-left: 8px; white-space: pre-wrap; overflow-wrap: anywhere;
              border-left: 2px solid var(--border, var(--fb-border));
              color: var(--foreground, var(--fb-foreground)); }
      .card-acts { display: flex; flex-wrap: wrap; gap: 6px; }
      /* Los retenidos fuera de un caso: arriba del tablero, con el tinte de "Su decision"
         porque es lo mismo, algo que espera al dueno. Las tarjetas no se abren: todo esta a
         la vista. */
      .held { display: flex; flex-direction: column; gap: 8px; margin: 0 12px 12px; padding: 10px;
              border: 1px solid color-mix(in srgb, var(--primary, var(--fb-primary)) 35%, var(--border, var(--fb-border)));
              border-radius: var(--radius-md);
              background: color-mix(in srgb, var(--primary, var(--fb-primary)) 4%, transparent); }
      .held[hidden] { display: none; }
      .held > .meta { margin: 0; }
      .held-head { display: flex; align-items: center; gap: 8px; }
      .held-title { font-size: 13px; font-weight: 600; color: var(--foreground, var(--fb-foreground)); }
      .held-head .col-count { margin-left: auto; }
      .held-msg { margin: 0; font-size: 11px; font-weight: 600; overflow-wrap: anywhere;
              color: var(--foreground, var(--fb-foreground)); }
      .held-msg:empty { display: none; }
      .held-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
      .held-list .card { cursor: default; }
      .held-list .card:hover { background: var(--card, var(--fb-card)); }
      .card-msg { font-size: 11px; font-weight: 600; overflow-wrap: anywhere;
              color: var(--foreground, var(--fb-foreground)); }
      .card-msg.mala { color: var(--destructive, var(--fb-destructive)); }

      /* Los botones del tablero: el Button de Orca en `size="sm"` (h-8 px-3 text-xs
         rounded-md), `default` en --primary y `outline` para el resto. */
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
             height: 28px; padding: 0 10px; font: inherit; font-size: 12px; font-weight: 500;
             cursor: pointer; white-space: nowrap; border-radius: var(--radius-md);
             border: 1px solid var(--border, var(--fb-border));
             background: var(--background, var(--fb-background));
             color: var(--foreground, var(--fb-foreground));
             transition: background-color 90ms ease, color 90ms ease, opacity 90ms ease; }
      .btn:hover { background: var(--accent, var(--fb-accent));
             color: var(--accent-foreground, var(--fb-accent-foreground)); }
      .btn.primario { border-color: transparent; background: var(--primary, var(--fb-primary));
             color: var(--primary-foreground, var(--fb-primary-foreground)); }
      .btn.primario:hover { opacity: 0.9; background: var(--primary, var(--fb-primary));
             color: var(--primary-foreground, var(--fb-primary-foreground)); }
      .btn.mute { color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .btn[disabled] { opacity: 0.5; cursor: default; }
      .btn:active:not([disabled]) { transform: translateY(1px); }
      .btn:focus-visible { outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px; }

      /* La lista: los renglones de la lista de Plane, `grid gap-3 px-3 py-2
         hover:bg-muted/50`, bajo la cabecera de grupo `border-b bg-muted/50 px-3 py-1.5
         text-[12px] font-semibold`. */
      .board-list { border: 1px solid var(--border, var(--fb-border));
             border-radius: var(--radius-md); overflow: hidden;
             background: var(--background, var(--fb-background)); }
      .grupo + .grupo { border-top: 1px solid var(--border, var(--fb-border)); }
      .grupo-head { display: flex; align-items: center; gap: 8px; margin: 0; padding: 6px 12px;
             font-size: 12px; font-weight: 600; color: var(--foreground, var(--fb-foreground));
             border-bottom: 1px solid var(--border, var(--fb-border));
             background: color-mix(in srgb, var(--muted, var(--fb-muted)) 50%, transparent); }
      .grupo.lane .grupo-head { background: color-mix(in srgb, var(--destructive, var(--fb-destructive)) 5%, transparent); }
      .grupo .col-more { padding: 6px 12px; }
      .card.fila { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto;
             align-items: start; gap: 4px 12px; padding: 8px 12px; border: 0;
             border-radius: 0; box-shadow: none; background: transparent; }
      .card.fila + .card.fila, .card.fila + .board-detail, .board-detail + .card.fila {
             border-top: 1px solid var(--border, var(--fb-border)); }
      .card.fila:hover { background: color-mix(in srgb, var(--muted, var(--fb-muted)) 50%, transparent); }
      .card.fila.elegida { background: var(--accent, var(--fb-accent)); }
      .card.fila .card-id { padding-top: 2px; }
      .card.fila .card-prio { margin-left: 0; padding-top: 2px; }
      .fila-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

      /* El detalle: el panel de un elemento de Plane, al costado del tablero. */
      .board-detail { flex: 0 0 380px; width: 380px; min-width: 0; position: sticky; top: 8px;
             max-height: calc(100vh - 16px); overflow: auto; padding: 12px 14px 16px;
             border: 1px solid var(--border, var(--fb-border)); border-radius: var(--radius-md);
             background: var(--card, var(--fb-card));
             color: var(--card-foreground, var(--foreground, var(--fb-foreground)));
             box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); }
      .det-head { display: flex; align-items: center; gap: 8px; }
      /* La pastilla de etapa: `rounded-full border px-2 py-0.5 text-[10px] font-medium`. */
      .etapa-pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px;
             font-size: 10px; font-weight: 500; border-radius: 9999px;
             border: 1px solid var(--border, var(--fb-border));
             color: var(--foreground, var(--fb-foreground));
             background: color-mix(in srgb, var(--muted, var(--fb-muted)) 40%, transparent); }
      .det-close { margin-left: auto; display: inline-flex; align-items: center;
             justify-content: center; width: 28px; height: 28px; padding: 0; font: inherit;
             font-size: 18px; line-height: 1; border: 0; border-radius: var(--radius-md);
             background: none; cursor: pointer;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .det-close:hover { background: var(--accent, var(--fb-accent));
             color: var(--foreground, var(--fb-foreground)); }
      .det-close:focus-visible { outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px; }
      .det-title { margin: 10px 0 6px; font-size: 15px; font-weight: 600; line-height: 1.35;
             overflow-wrap: anywhere; color: var(--foreground, var(--fb-foreground)); }
      .det-meta { flex-wrap: wrap; gap: 2px 6px; }
      .det-meta .name { overflow-wrap: anywhere; }
      .det-meta .card-prio { margin-left: 0; }
      .board-detail > .card-exc, .board-detail > .card-aprobada,
      .board-detail > .card-despacho { margin-top: 10px; }
      .det-sec { margin-top: 16px; }
      .det-label { margin: 0 0 6px; font-size: 11px; font-weight: 500;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .det-sec.card-blocked .det-label { color: inherit; }
      .det-sum, .det-text { margin: 0; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
      .det-sec .card-prop { padding: 8px 10px; line-height: 1.5; border-left: 0;
             border-radius: var(--radius-md);
             background: color-mix(in srgb, var(--muted, var(--fb-muted)) 60%, transparent); }
      .det-jev p { margin: 0 0 2px; overflow-wrap: anywhere; }
      .det-acts { display: flex; flex-wrap: wrap; gap: 6px; }
      .det-acciones .card-msg { margin-bottom: 8px; }
      .det-hist { margin: 0; padding: 0; list-style: none; font-size: 11px; }
      .det-hist li { display: flex; gap: 8px; justify-content: space-between; padding: 3px 0;
             border-top: 1px solid var(--border, var(--fb-border)); }
      .det-hist li:first-child { border-top: 0; }
      .det-hist .when { margin-left: auto; }
      .hist-reabierto { margin: 0 0 4px; padding: 3px 0; font-size: 11px; font-weight: 600;
             border-bottom: 1px solid var(--border, var(--fb-border)); }
      .hist-previa { margin-top: 8px; font-size: 11px; }
      .hist-previa summary { cursor: pointer; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .hist-previa .hist-reabierto { margin-top: 8px; }
      .det-acciones .det-text { margin-bottom: 8px; }
      .det-escalar .det-text + .det-text { margin-top: 4px; }
      .det-hist .hist-quien { color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .det-proyecto { margin-top: 6px; font-size: 12px; overflow-wrap: anywhere; }
      .det-link { background: none; border: 0; padding: 0; font: inherit; cursor: pointer;
             color: inherit; text-decoration: underline; }
      .det-link:focus-visible { outline: 2px solid var(--ring, var(--fb-ring, currentColor)); outline-offset: 2px; }
      .det-proyecto .det-k { color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .card-agente { font-size: 11px; font-weight: 500;
              color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .card-agente::before { content: "\2192  "; }
      /* No pude lanzar al agente: un fallo, con el color de lo bloqueado. */
      .card-agente.fallo { color: var(--destructive, var(--fb-destructive)); overflow-wrap: anywhere; }
      /* El autocompletar de proyecto: el de los ajustes (config.html, T17). Fondo opaco y
         filete: la lista flota sobre lo que sigue y tiene que taparlo. */
      .combo { position: relative; min-width: 0; }
      .combo-list { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px);
              max-height: 264px; overflow-y: auto; padding: 4px;
              border: 1px solid var(--border, var(--fb-border)); border-radius: var(--radius-md);
              background: var(--background, var(--fb-background));
              box-shadow: 0 6px 20px rgb(0 0 0 / 0.18); }
      /* Dentro del detalle la lista va en el flujo: el detalle se desplaza solo y una lista
         que flota se cortaria en su borde. */
      .board-detail .combo-list { position: static; margin-top: 4px; max-height: 220px;
              box-shadow: none; }
      .combo-opt { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px;
              border-radius: calc(var(--radius-md) * 0.75); cursor: pointer;
              color: var(--foreground, var(--fb-foreground)); }
      .combo-opt[aria-selected="true"], .combo-opt:hover { background: var(--accent, var(--fb-accent));
              color: var(--accent-foreground, var(--fb-accent-foreground)); }
      .combo-name { min-width: 0; overflow-wrap: anywhere; }
      .combo-sub { flex: none; margin-left: auto; font-size: 11px; white-space: nowrap;
              color: var(--muted-foreground, var(--fb-muted-foreground)); }
      /* Angosto, el id va debajo del nombre: al lado, un nombre largo quedaba en una columna
         de una palabra por renglon (como en config.html). */
      @media (max-width: 420px) {
        .combo-opt { flex-wrap: wrap; }
        .combo-sub { margin-left: 0; white-space: normal; flex: 1 1 100%; min-width: 0;
              overflow-wrap: anywhere; }
      }
      .combo-group { padding: 6px 8px 2px; font-size: 11px; font-weight: 600;
              text-transform: uppercase; letter-spacing: 0.05em;
              color: var(--muted-foreground, var(--fb-muted-foreground)); }
      /* El proyecto del caso: por que y quien lo eligio, mas tenue que el nombre; y la
         pregunta "A o B?" que espera respuesta, con un filete como lo que espera algo. */
      .det-porque { color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .det-pregunta { margin-top: 8px; padding: 8px 10px; font-size: 12px;
              border: 1px solid var(--border, var(--fb-border)); border-radius: var(--radius-md);
              overflow-wrap: anywhere; }
      .det-pregunta .det-text + .det-text { margin-top: 4px; }
      .det-pregunta-lead { margin: 0 0 4px; font-weight: 600; }
      .det-pregunta .det-k { color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .card-pregunta { font-size: 11px; font-weight: 500; overflow-wrap: anywhere;
              color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .combo-empty { padding: 8px; font-size: 12px;
              color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .card-form label { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 500;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .card-form textarea, .card-form input {
        display: block; width: 100%; box-sizing: border-box; font: inherit; font-size: 12px;
        line-height: 1.5; padding: 6px 8px; border-radius: var(--radius-md);
        border: 1px solid var(--input, var(--fb-border));
        background: var(--background, var(--fb-background));
        color: var(--foreground, var(--fb-foreground)); }
      .card-form textarea { min-height: 120px; resize: vertical; }
      .card-form textarea:focus-visible, .card-form input:focus-visible {
        outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px; }
      .card-form textarea[disabled], .card-form input[disabled] { opacity: 0.6; }
      .card-form .card-msg { margin-top: 6px; }
      .card-form .det-acts { margin-top: 8px; }

      /* ── Tablero | Informes (I5) ─────────────────────────────────────────────────
         Las pestanas como las de los ajustes (config.html): subrayado en --primary. El
         periodo va a la derecha; si no cabe sube a su propia linea (wrap-reverse) y las
         pestanas quedan sobre el filete. */
      .vistas { display: flex; flex-wrap: wrap-reverse; align-items: flex-end; gap: 0 12px;
                margin: 0 0 8px; padding: 0 12px;
                border-bottom: 1px solid var(--border, var(--fb-border)); }
      .seg.periodo { margin: 4px 0 6px auto; }
      .tabs { display: flex; gap: 0 2px; }
      .tab { font: inherit; font-size: 13px; padding: 7px 8px; cursor: pointer;
             border: 0; border-bottom: 2px solid transparent; border-radius: 0;
             margin-bottom: -1px; background: none; white-space: nowrap;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .tab:hover { color: var(--foreground, var(--fb-foreground)); }
      .tab[aria-selected="true"] { color: var(--foreground, var(--fb-foreground));
             font-weight: 600; border-bottom-color: var(--primary, var(--fb-primary)); }
      .tab:focus-visible { outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: -2px; }

      /* Los informes: un bloque por pregunta, en tarjetas como las columnas. */
      .rep { display: grid; gap: 12px; padding: 0 12px; }
      .rep-sec { min-width: 0; padding: 12px 14px 14px; border-radius: var(--radius-md);
             border: 1px solid var(--border, var(--fb-border));
             background: var(--card, var(--fb-card)); }
      .rep-sec h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: -0.01em;
             color: var(--foreground, var(--fb-foreground)); }
      .rep-sec h3 { margin: 0; font-size: 12px; font-weight: 500;
             color: var(--foreground, var(--fb-foreground)); }
      .rep-def { margin: 2px 0 10px; max-width: 80ch; font-size: 11px; line-height: 1.45;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .rep-nada { margin: 0; font-size: 12px; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .rep-azulejos { display: grid; gap: 8px;
             grid-template-columns: repeat(auto-fill, minmax(min(100%, 118px), 1fr)); }
      .rep-azulejo { min-width: 0; padding: 8px 10px; border-radius: var(--radius-md);
             background: color-mix(in srgb, var(--muted, var(--fb-muted)) 55%, transparent); }
      .rep-label { display: block; font-size: 11px; overflow-wrap: anywhere;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .rep-num { display: block; margin-top: 2px; font-size: 20px; font-weight: 600; line-height: 1.2;
             font-variant-numeric: tabular-nums; color: var(--foreground, var(--fb-foreground)); }
      .rep-num.sin { font-size: 13px; font-weight: 500;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .rep-n, .rep-extra { display: block; font-size: 11px;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      /* La comparacion: flecha Y texto (nunca solo color). Mejor y peor tienen color de
         texto legible; lo que no es ni mejor ni peor (el volumen) queda apagado. */
      .rep-delta { display: block; margin-top: 2px; font-size: 11px; font-variant-numeric: tabular-nums;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .rep-delta.mejor { color: var(--rep-mejor); }
      .rep-delta.peor { color: var(--destructive, var(--fb-destructive)); }
      .rep-tiempos, .rep-mapas, .rep-graficos { display: grid; gap: 16px;
             grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
      /* Los tres tiempos van juntos o uno debajo del otro: dos y uno suelto se lee como
         que el tercero es de otra cosa. */
      .rep-tiempos { margin-top: 8px;
             grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
      .rep-graficos { margin-top: 14px; }
      .rep-tiempo { min-width: 0; }
      .rep-tiempo .rep-def { margin: 6px 0 0; }
      /* Barras en CSS: una columna por cubeta, la serie 1 y la 2 lado a lado. El tope de la
         escala va arriba a la izquierda; la fecha de la primera, la del medio y la ultima
         abajo. Cada cubeta dice lo suyo al pasar el puntero. */
      .rep-barras { min-width: 0; margin-top: 8px; }
      /* El tope de la escala vive en su propia franja de arriba (padding-top): encima de las
         barras tapaba la mas alta. */
      .rep-plot { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 88px;
             padding-top: 16px;
             border-bottom: 1px solid var(--border, var(--fb-border)); }
      .rep-grupo { flex: 1 1 0; min-width: 0; height: 100%; display: flex; align-items: flex-end;
             justify-content: center; gap: 1px; }
      .rep-grupo:hover { background: color-mix(in srgb, var(--muted, var(--fb-muted)) 60%, transparent); }
      .rep-grupo .b { flex: 1 1 0; max-width: 16px; border-radius: 3px 3px 0 0;
             background: var(--rep-serie-1); }
      .rep-grupo .b.s2 { background: var(--rep-serie-2); }
      /* Dos series: con 24 o 30 cubetas las barras llenan la cubeta, y 1 px adentro contra
         2 px afuera no se ve: las barras quedaban parejas y no se sabia de que hora era
         cada una. Las dos barras de una cubeta van pegadas (un solo bloque de dos colores)
         y cada una llega a lo sumo al 38 % de la cubeta: entre una cubeta y la siguiente
         queda un cuarto de su ancho, que se ve aun con 30 cubetas a 320 px. */
      .rep-plot.dos .rep-grupo { gap: 0; }
      .rep-plot.dos .rep-grupo .b { max-width: min(16px, 38%); }
      .rep-max { position: absolute; top: 0; left: 0; font-size: 10px;
             line-height: 1; pointer-events: none;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .rep-eje { display: flex; justify-content: space-between; gap: 8px; margin-top: 3px;
             font-size: 10px; white-space: nowrap;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      /* Una marca que no cabe se corta con puntos suspensivos, nunca sale de la tarjeta. */
      .rep-eje span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .rep-eje span:nth-child(2) { text-align: center; }
      .rep-eje span:last-child { text-align: right; }
      .rep-leyenda { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; font-size: 11px;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .rep-leyenda span { display: inline-flex; align-items: center; gap: 5px; }
      .rep-leyenda i { width: 8px; height: 8px; border-radius: 2px; background: var(--rep-serie-1); }
      .rep-leyenda i.s2 { background: var(--rep-serie-2); }
      /* El mapa de calor: una fila por fecha o dia de la semana, 24 horas locales. */
      .rep-mapa { display: grid; gap: 2px; margin-top: 6px; }
      .rep-fila, .rep-horas { display: grid; grid-template-columns: 44px repeat(24, minmax(0, 1fr)); gap: 2px;
             align-items: center; }
      .rep-fila-k { padding-right: 4px; font-size: 10px; white-space: nowrap; overflow: hidden;
             text-overflow: ellipsis; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .rep-celda { height: 14px; border-radius: 2px; background: var(--rep-hm-0); }
      .rep-celda.n1 { background: var(--rep-hm-1); }
      .rep-celda.n2 { background: var(--rep-hm-2); }
      .rep-celda.n3 { background: var(--rep-hm-3); }
      .rep-celda.n4 { background: var(--rep-hm-4); }
      .rep-horas span + span { grid-column: span 6; font-size: 10px;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .rep-escala { display: flex; align-items: center; gap: 3px; margin-top: 6px; font-size: 10px;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .rep-escala .rep-celda { width: 12px; height: 10px; }
      .rep-pico { margin: 4px 0 0; font-size: 11px; color: var(--foreground, var(--fb-foreground)); }
      /* La meta: la tasa grande, y la proporcion en una barra con separaciones de 2 px. */
      .rep-sla-cab { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 24px; }
      .rep-sla-barra { display: flex; gap: 2px; height: 10px; margin: 10px 0 6px; }
      .rep-sla-barra span { min-width: 2px; border-radius: 2px; }
      .rep-sla-barra .met, .rep-sla-cuentas .met i { background: var(--tone-emerald); }
      .rep-sla-barra .missed, .rep-sla-cuentas .missed i { background: var(--destructive, var(--fb-destructive)); }
      .rep-sla-barra .pending, .rep-sla-cuentas .pending i { background: var(--rep-hm-0);
             box-shadow: inset 0 0 0 1px var(--muted-foreground, var(--fb-muted-foreground)); }
      .rep-sla-cuentas { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px;
             color: var(--foreground, var(--fb-foreground)); }
      .rep-sla-cuentas span { display: inline-flex; align-items: center; gap: 6px; }
      .rep-sla-cuentas i { width: 8px; height: 8px; border-radius: 2px; }
      /* Las tablas: se desplazan dentro de su caja si no caben; la pagina nunca. */
      .rep-tabla-caja { overflow-x: auto; margin-top: 10px; scrollbar-width: thin; }
      .rep-tabla { width: 100%; border-collapse: collapse; font-size: 12px;
             color: var(--foreground, var(--fb-foreground)); }
      .rep-tabla th { padding: 0 10px 6px 0; text-align: left; font-size: 11px; font-weight: 500;
             white-space: nowrap; color: var(--muted-foreground, var(--fb-muted-foreground));
             border-bottom: 1px solid var(--border, var(--fb-border)); }
      .rep-tabla td { padding: 6px 10px 6px 0; vertical-align: top;
             border-top: 1px solid var(--border, var(--fb-border)); }
      .rep-tabla tr:first-child td { border-top: 0; }
      .rep-tabla .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .rep-tabla .rep-caso-id { font-family: var(--font-mono, ui-monospace, Menlo, monospace);
             font-size: 11px; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .rep-tabla .rep-caso-t { display: block; min-width: 140px; max-width: 320px; overflow-wrap: anywhere; }
      .rep-csv { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
      .rep-csv .card-msg { margin: 0; }
      /* El campo que lleva el CSV al portapapeles: fuera de la vista, nunca visible. */
      .rep-csv-aux { position: fixed; top: 0; left: -9999px; width: 1px; height: 1px; opacity: 0; }
      /* En lo angosto cada fila de una tabla es una ficha: la primera celda arriba y cada
         numero con el nombre de su columna. Una tabla cortada a 320 px no se lee. */
      @media (max-width: 520px) {
        .rep-tabla thead { display: none; }
        .rep-tabla, .rep-tabla tbody, .rep-tabla tr, .rep-tabla td { display: block; width: auto; }
        .rep-tabla tr { padding: 8px 0; border-top: 1px solid var(--border, var(--fb-border)); }
        .rep-tabla tr:first-child { border-top: 0; padding-top: 0; }
        .rep-tabla td { padding: 1px 0; border: 0; }
        .rep-tabla td + td { display: flex; justify-content: space-between; gap: 12px; text-align: right; }
        .rep-tabla td + td::before { content: attr(data-col); text-align: left;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
        .rep-tabla td:first-child { font-weight: 500; }
        .rep-tabla .rep-caso-t { min-width: 0; max-width: none; }
      }
      .rep-mas { margin: 6px 0 0; font-size: 11px; color: var(--muted-foreground, var(--fb-muted-foreground)); }

      /* Hasta 768 px la lista es la vista natural y el detalle se abre en el lugar, debajo
         de lo elegido. El buscador toma la fila entera. */
      @media (max-width: 768px) {
        .board-body { flex-direction: column; align-items: stretch; }
        .board-detail { position: static; width: auto; flex: none; max-height: none; }
        .board-detail.en-linea { border: 0; border-radius: 0; box-shadow: none;
             background: color-mix(in srgb, var(--muted, var(--fb-muted)) 35%, transparent); }
        .search { flex-basis: 100%; }
        #board-shown { margin-left: auto; }
        .btn { min-height: 32px; padding: 0 12px; }
        .card.fila { grid-template-columns: 40px minmax(0, 1fr) auto; gap: 4px 8px; }
        /* Con el detalle abierto justo debajo, la fila no repite lo que el detalle dice. */
        .card.fila.elegida .fila-main > :not(.card-title):not(.card-meta) { display: none; }
      }
    </style>

  <body>
    <header>
      <h1 data-t="title">WhatsApp</h1>
      <span class="meta" id="synced"></span>
      <button id="refresh" data-t-title="refreshTitle">&#8635;</button>
    </header>

    <p class="meta nota" id="note"></p>

    <!-- Varias lineas a la vez: con dos o mas, el tablero, la actividad y los informes son
         los de la linea que se elige aca. Con una sola no aparece. -->
    <div class="meta nota" id="linea-vista-fila" hidden>
      <span id="linea-vista-label" data-t="linesView"></span>
      <div class="seg" id="linea-vista" role="group" aria-labelledby="linea-vista-label"></div>
    </div>

    <!-- Lo primero que hay que poder contestar de un vistazo: esta viva la linea, y
         sobre cuanto puede actuar el agente. Sin esto, "no hay nada pendiente" y "no
         estoy conectado" se leen igual. -->
    <p class="meta nota" id="linea"></p>
    <p class="meta nota" id="cobertura"></p>

    <!-- La bandeja se fue: el panel es el tablero. Lo que pedia decision es la columna
         "Su decision", lo que hizo el agente es la historia de cada caso, y la cola son
         los casos en Recibido y Clasificado, con "Atender ahora" e "Ignorar". -->

    <!-- El tablero lo escribe `wa-scope` en la clave `board`. Las acciones del dueno
         (T6) dejan un pedido en `scopeRequest` y el worker lo cumple: el panel no ejecuta
         nada ni dice quien firma. Solo se pinta una accion que la tarjeta trae en
         `actions` Y que vale en su etapa. -->
    <!-- La barra copia la de Plane en Orca (TaskPage.tsx): las etapas con su cuenta, que
         filtran; el buscador; Lista/Tablero y cuantos se muestran. Los iconos son los de
         lucide que usa la app, en linea porque el panel no puede pedir nada afuera. -->
    <!-- El periodo (informes-tablero, I1): uno solo para el tablero y los informes. En el
         tablero acota Respondido y Cerrado por la hora en que el caso entro a la etapa; lo
         abierto se ve siempre. -->
    <div class="vistas" id="vistas">
      <div class="tabs" role="tablist" data-t-aria="viewsLabel">
        <button type="button" class="tab" role="tab" id="tab-board" aria-controls="view-board"
                aria-selected="true" data-t="tabBoard"></button>
        <button type="button" class="tab" role="tab" id="tab-reports" aria-controls="view-reports"
                aria-selected="false" tabindex="-1" data-t="tabReports"></button>
      </div>
      <div class="seg periodo" id="period" role="group" data-t-aria="periodLabel">
        <button type="button" data-periodo="today" aria-pressed="false" data-t="periodToday"></button>
        <button type="button" data-periodo="7d" aria-pressed="true" data-t="period7d"></button>
        <button type="button" data-periodo="30d" aria-pressed="false" data-t="period30d"></button>
        <button type="button" data-periodo="all" aria-pressed="false" data-t="periodAll"></button>
      </div>
    </div>
    <div id="view-board" role="tabpanel" aria-labelledby="tab-board">
      <div class="board-bar" id="board-bar" hidden>
        <div class="chips" id="board-chips" role="group" data-t-aria="boardStagesLabel"></div>
        <div class="bar-row">
          <div class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="board-search" type="text" autocomplete="off" spellcheck="false"
                   data-t-ph="boardSearchPh" data-t-aria="boardSearchPh" />
            <button type="button" class="search-clear" id="board-search-clear"
                    data-t-title="boardSearchClear" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
          </div>
          <div class="seg" id="board-view" role="group" data-t-aria="boardViewLabel">
            <button type="button" data-vista="list" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg><span data-t="boardViewList">Lista</span></button>
            <button type="button" data-vista="board" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/></svg><span data-t="boardViewBoard">Tablero</span></button>
          </div>
          <span class="meta" id="board-shown"></span>
        </div>
      </div>
      <p class="meta nota" id="board-synced"></p>
      <!-- La ultima corrida del agente, en una linea: sobre cuantas reviso y que encontro,
           o por que no reviso. Sin ella "no hay nada", "nunca corrio" y "se murio a
           medias" se ven iguales. -->
      <p class="meta nota" id="runline"></p>
      <p class="meta nota" id="board-note"></p>
      <!-- Lo retenido que no es de ningun caso (approve-solo-dueno): el aviso de la sesion de
           un proyecto que el piso freno. Un agente ya no lo puede aprobar; el dueno si, aca. -->
      <section class="held" id="board-held" hidden>
        <div class="held-head"><span class="held-title" data-t="heldTitle"></span>
          <span class="col-count" id="board-held-count"></span></div>
        <p class="meta" data-t="heldLead"></p>
        <p class="held-msg" id="board-held-msg" role="status"></p>
        <div class="held-list" id="board-held-list"></div>
      </section>
      <div class="board-empty" id="board-empty" hidden><p class="t"></p><p class="b"></p></div>
      <div class="board-body" id="board-body" hidden>
        <div class="board-main">
          <p class="board-nada" id="board-nada" hidden></p>
          <div class="board-cols" id="board-cols"></div>
          <div class="board-list" id="board-list" hidden></div>
        </div>
        <aside class="board-detail" id="board-detail" hidden></aside>
      </div>
    </div>

    <!-- Los informes (informes-tablero, I5): la clave `reports` que escribe `wa-scope sync`.
         Se lee solo con esta pestana a la vista: es grande y cambia cada pocos minutos. -->
    <div id="view-reports" role="tabpanel" aria-labelledby="tab-reports" hidden>
      <p class="meta nota" id="reports-synced"></p>
      <div class="board-empty" id="reports-empty" hidden><p class="t"></p><p class="b"></p></div>
      <div class="rep" id="reports-body"></div>
    </div>

      }
      var LANG = (function () {
        var tag = String(navigator.language || 'en').toLowerCase()
        if (tag.indexOf('es') === 0) return 'es'
        if (tag.indexOf('pt') === 0) return 'pt'
        return 'en'
      })()
      function t(key) { return (STRINGS[LANG] && STRINGS[LANG][key]) || STRINGS.en[key] || key }
      // De un codigo estable del CLI, la frase en el idioma del usuario. Sin respaldo, el
      // codigo crudo; el tablero pasa siempre un respaldo, y ahi no sale nunca crudo.
      function porCodigo(mapa, code, respaldo) {
        var key = Object.prototype.hasOwnProperty.call(mapa, code) ? mapa[code] : null
        if (key) return t(key)
        if (respaldo !== undefined) return respaldo
        return String(code == null ? '' : code)
      }

      function applyStrings() {
        Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (node) {
          node.innerHTML = t(node.dataset.t)
        })
        Array.prototype.forEach.call(document.querySelectorAll('[data-t-ph]'), function (node) {
          node.placeholder = t(node.dataset.tPh)
        })
        Array.prototype.forEach.call(document.querySelectorAll('[data-t-aria]'), function (node) {
          node.setAttribute('aria-label', t(node.dataset.tAria))
        })
        Array.prototype.forEach.call(document.querySelectorAll('[data-t-title]'), function (node) {
          node.title = t(node.dataset.tTitle)
          node.setAttribute('aria-label', t(node.dataset.tTitle))
        })
      }

      var seq = 0, pending = {}
      var el = function (id) { return document.getElementById(id) }

      function call(action, params) {
        return new Promise(function (resolve) {
          var requestId = 'req-' + ++seq
          pending[requestId] = resolve
          window.parent.postMessage(
            { type: 'orca-panel-action', requestId: requestId, action: action, params: params },
            '*')
        })
      }

      window.addEventListener('message', function (event) {
        var d = event.data
        if (!d || d.type !== 'orca-panel-action-result') return
        var resolve = pending[d.requestId]
        if (!resolve) return
        delete pending[d.requestId]
        resolve(d)
      })

      // storage.get devuelve { value: <dato> } y el bridge lo envuelve otra vez.
      function stored(result) {
        if (!result || !result.ok || !result.value) return null
        return result.value.value === undefined ? null : result.value.value
      }

      function esc(text) {
        return String(text == null ? '' : text)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      }

      function hora(stamp) {
        var m = /\d{2}:\d{2}/.exec(String(stamp || ''))
        return m ? m[0] : esc(stamp)
      }

      // Los textos con {n} se arman aca y no concatenando: en portugues y en ingles el
      // numero no cae en el mismo lugar de la frase.
      // Acepta un numero suelto -el caso de siempre- o un objeto con varios huecos.
      // Un texto con dos cifras ("1 de 298") no se puede armar con un solo {n}.
      function fmt(key, n) {
        var texto = t(key)
        if (n !== null && typeof n === 'object') {
          for (var k in n) {
            if (Object.prototype.hasOwnProperty.call(n, k)) {
              texto = texto.split('{' + k + '}').join(String(n[k]))
            }
          }
          return texto
        }
        return texto.replace('{n}', String(n))
      }

      /** Que decir con la lista vacia. Tres finales distintos y hasta hoy uno solo:
       *  no hay nada pendiente, todo quedo en `off` — que es configuracion y no
       *  ausencia de trabajo — o todavia no se autorizo ni una conversacion. */
      function vacioPorConfig(activity) {
        // Un numero recien vinculado todavia no tiene actividad: no es configuracion.
        if (!activity || activity.esperandoLinea) return null
        var mapped = activity && activity.mapped
        var authorized = activity && activity.authorized
        if (typeof mapped === 'number' && typeof authorized === 'number') {
          if (!mapped) return t('nothingMapped')
          if (!authorized) {
            return mapped === 1 ? t('nothingAuthorized1')
              : fmt('nothingAuthorized', mapped)
          }
        }
        return null
      }

      // La actividad la arma `wa-scope sync`, no el panel: un panel no puede ejecutar
      // nada, solo leer storage. Si el sello de tiempo esta viejo, decirlo es mas
      // honesto que mostrar una lista que parece viva y no lo esta.
      function viejo(stamp) {
        return anotarReloj(viejoAhora, stamp)
      }
      function viejoAhora(stamp) {
        var ms = Date.parse(String(stamp || '').replace(' ', 'T'))
        return !ms || (Date.now() - ms) > 30 * 60000
      }

      // Lo que el reloj decide en el tablero pintado ("hace 5 min", "vieja", un aviso que
      // ya vencio). El tablero no se reconstruye si nada cambio (ver `renderBoard`), y sin
      // esto un "hace 5 min" se quedaria ahi para siempre: se anota cada respuesta del
      // reloj al pintar y se repinta cuando alguna ya no es la misma.
      var relojes = null        // [funcion, argumento, respuesta] mientras se pinta el tablero
      var relojesPintados = []
      function anotarReloj (fn, arg) {
        var r = fn(arg)
        if (relojes) relojes.push([fn, arg, r])
        return r
      }
      function relojesIguales () {
        return relojesPintados.every(function (x) { return x[0](x[1]) === x[2] })
      }

      // Pasada media hora la hora sola ya no ubica: "09:33" de anteayer se lee como de
      // hace un rato, asi que ahi se muestra la marca entera.
      function cuando(stamp) {
        var s = String(stamp == null ? '' : stamp)
        if (viejo(s)) return s
        var m = /\d{2}:\d{2}/.exec(s)
        return m ? m[0] : s
      }

      function renderSynced(activity) {
        var when = activity && activity.syncedAt
        // Numero recien vinculado: el worker ya pidio el sync de esta linea (T9e), asi
        // que no se manda a nadie a una terminal; se dice que se lo esta esperando.
        if (!when && activity && activity.esperandoLinea) {
          el('synced').innerHTML = '<span class="stale">' + t('syncLineaNueva') + '</span>'
          return
        }
        if (!when) {
          el('synced').innerHTML = '<span class="stale">' + t('noData') + '</span>'
          return
        }
        el('synced').innerHTML =
          (activity.running ? '<span class="dot"></span>' + t('running') + ' · ' : '') +
          (viejo(when) ? '<span class="vieja">' + esc(when) + '</span>' : esc(when))
      }

      /** Si la linea esta viva, y cual. "No hay nada pendiente" y "no estoy conectado"
       *  se leian exactamente igual: una lista vacia. Son lo contrario, y cual de las
       *  dos es decide si el dueno tiene que hacer algo o no.
       *
       *  El numero va porque el dueno puede tener mas de una linea y porque, tras
       *  escanear un QR, saber CUAL quedo vinculada es la unica forma de notar que se
       *  escaneo con el telefono equivocado. */
      // Cuanto vale el latido de la linea: el MISMO plazo que config.html (la prueba de
      // paneles compara los dos). La foto guardada en storage no caduca nunca, y sin esto
      // la linea se leia "conectada" una semana despues de morir.
      var LATIDO_LINEA_VENCE_MS = 150000

      function latidoFresco (sc) {
        var ts = sc && sc.latido && Number(sc.latido.ts)
        if (!ts) return false
        var edad = Date.now() - ts
        return edad >= 0 && edad <= LATIDO_LINEA_VENCE_MS
      }

      /** "Desde las 17:44", o con la fecha si ya paso un dia: la hora sola de anteayer
       *  se lee como de hace un rato. */
      function horaUltimaSenal (sc) {
        var ms = (sc && sc.latido && Number(sc.latido.ts)) || Date.parse((sc && sc.at) || '')
        if (!ms) return '\u2014'
        var f = new Date(ms)
        var hora = ('0' + f.getHours()).slice(-2) + ':' + ('0' + f.getMinutes()).slice(-2)
        return Date.now() - ms > 20 * 3600 * 1000
          ? f.getFullYear() + '-' + ('0' + (f.getMonth() + 1)).slice(-2) + '-' +
            ('0' + f.getDate()).slice(-2) + ' ' + hora
          : hora
      }

      function renderLinea (sc) {
        var nodo = el('linea')
        if (!sc || typeof sc !== 'object') { nodo.textContent = ''; return }
        var clase = 'meta nota'
        var texto
        if (sc.connection === 'open' && !latidoFresco(sc)) {
          texto = fmt('lineaSinSenal', { hora: horaUltimaSenal(sc) })
          clase += ' stale'
        } else if (sc.connection === 'open') {
          texto = t('lineaConectada')
          var yo = sc.me || null
          if (yo) texto += ' · ' + esc(yo)
        } else if (sc.exited || sc.motivo === 'sesion-cerrada') {
          texto = t('lineaCaida')
          clase += ' stale'
        } else if (sc.qr) {
          texto = t('lineaSinVincular')
          clase += ' vieja'
        } else {
          texto = t('lineaConectando')
          clase += ' vieja'
        }
        nodo.textContent = texto
        nodo.className = clase
      }

      /** Sobre cuanto puede actuar el agente. Un "revise 1 conversacion" sin decir de
       *  cuantas no informa nada: 1 de 1 es cobertura completa y 1 de 298 es un agente
       *  que casi no ve. Es el mismo numero y significan lo contrario. */
      function renderCobertura (a, chats) {
        var nodo = el('cobertura')
        var total = Array.isArray(chats) ? chats.length : null
        var vivas = a && a.authorized != null ? a.authorized : null
        if (vivas == null) { nodo.textContent = ''; return }
        nodo.className = 'meta nota' + (vivas === 0 ? ' vieja' : '')
        nodo.textContent = total == null
          ? fmt('coberturaSinTotal', vivas)
          : fmt('cobertura', { n: vivas, total: total })
      }

      /** La linea honesta, arriba de la lista. Cinco finales y ninguno se parece a
       *  otro: reviso y no habia nada, reviso y hay tanto, nunca reviso, arranco y no
       *  volvio, o fallo por algo. Sin ella los cinco eran una lista vacia, y el dueno
       *  concluia lo unico que se puede concluir mirando eso: que no funciona.
       *
       *  Sin color propio: la allowlist del host no trae ni exito ni advertencia. El
       *  peso lo dan las dos clases que ya existen — `vieja` para lo que pide atencion
       *  y `stale` (--destructive) para lo que si es un fallo. */
      function renderRun(activity, board) {
        var nodo = el('runline')
        var r = activity && activity.run
        var clase = 'meta nota run'
        var texto = ''
        if (!r) {
          // Un CLI viejo no manda `run`. Callarse es lo honesto: afirmar que nunca
          // corrio seria decir algo que ese CLI no cuenta.
          nodo.textContent = ''
          nodo.className = 'meta nota'
          return
        }
        if (r.state === 'running') {
          texto = t('runNow')
        } else if (r.state === 'never') {
          texto = t('runNever')
          clase += ' vieja'
        } else if (r.state === 'interrupted') {
          texto = t('runCut') + (r.startedAt ? ' · ' + cuando(r.startedAt) : '')
          clase += ' vieja'
        } else if (r.state === 'failed') {
          // El motivo va tal cual: lo escribio quien fallo y es el unico dato que
          // dice que paso de verdad. Traducirlo seria inventarlo.
          texto = t('runFailed') + (r.reason ? ': ' + r.reason : '') +
            (r.endedAt ? ' · ' + cuando(r.endedAt) : '')
          clase += ' stale'
        } else {
          // Casos de verdad, del tablero: los que esperan al agente (los mismos que
          // `pending --needs-agent`) y los que esperan al dueno. Un cero no se dice. La
          // cola vieja de mensajes (`activity.pending`) ya no significa nada aqui.
          var partes = [r.endedAt ? fmt('runLast', { hora: cuando(r.endedAt) }) : t('runLastNoTime')]
          var agente = board && Number.isInteger(board.agent_waiting) ? board.agent_waiting : null
          var dueno = board && esObjeto(board.counts) && Number.isInteger(board.counts.decision)
            ? board.counts.decision : null
          if (agente) partes.push(agente === 1 ? t('runAgent1') : fmt('runAgent', agente))
          // Con casos esperando, que el agente no se pudo lanzar se dice aqui tambien.
          var falla = agente ? falloAgente(board) : ''
          if (falla) partes.push(falla)
          // El agente de casos que corre con otra cuenta que la del bot: con cual y por que.
          var lanz = esObjeto(board) && esObjeto(board.agent_launch) ? board.agent_launch : null
          var respaldoAg = lanz && (lanz.state === 'running' || lanz.state === 'launching')
            ? respaldoTexto('agentFallback', lanz.account, lanz.fallback) : ''
          if (respaldoAg) partes.push(respaldoAg)
          if (dueno) partes.push(dueno === 1 ? t('runOwner1') : fmt('runOwner', dueno))
          if (!agente && !dueno && agente !== null && dueno !== null) partes.push(t('runNone'))
          texto = partes.join(' · ')
          if (falla) clase += ' stale'
          else if (viejo(r.endedAt)) clase += ' vieja'
        }
        // Los espacios que el tick no pudo quitar de la barra lateral tras sus intentos
        // (`workspaces_stuck`): se dicen en cualquier estado, para que el dueno los quite.
        var atascados = board && Number.isInteger(board.workspaces_stuck) && board.workspaces_stuck > 0
          ? board.workspaces_stuck : 0
        if (atascados) {
          texto += ' · ' + (atascados === 1 ? t('stuckWorkspaces1') : fmt('stuckWorkspaces', atascados))
          if (!/ stale/.test(clase)) clase = clase.replace(' vieja', '') + ' stale'
        }
        nodo.textContent = texto
        nodo.className = clase
      }

      function note(text, bad) {
        var node = el('note')
        node.textContent = text || ''
        node.className = 'meta' + (bad ? ' stale' : '')
      }

      // Cada numero, su linea (T9). Tras vincular OTRO numero, este panel seguia
      // mostrando la cobertura, los avisos, lo ultimo hecho, la cola y la corrida del
      // anterior (visto en vivo: "actua sobre 3 de 306", "arranco y no volvio · 09-24").
      // Hasta que el sync arme la actividad del numero nuevo, lo que hay es de otro
      // numero y se muestra como vacio honesto; lo del anterior sigue guardado y vuelve
      // si ese numero se vincula de nuevo. Sin numero conocido no se filtra nada.
      var cuentaVinculada = null
      function deEstaLinea (cuenta) {
        return !cuentaVinculada || (cuenta || 'local') === cuentaVinculada
      }

      // ───────────────────────── El tablero de casos ─────────────────────────
      // `wa-scope` escribe la clave `board` (odd/tasks/kanban-casos.md, "Contratos") y
      // este panel la LEE. Las acciones del dueno (T6) salen de `actions`, y viajan por
      // el canal del worker: un pedido en `scopeRequest`, su veredicto en `scopeResult`.
      //
      // La forma es la del tablero de Plane en Orca (orca-oss, TaskPage.tsx y
      // task-page-plane-board.tsx): una fila de etapas con su cuenta que filtra, un

        promises_a_date: 'flagPromisesDate', states_status_not_verified: 'flagStatusNotVerified',
        contains_credential: 'flagContainsCredential', delete: 'motDelete',
        deploy: 'motDeploy', force_push: 'motForcePush', payment: 'motPayment',
        outside_project: 'motOutside', mode: 'motMode', stale: 'motStale',

        writer: 'motToWriter', owner: 'motToOwner',

      /** "hace 5 min": el sello de una tarjeta es de maquina y no dice nada de un

      function haceAhora (stamp) {

      /** Lo que el panel va a pintar, ya limpio: tarjetas por etapa, cuentas y avisos. No
       *  toca el DOM, asi que el panel no se rompe por lo que traiga la clave.
       *
       *  `counts` manda sobre las tarjetas (cuenta todo, no solo lo enviado); si las
       *  tarjetas de otro numero se descartaron, ya no es del mismo universo y se cuenta
       *  lo que se ve. */
      function modeloTablero (board) {
        if (!esObjeto(board)) return { estado: 'sin-datos' }
        if (board.v !== 1) return { estado: 'version', v: board.v == null ? '?' : board.v }
        var todas = Array.isArray(board.cards) ? board.cards.filter(esObjeto) : []
        var propias = todas.filter(function (c) { return deEstaLinea(c.account) })
        var descartadas = propias.length !== todas.length
        var porEtapa = {}
        ETAPAS.forEach(function (e) { porEtapa[e] = [] })
        var desconocidas = 0
        propias.forEach(function (c) {

          porEtapa[e].sort(function (a, b) {

      /** Deja el pedido y espera SU veredicto, por id. Sin el id el panel pintaria la
