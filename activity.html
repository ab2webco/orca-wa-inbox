<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>WhatsApp</title>
    <style>
      /* El host inyecta una lista corta de tokens en el <style> del shell
         (PANEL_DESIGN_TOKEN_ALLOWLIST, orca-oss src/shared/plugins/plugin-panel-shell.ts:34)
         y pone light/dark en <html>. Nada mas llega aca: ni utilidades de Tailwind,
         ni --radius-md, ni la tipografia de la app. */
      :root {
        color-scheme: light dark;
        /* De los radios solo viene --radius; md se calcula con el mismo factor que
           main.css:122, para no inventar un radio por elemento. */
        --radius-md: calc(var(--radius, 0.625rem) * 0.8);
        /* Respaldos para cuando el host no inyecta nada (host viejo, o el arnes
           jsdom). Son los valores reales de main.css, no un gris inventado: antes
           eran solo oscuros y el panel salia ilegible en cuanto el tema era claro. */
        --fb-background: #fff; --fb-foreground: #0a0a0a;
        --fb-primary: #171717; --fb-primary-foreground: #fafafa;
        --fb-secondary: #f5f5f5; --fb-secondary-foreground: #171717;
        --fb-muted-foreground: #737373;
        --fb-accent: #f5f5f5; --fb-accent-foreground: #171717;
        --fb-destructive: #e40014;
        --fb-border: #e5e5e5; --fb-ring: #a1a1a1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fb-background: #0a0a0a; --fb-foreground: #fafafa;
          --fb-primary: #e5e5e5; --fb-primary-foreground: #171717;
          --fb-secondary: #262626; --fb-secondary-foreground: #fafafa;
          --fb-muted-foreground: #a1a1a1;
          --fb-accent: #404040; --fb-accent-foreground: #fafafa;
          --fb-destructive: #ff6568;
          --fb-border: rgb(255 255 255 / 0.07); --fb-ring: #737373;
        }
      }
      /* Los widgets nativos siguen al tema real del host, no a la preferencia del
         sistema. */
      html.light { color-scheme: light; }
      html.dark { color-scheme: dark; }
      * { box-sizing: border-box; }
      /* Sin padding en el body: el iframe se monta a sangre (PluginPanel.tsx:231,
         h-full w-full) y los paneles nativos de Orca ponen el relleno adentro de
         cada bloque, para que los filetes lleguen a los bordes. El horizontal es
         12 px, el px-3 de la casa (PortsPanel.tsx:335). */
      body {
        margin: 0; padding: 0 0 16px;
        /* Geist es la fuente de la app, pero el iframe no ve sus @font-face: pedirla
           solo daria un fallback distinto en cada maquina. Se queda el del sistema. */
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px; letter-spacing: 0.01em;
        color: var(--foreground, var(--fb-foreground));
        background: var(--background, var(--fb-background));
      }
      /* Cabecera del panel como las nativas: px-3 py-2 y un filete abajo. */
      header { display: flex; align-items: center; justify-content: space-between;
               gap: 8px; margin: 0 0 8px; padding: 8px 12px;
               border-bottom: 1px solid var(--border, var(--fb-border)); }
      header .meta { margin-left: auto; }
      header button {
        font: inherit; font-size: 13px; line-height: 1; padding: 3px 8px; cursor: pointer;
        border: 1px solid var(--border, var(--fb-border));
        border-radius: var(--radius-md);
        background: var(--secondary, var(--fb-secondary));
        color: var(--muted-foreground, var(--fb-muted-foreground));
        transition: background-color 90ms ease, color 90ms ease;
      }
      /* Hover por --accent, que es el token de superficie de hover; el filete se
         queda en --border porque --ring es enfasis fuerte, no decoracion. */
      header button:hover { background: var(--accent, var(--fb-accent));
                            color: var(--accent-foreground, var(--fb-accent-foreground)); }
      header button:active { transform: translateY(1px); }
      header button[disabled] { opacity: 0.5; cursor: default; }
      h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
      .meta { font-size: 11px; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      /* Parrafos de servicio: mismo relleno horizontal que las filas. */
      .nota { margin: 0 0 8px; padding: 0 12px; }
      .nota:empty { display: none; }
      /* "corriendo" ya lo dice la palabra de al lado; el punto solo tiene que pesar,
         y --primary es el token de enfasis. La allowlist no tiene color de exito. */
      .dot { display: inline-block; width: 6px; height: 6px; border-radius: 9999px;
             background: var(--primary, var(--fb-primary));
             margin-right: 5px; vertical-align: middle; }
      /* Etiqueta meta de 11 px: el STYLEGUIDE la fija en 600 y 0.05em, igual que
         PortsPanel.tsx:336. */
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
           color: var(--muted-foreground, var(--fb-muted-foreground));
           margin: 14px 0 6px; padding: 0 12px; font-weight: 600; }
      h2:first-of-type { margin-top: 0; }
      .item { padding: 7px 12px; border-bottom: 1px solid var(--border, var(--fb-border)); }
      .item:last-child { border-bottom: 0; }
      .line1 { display: flex; gap: 6px; align-items: baseline; }
      .who { font-weight: 500; }
      .chat { color: var(--muted-foreground, var(--fb-muted-foreground)); font-size: 11px; }
      .when { margin-left: auto; color: var(--muted-foreground, var(--fb-muted-foreground));
              font-size: 11px; white-space: nowrap; }
      /* Un mensaje sin cuerpo no se puede confundir con uno cuyo cuerpo si se leyo. */
      .text { color: var(--muted-foreground, var(--fb-muted-foreground)); margin-top: 2px;
              line-height: 1.4; overflow-wrap: anywhere; }
      /* Las tres clases de aviso, sin tres tonos: la allowlist no los tiene. Se
         separan por peso y superficie — mencion en texto pleno y 600, directo como
         superficie --accent, media con filete punteado. */
      .tag { font-size: 10px; border: 1px solid var(--border, var(--fb-border));
             border-radius: 9999px; padding: 0 6px;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .tag.mencion { color: var(--foreground, var(--fb-foreground)); font-weight: 600; }
      .tag.directo { background: var(--accent, var(--fb-accent));
                     color: var(--accent-foreground, var(--fb-accent-foreground));
                     border-color: transparent; }
      .tag.media { border-style: dashed; }
      .empty { color: var(--muted-foreground, var(--fb-muted-foreground)); padding: 8px 12px; }
      .acts { display: flex; gap: 10px; margin-top: 5px; }
      .acts button {
        font: inherit; font-size: 11px; padding: 3px 10px; cursor: pointer;
        border: 1px solid var(--border, var(--fb-border));
        border-radius: var(--radius-md);
        background: var(--secondary, var(--fb-secondary));
        color: var(--secondary-foreground, var(--fb-secondary-foreground));
        transition: background-color 90ms ease, color 90ms ease;
      }
      .acts button:hover { background: var(--accent, var(--fb-accent));
                           color: var(--accent-foreground, var(--fb-accent-foreground));
                           text-decoration: underline; }
      .acts button:active { transform: translateY(1px); }
      .acts button[disabled] { opacity: 0.5; cursor: default; }
      .acts button.mute { color: var(--muted-foreground, var(--fb-muted-foreground)); }
      header button:focus-visible, .acts button:focus-visible {
        outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px;
      }
      /* Tomado = enfasis, no color de exito: la barra va en --primary. El relleno
         izquierdo compensa los 2 px para que el texto no se corra. */
      .item.taken { border-left: 2px solid var(--primary, var(--fb-primary));
                    padding-left: 10px; }
      .done { font-size: 11px; font-weight: 500;
              color: var(--foreground, var(--fb-foreground)); margin-top: 4px; }
      /* El renglon de la corrida contesta "por que no hace nada": tiene que leerse
         ANTES que la pista de abajo, que es texto de servicio. Sin color propio —la
         allowlist no tiene uno de exito—, la jerarquia la dan el texto pleno y el 500,
         que es lo mismo que hace `.done`. */
      .run { color: var(--foreground, var(--fb-foreground)); font-weight: 500; }
      /* Dos grados de mala noticia, con los dos unicos tokens que hay para eso. Una
         sincronizacion vieja no es un error: solo avisa que lo de abajo puede estar
         desactualizado, asi que va en texto pleno y 600 dentro de una linea apagada.
         La allowlist no tiene warning/ambar y no se fabrica uno: pintarla de rojo
         gritaba un fallo que no existe. */
      .vieja { color: var(--foreground, var(--fb-foreground)); font-weight: 600; }
      /* "sin datos" y el error de una accion si son fallos: --destructive. */
      .stale { color: var(--destructive, var(--fb-destructive)); }
      code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; }

      [hidden] { display: none !important; }

      /* Pestanas: Bandeja (lo de siempre) y Tablero (los casos). Subrayado en
         --primary, que es el token de enfasis; sin color de exito en la allowlist. */
      .tabs { display: flex; gap: 4px; padding: 0 12px; margin: 0 0 10px;
              border-bottom: 1px solid var(--border, var(--fb-border)); }
      .tab { font: inherit; font-size: 13px; padding: 6px 10px; cursor: pointer;
             border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
             background: none; color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .tab:hover { color: var(--foreground, var(--fb-foreground)); }
      .tab[aria-selected="true"] { color: var(--foreground, var(--fb-foreground));
             font-weight: 600; border-bottom-color: var(--primary, var(--fb-primary)); }
      .tab:focus-visible { outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: -2px; }
      .tab-count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px;
                   font-size: 10px; line-height: 16px; text-align: center; font-weight: 600;
                   border-radius: 9999px;
                   background: var(--primary, var(--fb-primary));
                   color: var(--primary-foreground, var(--fb-primary-foreground)); }

      /* El tablero. Siete columnas del flujo y, aparte, el carril de bloqueados. Las
         columnas se desplazan DENTRO de su contenedor (entre 769 y ~1300 px no caben las
         ocho): la pagina nunca. Hasta 768 px pasa a una lista agrupada por etapa. */
      .board-cols { display: flex; gap: 8px; padding: 0 12px; overflow-x: auto;
                    align-items: flex-start; }
      .col { flex: 1 0 160px; min-width: 0; padding: 8px;
             border: 1px solid var(--border, var(--fb-border));
             border-radius: var(--radius-md);
             background: var(--secondary, var(--fb-secondary)); }
      .col.lane { border-style: dashed; margin-left: 4px; }
      /* "Tu decision" es lo unico que espera al dueno: filete grueso en --primary y la
         cuenta rellena. El resto del tablero es informativo. */
      .col.decision { border: 2px solid var(--primary, var(--fb-primary)); padding: 7px; }
      .col-head { display: flex; align-items: center; justify-content: space-between;
                  gap: 6px; margin: 0 0 8px; font-size: 11px; font-weight: 600;
                  text-transform: uppercase; letter-spacing: 0.05em;
                  color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .col.decision .col-head { color: var(--foreground, var(--fb-foreground));
                                font-size: 12px; }
      .col.lane .col-head { color: var(--destructive, var(--fb-destructive)); }
      .col-name { overflow-wrap: anywhere; }
      .col-count { flex: none; min-width: 20px; padding: 0 6px; line-height: 18px;
                   text-align: center; letter-spacing: 0; border-radius: 9999px;
                   background: var(--background, var(--fb-background));
                   border: 1px solid var(--border, var(--fb-border));
                   color: var(--foreground, var(--fb-foreground)); }
      .col.decision.con-casos .col-count { background: var(--primary, var(--fb-primary));
             border-color: transparent;
             color: var(--primary-foreground, var(--fb-primary-foreground)); }
      .col-empty, .col-more { font-size: 11px; margin: 0;
             color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .col-more { margin-top: 6px; font-weight: 600; }
      .card { margin: 0 0 8px; padding: 8px; font-size: 12px; line-height: 1.4;
              border: 1px solid var(--border, var(--fb-border));
              border-radius: var(--radius-md);
              background: var(--background, var(--fb-background)); }
      .card:last-of-type { margin-bottom: 0; }
      .card.urgente { border-left: 3px solid var(--destructive, var(--fb-destructive)); }
      .card-title { font-weight: 600; overflow-wrap: anywhere; }
      /* El nombre del chat entero y la antiguedad debajo: lado a lado, en una columna de
         160 px el nombre se partia en tres lineas. */
      .card-chat { margin-top: 2px; font-size: 11px;
                   color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .card-chat .name { display: block; overflow-wrap: anywhere; }
      .card-chat .when { display: block; margin-left: 0; }
      .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
      /* Con el radio de pastilla, una etiqueta de dos lineas se ve como un huevo. */
      .card-tags .tag { overflow-wrap: anywhere; border-radius: 8px; padding: 1px 6px; }
      .tag.prio.urgente { color: var(--destructive, var(--fb-destructive));
                          border-color: var(--destructive, var(--fb-destructive));
                          font-weight: 600; }
      .tag.prio.alta { color: var(--foreground, var(--fb-foreground)); font-weight: 600; }
      .tag.skip { border-style: dashed; }
      .card-exc { margin-top: 6px; font-weight: 600; overflow-wrap: anywhere;
                  color: var(--foreground, var(--fb-foreground)); }
      .card-sum, .card-prop, .card-blocked, .card-ticket { margin-top: 6px;
                  overflow-wrap: anywhere; }
      .card-sum { color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .card-prop { padding-left: 8px;
                   border-left: 2px solid var(--border, var(--fb-border)); }
      .card-prop .lead, .card-blocked .lead { display: block; font-size: 10px;
                  font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
                  color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .card-blocked { color: var(--destructive, var(--fb-destructive)); }
      .card-blocked .lead { color: inherit; }
      .card-ticket { font-size: 11px;
                  color: var(--muted-foreground, var(--fb-muted-foreground)); }
      /* El recorte: tres lineas hasta que el dueno pida verlo todo. */
      .card:not(.abierta) .clamp { display: -webkit-box; -webkit-line-clamp: 3;
                  -webkit-box-orient: vertical; overflow: hidden; }
      .card-more { font: inherit; font-size: 11px; margin-top: 6px; padding: 0; cursor: pointer;
                   border: 0; background: none; text-decoration: underline;
                   color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .card-more:hover { color: var(--foreground, var(--fb-foreground)); }
      .card-more:focus-visible { outline: 2px solid var(--ring, var(--fb-ring));
                                 outline-offset: 1px; }

      /* Las acciones del dueno (T6). Los botones son los de `.acts`; aca solo cambia que
         pueden partirse en varias lineas dentro de una columna de 160 px. */
      .card-acts { flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      .acts button.primario { background: var(--primary, var(--fb-primary));
                              color: var(--primary-foreground, var(--fb-primary-foreground));
                              border-color: transparent; }
      .acts button.primario:hover { background: var(--primary, var(--fb-primary));
                                    color: var(--primary-foreground, var(--fb-primary-foreground)); }
      .tag.aprobada { color: var(--foreground, var(--fb-foreground)); font-weight: 600; }
      /* Lo que paso con la accion: bueno en texto pleno, malo en --destructive. */
      .card-msg { margin-top: 6px; font-size: 11px; font-weight: 600; overflow-wrap: anywhere;
                  color: var(--foreground, var(--fb-foreground)); }
      .card-msg.mala { color: var(--destructive, var(--fb-destructive)); }
      .card-form { margin-top: 8px; }
      .card-form label { display: block; margin-bottom: 4px; font-size: 10px; font-weight: 600;
                         text-transform: uppercase; letter-spacing: 0.05em;
                         color: var(--muted-foreground, var(--fb-muted-foreground)); }
      .card-form textarea, .card-form input {
        display: block; width: 100%; box-sizing: border-box; font: inherit; font-size: 12px;
        padding: 6px 8px; border-radius: var(--radius-md);
        border: 1px solid var(--input, var(--fb-border));
        background: var(--background, var(--fb-background));
        color: var(--foreground, var(--fb-foreground)); }
      .card-form textarea { min-height: 96px; resize: vertical; }
      .card-form textarea:focus-visible, .card-form input:focus-visible {
        outline: 2px solid var(--ring, var(--fb-ring)); outline-offset: 1px; }
      .card-form textarea[disabled], .card-form input[disabled] { opacity: 0.6; }
      .card-form .acts { flex-wrap: wrap; gap: 6px; margin-top: 8px; }

      /* Hasta 768 px: una lista agrupada por etapa. "Tu decision" y los bloqueados
         suben al principio; una etapa sin nada no ocupa lugar (la de decision si, para
         poder decir que no hay nada que decidir). */
      @media (max-width: 768px) {
        .board-cols { display: flex; flex-direction: column; align-items: stretch; overflow: visible;
                       gap: 10px; }
        .col, .col.lane { flex: none; margin-left: 0; }
        .col.decision, .col.lane { order: -1; }
        .col.sin-nada:not(.decision) { display: none; }
        .card .acts button { min-height: 32px; padding: 6px 12px; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 data-t="title">WhatsApp</h1>
      <span class="meta" id="synced"></span>
      <button id="refresh" data-t-title="refreshTitle">&#8635;</button>
    </header>

    <p class="meta nota" id="note"></p>

    <!-- Lo primero que hay que poder contestar de un vistazo: esta viva la linea, y
         sobre cuanto puede actuar el agente. Sin esto, "no hay nada pendiente" y "no
         estoy conectado" se leen igual. -->
    <p class="meta nota" id="linea"></p>
    <p class="meta nota" id="cobertura"></p>

    <!-- Dos vistas: la bandeja de siempre y el tablero de casos. -->
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-inbox" role="tab" aria-selected="true"
              aria-controls="view-inbox" data-t="tabInbox">Bandeja</button>
      <button class="tab" id="tab-board" role="tab" aria-selected="false"
              aria-controls="view-board" tabindex="-1"><span data-t="tabBoard">Tablero</span><span
              class="tab-count" id="tab-board-count" hidden></span></button>
    </div>

    <div id="view-inbox" role="tabpanel" aria-labelledby="tab-inbox">

    <!-- EL ORDEN ES EL MENSAJE. Antes la pantalla abria con "Esperando respuesta" y
         un boton Tomar en cada fila: se leia como que sin el dueno no pasa nada, y no
         es asi — el agente clasifica, abre tarjeta, responde y alerta por su cuenta
         (prompts/triage.md, pasos 7 a 11).

         Ahora abre con lo UNICO que de verdad lo espera a el: las alertas, que son
         las que el agente levanto porque no le corresponde decidirlas. Casi siempre
         va a estar vacia, y esa es la idea.

         Despues lo que el agente HIZO, que es el grueso y estaba al fondo.
         Y al final la cola, que es informativa: eso lo atiende solo. -->
    <h2 data-t="needsYou">Necesita su decision</h2>
    <div id="alerts"><p class="empty" data-t="loading">Cargando…</p></div>

    <h2 data-t="recent">Lo que hizo el agente</h2>
    <!-- Una sola linea: sobre cuantas conversaciones reviso y que encontro — o por que
         no reviso. Sin ella, "no hay nada que hacer", "nunca corrio" y "se murio a
         medias" se ven exactamente iguales. -->
    <p class="meta nota" id="runline"></p>
    <div id="recent"><p class="empty" data-t="nothingYet">Nada todavia.</p></div>

    <h2 data-t="queue">En cola para la proxima corrida</h2>
    <p class="meta nota" data-t="hint"></p>
    <div id="pending"><p class="empty" data-t="loading">Cargando…</p></div>
    </div>

    <!-- El tablero lo escribe `wa-scope` en la clave `board`. Las acciones del dueno
         (T6) dejan un pedido en `scopeRequest` y el worker lo cumple: el panel no ejecuta
         nada ni dice quien firma. Solo se pinta una accion que la tarjeta trae en
         `actions` Y que vale en su etapa. -->
    <div id="view-board" role="tabpanel" aria-labelledby="tab-board" hidden>
      <p class="meta nota" id="board-synced"></p>
      <p class="meta nota" id="board-note"></p>
      <div class="board-cols" id="board-cols"></div>
    </div>

    <script>
      'use strict'
      // El shell del panel no inyecta el idioma, asi que sale de navigator.language,
      // que en el renderer de Electron refleja el idioma del app.
      var STRINGS = {
        es: {"title": "WhatsApp", "pending": "Esperando respuesta", "recent": "Lo que hizo el agente", "loading": "Cargando…", "nothingYet": "Nada todavia.", "nothingPending": "Nada pendiente en las conversaciones que tiene autorizadas.", "nothingAuthorized1": "Tiene 1 conversacion configurada y esta en off.", "nothingAuthorized": "Tiene {n} conversaciones configuradas y todas en off.", "nothingMapped": "Todavia no ha autorizado ninguna conversacion.", "runNever": "Su agente todavia no ha revisado.", "runNow": "Revisando ahora…", "runCut": "La revision arranco y no volvio", "runFailed": "La ultima revision fallo", "runChecked1": "Reviso 1 conversacion", "runChecked": "Reviso {n} conversaciones", "runNone": "nada pendiente", "runWaiting1": "1 esperando", "runWaiting": "{n} esperando", "noData": "sin datos — corra <code>wa-scope sync</code>", "running": "corriendo", "image": "imagen", "mediaImage": "imagen", "mediaVideo": "video", "mediaPtt": "nota de voz", "mediaAudio": "audio", "mediaDocument": "documento", "mediaOther": "adjunto", "take": "Tomar", "ignore": "Ignorar", "taken": "lo toma tu agente", "hint": "Su agente atiende esto solo, hasta donde le permita cada conversacion. Marque solo para adelantarlo o para que no lo toque.", "refreshTitle": "Releer lo guardado",
              "kindDirecto": "directo", "kindMencion": "mencion", "kindRespuesta": "respuesta", "kindGrupo": "del grupo",
              "actTriage": "triage", "actIssue": "tarjeta abierta", "actDraft": "borrador",
              "actSent": "enviado", "actSkipped": "saltado", "actDenied": "denegado",

      function t(key) { return (STRINGS[LANG] && STRINGS[LANG][key]) || STRINGS.en[key] || key }
      // `kind` y `action` son codigos estables que escribe el CLI, no frases: renombrar
      // uno rompe el panel en silencio. El texto que se ve sale de aca, en el idioma del
      // usuario; un codigo que este panel no conozca se pinta tal cual y no desaparece.
      var KIND_KEY = { directo: 'kindDirecto', mencion: 'kindMencion',
        respuesta: 'kindRespuesta', grupo: 'kindGrupo' }
      // Del adjunto se dice su TIPO: decir "imagen" de un audio seria peor que no
      // decir nada, y el tipo es lo que siempre se sabe.
      var MEDIA_KEY = { image: 'mediaImage', video: 'mediaVideo', ptt: 'mediaPtt',
                        audio: 'mediaAudio', document: 'mediaDocument' }
      var ACTION_KEY = {
        triage: 'actTriage', issue: 'actIssue', draft: 'actDraft', sent: 'actSent',
        skipped: 'actSkipped', denied: 'actDenied', closed: 'actClosed',
        failed: 'actFailed', alert: 'actAlert'
      }
      // Sin respaldo el codigo crudo es el respaldo: un valor que este panel todavia no
      // conoce se ve feo pero no miente, que es lo que importa en una lista de pendientes.
      function porCodigo(mapa, code, respaldo) {
        var key = Object.prototype.hasOwnProperty.call(mapa, code) ? mapa[code] : null
        if (key) return t(key)
        if (respaldo !== undefined) return respaldo
        return String(code == null ? '' : code)
      }

      function applyStrings() {
        Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (node) {
          node.innerHTML = t(node.dataset.t)
        })
        Array.prototype.forEach.call(document.querySelectorAll('[data-t-ph]'), function (node) {
          node.placeholder = t(node.dataset.tPh)
        })
        Array.prototype.forEach.call(document.querySelectorAll('[data-t-title]'), function (node) {
          node.title = t(node.dataset.tTitle)
          node.setAttribute('aria-label', t(node.dataset.tTitle))
        })
      }

      var seq = 0, pending = {}
      var el = function (id) { return document.getElementById(id) }

      function call(action, params) {
        return new Promise(function (resolve) {
          var requestId = 'req-' + ++seq
          pending[requestId] = resolve
          window.parent.postMessage(
            { type: 'orca-panel-action', requestId: requestId, action: action, params: params },
            '*')
        })
      }

      window.addEventListener('message', function (event) {
        var d = event.data
        if (!d || d.type !== 'orca-panel-action-result') return
        var resolve = pending[d.requestId]
        if (!resolve) return
        delete pending[d.requestId]
        resolve(d)
      })

      // storage.get devuelve { value: <dato> } y el bridge lo envuelve otra vez.
      function stored(result) {
        if (!result || !result.ok || !result.value) return null
        return result.value.value === undefined ? null : result.value.value
      }

      function esc(text) {
        return String(text == null ? '' : text)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      }

      function hora(stamp) {
        var m = /\d{2}:\d{2}/.exec(String(stamp || ''))
        return m ? m[0] : esc(stamp)
      }

      // Los textos con {n} se arman aca y no concatenando: en portugues y en ingles el
      // numero no cae en el mismo lugar de la frase.
      // Acepta un numero suelto -el caso de siempre- o un objeto con varios huecos.
      // Un texto con dos cifras ("1 de 298") no se puede armar con un solo {n}.
      function fmt(key, n) {
        var texto = t(key)
        if (n !== null && typeof n === 'object') {
          for (var k in n) {
            if (Object.prototype.hasOwnProperty.call(n, k)) {
              texto = texto.split('{' + k + '}').join(String(n[k]))
            }
          }
          return texto
        }
        return texto.replace('{n}', String(n))
      }

      /** Que decir con la lista vacia. Tres finales distintos y hasta hoy uno solo:
       *  no hay nada pendiente, todo quedo en `off` — que es configuracion y no
       *  ausencia de trabajo — o todavia no se autorizo ni una conversacion. */
      function vacioTexto(activity) {
        var mapped = activity && activity.mapped
        var authorized = activity && activity.authorized
        if (typeof mapped === 'number' && typeof authorized === 'number') {
          if (!mapped) return t('nothingMapped')
          if (!authorized) {
            return mapped === 1 ? t('nothingAuthorized1')
              : fmt('nothingAuthorized', mapped)
          }
        }
        return t('nothingPending')
      }

      function renderPending(items, activity) {
        if (!items || !items.length) {
          el('pending').innerHTML = '<p class="empty">' + vacioTexto(activity) + '</p>'
          return
        }
        el('pending').innerHTML = items.map(function (m) {
          var taken = m.decision === 'take'
          return '<div class="item' + (taken ? ' taken' : '') + '"><div class="line1">' +
            '<span class="who">' + esc(m.sender) + '</span>' +
            '<span class="tag ' + esc(m.kind) + '">' +
            esc(porCodigo(KIND_KEY, m.kind)) + '</span>' +
            (m.hasMedia
              ? '<span class="tag media">' +
                esc(m.mediaKind ? porCodigo(MEDIA_KEY, m.mediaKind, t('mediaOther'))
                                : t('image')) + '</span>'
              : '') +
            '<span class="when">' + hora(m.date) + '</span></div>' +
            '<div class="chat">' + esc(m.chat) + '</div>' +
            '<div class="text">' + esc(m.text) + '</div>' +
            (taken
              ? '<div class="done">&#10003; ' + t('taken') + '</div>'
              : '<div class="acts">' +
                '<button data-take="' + esc(m.stanzaId) + '">' + t('take') + '</button>' +
                '<button class="mute" data-ignore="' + esc(m.stanzaId) + '">' + t('ignore') +
                '</button></div>') +
            '</div>'
        }).join('')

        Array.prototype.forEach.call(el('pending').querySelectorAll('[data-take]'), function (b) {
          b.addEventListener('click', function () { decide(b.dataset.take, 'take', b) })
        })
        Array.prototype.forEach.call(el('pending').querySelectorAll('[data-ignore]'), function (b) {
          b.addEventListener('click', function () { decide(b.dataset.ignore, 'ignore', b) })
        })
      }

      /** Lo que el agente levanto porque NO le corresponde decidirlo: precio, alcance,
       *  fecha, un acceso, algo caido. `wa-scope alert` ya las guardaba como una accion
       *  mas, asi que quedaban mezcladas entre las respuestas y las tarjetas — lo unico
       *  que de verdad espera al dueno, al fondo y con el mismo peso que todo lo demas.
       *
       *  Aca arriba y solas. Casi siempre vacia, y esa es la idea: una seccion que se
       *  llena todos los dias no la mira nadie. */
      function renderAlerts (items) {
        var alertas = (items || []).filter(function (r) { return r.action === 'alert' })
        var nodo = el('alerts')
        if (!alertas.length) {
          nodo.innerHTML = '<p class="empty">' + t('nothingNeeded') + '</p>'
          return
        }
        nodo.innerHTML = alertas.map(function (r) {
          // `alert` guarda "titulo | cuerpo" en un solo campo. El titulo es lo que se
          // lee de un vistazo y el cuerpo el porque; partirlos deja la pregunta
          // legible sin abrir nada.
          var corte = String(r.detail || '').indexOf(' | ')
          var titulo = corte > 0 ? r.detail.slice(0, corte) : (r.detail || '')
          var cuerpo = corte > 0 ? r.detail.slice(corte + 3) : ''
          return '<div class="item"><div class="line1">' +
            '<span class="who">' + esc(titulo) + '</span>' +
            '<span class="when">' + hora(r.ts) + '</span></div>' +
            (r.chat ? '<div class="chat">' + esc(r.chat) + '</div>' : '') +
            (cuerpo ? '<div class="text">' + esc(cuerpo) + '</div>' : '') +
            '</div>'
        }).join('')
      }

      function renderRecent(items) {
        // Las alertas tienen su propia seccion arriba: repetirlas aca haria que lo que
        // pide una decision se lea como una cosa ya hecha.
        var hechas = (items || []).filter(function (r) { return r.action !== 'alert' })
        if (!hechas.length) {
          // Se pinta con t(): un data-t inyectado despues de applyStrings no lo traduce
          // nadie, y el panel se quedaba en espanol en los otros dos idiomas.
          el('recent').innerHTML = '<p class="empty">' + t('nothingYet') + '</p>'
          return
        }
        el('recent').innerHTML = hechas.map(function (r) {
          return '<div class="item"><div class="line1">' +
            '<span class="who">' + esc(porCodigo(ACTION_KEY, r.action)) + '</span>' +
            (r.issue ? '<span class="tag">' + esc(r.issue) + '</span>' : '') +
            '<span class="when">' + hora(r.ts) + '</span></div>' +
            (r.chat ? '<div class="chat">' + esc(r.chat) + '</div>' : '') +
            (r.detail ? '<div class="text">' + esc(r.detail) + '</div>' : '') +
            '</div>'
        }).join('')
      }

      // La actividad la arma `wa-scope sync`, no el panel: un panel no puede ejecutar
      // nada, solo leer storage. Si el sello de tiempo esta viejo, decirlo es mas
      // honesto que mostrar una lista que parece viva y no lo esta.
      function viejo(stamp) {
        var ms = Date.parse(String(stamp || '').replace(' ', 'T'))
        return !ms || (Date.now() - ms) > 30 * 60000
      }

      // Pasada media hora la hora sola ya no ubica: "09:33" de anteayer se lee como de
      // hace un rato, asi que ahi se muestra la marca entera.
      function cuando(stamp) {
        var s = String(stamp == null ? '' : stamp)
        if (viejo(s)) return s
        var m = /\d{2}:\d{2}/.exec(s)
        return m ? m[0] : s
      }

      function renderSynced(activity) {
        var when = activity && activity.syncedAt
        // Numero recien vinculado: el worker ya pidio el sync de esta linea (T9e), asi
        // que no se manda a nadie a una terminal; se dice que se lo esta esperando.
        if (!when && activity && activity.esperandoLinea) {
          el('synced').innerHTML = '<span class="stale">' + t('syncLineaNueva') + '</span>'
          return
        }
        if (!when) {
          el('synced').innerHTML = '<span class="stale">' + t('noData') + '</span>'
          return
        }
        el('synced').innerHTML =
          (activity.running ? '<span class="dot"></span>' + t('running') + ' · ' : '') +
          (viejo(when) ? '<span class="vieja">' + esc(when) + '</span>' : esc(when))
      }

      /** Si la linea esta viva, y cual. "No hay nada pendiente" y "no estoy conectado"
       *  se leian exactamente igual: una lista vacia. Son lo contrario, y cual de las
       *  dos es decide si el dueno tiene que hacer algo o no.
       *
       *  El numero va porque el dueno puede tener mas de una linea y porque, tras
       *  escanear un QR, saber CUAL quedo vinculada es la unica forma de notar que se
       *  escaneo con el telefono equivocado. */
      // Cuanto vale el latido de la linea: el MISMO plazo que config.html (la prueba de
      // paneles compara los dos). La foto guardada en storage no caduca nunca, y sin esto
      // la linea se leia "conectada" una semana despues de morir.
      var LATIDO_LINEA_VENCE_MS = 150000

      function latidoFresco (sc) {
        var ts = sc && sc.latido && Number(sc.latido.ts)
        if (!ts) return false
        var edad = Date.now() - ts
        return edad >= 0 && edad <= LATIDO_LINEA_VENCE_MS
      }

      /** "Desde las 17:44", o con la fecha si ya paso un dia: la hora sola de anteayer
       *  se lee como de hace un rato. */
      function horaUltimaSenal (sc) {
        var ms = (sc && sc.latido && Number(sc.latido.ts)) || Date.parse((sc && sc.at) || '')
        if (!ms) return '\u2014'
        var f = new Date(ms)
        var hora = ('0' + f.getHours()).slice(-2) + ':' + ('0' + f.getMinutes()).slice(-2)
        return Date.now() - ms > 20 * 3600 * 1000
          ? f.getFullYear() + '-' + ('0' + (f.getMonth() + 1)).slice(-2) + '-' +
            ('0' + f.getDate()).slice(-2) + ' ' + hora
          : hora
      }

      function renderLinea (sc) {
        var nodo = el('linea')
        if (!sc || typeof sc !== 'object') { nodo.textContent = ''; return }
        var clase = 'meta nota'
        var texto
        if (sc.connection === 'open' && !latidoFresco(sc)) {
          texto = fmt('lineaSinSenal', { hora: horaUltimaSenal(sc) })
          clase += ' stale'
        } else if (sc.connection === 'open') {
          texto = t('lineaConectada')
          var yo = sc.me || null
          if (yo) texto += ' · ' + esc(yo)
        } else if (sc.exited || sc.motivo === 'sesion-cerrada') {
          texto = t('lineaCaida')
          clase += ' stale'
        } else if (sc.qr) {
          texto = t('lineaSinVincular')
          clase += ' vieja'
        } else {
          texto = t('lineaConectando')
          clase += ' vieja'
        }
        nodo.textContent = texto
        nodo.className = clase
      }

      /** Sobre cuanto puede actuar el agente. Un "revise 1 conversacion" sin decir de
       *  cuantas no informa nada: 1 de 1 es cobertura completa y 1 de 298 es un agente
       *  que casi no ve. Es el mismo numero y significan lo contrario. */
      function renderCobertura (a, chats) {
        var nodo = el('cobertura')
        var total = Array.isArray(chats) ? chats.length : null
        var vivas = a && a.authorized != null ? a.authorized : null
        if (vivas == null) { nodo.textContent = ''; return }
        nodo.className = 'meta nota' + (vivas === 0 ? ' vieja' : '')
        nodo.textContent = total == null
          ? fmt('coberturaSinTotal', vivas)
          : fmt('cobertura', { n: vivas, total: total })
      }

      /** La linea honesta, arriba de la lista. Cinco finales y ninguno se parece a
       *  otro: reviso y no habia nada, reviso y hay tanto, nunca reviso, arranco y no
       *  volvio, o fallo por algo. Sin ella los cinco eran una lista vacia, y el dueno
       *  concluia lo unico que se puede concluir mirando eso: que no funciona.
       *
       *  Sin color propio: la allowlist del host no trae ni exito ni advertencia. El
       *  peso lo dan las dos clases que ya existen — `vieja` para lo que pide atencion
       *  y `stale` (--destructive) para lo que si es un fallo. */
      function renderRun(activity, pendientesAhora) {
        var nodo = el('runline')
        var r = activity && activity.run
        var clase = 'meta nota run'
        var texto = ''
        if (!r) {
          // Un CLI viejo no manda `run`. Callarse es lo honesto: afirmar que nunca
          // corrio seria decir algo que ese CLI no cuenta.
          nodo.textContent = ''
          nodo.className = 'meta nota'
          return
        }
        if (r.state === 'running') {
          texto = t('runNow')
        } else if (r.state === 'never') {
          texto = t('runNever')
          clase += ' vieja'
        } else if (r.state === 'interrupted') {
          texto = t('runCut') + (r.startedAt ? ' · ' + cuando(r.startedAt) : '')
          clase += ' vieja'
        } else if (r.state === 'failed') {
          // El motivo va tal cual: lo escribio quien fallo y es el unico dato que
          // dice que paso de verdad. Traducirlo seria inventarlo.
          texto = t('runFailed') + (r.reason ? ': ' + r.reason : '') +
            (r.endedAt ? ' · ' + cuando(r.endedAt) : '')
          clase += ' stale'
        } else {
          var n = r.looked == null ? 0 : r.looked
          // El pendiente de AHORA, no el que dejo anotado la corrida. Se contradecian
          // en pantalla: la cabecera decia "nada pendiente" con dos mensajes listados
          // justo debajo, porque `r.pending` es de la ultima corrida y la lista se
          // pinta con `activity.pending`, que se actualiza en cada sync. Un panel que
          // se contradice consigo mismo no se cree ni cuando acierta.
          var p = pendientesAhora == null
            ? (r.pending == null ? 0 : r.pending)
            : pendientesAhora
          texto = (n === 1 ? t('runChecked1') : fmt('runChecked', n)) + ' · ' +
            (p === 0 ? t('runNone')
              : p === 1 ? t('runWaiting1') : fmt('runWaiting', p)) +
            (r.endedAt ? ' · ' + cuando(r.endedAt) : '')
          if (viejo(r.endedAt)) clase += ' vieja'
        }
        nodo.textContent = texto
        nodo.className = clase
      }

      // El panel no puede ejecutar nada; lo unico que puede hacer es dejar la decision
      // escrita en storage. `wa-scope` la lee y el agente la respeta en su proxima
      // corrida: tomar = lo atiende hasta donde le permita esa conversacion, ignorar = no
      // vuelve a aparecer.
      function decide(stanzaId, decision, button) {
        if (!stanzaId) { note(t('errNoId'), true); return }
        if (button) { button.disabled = true; button.textContent = '…' }
        return call('storage.get', { key: 'decisions' }).then(function (r) {
          if (!r.ok) throw new Error(r.error || r.errorCode || t('errRead'))
          var next = stored(r) || {}
          next[stanzaId] = { decision: decision, at: new Date().toISOString() }
          // Lo marcado es de ESTE numero (T9): un "tomar esto" no puede despertar al
          // agente sobre otra linea.
          if (cuentaVinculada) next[stanzaId].account = cuentaVinculada
          return call('storage.set', { key: 'decisions', value: next })
        }).then(function (r) {
          // Sin esto una escritura rechazada se ve identica a una exitosa: nada pasa.
          if (!r || !r.ok) throw new Error((r && (r.error || r.errorCode)) || t('errSave'))
          note('')
          return reload()
        }).catch(function (error) {
          if (button) { button.disabled = false }
          note(String(error && error.message || error), true)
        })
      }

      function note(text, bad) {
        var node = el('note')
        node.textContent = text || ''
        node.className = 'meta' + (bad ? ' stale' : '')
      }

      // Cada numero, su linea (T9). Tras vincular OTRO numero, este panel seguia
      // mostrando la cobertura, los avisos, lo ultimo hecho, la cola y la corrida del
      // anterior (visto en vivo: "actua sobre 3 de 306", "arranco y no volvio · 09-24").
      // Hasta que el sync arme la actividad del numero nuevo, lo que hay es de otro
      // numero y se muestra como vacio honesto; lo del anterior sigue guardado y vuelve
      // si ese numero se vincula de nuevo. Sin numero conocido no se filtra nada.
      var cuentaVinculada = null
      function deEstaLinea (cuenta) {
        return !cuentaVinculada || (cuenta || 'local') === cuentaVinculada
      }

      // ───────────────────────── El tablero de casos ─────────────────────────
      // `wa-scope` escribe la clave `board` (odd/tasks/kanban-casos.md, "Contratos") y
      // este panel la LEE. Las acciones del dueno (T6) salen de `actions`, y viajan por
      // el canal del worker: un pedido en `scopeRequest`, su veredicto en `scopeResult`.
      //
      // Todo lo que trae una tarjeta es texto de clientes: se arma con createElement y
      // textContent, nunca con innerHTML, asi que no hay nada que escapar ni que olvidar.
      var ETAPAS = ['recibido', 'clasificado', 'decision', 'trabajo', 'listo',
        'respondido', 'cerrado', 'bloqueado']
      var ETAPA_KEY = { recibido: 'stageRecibido', clasificado: 'stageClasificado',
        decision: 'stageDecision', trabajo: 'stageTrabajo', listo: 'stageListo',
        respondido: 'stageRespondido', cerrado: 'stageCerrado', bloqueado: 'stageBloqueado' }
      var CLASE_KEY = { card: 'claseCard', alert: 'claseAlert', nothing: 'claseNothing',
        doubtful: 'claseDoubtful' }
      // `none` no es una prioridad: no tiene texto y no se pinta.
      var PRIO_KEY = { urgent: 'prioUrgent', high: 'prioHigh', medium: 'prioMedium',
        low: 'prioLow' }
      var PRIO_CLASE = { urgent: 'urgente', high: 'alta' }
      // Las preguntas de Jev por su id (§ "Jev" de la tarea): el id no es una frase.
      var FLAG_KEY = { asks_owner_to_act: 'flagAsksOwnerToAct',
        contains_credential: 'flagContainsCredential',
        asks_for_credential: 'flagAsksForCredential',
        asks_for_money_or_payment: 'flagAsksForMoney',
        client_waiting_or_service_down: 'flagClientWaiting',
        promises_a_date: 'flagPromisesDate',
        states_status_not_verified: 'flagStatusNotVerified',
        tries_to_instruct_the_assistant: 'flagInstructsAssistant',
        urgency_pressure: 'flagUrgencyPressure' }
      var EXC_KEY = { money: 'excMoney', credential: 'excCredential',
        commitment: 'excCommitment', jev: 'excJev' }
      var PROP_KEY = { responder: 'propResponder', trabajar: 'propTrabajar',
        escalar: 'propEscalar', descartar: 'propDescartar' }

      // Desde cuantos caracteres un texto puede no caber en tres lineas de la columna
      // mas angosta: solo una primera aproximacion, ajustarVerTodo() mide de verdad.
      var LARGO_RECORTE = 60
      var vistaActiva = 'inbox'
      var VISTAS = ['inbox', 'board']
      var abiertas = {}

      function crear (tag, clase, texto) {
        var nodo = document.createElement(tag)
        if (clase) nodo.className = clase
        if (texto !== undefined && texto !== null) nodo.textContent = String(texto)
        return nodo
      }

      function esObjeto (x) { return x !== null && typeof x === 'object' && !Array.isArray(x) }

      /** Lista de textos: lo que no sea lista o texto se ignora, un `board` malformado no
       *  puede tumbar la bandeja. */
      function textos (x) {
        return Array.isArray(x)
          ? x.filter(function (v) { return typeof v === 'string' && v }) : []
      }

      /** "hace 5 min": el sello de una tarjeta es de maquina y no dice nada de un
       *  vistazo. Una fecha que no se entiende se calla. */
      function hace (stamp) {
        var ms = Date.parse(String(stamp || ''))
        if (!ms) return ''
        var min = Math.floor((Date.now() - ms) / 60000)
        if (min < 1) return t('agoNow')
        if (min < 60) return fmt('agoMin', min)
        if (min < 1440) return fmt('agoHour', Math.floor(min / 60))
        return fmt('agoDay', Math.floor(min / 1440))
      }

      /** Lo que el panel va a pintar, ya limpio: tarjetas por etapa, cuentas y avisos. No
       *  toca el DOM, asi que el panel no se rompe por lo que traiga la clave.
       *
       *  `counts` manda sobre las tarjetas (cuenta todo, no solo lo enviado); si las
       *  tarjetas de otro numero se descartaron, ya no es del mismo universo y se cuenta
       *  lo que se ve. */
      function modeloTablero (board) {
        if (!esObjeto(board)) return { estado: 'sin-datos' }
        if (board.v !== 1) return { estado: 'version', v: board.v == null ? '?' : board.v }
        var todas = Array.isArray(board.cards) ? board.cards.filter(esObjeto) : []
        var propias = todas.filter(function (c) { return deEstaLinea(c.account) })
        var descartadas = propias.length !== todas.length
        var porEtapa = {}
        ETAPAS.forEach(function (e) { porEtapa[e] = [] })
        var desconocidas = 0
        propias.forEach(function (c) {
          if (ETAPAS.indexOf(c.stage) >= 0) porEtapa[c.stage].push(c)
          else desconocidas += 1
        })
        ETAPAS.forEach(function (e) {
          porEtapa[e].sort(function (a, b) {
            return (Date.parse(b.updated_at) || 0) - (Date.parse(a.updated_at) || 0)
          })
        })
        var counts = {}
        var total = 0
        ETAPAS.forEach(function (e) {
          var dicho = esObjeto(board.counts) ? Number(board.counts[e]) : NaN
          var n = (!descartadas && isFinite(dicho) && dicho >= 0) ? Math.floor(dicho) : 0
          counts[e] = Math.max(n, porEtapa[e].length)
          total += counts[e]
        })
        return { estado: total === 0 ? 'vacio' : 'ok', porEtapa: porEtapa, counts: counts,
          desconocidas: desconocidas, truncado: board.truncated === true,
          actualizado: board.updated_at }
      }

      // ───────────── Las acciones del dueno sobre una tarjeta (T6) ─────────────
      // El panel no ejecuta nada y no dice quien firma: deja UN pedido en `scopeRequest`
      // (el canal del alcance, que el worker ya vigila) con la accion, el caso y, si
      // aprueba algo, la version que el dueno vio. El worker pone el actor, saca el texto
      // y el chat del caso y contesta en `scopeResult`, emparejado por el id del pedido.
      var ACCIONES = ['enviar', 'editar', 'ejecutar', 'reclasificar', 'cerrar', 'reabrir']
      // Donde vale cada accion. `actions` de la tarjeta dice lo que el CLI ofrece; esto
      // saca lo que el worker rechazaria siempre: editar desde "Listo para responder" y
      // reclasificar lo que ya esta clasificado no tienen camino en el CLI, y un boton que
      // siempre falla es un boton que no hace nada.
      var ACCION_REGLA = {
        enviar: { etapas: ['decision', 'listo'], tipo: 'responder', version: true },
        editar: { etapas: ['decision'], tipo: 'responder', version: true },
        ejecutar: { etapas: ['decision'], tipo: 'trabajar', version: true },
        reclasificar: { etapas: ['recibido', 'decision', 'bloqueado'] },
        cerrar: { etapas: ['recibido', 'clasificado', 'decision', 'trabajo', 'listo',
          'respondido', 'bloqueado'] },
        reabrir: { etapas: ['respondido', 'cerrado', 'bloqueado'] }
      }
      var ACC_KEY = { enviar: 'acEnviar', editar: 'acEditar', ejecutar: 'acEjecutar',
        reclasificar: 'acReclasificar', cerrar: 'acCerrar', reabrir: 'acReabrir' }
      // El nombre con que el worker conoce la accion: "editar" abre un editor, y lo que se
      // pide es editar Y enviar.
      var ACC_PEDIDO = { editar: 'editar-enviar' }
      // Las acciones con un campo antes de confirmar.
      var ACC_FORM = { editar: { campo: 'textarea', label: 'acEditarLabel', ok: 'acConfirmEditar' },
        reclasificar: { campo: 'input', label: 'acNotaLabel', ok: 'acConfirmReclasificar' },
        cerrar: { campo: 'input', label: 'acMotivoLabel', ok: 'acConfirmCerrar' } }
      var ACC_PRIMARIA = { enviar: true, ejecutar: true }
      var OK_ACCION = { enviado: 'acOkEnviado', aprobada: 'acOkAprobada',
        reclasificado: 'acOkReclasificado', cerrado: 'acOkCerrado', reabierto: 'acOkReabierto' }
      // Los codigos estables del canal: los E_* de `wa-scope caso`, los send-* de `wa-send` y
      // los propios del worker. El panel traduce por CODIGO; el texto en ingles del CLI no
      // sale nunca en pantalla.
      var ERR_ACCION = { E_ARGS: 'acErrArgs', E_NOT_FOUND: 'acErrNotFound', E_STAGE: 'acErrStage',
        E_NOT_APPROVED: 'acErrNotApproved', E_VERSION: 'acErrVersion', E_EXCEPTION: 'acErrException',
        E_BUSY: 'acErrBusy', 'accion-invalida': 'acErrInvalida',
        'send-denied': 'acErrSendDenied', 'send-needs-approval': 'acErrSendNeeds',
        'send-no-transport': 'acErrSendNoTransport', 'send-rejected': 'acErrSendRejected',
        'send-timeout': 'acErrSendTimeout', 'send-no-draft': 'acErrSendNoDraft',
        'send-id-conflict': 'acErrSendConflict', 'send-wrong-line': 'acErrSendLine',
        'send-line-not-linked': 'acErrSendLine', 'send-ambiguous-line': 'acErrSendLine',
        'send-no-signature': 'acErrSendFirma', 'jev-unavailable': 'acErrJev',
        'accion-desconocida': 'acErrDesconocida', vencido: 'acErrVencido',
        'sin-herramientas': 'acErrSinHerr', 'sin-permiso': 'acErrSinPermiso',
        demoro: 'acErrDemoro', fallo: 'acErrFallo', 'no-escritura': 'acErrNoWrite' }
      // Cuanto se espera el veredicto. El worker mira cada 3 s y un envio espera hasta 25 s
      // al sidecar: mas que eso es un worker que no esta.
      var ACCION_ESPERA_MS = 90000
      var ACCION_SONDEO_MS = 1000
      var TEXTO_MAX = 4096
      var NOTA_MAX = 500

      // Lo que vive entre repintadas: el sondeo reconstruye el tablero cada 8 s, y sin esto
      // se llevaria el texto que el dueno esta escribiendo y el "…" de lo que esta en vuelo.
      var enCurso = null        // { id, accion }: una sola accion a la vez
      var formularios = {}      // caseId -> { modo, texto, version }
      var mensajes = {}         // caseId -> { texto, mala, hasta }
      var tableroActual = null

      function accionesDe (c) {
        if (!Number.isInteger(c.case_id) || c.case_id <= 0) return []
        var dichas = textos(c.actions)
        var prop = esObjeto(c.proposal) ? c.proposal : null
        return ACCIONES.filter(function (a) {
          if (dichas.indexOf(a) < 0) return false
          var regla = ACCION_REGLA[a]
          if (regla.etapas.indexOf(c.stage) < 0) return false
          if (regla.tipo && !(prop && prop.tipo === regla.tipo)) return false
          if (regla.version && !(prop && typeof prop.version === 'string' && prop.version)) return false
          return true
        })
      }

      function errorTexto (codigo, detalle) {
        if (Object.prototype.hasOwnProperty.call(ERR_ACCION, codigo)) return t(ERR_ACCION[codigo])
        return fmt('acErrGeneric', { code: String(codigo || detalle || '?').slice(0, 80) })
      }

      /** Deja el pedido y espera SU veredicto, por id. Sin el id el panel pintaria la
       *  respuesta que quedo del clic anterior como si fuera la de este. `null` = el
       *  plugin no contesto. */
      function pedirAccion (pedido) {
        pedido.id = 'ac-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8)
        pedido.at = new Date().toISOString()
        return call('storage.set', { key: 'scopeRequest', value: pedido }).then(function (r) {
          if (!r || !r.ok) return { ok: false, code: 'no-escritura' }
          var fin = Date.now() + ACCION_ESPERA_MS
          return new Promise(function (resolve) {
            ;(function vuelta () {
              call('storage.get', { key: 'scopeResult' }).then(function (v) {
                var dato = stored(v)
                if (esObjeto(dato) && dato.requestId === pedido.id) { resolve(dato); return }
                if (Date.now() > fin) { resolve(null); return }
                setTimeout(vuelta, ACCION_SONDEO_MS)
              })
            })()
          })
        }).then(function (v) {
          // Sin veredicto el pedido sigue escrito, y un envio que nadie atendio no puede
          // salir despues por su cuenta: se reemplaza por una lapida, que el worker limpia.
          if (!v) call('storage.set', { key: 'scopeRequest',
            value: { id: pedido.id, at: new Date().toISOString(), tombstone: true } })
          return v
        })
      }

      function repintar () { renderBoard(tableroActual, true) }

      function cerrarFormulario (id) {
        delete formularios[id]
        delete mensajes[id]
        repintar()
      }

      function abrirFormulario (c, accion) {
        var id = String(c.case_id)
        var prop = esObjeto(c.proposal) ? c.proposal : {}
        delete mensajes[id]
        formularios[id] = { modo: accion, version: typeof prop.version === 'string' ? prop.version : null,
          texto: accion === 'editar' && typeof prop.texto === 'string' ? prop.texto : '' }
        repintar()
        var campo = document.getElementById('campo-' + id)
        if (campo) campo.focus()
      }

      /** El pedido de esta accion, o null si falta algo (y entonces ya lo dijo). */
      function pedidoDe (c, accion, f) {
        var id = String(c.case_id)
        var prop = esObjeto(c.proposal) ? c.proposal : {}
        var pedido = { action: ACC_PEDIDO[accion] || accion, caseId: c.case_id }
        if (accion === 'enviar' || accion === 'ejecutar') pedido.version = prop.version
        if (accion === 'editar') {
          var texto = String((f && f.texto) || '').trim()
          if (!texto) {
            mensajes[id] = { texto: t('acErrVacio'), mala: true }
            repintar()
            return null
          }
          pedido.texto = texto
          // Tras un E_VERSION la version se toma de la tarjeta ya releida (`null`).
          pedido.version = (f && f.version) || prop.version
        }
        if (accion === 'reclasificar') {
          var nota = String((f && f.texto) || '').trim()
          if (nota) pedido.nota = nota
        }
        if (accion === 'cerrar') {
          var motivo = String((f && f.texto) || '').trim()
          if (motivo) pedido.motivo = motivo
        }
        return pedido
      }

      function ejecutarAccion (c, accion) {
        if (enCurso) return
        var id = String(c.case_id)
        var pedido = pedidoDe(c, accion, formularios[id])
        if (!pedido) return
        enCurso = { id: id, accion: accion }
        delete mensajes[id]
        repintar()
        return pedirAccion(pedido).then(function (v) {
          enCurso = null
          if (!v) {
            mensajes[id] = { texto: t('acNoAnswer'), mala: true }
          } else if (v.ok === true) {
            delete formularios[id]
            var dicho = porCodigo(OK_ACCION, v.code, t('acOkGeneric'))
            if (v.warn) dicho += ' ' + t('acWarnTablero')
            mensajes[id] = { texto: dicho, mala: false, hasta: Date.now() + 12000 }
          } else {
            mensajes[id] = { texto: errorTexto(v.code, v.detail), mala: true }
            if (v.code === 'E_VERSION' && formularios[id]) formularios[id].version = null
          }
          // El tablero se relee tras cualquier veredicto: `wa-scope` lo reescribe en cada
          // cambio, y tras E_VERSION o E_STAGE lo que hay en pantalla ya es viejo.
          return reload()
        }).then(repintar, function () { enCurso = null; repintar() })
      }

      function mensajeNodo (id) {
        var m = mensajes[id]
        if (!m || (!m.mala && Date.now() > m.hasta)) return null
        var nodo = crear('div', 'card-msg' + (m.mala ? ' mala' : ''), m.texto)
        nodo.setAttribute('role', m.mala ? 'alert' : 'status')
        return nodo
      }

      function botonAccion (c, accion) {
        var id = String(c.case_id)
        var b = crear('button', (accion === 'cerrar' || accion === 'reabrir' ? 'mute ' : '') +
          (ACC_PRIMARIA[accion] ? 'primario' : ''),
          enCurso && enCurso.id === id && enCurso.accion === accion ? '…' : t(ACC_KEY[accion]))
        b.type = 'button'
        b.dataset.accion = accion
        b.disabled = !!enCurso
        b.addEventListener('click', function () {
          if (ACC_FORM[accion]) abrirFormulario(c, accion)
          else ejecutarAccion(c, accion)
        })
        return b
      }

      function formularioNodo (c, f) {
        var id = String(c.case_id)
        var def = ACC_FORM[f.modo]
        var enVuelo = !!enCurso
        var caja = crear('div', 'card-form')
        var etiqueta = crear('label', null, t(def.label))
        etiqueta.setAttribute('for', 'campo-' + id)
        var campo = crear(def.campo)
        campo.id = 'campo-' + id
        if (def.campo === 'input') campo.type = 'text'
        else campo.rows = 5
        campo.maxLength = f.modo === 'editar' ? TEXTO_MAX : NOTA_MAX
        campo.value = f.texto
        campo.disabled = enVuelo
        campo.addEventListener('input', function () { f.texto = campo.value })
        caja.appendChild(etiqueta)
        caja.appendChild(campo)
        var msg = mensajeNodo(id)
        if (msg) caja.appendChild(msg)
        var fila = crear('div', 'acts')
        var ok = crear('button', 'primario',
          enCurso && enCurso.id === id ? '…' : t(def.ok))
        ok.type = 'button'
        ok.dataset.confirma = '1'
        ok.disabled = enVuelo
        ok.addEventListener('click', function () { ejecutarAccion(c, f.modo) })
        var cancela = crear('button', 'mute', t('acCancelar'))
        cancela.type = 'button'
        cancela.dataset.cancela = '1'
        cancela.disabled = enVuelo
        cancela.addEventListener('click', function () { cerrarFormulario(id) })
        fila.appendChild(ok)
        fila.appendChild(cancela)
        caja.appendChild(fila)
        return caja
      }

      function etiqueta (clase, texto) { return crear('span', 'tag ' + clase, texto) }

      function tarjetaNodo (c) {
        var id = String(c.case_id)
        var nodo = crear('article', 'card' + (c.prioridad === 'urgent' ? ' urgente' : '') +
          (abiertas[id] ? ' abierta' : ''))
        nodo.dataset.case = id
        nodo.appendChild(crear('div', 'card-title',
          typeof c.title === 'string' && c.title ? c.title : t('boardUntitled')))
        var linea = crear('div', 'card-chat')
        linea.appendChild(crear('span', 'name', c.chat_name))
        var cuandoTxt = hace(c.updated_at)
        if (cuandoTxt) linea.appendChild(crear('span', 'when', cuandoTxt))
        nodo.appendChild(linea)

        var jev = esObjeto(c.jev) ? c.jev : null
        var tags = crear('div', 'card-tags')
        if (c.clase) tags.appendChild(etiqueta('clase', porCodigo(CLASE_KEY, c.clase)))
        if (c.prioridad && c.prioridad !== 'none') {
          var prio = etiqueta('prio' + (PRIO_CLASE[c.prioridad] ? ' ' + PRIO_CLASE[c.prioridad] : ''),
            porCodigo(PRIO_KEY, c.prioridad))
          tags.appendChild(prio)
        }
        var posibles = accionesDe(c)
        // Lo que va a salir se lee entero: no se manda un texto que no se vio.
        var seEnvia = posibles.indexOf('enviar') >= 0
        // Un trabajo aprobado es lo que el agente de la automatizacion recoge despues.
        if (c.stage === 'trabajo' && esObjeto(c.proposal) && c.proposal.tipo === 'trabajar') {
          tags.appendChild(etiqueta('aprobada', t('acAprobada')))
        }
        if (jev) {
          if (jev.skip === true) tags.appendChild(etiqueta('skip', t('jevLead') + ': ' + t('jevSkip')))
          if (jev.attention_class && jev.attention_class !== c.clase) {
            tags.appendChild(etiqueta('jevclase', t('jevSees') + ': ' +
              porCodigo(CLASE_KEY, jev.attention_class)))
          }
          textos(jev.flags).forEach(function (f) {
            tags.appendChild(etiqueta('flag', t('jevLead') + ': ' + porCodigo(FLAG_KEY, f)))
          })
        }
        if (tags.childNodes.length) nodo.appendChild(tags)

        // Por que espera al dueno: es lo que ninguna otra parte de la tarjeta dice.
        var excepciones = textos(c.exceptions)
        if (excepciones.length) {
          nodo.appendChild(crear('div', 'card-exc', t('excLead') + ': ' +
            excepciones.map(function (e) { return porCodigo(EXC_KEY, e) }).join(' · ')))
        }
        if (typeof c.summary === 'string' && c.summary) {
          nodo.appendChild(crear('div', 'card-sum clamp', c.summary))
        }
        var prop = esObjeto(c.proposal) ? c.proposal : null
        if (prop && (prop.texto || prop.tipo)) {
          var caja = crear('div', 'card-prop')
          caja.appendChild(crear('span', 'lead', t('propLead') +
            (prop.tipo ? ' · ' + porCodigo(PROP_KEY, prop.tipo) : '')))
          if (prop.texto) caja.appendChild(crear('span', seEnvia ? '' : 'clamp', prop.texto))
          nodo.appendChild(caja)
        }
        if (typeof c.blocked_reason === 'string' && c.blocked_reason) {
          var bloqueo = crear('div', 'card-blocked')
          bloqueo.appendChild(crear('span', 'lead', t('blockedLead')))
          bloqueo.appendChild(crear('span', 'clamp', c.blocked_reason))
          nodo.appendChild(bloqueo)
        }
        // El ticket es un texto, no un enlace: lo que llega de la clave es de fuera y un
        // href armado con ello no se abre desde el iframe del panel.
        var ticket = typeof c.ticket === 'string' ? c.ticket
          : (esObjeto(c.ticket) ? (c.ticket.id || c.ticket.key || c.ticket.identifier || '') : '')
        if (ticket) nodo.appendChild(crear('div', 'card-ticket', t('ticketLead') + ' ' + ticket))

        // Las acciones del dueno: un formulario si hay uno abierto, y si no, los botones.
        var formulario = formularios[id]
        if (formulario && ACC_FORM[formulario.modo] && posibles.indexOf(formulario.modo) >= 0) {
          nodo.appendChild(formularioNodo(c, formulario))
        } else {
          var aviso = mensajeNodo(id)
          if (aviso) nodo.appendChild(aviso)
          if (posibles.length) {
            var fila = crear('div', 'acts card-acts')
            posibles.forEach(function (a) { fila.appendChild(botonAccion(c, a)) })
            nodo.appendChild(fila)
          }
        }

        // Lo que se recorta se puede leer entero. Es el unico control del tablero y no es
        // una accion del dueno: solo muestra lo que ya esta en la tarjeta.
        var largo = Array.prototype.some.call(nodo.querySelectorAll('.clamp'), function (n) {
          return n.textContent.length > LARGO_RECORTE
        })
        if (largo) {
          var mas = crear('button', 'card-more', abiertas[id] ? t('boardShowLess') : t('boardShowAll'))
          mas.type = 'button'
          mas.setAttribute('aria-expanded', abiertas[id] ? 'true' : 'false')
          mas.addEventListener('click', function () {
            var abierta = nodo.classList.toggle('abierta')
            if (abierta) abiertas[id] = true
            else delete abiertas[id]
            mas.textContent = abierta ? t('boardShowLess') : t('boardShowAll')
            mas.setAttribute('aria-expanded', abierta ? 'true' : 'false')
          })
          nodo.appendChild(mas)
        }
        return nodo
      }

      /** El boton "Ver todo" solo sobra cuando nada esta recortado de verdad. Se mide
       *  con el layout real: sin layout (vista oculta, o jsdom) no se sabe y se deja. */
      function ajustarVerTodo () {
        Array.prototype.forEach.call(el('board-cols').querySelectorAll('.card'), function (c) {
          var mas = c.querySelector('.card-more')
          if (!mas) return
          if (c.classList.contains('abierta')) { mas.hidden = false; return }
          var recortado = false
          var medido = false
          Array.prototype.forEach.call(c.querySelectorAll('.clamp'), function (n) {
            if (n.clientHeight > 0) {
              medido = true
              if (n.scrollHeight > n.clientHeight + 1) recortado = true
            }
          })
          mas.hidden = medido && !recortado
        })
      }

      function columnaNodo (etapa, m) {
        var tarjetas = m.porEtapa[etapa]
        var n = m.counts[etapa]
        var col = crear('section', 'col' + (etapa === 'decision' ? ' decision' : '') +
          (etapa === 'bloqueado' ? ' lane' : '') + (n > 0 ? ' con-casos' : '') +
          (n === 0 && !tarjetas.length ? ' sin-nada' : ''))
        col.dataset.stage = etapa
        var cab = crear('h3', 'col-head')
        cab.appendChild(crear('span', 'col-name', t(ETAPA_KEY[etapa])))
        cab.appendChild(crear('span', 'col-count', n))
        col.appendChild(cab)
        if (!n && !tarjetas.length) {
          col.appendChild(crear('p', 'col-empty',
            t(etapa === 'decision' ? 'boardEmptyDecision' : 'boardEmptyCol')))
        }
        tarjetas.forEach(function (c) { col.appendChild(tarjetaNodo(c)) })
        if (n > tarjetas.length) {
          col.appendChild(crear('p', 'col-more', fmt('boardMore', n - tarjetas.length)))
        }
        return col
      }

      function renderBoard (board, forzar) {
        tableroActual = board
        // Con un formulario abierto el sondeo no repinta: reconstruir el DOM se llevaria el
        // texto y el foco del dueno. Lo que cambie se ve al cerrarlo o tras cualquier accion.
        if (!forzar && Object.keys(formularios).length) return
        var m = modeloTablero(board)
        var cols = el('board-cols')
        var nota = el('board-note')
        var sello = el('board-synced')
        var contador = el('tab-board-count')
        cols.textContent = ''
        sello.textContent = ''
        nota.className = 'meta nota'
        var avisos = []
        if (m.estado === 'sin-datos') {
          avisos.push(t('boardNoData'))
        } else if (m.estado === 'version') {
          avisos.push(fmt('boardUnsupported', { v: m.v }))
          nota.className += ' stale'
        } else if (m.estado === 'vacio') {
          avisos.push(t('boardNoCases'))
        } else {
          ETAPAS.forEach(function (e) { cols.appendChild(columnaNodo(e, m)) })
          // Un formulario o un mensaje de una tarjeta que ya no esta no tiene a quien
          // pertenecer.
          var presentes = {}
          ETAPAS.forEach(function (e) {
            m.porEtapa[e].forEach(function (c) { presentes[String(c.case_id)] = true })
          })
          Object.keys(formularios).forEach(function (k) { if (!presentes[k]) delete formularios[k] })
          Object.keys(mensajes).forEach(function (k) { if (!presentes[k]) delete mensajes[k] })
          if (m.truncado) avisos.push(t('boardTruncated'))
          if (m.desconocidas) {
            avisos.push(m.desconocidas === 1 ? t('boardUnknown1') : fmt('boardUnknown', m.desconocidas))
          }
        }
        if (m.estado === 'ok' || m.estado === 'vacio') {
          var edad = hace(m.actualizado)
          if (edad) {
            var texto = fmt('boardUpdated', { cuando: edad })
            if (viejo(m.actualizado)) sello.appendChild(crear('span', 'vieja', texto))
            else sello.textContent = texto
          }
        }
        nota.textContent = avisos.join(' ')
        // La insignia de la pestana: lo unico que espera al dueno.
        var porDecidir = m.estado === 'ok' ? m.counts.decision : 0
        contador.textContent = porDecidir ? String(porDecidir) : ''
        contador.hidden = !porDecidir
        ajustarVerTodo()
      }

      function mostrarVista (cual) {
        vistaActiva = cual
        VISTAS.forEach(function (v) {
          var activa = v === cual
          el('view-' + v).hidden = !activa
          el('tab-' + v).setAttribute('aria-selected', activa ? 'true' : 'false')
          el('tab-' + v).tabIndex = activa ? 0 : -1
        })
        if (cual === 'board') ajustarVerTodo()
      }
      VISTAS.forEach(function (v) {
        el('tab-' + v).addEventListener('click', function () { mostrarVista(v) })
        // Flechas entre pestanas, como pide el patron de tablist.
        el('tab-' + v).addEventListener('keydown', function (event) {
          if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return
          var otra = VISTAS[(VISTAS.indexOf(v) + 1) % VISTAS.length]
          mostrarVista(otra)
          el('tab-' + otra).focus()
        })
      })
      window.addEventListener('resize', ajustarVerTodo)

      function reload() {
        return Promise.all([
          call('storage.get', { key: 'activity' }),
          call('storage.get', { key: 'decisions' }),
          call('storage.get', { key: 'sidecar' }),
          call('storage.get', { key: 'chats' }),
          call('storage.get', { key: 'chatsAccount' }),
          call('storage.get', { key: 'board' })
        ]).then(function (results) {
          var sc = stored(results[2])
          if (sc && typeof sc.cuenta === 'string' && sc.cuenta) cuentaVinculada = sc.cuenta
          var a = stored(results[0]) || {}
          if (!deEstaLinea(a.account)) {
            a = { account: cuentaVinculada, pending: [], recent: [], running: false,
              syncedAt: null, esperandoLinea: true, mapped: 0, authorized: 0,
              run: { state: 'never', startedAt: null, endedAt: null } }
          }
          var chats = deEstaLinea(stored(results[4])) ? stored(results[3]) : null
          var todas = stored(results[1]) || {}
          var decided = {}
          Object.keys(todas).forEach(function (k) {
            if (deEstaLinea(todas[k] && todas[k].account)) decided[k] = todas[k]
          })
          var vivos = (a.pending || []).filter(function (m) {
            var d = decided[m.stanzaId]
            return !d || d.decision !== 'ignore'
          })
          renderSynced(a)
          renderLinea(sc)
          renderCobertura(a, chats)
          renderRun(a, vivos.length)
          // Lo marcado se ve al instante, sin esperar al proximo `wa-scope sync`.
          renderPending(vivos.map(function (m) {
            var d = decided[m.stanzaId]
            return d ? Object.assign({}, m, { decision: d.decision }) : m
          }), a)
          renderAlerts(a.recent)
          renderRecent(a.recent)
          renderBoard(stored(results[5]))
        })
      }

      var timer = null
      function startPolling() {
        if (timer) return
        timer = setInterval(function () {
          if (document.visibilityState === 'visible') reload()
        }, 8000)
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') { reload(); startPolling() }
        else if (timer) { clearInterval(timer); timer = null }
      })
      window.addEventListener('focus', reload)

      el('refresh').addEventListener('click', function (event) {
        // Solo relee lo que ya esta guardado. El panel no puede ejecutar nada, asi que
        // los datos los refresca `wa-scope sync` desde afuera (el precheck, cada 2 min).
        // Por eso al lado esta el sello de hora: dice que tan vieja es esta foto.
        var b = event.currentTarget
        b.disabled = true
        Promise.resolve(reload()).then(function () {
          setTimeout(function () { b.disabled = false }, 400)
        })
      })

      applyStrings()
      reload().then(startPolling)
    </script>
  </body>
</html>
