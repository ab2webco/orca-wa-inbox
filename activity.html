              call('storage.get', { key: 'scopeResult' }).then(function (v) {
                var dato = stored(v)
                if (esObjeto(dato) && dato.requestId === pedido.id) { resolve(dato); return }
                if (Date.now() > fin) { resolve(null); return }
                setTimeout(vuelta, ACCION_SONDEO_MS)
              })
            })()
          })
        }).then(function (v) {
          // Sin veredicto el pedido sigue escrito, y un envio que nadie atendio no puede
          // salir despues por su cuenta: se reemplaza por una lapida, que el worker limpia.
          if (!v) call('storage.set', { key: 'scopeRequest',
            value: { id: pedido.id, at: new Date().toISOString(), tombstone: true } })
          return v
        })
      }

      function repintar () { renderBoard(tableroActual, true); ajustarAlto() }

      // Los retenidos fuera de un caso (approve-solo-dueno). `heldHechos`: los que el dueno
      // ya aprobo o cancelo, ocultos hasta que el tablero deje de listarlos (lo reescribe el
      // tick, al minuto). `heldMsgs`: el error de cada uno. `heldAviso`: lo que salio bien.
      var heldHechos = {}
      var heldMsgs = {}
      var heldAviso = null
      var ID_RETENIDO = /^(?!caso-|aviso-)[A-Za-z0-9_][^\s]{0,199}$/

      function retenidosDe (board) {
        var lista = esObjeto(board) && Array.isArray(board.held_drafts) ? board.held_drafts : []
        return lista.filter(function (r) {
          return esObjeto(r) && typeof r.req_id === 'string' && ID_RETENIDO.test(r.req_id) &&
            typeof r.text === 'string'
        })
      }

      function avisoRetenidoVivo () { return !!heldAviso && Date.now() <= heldAviso.hasta }

      function retenidoNodo (r) {
        var id = r.req_id
        var nodo = crear('div', 'card')
        nodo.dataset.req = id
        var arriba = crear('div', 'card-top')
        arriba.appendChild(crear('p', 'card-title clamp1', String(r.chat || r.chat_jid || '?')))
        nodo.appendChild(arriba)
        var edad = hace(r.at)
        if (edad) nodo.appendChild(crear('div', 'card-meta', edad))
        var motivos = Array.isArray(r.reasons) ? r.reasons.filter(function (x) { return typeof x === 'string' }) : []
        if (motivos.length) {
          nodo.appendChild(crear('div', 'card-exc', fmt('heldReason', { x: frases(EXC_KEY, motivos, t('excOther')) })))
        }
        nodo.appendChild(crear('div', 'card-prop', r.text))
        var acts = crear('div', 'card-acts')
        ;[['aprobar', 'heldApprove', ' primario'], ['cancelar', 'heldCancel', ' mute']].forEach(function (a) {
          var enVuelo = !!(enCurso && enCurso.id === 'held:' + id && enCurso.accion === a[0])
          var b = crear('button', 'btn' + a[2], enVuelo ? '…' : t(a[1]))
          b.type = 'button'
          b.dataset.held = a[0]
          b.disabled = !!enCurso
          if (enVuelo) b.setAttribute('aria-busy', 'true')
          b.addEventListener('click', function () { accionRetenido(r, a[0]) })
          acts.appendChild(b)
        })
        nodo.appendChild(acts)
        if (heldMsgs[id]) {
          var m = crear('div', 'card-msg mala', heldMsgs[id])
          m.setAttribute('role', 'alert')
          nodo.appendChild(m)
        }
        return nodo
      }

      function pintarRetenidos (board) {
        var caja = el('board-held')
        var lista = el('board-held-list')
        lista.textContent = ''
        var todos = retenidosDe(board)
        var vivos = {}
        todos.forEach(function (r) { vivos[r.req_id] = true })
        Object.keys(heldHechos).forEach(function (k) { if (!vivos[k]) delete heldHechos[k] })
        Object.keys(heldMsgs).forEach(function (k) { if (!vivos[k]) delete heldMsgs[k] })
        var visibles = todos.filter(function (r) { return !heldHechos[r.req_id] })
        visibles.forEach(function (r) { lista.appendChild(retenidoNodo(r)) })
        el('board-held-count').textContent = visibles.length ? String(visibles.length) : ''
        var aviso = anotarReloj(avisoRetenidoVivo) ? heldAviso.texto : ''
        el('board-held-msg').textContent = aviso
        lista.hidden = !visibles.length
        caja.hidden = !visibles.length && !aviso
      }

      /** Aprobar o cancelar un retenido: el pedido lleva solo el id, el worker hace el resto
       *  (la llave del plugin y `--by board` al aprobar). */
      function accionRetenido (r, accion) {
        if (enCurso) return
        var id = r.req_id
        var chat = String(r.chat || r.chat_jid || '?')
        enCurso = { id: 'held:' + id, accion: accion }
        delete heldMsgs[id]
        repintar()
        return pedirAccion({ action: accion === 'aprobar' ? 'aprobar-retenido' : 'cancelar-retenido',
          reqId: id }).then(function (v) {
          enCurso = null
          if (v && v.ok === true) {
            heldHechos[id] = true
            heldAviso = { texto: fmt(accion === 'aprobar' ? 'heldSent' : 'heldCancelled', { chat: chat }),
              hasta: Date.now() + 12000 }
          } else {
            heldMsgs[id] = v ? errorTexto(v.code, v.detail) : t('acNoAnswer')
          }
          return reload()
        }).then(repintarAlSoltar, function () { enCurso = null; repintarAlSoltar() })
      }

      function cerrarFormulario (id) {
        delete formularios[id]
        delete mensajes[id]
        repintar()
      }

      function abrirFormulario (c, accion) {
        var id = String(c.case_id)
        var prop = esObjeto(c.proposal) ? c.proposal : {}
        delete mensajes[id]
        formularios[id] = { modo: accion, version: typeof prop.version === 'string' ? prop.version : null,
          texto: accion === 'editar' && typeof prop.texto === 'string' ? prop.texto : '' }
        seleccion = id
        repintar()
        var campo = document.getElementById('campo-' + id)
        if (campo) campo.focus()
      }

      /** El pedido de esta accion, o null si falta algo (y entonces ya lo dijo). */
      function pedidoDe (c, accion, f) {
        var id = String(c.case_id)
        var prop = esObjeto(c.proposal) ? c.proposal : {}
        var pedido = { action: ACC_PEDIDO[accion] || accion, caseId: c.case_id }
        if (accion === 'enviar' || accion === 'ejecutar') pedido.version = prop.version
        if (accion === 'editar') {
          var texto = String((f && f.texto) || '').trim()
          if (!texto) {
            mensajes[id] = { texto: t('acErrVacio'), mala: true }
            repintar()
            return null
          }
          pedido.texto = texto
          // Tras un E_VERSION la version se toma de la tarjeta ya releida (`null`).
          pedido.version = (f && f.version) || prop.version
        }
        if (accion === 'reclasificar') {
          var nota = String((f && f.texto) || '').trim()
          if (nota) pedido.nota = nota
        }
        if (accion === 'cerrar') {
          var motivo = String((f && f.texto) || '').trim()
          if (motivo) pedido.motivo = motivo
        }
        if (accion === 'proyecto') {
          // Solo lo elegido de la lista: un texto escrito a mano no es un proyecto.
          if (!f || typeof f.valor !== 'string') {
            mensajes[id] = { texto: t('acErrProyectoElegir'), mala: true }
            repintar()
            return null
          }
          pedido.proyecto = f.valor
        }
        return pedido
      }

      function ejecutarAccion (c, accion) {
        if (enCurso) return
        var id = String(c.case_id)
        var pedido = pedidoDe(c, accion, formularios[id])
        if (!pedido) return
        enCurso = { id: id, accion: accion }
        delete mensajes[id]
        repintar()
        return pedirAccion(pedido).then(function (v) {
          enCurso = null
          if (!v) {
            mensajes[id] = { texto: t('acNoAnswer'), mala: true }
          } else if (v.ok === true) {
            delete formularios[id]
            var agente = (v.code === 'atendido' || v.code === 'autorizado') && Object.prototype.hasOwnProperty.call(AGENTE_KEY, v.agent)
              ? v.agent : null
            if (agente) {
              // Un motivo de `wa-scope agente lanzar` se dice con la frase del tablero; uno
              // del worker (exit-1, timeout) va tal cual, corto.
              var motivo = typeof v.agentReason === 'string'
                ? (motivoAgente(v.agentReason) || v.agentReason.slice(0, AGENTE_MOTIVO_MAX)) : ''
              mensajes[id] = { texto: fmt(AGENTE_KEY[agente], { reason: motivo || '?' }),
                mala: agente !== 'launched' && agente !== 'running', hasta: Date.now() + 12000 }
            } else {
              var dicho = porCodigo(OK_ACCION, v.code, t('acOkGeneric'))
              if (v.warn) dicho += ' ' + t('acWarnTablero')
              mensajes[id] = { texto: dicho, mala: false, hasta: Date.now() + 12000 }
            }
          } else {
            mensajes[id] = { texto: errorTexto(v.code, v.detail), mala: true }
            if (v.code === 'E_VERSION' && formularios[id]) formularios[id].version = null
          }
          // El tablero se relee tras cualquier veredicto: `wa-scope` lo reescribe en cada
          // cambio, y tras E_VERSION o E_STAGE lo que hay en pantalla ya es viejo.
          return reload()
          // El veredicto llega cuando quiere: si el dueno tiene el puntero apretado en otra
          // tarjeta, repintar ahi le robaria el clic (ver `alSoltar`).
        }).then(repintarAlSoltar, function () { enCurso = null; repintarAlSoltar() })
      }

      function mensajeVivo (id) {
        var m = mensajes[id]
        return !!m && (m.mala || Date.now() <= m.hasta)
      }

      function mensajeNodo (id) {
        var m = mensajes[id]
        if (!anotarReloj(mensajeVivo, id)) return null
        var nodo = crear('div', 'card-msg' + (m.mala ? ' mala' : ''), m.texto)
        nodo.setAttribute('role', m.mala ? 'alert' : 'status')
        return nodo
      }

      function botonAccion (c, accion) {
        var id = String(c.case_id)
        var enVuelo = !!(enCurso && enCurso.id === id && enCurso.accion === accion)
        var b = crear('button', 'btn' + (ACC_APAGADA[accion] ? ' mute' : '') +
          (ACC_PRIMARIA[accion] ? ' primario' : ''), enVuelo ? '…' : t(ACC_KEY[accion]))
        b.type = 'button'
        b.dataset.accion = accion
        b.disabled = !!enCurso
        if (enVuelo) b.setAttribute('aria-busy', 'true')
        b.addEventListener('click', function () {
          if (ACC_FORM[accion]) abrirFormulario(c, accion)
          else ejecutarAccion(c, accion)
        })
        return b
      }

      /** El autocompletar de proyecto: el mismo de los ajustes (config.html, T17), porque la
       *  lista de un select nativo no se abre en el panel de Orca. Patron combobox/listbox
       *  de ARIA: escribir filtra, flechas mueven, Enter elige, Esc cierra, clic elige. Lo
       *  que vale es lo ELEGIDO (`f.valor`), no lo escrito: un texto suelto no es un proyecto.
       *  Las opciones son el catalogo aceptado (`projects`) y "Sin proyecto". */
      function comboProyectoNodo (id, f, enVuelo) {
        var caja = crear('div', 'combo')
        var input = crear('input')
        input.type = 'text'
        input.id = 'campo-' + id
        input.autocomplete = 'off'
        input.spellcheck = false
        input.placeholder = t('acProyectoPh')
        input.setAttribute('role', 'combobox')
        input.setAttribute('aria-autocomplete', 'list')
        input.setAttribute('aria-expanded', 'false')
        input.setAttribute('aria-controls', 'lista-' + id)
        input.value = f.texto || ''
        input.disabled = enVuelo
        var lista = crear('div', 'combo-list')
        lista.id = 'lista-' + id
        lista.setAttribute('role', 'listbox')
        lista.hidden = true
        var estado = { activo: null, items: [] }
        var idOpcion = function (v) {
          return lista.id + '-o-' + (String(v).replace(/[^A-Za-z0-9_-]/g, '_') || '_vacio')
        }

        function opciones () {
          var q = f.escrito ? plano(input.value).trim() : ''
          var opcion = function (p, grupo) {
            return { value: p.id, nombre: typeof p.name === 'string' && p.name ? p.name : p.id, sub: p.id,
              grupo: grupo }
          }
          // Los proyectos de la conversacion primero, en su orden, y despues el resto del
          // catalogo (proyectos-por-chat, M6). Sin la ruta en el tablero, la lista de siempre.
          var delChat = candidatosDe(rutaDe({ case_id: id }))
          var ids = delChat.map(function (p) { return p.id })
          var todas = [{ value: '', nombre: t('acProyectoNinguno') }]
          if (delChat.length) {
            todas = todas.concat(delChat.map(function (p) { return opcion(p, t('acProyectoDelChat')) }),
              proyectosAceptados.filter(function (p) { return ids.indexOf(p.id) === -1 })
                .map(function (p) { return opcion(p, t('acProyectoOtros')) }))
          } else {
            todas = todas.concat(proyectosAceptados.map(function (p) { return opcion(p, null) }))
          }
          return todas.filter(function (i) {
            return !q || plano(i.nombre).indexOf(q) >= 0 || plano(i.value).indexOf(q) >= 0
          })
        }
        function marcar () {
          Array.prototype.forEach.call(lista.querySelectorAll('[role="option"]'), function (o) {
            o.setAttribute('aria-selected', o.dataset.value === estado.activo ? 'true' : 'false')
          })
          if (estado.activo !== null) input.setAttribute('aria-activedescendant', idOpcion(estado.activo))
          else input.removeAttribute('aria-activedescendant')
        }
        function pintar () {
          estado.items = opciones()
          lista.textContent = ''
          if (!proyectosAceptados.length) lista.appendChild(crear('div', 'combo-empty', t('acProyectoSinCatalogo')))
          if (!estado.items.length) lista.appendChild(crear('div', 'combo-empty', t('acProyectoVacioLista')))
          var grupo = null, destino = lista
          estado.items.forEach(function (i) {
            // Cada grupo con su nombre, para la vista y para el lector de pantalla.
            if ((i.grupo || null) !== grupo) {
              grupo = i.grupo || null
              destino = lista
              if (grupo) {
                destino = crear('div')
                destino.setAttribute('role', 'group')
                destino.setAttribute('aria-label', grupo)
                var rotulo = crear('div', 'combo-group', grupo)
                rotulo.setAttribute('role', 'presentation')
                destino.appendChild(rotulo)
                lista.appendChild(destino)
              }
            }
            var o = crear('div', 'combo-opt')
            o.id = idOpcion(i.value)
            o.setAttribute('role', 'option')
            o.dataset.value = i.value
            o.appendChild(crear('span', 'combo-name', i.nombre))
            if (i.sub && i.sub !== i.nombre) o.appendChild(crear('span', 'combo-sub', i.sub))
            destino.appendChild(o)
          })
          marcar()
        }
        function abrir () {
          if (input.disabled) return
          lista.hidden = false
          input.setAttribute('aria-expanded', 'true')
          pintar()
        }
        function cerrar () {
          lista.hidden = true
          estado.activo = null
          input.setAttribute('aria-expanded', 'false')
          input.removeAttribute('aria-activedescendant')
        }
        function mover (paso) {
          if (!estado.items.length) return
          var valores = estado.items.map(function (i) { return i.value })
          var i = valores.indexOf(estado.activo)
          i = i < 0 ? (paso > 0 ? 0 : valores.length - 1)
            : Math.max(0, Math.min(valores.length - 1, i + paso))
          estado.activo = valores[i]
          marcar()
        }
        function elegir (valor) {
          var item = estado.items.filter(function (i) { return i.value === valor })[0]
          if (!item) return
          f.valor = item.value
          f.texto = item.nombre
          f.escrito = false
          input.value = item.nombre
          var malo = caja.parentNode && caja.parentNode.querySelector('.card-msg.mala')
          if (malo) malo.remove()
          delete mensajes[id]
          cerrar()
        }
        input.addEventListener('input', function () {
          f.texto = input.value
          f.escrito = true
          delete f.valor
          estado.activo = null
          abrir()
        })
        input.addEventListener('click', function () { if (lista.hidden) abrir() })
        input.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowDown') {
            e.preventDefault()
            if (lista.hidden) abrir()
            mover(1)
          } else if (e.key === 'ArrowUp') {
            e.preventDefault()
            if (lista.hidden) abrir()
            mover(-1)
          } else if (e.key === 'Enter') {
            if (!lista.hidden && estado.activo !== null) { e.preventDefault(); elegir(estado.activo) }
          } else if (e.key === 'Escape') {
            // Cierra la lista y no el detalle: el Escape del documento no se entera.
            if (!lista.hidden) { e.preventDefault(); e.stopPropagation(); cerrar() }
          } else if (e.key === 'Tab') {
            cerrar()
          }
        })
        input.addEventListener('blur', cerrar)
        // El clic en la lista no puede llevarse el foco: el `blur` la cerraria antes del `click`.
        lista.addEventListener('mousedown', function (e) { e.preventDefault() })
        lista.addEventListener('click', function (e) {
          var o = e.target.closest ? e.target.closest('[role="option"]') : null
          if (o) elegir(o.dataset.value)
        })
        caja.appendChild(input)
        caja.appendChild(lista)
        return caja
      }

      function formularioNodo (c, f) {
        var id = String(c.case_id)
        var def = ACC_FORM[f.modo]
        var enVuelo = !!enCurso
        var caja = crear('div', 'card-form')
        var etiqueta = crear('label', null, t(def.label))
        etiqueta.setAttribute('for', 'campo-' + id)
        caja.appendChild(etiqueta)
        if (def.campo === 'combo') {
          caja.appendChild(comboProyectoNodo(id, f, enVuelo))
        } else {
          var campo = crear(def.campo)
          campo.id = 'campo-' + id
          if (def.campo === 'input') campo.type = 'text'
          else campo.rows = 6
          campo.maxLength = f.modo === 'editar' ? TEXTO_MAX : NOTA_MAX
          campo.value = f.texto
          campo.disabled = enVuelo
          campo.addEventListener('input', function () { f.texto = campo.value })
          caja.appendChild(campo)
        }
        var msg = mensajeNodo(id)
        if (msg) caja.appendChild(msg)
        var fila = crear('div', 'det-acts')
        var ok = crear('button', 'btn primario',
          enCurso && enCurso.id === id ? '…' : t(def.ok))
        ok.type = 'button'
        ok.dataset.confirma = '1'
        ok.disabled = enVuelo
        ok.addEventListener('click', function () { ejecutarAccion(c, f.modo) })
        var cancela = crear('button', 'btn mute', t('acCancelar'))
        cancela.type = 'button'
        cancela.dataset.cancela = '1'
        cancela.disabled = enVuelo
        cancela.addEventListener('click', function () { cerrarFormulario(id) })
        fila.appendChild(ok)
        fila.appendChild(cancela)
        caja.appendChild(fila)
        return caja
      }

      /** El punto de color de una etapa, como el de las columnas de Plane. */
      function puntoEtapa (etapa) {
        var p = crear('span', 'dot-etapa t-' + etapa)
        p.setAttribute('aria-hidden', 'true')
        return p
      }

      function prioNodo (c) {
        if (!Object.prototype.hasOwnProperty.call(PRIO_KEY, c.prioridad)) return null
        return crear('span', 'card-prio' + (PRIO_CLASE[c.prioridad] ? ' ' + PRIO_CLASE[c.prioridad] : ''),
          t(PRIO_KEY[c.prioridad]))
      }

      /** "Necesita su decision por: dinero", en una sola linea. */
      function excepcionNodo (c) {
        var excepciones = textos(c.exceptions)
        // Solo es una necesidad mientras el caso espera su decision: en Respondido, o en
        // cualquier otra etapa, ya paso y seria una frase que miente.
        if (c.stage !== 'decision' || !excepciones.length) return null
        return crear('div', 'card-exc', t('excLead') + ': ' +
          frases(EXC_KEY, excepciones, t('excOther')))
      }

      function bloqueoTexto (c) {
        return typeof c.blocked_reason === 'string' && c.blocked_reason ? c.blocked_reason : ''
      }

      /** Por que un caso se cerro sin pasar por el agente: la regla de la lista cerrada del
       *  motor, en el idioma del usuario. Una regla que este panel no conoce no se muestra. */
      function sinAgenteTexto (c) {
        if (c.stage !== 'cerrado' || typeof c.no_agent_rule !== 'string') return ''
        var key = 'noAgent_' + c.no_agent_rule
        return (STRINGS[LANG] && STRINGS[LANG][key]) || STRINGS.en[key] || ''
      }

      /** La frase de un motivo estable de un lanzamiento fallido del agente de casos, o ''.
       *  Un codigo que este panel no conoce no se muestra crudo. */
      function motivoAgente (codigo) {
        if (typeof codigo !== 'string' || !/^[a-z0-9-]{1,40}$/.test(codigo)) return ''
        var key = 'agentWhy_' + codigo
        return (STRINGS[LANG] && STRINGS[LANG][key]) || STRINGS.en[key] || ''
      }

      /** "Cuenta de respaldo: <cuenta> (<por que>)": un agente que no se abrio con la cuenta
       *  de Claude del bot (Ajustes, pestana Agente). '' si fue con ella o no se sabe por que.
       *  `clave` es la frase: la del despacho o la del agente de casos. */
      function respaldoTexto (clave, cuenta, porQue) {
        if (typeof porQue !== 'string' || !/^[a-z0-9-]{1,40}$/.test(porQue)) return ''
        var key = 'fallbackWhy_' + porQue
        var razon = (STRINGS[LANG] && STRINGS[LANG][key]) || STRINGS.en[key]
        if (!razon) return ''
        var quien = typeof cuenta === 'string' && cuenta ? cuenta.slice(0, 120) : t('fallbackOrca')
        return fmt(clave, { account: quien, reason: razon })
      }

      /** "No pude lanzar al agente: <motivo>" si el ultimo lanzamiento fallo, o ''. */
      function falloAgente (board) {
        var l = esObjeto(board) ? board.agent_launch : null
        if (!esObjeto(l) || l.state !== 'failed') return ''
        var m = motivoAgente(l.reason)
        return m ? fmt('agentFail', { reason: m }) : t('agentFailGeneric')
      }

      // ---------- el proyecto del caso: su porque, quien y la pregunta (proyectos-por-chat) ----------
      // `board.project_routes[<case_id>]` = {why, by, candidates, missing, question}. Vive en el
      // tablero y no en la tarjeta (su juego de llaves es contrato), y viaja dentro de `board`,
      // asi que la firma del tablero ya la cubre.
      function rutaDe (c) {
        var rutas = tableroActual && esObjeto(tableroActual.project_routes) ? tableroActual.project_routes : null
        var r = rutas ? rutas[String(c.case_id)] : null
        return esObjeto(r) ? r : null
      }
      function candidatosDe (ruta) {
        return ruta && Array.isArray(ruta.candidates) ? ruta.candidates.filter(function (p) {
          return esObjeto(p) && typeof p.id === 'string' && p.id
        }) : []
      }
      function nombreDeCandidato (p) { return typeof p.name === 'string' && p.name ? p.name : p.id }
      /** "A o B", "A, B o C": los proyectos de la pregunta. */
      function listaConO (nombres) {
        if (nombres.length < 2) return nombres.join('')
        return nombres.slice(0, -1).join(', ') + t('pqOr') + nombres[nombres.length - 1]
      }
      /** Por que el caso tiene ese proyecto y quien lo eligio, en el idioma del usuario, o ''.
       *  Lo que wa-scope dice en ingles (la regla, el del chat, el del dueno) se dice con la
       *  frase del panel; el porque del agente es texto suyo y va tal cual. */
      function porQueDelProyecto (ruta, proyecto) {
        if (!ruta) return ''
        var why = typeof ruta.why === 'string' ? ruta.why.trim() : ''
        if (ruta.by === 'agent') return t('projByAgent') + (why ? ': ' + why : '')
        if (ruta.by === 'rule') {
          var m = /^the message says (['"])(.+)\1$/.exec(why)
          return m ? fmt('projByRuleSays', { p: m[2] }) : t('projByRule')
        }
        // Sin proyecto no es "el de la conversacion": el unico del chat que el dueno quito del
        // catalogo se ve sin proyecto, como antes.
        if (ruta.by === 'chat') return proyecto ? t('projByChat') : ''
        if (ruta.by === 'owner') return t(proyecto ? 'projByOwner' : 'projNoneByOwner')
        var n = candidatosDe(ruta).length
        if (!proyecto && n > 1) return fmt('projAgentChooses', { n: n })
        return ''
      }
      /** La pregunta "A o B?" del caso si sigue abierta o ya se contesto; null si no hay o se
       *  cerro (el proyecto ya se eligio). */
      function preguntaDe (c) {
        var ruta = rutaDe(c)
        var p = ruta && esObjeto(ruta.question) ? ruta.question : null
        if (!p || (p.state !== 'open' && p.state !== 'answered')) return null
        return p
      }
      function nombresDePregunta (p) {
        return (Array.isArray(p.candidates) ? p.candidates : []).filter(function (x) {
          return esObjeto(x) && typeof x.id === 'string' && x.id
        }).map(nombreDeCandidato)
      }
      /** En la tarjeta: la pregunta abierta, en una linea. */
      function preguntaTarjetaNodo (c) {
        var p = preguntaDe(c)
        if (!p || p.state !== 'open') return null
        return crear('div', 'card-pregunta clamp2', fmt('pqWaitingLead', { list: listaConO(nombresDePregunta(p)) }))
      }
      /** En el detalle: a quien se pregunto, que, o que ya contesto. */
      function preguntaDetalleNodo (c) {
        var p = preguntaDe(c)
        if (!p) return null
        var caja = crear('div', 'det-pregunta')
        if (p.state === 'answered') {
          caja.appendChild(crear('p', 'det-text', t('pqAnswered')))
          return caja
        }
        caja.appendChild(crear('p', 'det-pregunta-lead', fmt('pqWaitingLead', { list: listaConO(nombresDePregunta(p)) })))
        var a = p.to === 'owner' ? (p.escalated === true ? 'pqToOwnerLate' : 'pqToOwner') : 'pqToWriter'
        caja.appendChild(crear('p', 'det-text', t(a)))
        if (typeof p.text === 'string' && p.text.trim()) {
          var q = crear('p', 'det-text')
          q.appendChild(crear('span', 'det-k', t('pqQuestion') + ': '))
          q.appendChild(crear('span', null, p.text.trim()))
          caja.appendChild(q)
        }
        return caja
      }

      /** "Para el agente en su proxima corrida": el caso que el dueno o Jev le pasaron. Si el
       *  ultimo lanzamiento del agente fallo, eso es lo que se dice, en todas las que lo
       *  esperan: prometer la proxima corrida mientras cada una falla es esconderlo. */
      function agenteNodo (c) {
        if (c.stage !== 'recibido' && c.stage !== 'clasificado') return null
        var falla = c.waits_agent === true || c.needs_agent === true ? falloAgente(tableroActual) : ''
        if (falla) {
          var nodo = crear('div', 'card-agente fallo', falla)
          var detalle = tableroActual.agent_launch.detail
          if (typeof detalle === 'string' && detalle) nodo.title = detalle.slice(0, 200)
          return nodo
        }
        if (c.needs_agent === true) return crear('div', 'card-agente', t('boardNeedsAgent'))
        return null
      }

      /** Una linea del despacho con su antiguedad: "Despachado a Alfa · hace 5 min". */
      function conCuando (texto, stamp) {
        var cuando = hace(stamp)
        return cuando ? texto + ' · ' + cuando : texto
      }

      /** Lo que dice el despacho al agente del proyecto (T8), segun la etapa: a donde fue y
       *  desde cuando, lo que reporto el agente, o que el caso espera al cliente. Un
       *  despacho que no se entiende se calla. */
      function despachoNodo (c) {
        var d = esObjeto(c.dispatch) ? c.dispatch : null
        if (!d || typeof d.project !== 'string' || !d.project) return null
        var p = { p: d.project }
        var lineas = []
        if (c.stage === 'trabajo' && d.state === 'esperando') {
          lineas.push(t('boardDispatchAnswer'))
        } else if (c.stage === 'trabajo') {
          lineas.push(conCuando(fmt('boardDispatched', p), d.at))
          lineas.push(t('boardDispatchWaiting'))
          var respaldo = respaldoTexto('botFallback', d.account, d.fallback)
          if (respaldo) lineas.push(respaldo)
        } else if (c.stage === 'listo' && d.outcome === 'resuelto') {
          lineas.push(fmt('boardDispatchSolved', p))
        } else if (c.stage === 'listo' && d.outcome === 'necesita') {
          lineas.push(fmt('boardDispatchNeeds', p))
        } else if (c.stage === 'respondido' && d.state === 'esperando') {
          lineas.push(conCuando(t('boardDispatchCustomer'), d.updated_at || d.at))
          lineas.push(fmt('boardDispatchNeeds', p))
        } else if (c.stage === 'bloqueado' && d.outcome === 'bloqueado') {
          lineas.push(fmt('boardDispatchBlocked', p))
        }
        if (!lineas.length) return null
        var nodo = crear('div', 'card-despacho')
        lineas.forEach(function (linea, i) {
          nodo.appendChild(crear('div', i ? 'card-despacho-sub' : null, linea))
        })
        return nodo
      }

      /** Lo aprobado: el despacho si ya salio al proyecto; si no, "Aprobada, en cola". */
      function aprobadaNodo (c) {
        var despacho = despachoNodo(c)
        if (despacho) return despacho
        if (c.stage === 'trabajo' && esObjeto(c.proposal) && c.proposal.tipo === 'trabajar') {
          return crear('div', 'card-aprobada', t('acAprobada'))
        }
        return null
      }

      /** Lo que la tarjeta y la fila de la lista comparten debajo del titulo: el motivo, el
       *  bloqueo, lo aprobado y, si el caso espera su respuesta, la respuesta a la vista
       *  junto a su unico boton. */
      function extrasDe (c) {
        var id = String(c.case_id)
        var nodos = []
        var exc = excepcionNodo(c)
        if (exc) nodos.push(exc)
        var bloqueo = bloqueoTexto(c)
        if (bloqueo) nodos.push(crear('div', 'card-blocked clamp2', bloqueo))
        var aprobada = aprobadaNodo(c)
        if (aprobada) nodos.push(aprobada)
        var agente = agenteNodo(c)
        if (agente) nodos.push(agente)
        var pregunta = preguntaTarjetaNodo(c)
        if (pregunta) nodos.push(pregunta)
        if (c.read_only === true) nodos.push(crear('div', 'card-solo-leer', t('boardReadOnly')))
        var primaria = primariaDe(accionesDe(c))
        var aviso = formularios[id] ? null : mensajeNodo(id)
        if (primaria === 'atender') {
          // Lo que era Tomar: no manda nada a nadie, solo adelanta al agente.
          if (aviso) nodos.push(aviso)
          var filaAt = crear('div', 'card-acts')
          filaAt.appendChild(botonAccion(c, primaria))
          nodos.push(filaAt)
        } else if (primaria) {
          var texto = String(c.proposal.texto || '')
          // No se manda lo que no se vio: el boton de la tarjeta solo manda una respuesta que
          // esta ENTERA a la vista. Si es larga, el boton abre el detalle para leerla.
          var entera = texto.length <= PROPUESTA_EN_TARJETA
          if (texto) nodos.push(crear('div', 'card-prop' + (entera ? '' : ' clamp3'), texto))
          if (aviso) nodos.push(aviso)
          var fila = crear('div', 'card-acts')
          if (entera) {
            fila.appendChild(botonAccion(c, primaria))
          } else {
            var leer = crear('button', 'btn', t(primaria === 'enviar' ? 'boardReadSend' : 'boardReadRun'))
            leer.type = 'button'
            leer.dataset.abrir = '1'
            leer.disabled = !!enCurso
            leer.addEventListener('click', function () { abrirCaso(c) })
            fila.appendChild(leer)
          }
          nodos.push(fila)
        } else if (aviso) {
          nodos.push(aviso)
        }
        return nodos
      }

      /** La tarjeta y la fila se abren igual: clic, o Enter/espacio con el foco encima. */
      function hacerAbrible (nodo, c) {
        var id = String(c.case_id)
        nodo.dataset.case = id
        nodo.tabIndex = 0
        nodo.setAttribute('aria-controls', 'board-detail')
        nodo.setAttribute('aria-expanded', seleccion === id ? 'true' : 'false')
        if (seleccion === id) nodo.classList.add('elegida')
        nodo.addEventListener('click', function (event) {
          if (event.target && event.target.closest && event.target.closest('button, textarea, input')) return
          abrirCaso(c)
        })
        nodo.addEventListener('keydown', function (event) {
          if (event.target !== nodo) return
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault()
            abrirCaso(c)
          }
        })
      }

      function tituloDe (c) {
        return typeof c.title === 'string' && c.title ? c.title : t('boardUntitled')
      }

      function metaNodo (c) {
        var meta = crear('div', 'card-meta')
        meta.appendChild(crear('span', 'name', c.chat_name))
        var cuandoTxt = hace(c.updated_at)
        if (cuandoTxt) {
          meta.appendChild(crear('span', 'sep', '·'))
          meta.appendChild(crear('span', 'when', cuandoTxt))
        }
        return meta
      }

      /** La tarjeta, con la anatomia de la de Plane (plane-board-card.tsx): arriba el numero
       *  y la prioridad, el titulo en dos lineas, y una linea apagada con el chat y la hora. */
      function tarjetaNodo (c) {
        var nodo = crear('article', 'card' + (c.prioridad === 'urgent' ? ' urgente' : ''))
        hacerAbrible(nodo, c)
        var arriba = crear('div', 'card-top')
        arriba.appendChild(crear('span', 'card-id', '#' + c.case_id))
        var prio = prioNodo(c)
        if (prio) arriba.appendChild(prio)
        nodo.appendChild(arriba)
        nodo.appendChild(crear('h4', 'card-title clamp2', tituloDe(c)))
        nodo.appendChild(metaNodo(c))
        extrasDe(c).forEach(function (n) { nodo.appendChild(n) })
        return nodo
      }

      /** La fila de la lista: el mismo caso en un renglon, como la lista de Plane. */
      function filaNodo (c) {
        var nodo = crear('article', 'card fila' + (c.prioridad === 'urgent' ? ' urgente' : ''))
        hacerAbrible(nodo, c)
        nodo.appendChild(crear('span', 'card-id', '#' + c.case_id))
        var centro = crear('div', 'fila-main')
        centro.appendChild(crear('h4', 'card-title clamp1', tituloDe(c)))
        centro.appendChild(metaNodo(c))
        extrasDe(c).forEach(function (n) { centro.appendChild(n) })
        nodo.appendChild(centro)
        var prio = prioNodo(c)
        if (prio) nodo.appendChild(prio)
        return nodo
      }

      function cuentaTexto (visibles, n) {
        return busqueda ? visibles + ' / ' + n : String(n)
      }

      /** "Mostrar N mas" de una etapa terminada, o null si ya se ve todo. */
      function botonMasNodo (etapa, resto) {
        if (!(resto > 0)) return null
        var n = Math.min(PASO_FINALES, resto)
        var b = crear('button', 'btn mute col-mas', fmt('boardShowMore', n))
        b.type = 'button'
        b.setAttribute('aria-label', fmt('boardShowMoreAria', { n: n, etapa: t(ETAPA_KEY[etapa]) }))
        b.addEventListener('click', function () {
          cuantosFinales[etapa] += PASO_FINALES
          repintar()
        })
        return b
      }

      function columnaNodo (etapa, m, tarjetas, sola, resto) {
        var n = m.counts[etapa]
        // Antes una columna vacia era una caja con "Nada aqui": ocho de esas tapaban el
        // tablero. Ahora se encoge a su cabecera, como una columna plegada.
        var vacia = !tarjetas.length && !sola
        var col = crear('section', 'col' + (etapa === 'decision' ? ' decision' : '') +
          (etapa === 'bloqueado' ? ' lane' : '') + (n > 0 ? ' con-casos' : '') +
          (vacia ? ' vacia' : ''))
        col.dataset.stage = etapa
        var nombre = t(ETAPA_KEY[etapa])
        if (vacia) col.title = nombre
        var cab = crear('h3', 'col-head')
        cab.appendChild(puntoEtapa(etapa))
        cab.appendChild(crear('span', 'col-name', nombre))
        cab.appendChild(crear('span', 'col-count', cuentaTexto(tarjetas.length + (resto || 0), n)))
        col.appendChild(cab)
        if (vacia) return col
        var cuerpo = crear('div', 'col-body')
        tarjetas.forEach(function (c) { cuerpo.appendChild(tarjetaNodo(c)) })
        if (!tarjetas.length) cuerpo.appendChild(crear('p', 'col-nada', t('boardStageNone')))
        var mas = botonMasNodo(etapa, resto)
        if (mas) cuerpo.appendChild(mas)
        else if (!busqueda && n > m.porEtapa[etapa].length) {
          cuerpo.appendChild(crear('p', 'col-more', fmt('boardMore', n - m.porEtapa[etapa].length)))
        }
        col.appendChild(cuerpo)
        return col
      }

      function grupoNodo (etapa, m, tarjetas, resto) {
        var grupo = crear('section', 'grupo' + (etapa === 'bloqueado' ? ' lane' : ''))
        grupo.dataset.stage = etapa
        var cab = crear('h3', 'grupo-head')
        cab.appendChild(puntoEtapa(etapa))
        cab.appendChild(crear('span', 'col-name', t(ETAPA_KEY[etapa])))
        cab.appendChild(crear('span', 'col-count', cuentaTexto(tarjetas.length + (resto || 0), m.counts[etapa])))
        grupo.appendChild(cab)
        tarjetas.forEach(function (c) { grupo.appendChild(filaNodo(c)) })
        var mas = botonMasNodo(etapa, resto)
        if (mas) grupo.appendChild(mas)
        else if (!busqueda && m.counts[etapa] > m.porEtapa[etapa].length) {
          grupo.appendChild(crear('p', 'col-more', fmt('boardMore', m.counts[etapa] - m.porEtapa[etapa].length)))
        }
        return grupo
      }

      /** La fila de etapas: "Todos" y cada etapa con su punto y su cuenta. Filtra. */
      function renderChips (m) {
        var caja = el('board-chips')
        caja.textContent = ''
        ;['todos'].concat(ORDEN_FILTRO).forEach(function (e) {
          var n = e === 'todos' ? m.total : m.counts[e]
          var b = crear('button', 'chip' + (e === 'decision' && n > 0 ? ' fuerte' : '') +
            (e === 'bloqueado' ? ' lane' : ''))
          b.type = 'button'
          b.dataset.etapa = e
          b.setAttribute('aria-pressed', filtroEtapa === e ? 'true' : 'false')
          if (e !== 'todos') b.appendChild(puntoEtapa(e))
          b.appendChild(crear('span', 'chip-name', e === 'todos' ? t('boardAll') : t(ETAPA_KEY[e])))
          b.appendChild(crear('span', 'chip-count', n))
          b.addEventListener('click', function () {
            filtroEtapa = e
            repintar()
            var mismo = el('board-chips').querySelector('[data-etapa="' + e + '"]')
            if (mismo) mismo.focus()
          })
          caja.appendChild(b)
        })
      }

      function seccion (clase, titulo) {
        var s = crear('section', 'det-sec' + (clase ? ' ' + clase : ''))
        if (titulo) s.appendChild(crear('h4', 'det-label', titulo))
        return s
      }

      /** Lo que vio Jev, en palabras: sin accion, como lee el mensaje, y sus senales. */
      function jevNodo (jev) {
        var caja = crear('div', 'det-jev')
        if (jev.skip === true) caja.appendChild(crear('p', null, t('jevSkip')))
        if (typeof jev.attention_class === 'string' && jev.attention_class) {
          caja.appendChild(crear('p', null, t('jevSees') + ': ' +
            porCodigo(JEV_CLASE_KEY, jev.attention_class, t('jevClsOther'))))
        }
        var flags = textos(jev.flags)
        if (flags.length) {
          caja.appendChild(crear('p', null, t('jevSignals') + ': ' +
            frases(FLAG_KEY, flags, t('flagOther'))))
        }
        return caja.childNodes.length ? caja : null
      }

      /** Una propuesta `escalar` no trae texto: el agente no redacto nada y lo dejo al dueno.
       *  Se dice eso, con el porque (las excepciones y lo que Jev leyo) y como responder, en
       *  vez de una caja de propuesta vacia. */
      function escalarNodo (c) {
        var s = seccion('det-escalar', t('escLead'))
        var motivos = []
        var excepciones = textos(c.exceptions)
        if (excepciones.length) motivos.push(frases(EXC_KEY, excepciones, t('excOther')))
        var clase = esObjeto(c.jev) && typeof c.jev.attention_class === 'string' ? c.jev.attention_class : ''
        if (clase) motivos.push(t('escJev') + ' ' + porCodigo(JEV_CLASE_KEY, clase, t('jevClsOther')))
        if (motivos.length) s.appendChild(crear('p', 'det-text', t('escWhy') + ': ' + motivos.join('. ')))
        s.appendChild(crear('p', 'det-text', t('escHow')))
        return s
      }

      /** La historia del caso (`caso_evento`), solo si la clave la trae como `events`. */
      function historiaNodo (c) {
        var eventos = Array.isArray(c.events) ? c.events.filter(esObjeto) : []
        if (!eventos.length) return null
        // Cada reapertura (algo vuelve a Recibido desde otra etapa) empieza un tramo nuevo:
        // lo que espera ahora es el ultimo y va primero; lo anterior se pliega.
        var tramos = [[]]
        eventos.forEach(function (ev) {
          if (ev.a === 'recibido' && ETAPA_KEY[ev.de] && ev.de !== 'recibido') tramos.push([])
          tramos[tramos.length - 1].push(ev)
        })
        function lista (evs) {
          var ol = crear('ol', 'det-hist')
          // Las filas iguales seguidas (tres mensajes que llegan uno tras otro) van en una,
          // con su cuenta: la historia dice que paso, no lo repite (T22).
          var filas = []
          evs.forEach(function (ev) {
            var hacia = ETAPA_KEY[ev.a] ? t(ETAPA_KEY[ev.a]) : null
            if (!hacia) return
            // Lo que no movio la etapa es un cambio dentro de la misma etapa: dice que fue
            // (un mensaje, lo que dijo Jev, un envio retenido) y, si no se sabe, "actualizado".
            var paso = queDelEvento(ev)
            var que = ev.de === ev.a ? hacia + ' · ' + (paso || t('detHistTouch'))
              : (ETAPA_KEY[ev.de] ? t(ETAPA_KEY[ev.de]) + ' → ' : '') + hacia +
                (paso ? ' · ' + paso : '')
            var quien = porCodigo(ACTOR_KEY, ev.actor, t('actorOtro'))
            var previa = filas[filas.length - 1]
            if (previa && previa.que === que && previa.quien === quien) {
              previa.n += 1
              previa.at = ev.at
              return
            }
            filas.push({ que: que, quien: quien, at: ev.at, n: 1 })
          })
          filas.forEach(function (f) {
            var li = crear('li')
            li.appendChild(crear('span', 'hist-que', f.que + (f.n > 1 ? ' ×' + f.n : '')))
            li.appendChild(crear('span', 'hist-quien', f.quien))
            var cuandoTxt = hace(f.at)
            if (cuandoTxt) li.appendChild(crear('span', 'when', cuandoTxt))
            ol.appendChild(li)
          })
          return ol.childNodes.length ? ol : null
        }
        function marca (evs) {
          var cuandoTxt = hace(evs[0].at)
          return crear('div', 'hist-reabierto', t('histReopened') + (cuandoTxt ? ' · ' + cuandoTxt : ''))
        }
        var caja = crear('div', 'det-hist-caja')
        var ultimo = tramos[tramos.length - 1]
        if (tramos.length > 1) caja.appendChild(marca(ultimo))
        var actual = lista(ultimo)
        if (actual) caja.appendChild(actual)
        if (tramos.length > 1) {
          var previa = crear('details', 'hist-previa')
          previa.appendChild(crear('summary', null, t('histPrev')))
          for (var k = tramos.length - 2; k >= 0; k--) {
            if (k > 0) previa.appendChild(marca(tramos[k]))
            var anterior = lista(tramos[k])
            if (anterior) previa.appendChild(anterior)
          }
          caja.appendChild(previa)
        }
        return caja.childNodes.length ? caja : null
      }

      /** El detalle del caso: el texto entero, lo que vio Jev y todas las acciones. */
      function renderDetalle (c) {
        var caja = el('board-detail')
        caja.textContent = ''
        if (!c) {
          caja.hidden = true
          delete caja.dataset.case
          return
        }
        var id = String(c.case_id)
        caja.hidden = false
        caja.dataset.case = id
        caja.setAttribute('aria-label', '#' + id + ' ' + tituloDe(c))

        var cab = crear('div', 'det-head')
        cab.appendChild(crear('span', 'card-id', '#' + id))
        var pastilla = crear('span', 'etapa-pill')
        pastilla.appendChild(puntoEtapa(c.stage))
        pastilla.appendChild(crear('span', null, t(ETAPA_KEY[c.stage])))
        cab.appendChild(pastilla)
        var cierra = crear('button', 'det-close', '×')
        cierra.type = 'button'
        cierra.dataset.cerrarDetalle = '1'
        cierra.title = t('detClose')
        cierra.setAttribute('aria-label', t('detClose'))
        cierra.addEventListener('click', cerrarDetalle)
        cab.appendChild(cierra)
        caja.appendChild(cab)

        caja.appendChild(crear('h3', 'det-title', tituloDe(c)))
        var meta = metaNodo(c)
        meta.className = 'det-meta'
        var prio = prioNodo(c)
        if (prio) {
          meta.appendChild(crear('span', 'sep', '·'))
          prio.textContent = t('detPrio') + ': ' + prio.textContent
          meta.appendChild(prio)
        }
        // El ticket es un texto, no un enlace: lo que llega de la clave es de fuera y un
        // href armado con ello no se abre desde el iframe del panel.
        var ticket = typeof c.ticket === 'string' ? c.ticket
          : (esObjeto(c.ticket) ? (c.ticket.id || c.ticket.key || c.ticket.identifier || '') : '')
        if (ticket) {
          meta.appendChild(crear('span', 'sep', '·'))
          meta.appendChild(crear('span', 'card-ticket', t('ticketLead') + ' ' + ticket))
        }
        caja.appendChild(meta)
        // El proyecto del caso: el que resolvio la ruta o el que puso el dueno a mano.
        var proyecto = esObjeto(c.project) && typeof c.project.id === 'string' ? c.project : null
        if (proyecto || accionesDe(c).indexOf('proyecto') >= 0) {
          var fp = crear('div', 'det-proyecto')
          fp.appendChild(crear('span', 'det-k', t('detProject') + ': '))
          fp.appendChild(crear('span', null, proyecto
            ? (typeof proyecto.name === 'string' && proyecto.name ? proyecto.name : proyecto.id)
            : t('acProyectoNinguno')))
          // Por que ese proyecto y quien lo eligio (proyectos-por-chat, M6).
          var porQue = porQueDelProyecto(rutaDe(c), proyecto)
          if (porQue) fp.appendChild(crear('span', 'det-porque', ' · ' + porQue))
          caja.appendChild(fp)
        }
        var preguntaNodo = preguntaDetalleNodo(c)
        if (preguntaNodo) caja.appendChild(preguntaNodo)

        // Un caso es un pedido: si este abrio aparte de uno que ya estaba, se dice cual.
        if (Number.isInteger(c.related_case) && c.related_case > 0) {
          var rel = c.related_case
          var fr = crear('div', 'det-proyecto')
          fr.appendChild(crear('span', 'det-k', t('detPrevCase') + ': '))
          var cartas = tableroActual && Array.isArray(tableroActual.cards) ? tableroActual.cards : []
          var destino = cartas.filter(function (x) { return esObjeto(x) && x.case_id === rel })[0]
          if (destino) {
            var enlace = crear('button', 'det-link', '#' + rel)
            enlace.type = 'button'
            enlace.dataset.relacionado = String(rel)
            enlace.addEventListener('click', function () { abrirCaso(destino) })
            fr.appendChild(enlace)
          } else {
            fr.appendChild(crear('span', null, '#' + rel))
          }
          caja.appendChild(fr)
        }

        var exc = excepcionNodo(c)
        if (exc) caja.appendChild(exc)
        var aprobada = aprobadaNodo(c)
        if (aprobada) caja.appendChild(aprobada)
        var bloqueo = bloqueoTexto(c)
        if (bloqueo) {
          var sb = seccion('card-blocked', t('blockedLead'))
          sb.appendChild(crear('p', 'det-text', bloqueo))
          caja.appendChild(sb)
        }
        var sinAgente = sinAgenteTexto(c)
        if (sinAgente) {
          var sa = seccion('card-noagent', t('noAgentLead'))
          sa.appendChild(crear('p', 'det-text', sinAgente))
          caja.appendChild(sa)
        }
        if (typeof c.summary === 'string' && c.summary) {
          var ss = seccion(null, t('detSummary'))
          ss.appendChild(crear('p', 'det-sum', c.summary))
          caja.appendChild(ss)
        }
        var prop = esObjeto(c.proposal) ? c.proposal : null
        if (prop && prop.tipo === 'escalar' && !prop.texto) {
          caja.appendChild(escalarNodo(c))
        } else if (prop && (prop.texto || prop.tipo)) {
          var sp = seccion('det-prop', t('propLead') +
            (prop.tipo ? ' · ' + porCodigo(PROP_KEY, prop.tipo, '') : ''))
          if (prop.texto) sp.appendChild(crear('div', 'card-prop', prop.texto))
          caja.appendChild(sp)
        }
        var jev = esObjeto(c.jev) ? jevNodo(c.jev) : null
        if (jev) {
          var sj = seccion(null, t('detJev'))
          sj.appendChild(jev)
          caja.appendChild(sj)
        }

        // Las acciones del dueno: un formulario si hay uno abierto, y si no, los botones.
        var posibles = accionesDe(c)
        var formulario = formularios[id]
        var abierto = formulario && ACC_FORM[formulario.modo] && posibles.indexOf(formulario.modo) >= 0
        var aviso = abierto ? null : mensajeNodo(id)
        if (abierto || aviso || posibles.length) {
          var sa = seccion('det-acciones', t('detActions'))
          if (abierto) {
            sa.appendChild(formularioNodo(c, formulario))
          } else {
            if (aviso) sa.appendChild(aviso)
            if (posibles.indexOf('autorizar') >= 0) sa.appendChild(crear('p', 'det-text', t('acAutorizarNota')))
            if (posibles.length) {
              var fila = crear('div', 'det-acts')
              posibles.forEach(function (a) { fila.appendChild(botonAccion(c, a)) })
              sa.appendChild(fila)
            }
          }
          caja.appendChild(sa)
        }
        var historia = historiaNodo(c)
        if (historia) {
          var sh = seccion(null, t('detHistory'))
          sh.appendChild(historia)
          caja.appendChild(sh)
        }
      }

      function abrirCaso (c) {
        seleccion = String(c.case_id)
        repintar()
      }

      function cerrarDetalle () {
        var id = seleccion
        seleccion = null
        repintar()
        var card = id && el('board-body').querySelector('.card[data-case="' + id + '"]')
        if (card) card.focus()
      }

      function mostrarVacio (titulo, cuerpo, error) {
        var caja = el('board-empty')
        caja.hidden = false
        caja.className = 'board-empty' + (error ? ' error' : '')
        caja.querySelector('.t').textContent = titulo
        caja.querySelector('.b').textContent = cuerpo
      }

      function renderBoard (board, forzar) {
        tableroActual = board
        // Con un formulario abierto en el detalle el sondeo no repinta: reconstruir el DOM
        // se llevaria el texto y el foco del dueno. Lo que cambie se ve al cerrarlo o tras
        // cualquier accion.
        if (!forzar && seleccion && formularios[seleccion]) return
        // Si nada de lo que se pinta cambio, el DOM se queda como esta. El foco de la
        // ventana y el sondeo releen cada pocos segundos el mismo tablero, y reconstruirlo
        // igual cambiaba la tarjeta bajo el puntero entre que el dueno apretaba y soltaba:
        // el navegador no le mandaba el `click` y el primer clic no hacia nada.
        var firma = firmaTablero(board)
        if (!forzar && firma !== null && firma === firmaPintada && relojesIguales()) return
        firmaPintada = null
        relojes = []
        try { pintarTablero(board) } finally {
          relojesPintados = relojes
          relojes = null
        }
        // Despues de pintar: pintar puede soltar la seleccion o un formulario de una
        // tarjeta que ya no esta, y la firma tiene que ser la de lo que quedo en pantalla.
        firmaPintada = firmaTablero(board)
      }

      /** Todo lo que `pintarTablero` lee, en un texto: igual texto, igual tablero. Lo que
       *  depende de la hora lo cubren los relojes anotados. */
      var firmaPintada = null
      function firmaTablero (board) {
        try {
          return JSON.stringify([board, cuentaVinculada, vacioPorConfig(actividadActual),
            proyectosAceptados, filtroEtapa, busqueda, vistaEfectiva(), estrecho(), seleccion,
            formularios, mensajes, enCurso, periodo, desdePeriodo(periodo), cuantosFinales,
            heldHechos, heldMsgs, heldAviso])
        } catch (e) {
          return null
        }
      }

      function pintarTablero (board) {
        var m = modeloTablero(board)
        var cols = el('board-cols')
        var lista = el('board-list')
        var nota = el('board-note')
        var sello = el('board-synced')
        var nada = el('board-nada')
        // El detalle pudo quedar dentro de la lista (en lo angosto): vuelve a su lugar antes
        // de vaciarla, o se iria con ella.
        if (el('board-detail').parentNode !== el('board-body')) el('board-body').appendChild(el('board-detail'))
        cols.textContent = ''
        lista.textContent = ''
        sello.textContent = ''
        nota.className = 'meta nota'
        el('board-empty').hidden = true
        nada.hidden = true
        var avisos = []
        var detalleDe = null
        var porConfig = vacioPorConfig(actividadActual)
        pintarRetenidos(m.estado === 'ok' || m.estado === 'vacio' ? board : null)
        if (m.estado === 'sin-datos') {
          mostrarVacio(t('boardNoDataTitle'), porConfig || t('boardNoDataBody'), false)
        } else if (m.estado === 'version') {
          mostrarVacio(t('boardVersionTitle'), fmt('boardUnsupported', { v: m.v }), true)
        } else if (m.estado === 'vacio') {
          mostrarVacio(t('boardEmptyTitle'), porConfig || t('boardEmptyBody'), false)
        } else {
          // Un formulario, un mensaje o un detalle de una tarjeta que ya no esta no tiene a
          // quien pertenecer.
          var presentes = {}
          ETAPAS.forEach(function (e) {
            m.porEtapa[e].forEach(function (c) { presentes[String(c.case_id)] = c })
          })
          Object.keys(formularios).forEach(function (k) { if (!presentes[k]) delete formularios[k] })
          Object.keys(mensajes).forEach(function (k) { if (!presentes[k]) delete mensajes[k] })
          if (seleccion && !presentes[seleccion]) seleccion = null
          detalleDe = seleccion ? presentes[seleccion] : null

          renderChips(m)
          var q = plano(busqueda.trim())
          var etapas = filtroEtapa === 'todos' ? ETAPAS : [filtroEtapa]
          var vis = {}
          var resto = {}
          var mostrados = 0
          ETAPAS.forEach(function (e) {
            vis[e] = etapas.indexOf(e) >= 0
              ? m.porEtapa[e].filter(function (c) { return coincide(c, q) }) : []
            // Lo terminado, de 20 en 20: el resto espera su "Mostrar mas".
            if (FINALES.indexOf(e) >= 0 && vis[e].length > cuantosFinales[e]) {
              resto[e] = vis[e].length - cuantosFinales[e]
              vis[e] = vis[e].slice(0, cuantosFinales[e])
            }
            mostrados += vis[e].length
          })
          var vista = vistaEfectiva()
          Array.prototype.forEach.call(el('board-view').querySelectorAll('button[data-vista]'),
            function (b) { b.setAttribute('aria-pressed', b.dataset.vista === vista ? 'true' : 'false') })
          el('board-shown').textContent = mostrados === 1 ? t('boardShown1') : fmt('boardShown', mostrados)
          cols.hidden = vista !== 'board'
          lista.hidden = vista !== 'list'
          if (!m.total) {
            // Hay casos, pero ninguno abierto y nada terminado en el periodo: se dice eso, y
            // la barra queda para buscar o cambiar de vista.
            nada.textContent = t('boardPeriodNone')
            nada.hidden = false
          } else if (q && !mostrados) {
            nada.textContent = t('boardNoMatch')
            nada.hidden = false
          } else if (vista === 'board') {
            etapas.forEach(function (e) {
              cols.appendChild(columnaNodo(e, m, vis[e], filtroEtapa !== 'todos', resto[e]))
            })
          } else {
            var algun = false
            ORDEN_FILTRO.forEach(function (e) {
              if (!vis[e].length) return
              algun = true
              lista.appendChild(grupoNodo(e, m, vis[e], resto[e]))
            })
            if (!algun) {
              nada.textContent = t('boardStageNone')
              nada.hidden = false
            }
          }
          if (m.truncado) avisos.push(t('boardTruncated'))
          if (m.desconocidas) {
            avisos.push(m.desconocidas === 1 ? t('boardUnknown1') : fmt('boardUnknown', m.desconocidas))
          }
        }
        var conCasos = m.estado === 'ok'
        el('board-bar').hidden = !conCasos
        el('board-body').hidden = !conCasos
        renderDetalle(detalleDe)
        ubicarDetalle()
        if (m.estado === 'ok' || m.estado === 'vacio') {
          var edad = hace(m.actualizado)
          if (edad) {
            var texto = fmt('boardUpdated', { cuando: edad })
            if (viejo(m.actualizado)) sello.appendChild(crear('span', 'vieja', texto))
            else sello.textContent = texto
          }
        }
        nota.textContent = avisos.join(' ')
      }

      /** El tope de las columnas: lo que queda de la ventana debajo de ellas, con un minimo
       *  para que en una ventana baja sigan sirviendo. Se mide al pintar y al cambiar el
       *  tamano; no toca el DOM del tablero, asi que no le roba el clic a nadie. */
      var ALTO_MINIMO_COLUMNAS = 320
      function ajustarAlto () {
        var cols = el('board-cols')
        var arriba = cols.getBoundingClientRect().top + (window.scrollY || 0)
        var alto = Math.max(ALTO_MINIMO_COLUMNAS, Math.floor((window.innerHeight || 0) - arriba - 24))
        cols.style.setProperty('--alto-tablero', alto + 'px')
      }

      /** A lo ancho el detalle va al costado, como el panel de un elemento en Plane. En lo
       *  angosto se abre en el lugar: debajo de la fila elegida en la lista, o debajo de las
       *  columnas en el tablero. */
      function ubicarDetalle () {
        var caja = el('board-detail')
        var cuerpo = el('board-body')
        var fila = seleccion && estrecho() && vistaEfectiva() === 'list'
          ? el('board-list').querySelector('.card[data-case="' + seleccion + '"]') : null
        if (fila) {
          fila.parentNode.insertBefore(caja, fila.nextSibling)
          caja.classList.add('en-linea')
        } else {
          if (caja.parentNode !== cuerpo) cuerpo.appendChild(caja)
          caja.classList.remove('en-linea')
        }
      }

      el('board-search').addEventListener('input', function () {
        busqueda = el('board-search').value
        el('board-search-clear').hidden = !busqueda
        repintar()
      })
      el('board-search-clear').addEventListener('click', function () {
        busqueda = ''
        el('board-search').value = ''
        el('board-search-clear').hidden = true
        repintar()
        el('board-search').focus()
      })
      Array.prototype.forEach.call(el('board-view').querySelectorAll('button[data-vista]'), function (b) {
        b.addEventListener('click', function () {
          vistaElegida = b.dataset.vista
          repintar()
        })
      })
      Array.prototype.forEach.call(el('period').querySelectorAll('button[data-periodo]'), function (b) {
        b.addEventListener('click', function () { elegirPeriodo(b.dataset.periodo) })
      })
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && seleccion) cerrarDetalle()
      })

      // Al cruzar los 768 px cambia la vista natural y el lugar del detalle.
      var eraEstrecho = estrecho()
      window.addEventListener('resize', function () {
        ajustarAlto()
        if (estrecho() === eraEstrecho) return
        eraEstrecho = estrecho()
        repintar()
      })

      // ───────────────────────── Los informes (I5) ─────────────────────────
      // `wa-scope sync` escribe la clave `reports` (odd/tasks/informes-tablero.md, "Storage
      // key reports") y este panel la LEE: el panel no puede abrir las bases. Todo lo que
      // trae de clientes (titulos, chats, proyectos) se pinta con textContent.
      //
      // Las definiciones van escritas en cada bloque, en el idioma del dueno: un numero que
      // no dice que mide no se puede usar.
      var pestana = 'board'
      var PESTANAS = ['board', 'reports']
      var informesActual = null
      var informesLeidos = false
      var firmaInformes = null
      var csvMensaje = null   // { texto, mala }: lo que dijo el ultimo Copiar CSV
      var LOCALE = (function () {
        var tag = String(navigator.language || LANG)
        try { new Intl.NumberFormat(tag); return tag } catch (e) { return LANG }
      })()
      var FMT_NUM = new Intl.NumberFormat(LOCALE)
      var FMT_PCT = new Intl.NumberFormat(LOCALE, { style: 'percent', maximumFractionDigits: 1 })
      var FMT_UNO = new Intl.NumberFormat(LOCALE, { maximumFractionDigits: 1 })

      function num (n) { return FMT_NUM.format(n) }
      function esNumero (x) { return typeof x === 'number' && isFinite(x) }

      /** Una duracion en segundos, en la unidad que se lee: "45 s", "13 min", "3 h 50 min",
       *  "2 d 4 h". Sin valor, null: el que llama dice que no hay datos. */
      function duracion (s) {
        if (!esNumero(s) || s < 0) return null
        if (s < 60) return num(Math.round(s)) + ' s'
        var min = Math.round(s / 60)
        if (min < 60) return num(min) + ' min'
        if (min < 1440) {
          var h = Math.floor(min / 60), m = min % 60
          return num(h) + ' h' + (m ? ' ' + num(m) + ' min' : '')
        }
        var horas = Math.round(s / 3600)
        var d = Math.floor(horas / 24), hr = horas % 24
        return num(d) + ' d' + (hr ? ' ' + num(hr) + ' h' : '')
      }

      /** Una fecha local 'YYYY-MM-DD' como Date, sin pasar por UTC. */
      function fechaLocal (k) {
        var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(k || ''))
        return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : null
      }
      function fechaCorta (f) {
        return f.toLocaleDateString(LOCALE, { day: 'numeric', month: 'short' })
      }
      /** El nombre de una cubeta de las barras: la hora, la fecha o la semana. `corto`, para
       *  el eje: la semana es solo su lunes ("13 jul"); "Semana del 13 jul" queda en el
       *  titulo de cada barra y en el nombre del grafico. Tres de esos no caben en un eje
       *  de 200 px. */
      function nombreCubeta (k, cubeta, corto) {
        if (cubeta === 'hour') {
          var m = / (\d{2})$/.exec(String(k || ''))
          return m ? m[1] + ':00' : String(k)
        }
        var f = fechaLocal(k)
        if (!f) return String(k)
        return cubeta === 'week' && !corto ? fmt('repWeekOf', { d: fechaCorta(f) }) : fechaCorta(f)
      }
      /** El nombre de una fila del mapa: la fecha con su dia, o el dia de la semana (1 = lunes). */
      function nombreFila (k, filas) {
        if (filas === 'weekday') {
          var n = Number(k)
          if (!(n >= 1 && n <= 7)) return String(k)
          // 2024-01-01 fue lunes.
          return new Date(2024, 0, n).toLocaleDateString(LOCALE, { weekday: 'short' })
        }
        // "lun 28", "Mon 28", "seg 28": el dia y su numero, armados por partes. pt-BR
        // escribe "seg., 28", que en la columna de 44 px quedaba "seg., …" y sin el numero.
        var f = fechaLocal(k)
        if (!f) return String(k)
        var dia = f.toLocaleDateString(LOCALE, { weekday: 'short' }).replace(/[.,]/g, '').trim()
        return dia + ' ' + f.getDate()
      }

      /** La comparacion con el periodo anterior: flecha, porcentaje (o puntos) y "vs.
       *  periodo anterior". Sin base (null) no hay nodo: nunca se inventa un cambio.
       *  `sentido`: 'menos' si bajar es mejor, 'mas' si subir es mejor, null si ninguno. */
      function deltaNodo (valor, sentido, enPuntos) {
        if (!esNumero(valor)) return null
        var flecha = valor > 0 ? '▲' : valor < 0 ? '▼' : '='
        var cifra = enPuntos ? FMT_UNO.format(Math.abs(valor)) + ' ' + t('repPts')
          : FMT_PCT.format(Math.abs(valor) / 100)
        var nodo = crear('span', 'rep-delta', flecha + ' ' + cifra + ' ' + t('repVsPrev'))
        if (valor !== 0 && sentido) {
          var mejor = sentido === 'menos' ? valor < 0 : valor > 0
          nodo.classList.add(mejor ? 'mejor' : 'peor')
          nodo.title = t(mejor ? 'repBetter' : 'repWorse')
        }
        return nodo
      }

      function seccionInforme (cual, titulo, definicion) {
        var s = crear('section', 'rep-sec')
        s.dataset.bloque = cual
        s.appendChild(crear('h2', null, titulo))
        if (definicion) s.appendChild(crear('p', 'rep-def', definicion))
        return s
      }

      function azulejoNodo (metrica, etiqueta, valor, delta) {
        var a = crear('div', 'rep-azulejo')
        a.dataset.metrica = metrica
        a.appendChild(crear('span', 'rep-label', etiqueta))
        a.appendChild(crear('span', 'rep-num', esNumero(valor) ? num(valor) : '—'))
        if (delta) a.appendChild(delta)
        return a
      }

      /** Barras en CSS, una o dos series. `valorDe(barra, serie)` da el numero o null; `texto`
       *  dice como se lee un valor (una duracion, un numero). Cada cubeta lleva su titulo con
       *  todo lo que muestra, y el grafico entero un nombre para quien no lo ve. */
      function barrasNodo (barras, series, cubeta, texto, nombre) {
        var max = 0
        barras.forEach(function (b) {
          series.forEach(function (sr) {
            var v = b[sr.clave]
            if (esNumero(v) && v > max) max = v
          })
        })
        var caja = crear('div', 'rep-barras')
        caja.setAttribute('role', 'img')
        caja.setAttribute('aria-label', nombre + ': ' + (barras.length ? nombreCubeta(barras[0].k, cubeta) + ' – ' +
          nombreCubeta(barras[barras.length - 1].k, cubeta) : '') + ', ' + fmt('repMax', { v: texto(max) }))
        if (series.length > 1) {
          var ley = crear('div', 'rep-leyenda')
          series.forEach(function (sr, i) {
            var item = crear('span')
            item.appendChild(crear('i', i ? 's2' : null))
            item.appendChild(document.createTextNode(sr.nombre))
            ley.appendChild(item)
          })
          caja.appendChild(ley)
        }
        var plot = crear('div', 'rep-plot' + (series.length > 1 ? ' dos' : ''))
        plot.setAttribute('aria-hidden', 'true')
        barras.forEach(function (b) {
          var g = crear('div', 'rep-grupo')
          var partes = []
          series.forEach(function (sr, i) {
            var v = b[sr.clave]
            partes.push((series.length > 1 ? sr.nombre + ' ' : '') + (esNumero(v) ? texto(v) : t('repBarNone')))
            if (!esNumero(v) || !max) return
            var barra = crear('span', 'b' + (i ? ' s2' : ''))
            // Un valor chico se ve igual: 2 px de minimo para lo que no es cero.
            barra.style.height = v > 0 ? 'max(2px, ' + (v * 100 / max).toFixed(2) + '%)' : '0'
            g.appendChild(barra)
          })
          g.title = nombreCubeta(b.k, cubeta) + ': ' + partes.join(' · ')
          plot.appendChild(g)
        })
        if (max) plot.appendChild(crear('span', 'rep-max', texto(max)))
        caja.appendChild(plot)
        var eje = crear('div', 'rep-eje')
        eje.setAttribute('aria-hidden', 'true')
        var marcas = barras.length > 2 ? [0, Math.floor((barras.length - 1) / 2), barras.length - 1]
          : barras.map(function (_, i) { return i })
        marcas.forEach(function (i) { eje.appendChild(crear('span', null, nombreCubeta(barras[i].k, cubeta, true))) })
        caja.appendChild(eje)
        return caja
      }

      /** El mapa de calor: una fila por fecha o dia de la semana, 24 horas, cinco tonos de
       *  UNA rampa (0 = nada, 4 = el maximo). Cada celda dice dia, hora y cuantos; abajo la

        var max = 0, pico = null
        validas.forEach(function (f) {

        mapa.setAttribute('aria-label', titulo + '. ' + picoTxt)
        validas.forEach(function (f) {

          f.h.forEach(function (v, h) {

            var c = crear('span', 'rep-celda n' + n)
            c.title = fmt('repHeatCell', { dia: nombre, hora: hh(h), n: num(esNumero(v) ? v : 0) })

        })
        var horas = crear('div', 'rep-horas')

        ;[0, 6, 12, 18].forEach(function (h) { horas.appendChild(crear('span', null, hh(h))) })

      // ── Los casos del periodo en CSV (I6) ──
      // El panel vive en un iframe `sandbox="allow-scripts"` (orca-oss, PluginPanel.tsx): sin
      // allow-downloads el navegador no baja nada, y `navigator.clipboard` lo frena la
      // politica de permisos del iframe. Lo que si pasa, con el clic del dueno, es
      // `execCommand('copy')` sobre un campo seleccionado (probado en Chromium con el mismo
      // sandbox y la misma CSP del host). Por eso el boton COPIA, y dice si lo logro.
      var SLA_CSV = { met: 'repCsvMet', missed: 'repCsvMissed', pending: 'repCsvPending' }

      /** Un campo de CSV: entre comillas si lleva coma, comillas o salto, y con un apostrofo
       *  delante si empieza como una formula (el texto es de clientes y va a una planilla). */
      function campoCsv (x) {
        var v = x == null ? '' : String(x)
        if (/^[=+\-@\t\r]/.test(v)) v = "'" + v
        return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v
      }

      /** Las filas del periodo: los casos creados entre `from` y `to` (Todo: todos). */
      function filasCsv (p, r) {
        var desde = Date.parse(p.from), hasta = Date.parse(p.to)
        return (Array.isArray(r.cases) ? r.cases.filter(esObjeto) : []).filter(function (c) {
          var t0 = Date.parse(c.created)
          if (!t0) return false
          return (!desde || t0 >= desde) && (!hasta || t0 <= hasta)
        })
      }

      function textoCsv (filas) {
        var lineas = [t('repCsvCols').split('|').map(campoCsv).join(',')]
        filas.forEach(function (c) {
          lineas.push([c.case_id, c.chat, c.created,
            esNumero(c.first_response_s) ? c.first_response_s : '',
            esNumero(c.resolution_s) ? c.resolution_s : '',
            ETAPA_KEY[c.stage] ? t(ETAPA_KEY[c.stage]) : c.stage,
            c.project, SLA_CSV[c.sla] ? t(SLA_CSV[c.sla]) : ''].map(campoCsv).join(','))
        })
        // Salto LF: el campo que lleva el texto al portapapeles normaliza todo salto a LF
        // (la API de <textarea> lo hace asi), y las planillas lo leen igual.
        return lineas.join('\n')
      }

      /** Copia con el gesto del dueno. true solo si el navegador dijo que copio. */
      function copiar (texto, volver) {
        var aux = crear('textarea', 'rep-csv-aux')
        aux.value = texto
        aux.setAttribute('readonly', '')
        aux.setAttribute('aria-hidden', 'true')
        document.body.appendChild(aux)
        var bien = false
        try {
          aux.focus()
          aux.select()
          aux.setSelectionRange(0, texto.length)
          bien = typeof document.execCommand === 'function' && document.execCommand('copy') === true
        } catch (e) {
          bien = false
        }
        aux.remove()
        if (volver) volver.focus()
        return bien
      }

      function bloqueCsv (p, r) {
        var s = seccionInforme('csv', t('repCsvTitle'), t('repCsvDef'))
        var filas = filasCsv(p, r)
        if (!filas.length) {
          s.appendChild(crear('p', 'rep-nada', t('repCsvNone')))
          return s
        }
        var fila = crear('div', 'rep-csv')
        var b = crear('button', 'btn', t('repCsvButton'))
        b.type = 'button'
        b.id = 'reports-csv'
        // El aviso vive en una region que ya esta en la pagina antes de copiar, y el clic
        // solo le cambia el texto: un lector de pantalla anuncia el cambio de una region
        // viva, no una que llega ya llena (que es lo que pasaba al repintar el bloque).
        // Si no copio es una alerta, como los demas avisos que fallan (mensajeNodo).
        var msg = crear('span', 'card-msg')
        msg.id = 'reports-csv-msg'
        var avisar = function (m) {
          msg.className = 'card-msg' + (m && m.mala ? ' mala' : '')
          msg.setAttribute('role', m && m.mala ? 'alert' : 'status')
          msg.textContent = m ? m.texto : ''
        }
        avisar(csvMensaje)
        b.addEventListener('click', function () {
          var ok = copiar(textoCsv(filas), b)
          csvMensaje = ok
            ? { texto: filas.length === 1 ? t('repCsvOk1') : fmt('repCsvOk', num(filas.length)), mala: false }
            : { texto: t('repCsvFail'), mala: true }
          // Vaciar primero: copiar dos veces con el mismo resultado tambien se anuncia.
          avisar(null)
          avisar(csvMensaje)
        })
        fila.appendChild(b)
        fila.appendChild(crear('span', 'rep-n', filas.length === 1 ? t('repCsvCount1') : fmt('repCsvCount', num(filas.length))))
        fila.appendChild(msg)
        s.appendChild(fila)
        // Con el tope de 500 filas, lo que el periodo pide y no viajo se dice. Lo mas viejo
        // que viajo es la ultima fila que es un objeto: una entrada rara no rompe el bloque.
        var validas = r.cases.filter(esObjeto)
        var viejo = validas.length ? Date.parse(validas[validas.length - 1].created) : null
        var desde = Date.parse(p.from)
        if (Number(r.cases_more) > 0 && (!desde || (viejo && desde < viejo))) {
          s.appendChild(crear('p', 'rep-mas', fmt('repCsvCut', num(r.cases_more))))
        }
        return s
      }

      function mostrarVacioInformes (titulo, cuerpo, error) {
        var caja = el('reports-empty')
        caja.hidden = false
