              "acErrFallo": "A acao falhou. Confira o quadro antes de repeti-la."}
      }
      var LANG = (function () {
        var tag = String(navigator.language || 'en').toLowerCase()
        if (tag.indexOf('es') === 0) return 'es'
        if (tag.indexOf('pt') === 0) return 'pt'
        return 'en'
      })()
      function t(key) { return (STRINGS[LANG] && STRINGS[LANG][key]) || STRINGS.en[key] || key }
      // De un codigo estable del CLI, la frase en el idioma del usuario. Sin respaldo, el
      // codigo crudo; el tablero pasa siempre un respaldo, y ahi no sale nunca crudo.
      function porCodigo(mapa, code, respaldo) {
        var key = Object.prototype.hasOwnProperty.call(mapa, code) ? mapa[code] : null
        if (key) return t(key)
        if (respaldo !== undefined) return respaldo
        return String(code == null ? '' : code)
      }

      function applyStrings() {
        Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (node) {
          node.innerHTML = t(node.dataset.t)
        })
        Array.prototype.forEach.call(document.querySelectorAll('[data-t-ph]'), function (node) {
          node.placeholder = t(node.dataset.tPh)
        })
        Array.prototype.forEach.call(document.querySelectorAll('[data-t-aria]'), function (node) {
          node.setAttribute('aria-label', t(node.dataset.tAria))
        })
        Array.prototype.forEach.call(document.querySelectorAll('[data-t-title]'), function (node) {
          node.title = t(node.dataset.tTitle)
          node.setAttribute('aria-label', t(node.dataset.tTitle))
        })
      }

      var seq = 0, pending = {}
      var el = function (id) { return document.getElementById(id) }

      function call(action, params) {
        return new Promise(function (resolve) {
          var requestId = 'req-' + ++seq
          pending[requestId] = resolve
          window.parent.postMessage(
            { type: 'orca-panel-action', requestId: requestId, action: action, params: params },
            '*')
        })
      }

      window.addEventListener('message', function (event) {
        var d = event.data
        if (!d || d.type !== 'orca-panel-action-result') return
        var resolve = pending[d.requestId]
        if (!resolve) return
        delete pending[d.requestId]
        resolve(d)
      })

      // storage.get devuelve { value: <dato> } y el bridge lo envuelve otra vez.
      function stored(result) {
        if (!result || !result.ok || !result.value) return null
        return result.value.value === undefined ? null : result.value.value
      }

      function esc(text) {
        return String(text == null ? '' : text)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      }

      function hora(stamp) {
        var m = /\d{2}:\d{2}/.exec(String(stamp || ''))
        return m ? m[0] : esc(stamp)
      }

      // Los textos con {n} se arman aca y no concatenando: en portugues y en ingles el
      // numero no cae en el mismo lugar de la frase.
      // Acepta un numero suelto -el caso de siempre- o un objeto con varios huecos.
      // Un texto con dos cifras ("1 de 298") no se puede armar con un solo {n}.
      function fmt(key, n) {
        var texto = t(key)
        if (n !== null && typeof n === 'object') {
          for (var k in n) {
            if (Object.prototype.hasOwnProperty.call(n, k)) {
              texto = texto.split('{' + k + '}').join(String(n[k]))
            }
          }
          return texto
        }
        return texto.replace('{n}', String(n))
      }

      /** Que decir con la lista vacia. Tres finales distintos y hasta hoy uno solo:
       *  no hay nada pendiente, todo quedo en `off` — que es configuracion y no
       *  ausencia de trabajo — o todavia no se autorizo ni una conversacion. */
      function vacioPorConfig(activity) {
        // Un numero recien vinculado todavia no tiene actividad: no es configuracion.
        if (!activity || activity.esperandoLinea) return null
        var mapped = activity && activity.mapped
        var authorized = activity && activity.authorized
        if (typeof mapped === 'number' && typeof authorized === 'number') {
          if (!mapped) return t('nothingMapped')
          if (!authorized) {
            return mapped === 1 ? t('nothingAuthorized1')
              : fmt('nothingAuthorized', mapped)
          }
        }
        return null
      }

      // La actividad la arma `wa-scope sync`, no el panel: un panel no puede ejecutar
      // nada, solo leer storage. Si el sello de tiempo esta viejo, decirlo es mas
      // honesto que mostrar una lista que parece viva y no lo esta.
      function viejo(stamp) {
        var ms = Date.parse(String(stamp || '').replace(' ', 'T'))
        return !ms || (Date.now() - ms) > 30 * 60000
      }

      // Pasada media hora la hora sola ya no ubica: "09:33" de anteayer se lee como de
      // hace un rato, asi que ahi se muestra la marca entera.
      function cuando(stamp) {
        var s = String(stamp == null ? '' : stamp)
        if (viejo(s)) return s
        var m = /\d{2}:\d{2}/.exec(s)
        return m ? m[0] : s
      }

      function renderSynced(activity) {
        var when = activity && activity.syncedAt
        // Numero recien vinculado: el worker ya pidio el sync de esta linea (T9e), asi
        // que no se manda a nadie a una terminal; se dice que se lo esta esperando.
        if (!when && activity && activity.esperandoLinea) {
          el('synced').innerHTML = '<span class="stale">' + t('syncLineaNueva') + '</span>'
          return
        }
        if (!when) {
          el('synced').innerHTML = '<span class="stale">' + t('noData') + '</span>'
          return
        }
        el('synced').innerHTML =
          (activity.running ? '<span class="dot"></span>' + t('running') + ' · ' : '') +
          (viejo(when) ? '<span class="vieja">' + esc(when) + '</span>' : esc(when))
      }

      /** Si la linea esta viva, y cual. "No hay nada pendiente" y "no estoy conectado"
       *  se leian exactamente igual: una lista vacia. Son lo contrario, y cual de las
       *  dos es decide si el dueno tiene que hacer algo o no.
       *
       *  El numero va porque el dueno puede tener mas de una linea y porque, tras
       *  escanear un QR, saber CUAL quedo vinculada es la unica forma de notar que se
       *  escaneo con el telefono equivocado. */
      // Cuanto vale el latido de la linea: el MISMO plazo que config.html (la prueba de
      // paneles compara los dos). La foto guardada en storage no caduca nunca, y sin esto
      // la linea se leia "conectada" una semana despues de morir.
      var LATIDO_LINEA_VENCE_MS = 150000

      function latidoFresco (sc) {
        var ts = sc && sc.latido && Number(sc.latido.ts)
        if (!ts) return false
        var edad = Date.now() - ts
        return edad >= 0 && edad <= LATIDO_LINEA_VENCE_MS
      }

      /** "Desde las 17:44", o con la fecha si ya paso un dia: la hora sola de anteayer
       *  se lee como de hace un rato. */
      function horaUltimaSenal (sc) {
        var ms = (sc && sc.latido && Number(sc.latido.ts)) || Date.parse((sc && sc.at) || '')
        if (!ms) return '\u2014'
        var f = new Date(ms)
        var hora = ('0' + f.getHours()).slice(-2) + ':' + ('0' + f.getMinutes()).slice(-2)
        return Date.now() - ms > 20 * 3600 * 1000
          ? f.getFullYear() + '-' + ('0' + (f.getMonth() + 1)).slice(-2) + '-' +
            ('0' + f.getDate()).slice(-2) + ' ' + hora
          : hora
      }

      function renderLinea (sc) {
        var nodo = el('linea')
        if (!sc || typeof sc !== 'object') { nodo.textContent = ''; return }
        var clase = 'meta nota'
        var texto
        if (sc.connection === 'open' && !latidoFresco(sc)) {
          texto = fmt('lineaSinSenal', { hora: horaUltimaSenal(sc) })
          clase += ' stale'
        } else if (sc.connection === 'open') {
          texto = t('lineaConectada')
          var yo = sc.me || null
          if (yo) texto += ' · ' + esc(yo)
        } else if (sc.exited || sc.motivo === 'sesion-cerrada') {
          texto = t('lineaCaida')
          clase += ' stale'
        } else if (sc.qr) {
          texto = t('lineaSinVincular')
          clase += ' vieja'
        } else {
          texto = t('lineaConectando')
          clase += ' vieja'
        }
        nodo.textContent = texto
        nodo.className = clase
      }

      /** Sobre cuanto puede actuar el agente. Un "revise 1 conversacion" sin decir de
       *  cuantas no informa nada: 1 de 1 es cobertura completa y 1 de 298 es un agente
       *  que casi no ve. Es el mismo numero y significan lo contrario. */
      function renderCobertura (a, chats) {
        var nodo = el('cobertura')
        var total = Array.isArray(chats) ? chats.length : null
        var vivas = a && a.authorized != null ? a.authorized : null
        if (vivas == null) { nodo.textContent = ''; return }
        nodo.className = 'meta nota' + (vivas === 0 ? ' vieja' : '')
        nodo.textContent = total == null
          ? fmt('coberturaSinTotal', vivas)
          : fmt('cobertura', { n: vivas, total: total })
      }

      /** La linea honesta, arriba de la lista. Cinco finales y ninguno se parece a
       *  otro: reviso y no habia nada, reviso y hay tanto, nunca reviso, arranco y no
       *  volvio, o fallo por algo. Sin ella los cinco eran una lista vacia, y el dueno
       *  concluia lo unico que se puede concluir mirando eso: que no funciona.
       *
       *  Sin color propio: la allowlist del host no trae ni exito ni advertencia. El
       *  peso lo dan las dos clases que ya existen — `vieja` para lo que pide atencion
       *  y `stale` (--destructive) para lo que si es un fallo. */
      function renderRun(activity, board) {
        var nodo = el('runline')
        var r = activity && activity.run
        var clase = 'meta nota run'
        var texto = ''
        if (!r) {
          // Un CLI viejo no manda `run`. Callarse es lo honesto: afirmar que nunca
          // corrio seria decir algo que ese CLI no cuenta.
          nodo.textContent = ''
          nodo.className = 'meta nota'
          return
        }
        if (r.state === 'running') {
          texto = t('runNow')
        } else if (r.state === 'never') {
          texto = t('runNever')
          clase += ' vieja'
        } else if (r.state === 'interrupted') {
          texto = t('runCut') + (r.startedAt ? ' · ' + cuando(r.startedAt) : '')
          clase += ' vieja'
        } else if (r.state === 'failed') {
          // El motivo va tal cual: lo escribio quien fallo y es el unico dato que
          // dice que paso de verdad. Traducirlo seria inventarlo.
          texto = t('runFailed') + (r.reason ? ': ' + r.reason : '') +
            (r.endedAt ? ' · ' + cuando(r.endedAt) : '')
          clase += ' stale'
        } else {
          // Casos de verdad, del tablero: los que esperan al agente (los mismos que
          // `pending --needs-agent`) y los que esperan al dueno. Un cero no se dice. La
          // cola vieja de mensajes (`activity.pending`) ya no significa nada aqui.
          var partes = [r.endedAt ? fmt('runLast', { hora: cuando(r.endedAt) }) : t('runLastNoTime')]
          var agente = board && Number.isInteger(board.agent_waiting) ? board.agent_waiting : null
          var dueno = board && esObjeto(board.counts) && Number.isInteger(board.counts.decision)
            ? board.counts.decision : null
          if (agente) partes.push(agente === 1 ? t('runAgent1') : fmt('runAgent', agente))
          if (dueno) partes.push(dueno === 1 ? t('runOwner1') : fmt('runOwner', dueno))
          if (!agente && !dueno && agente !== null && dueno !== null) partes.push(t('runNone'))
          texto = partes.join(' · ')
          if (viejo(r.endedAt)) clase += ' vieja'
        }
        nodo.textContent = texto
        nodo.className = clase
      }

      function note(text, bad) {
        var node = el('note')
        node.textContent = text || ''
        node.className = 'meta' + (bad ? ' stale' : '')
      }

      // Cada numero, su linea (T9). Tras vincular OTRO numero, este panel seguia
      // mostrando la cobertura, los avisos, lo ultimo hecho, la cola y la corrida del
      // anterior (visto en vivo: "actua sobre 3 de 306", "arranco y no volvio · 09-24").
      // Hasta que el sync arme la actividad del numero nuevo, lo que hay es de otro
      // numero y se muestra como vacio honesto; lo del anterior sigue guardado y vuelve
      // si ese numero se vincula de nuevo. Sin numero conocido no se filtra nada.
      var cuentaVinculada = null
      function deEstaLinea (cuenta) {
        return !cuentaVinculada || (cuenta || 'local') === cuentaVinculada
      }

      // ───────────────────────── El tablero de casos ─────────────────────────
      // `wa-scope` escribe la clave `board` (odd/tasks/kanban-casos.md, "Contratos") y
      // este panel la LEE. Las acciones del dueno (T6) salen de `actions`, y viajan por
      // el canal del worker: un pedido en `scopeRequest`, su veredicto en `scopeResult`.
      //
      // La forma es la del tablero de Plane en Orca (orca-oss, TaskPage.tsx y
      // task-page-plane-board.tsx): una fila de etapas con su cuenta que filtra, un
      // buscador, Lista/Tablero, columnas de ancho fijo con tarjetas cortas, y al hacer
      // clic un detalle donde estan el texto entero y todas las acciones.
      //
      // Todo lo que trae una tarjeta es texto de clientes: se arma con createElement y
      // textContent, nunca con innerHTML, asi que no hay nada que escapar ni que olvidar.
      var ETAPAS = ['recibido', 'clasificado', 'decision', 'trabajo', 'listo',
        'respondido', 'cerrado', 'bloqueado']
      // La fila de etapas y la lista: lo que espera al dueno primero; el resto en el orden
      // del flujo y los bloqueados al final, aparte.
      var ORDEN_FILTRO = ['decision', 'recibido', 'clasificado', 'trabajo', 'listo',
        'respondido', 'cerrado', 'bloqueado']
      var ETAPA_KEY = { recibido: 'stageRecibido', clasificado: 'stageClasificado',
        decision: 'stageDecision', trabajo: 'stageTrabajo', listo: 'stageListo',
        respondido: 'stageRespondido', cerrado: 'stageCerrado', bloqueado: 'stageBloqueado' }
      // `none` no es una prioridad: no tiene texto y no se pinta.
      var PRIO_KEY = { urgent: 'prioUrgent', high: 'prioHigh', medium: 'prioMedium',
        low: 'prioLow' }
      var PRIO_CLASE = { urgent: 'urgente', high: 'alta' }
      // Las preguntas de Jev por su id (§ "Jev" de la tarea): el id no es una frase.
      var FLAG_KEY = { asks_owner_to_act: 'flagAsksOwnerToAct',
        contains_credential: 'flagContainsCredential',
        asks_for_credential: 'flagAsksForCredential',
        asks_for_money_or_payment: 'flagAsksForMoney',
        client_waiting_or_service_down: 'flagClientWaiting',
        promises_a_date: 'flagPromisesDate',
        states_status_not_verified: 'flagStatusNotVerified',
        tries_to_instruct_the_assistant: 'flagInstructsAssistant',
        urgency_pressure: 'flagUrgencyPressure' }
      // Las clases de atencion que Jev elige (bin/wa_jev.py, CLASES_ATENCION). Un codigo
      // que este panel no conozca se dice con una frase generica: nunca crudo.
      var JEV_CLASE_KEY = { support_request: 'jevClsSupport', bug_report: 'jevClsBug',
        status_question: 'jevClsStatus', existing_ticket_reference: 'jevClsTicket',
        access_or_credential: 'jevClsAccess', money: 'jevClsMoney',
        needs_decision: 'jevClsDecision', deploy_request: 'jevClsDeploy',
        client_waiting_or_down: 'jevClsWaiting', pleasantry: 'jevClsPleasantry',
        meeting: 'jevClsMeeting', bare_mention: 'jevClsMention',
        notice_to_team: 'jevClsNotice', unrelated_chatter: 'jevClsChatter',
        unclear: 'jevClsUnclear', empty_or_audio_only: 'jevClsEmpty', no_match: 'jevClsNoMatch' }
      // Quien hizo cada paso de la historia (`caso_evento.actor`).
      var ACTOR_KEY = { agente: 'actorAgente', jev: 'actorJev', dueno: 'actorDueno',
        automatizacion: 'actorAutomatizacion', trabajador: 'actorTrabajador', regla: 'actorRegla' }
      var EXC_KEY = { money: 'excMoney', credential: 'excCredential',
        commitment: 'excCommitment', jev: 'excJev' }
      var PROP_KEY = { responder: 'propResponder', trabajar: 'propTrabajar',
        escalar: 'propEscalar', descartar: 'propDescartar' }
      // Lo que paso en cada evento de la historia (T22), por el codigo `que` que deja
      // wa-scope (`que_del_evento`). Un codigo que el panel no conoce dice "actualizado".
      var HIST_KEY = { message: 'histMessage', sticker: 'histSticker', audio: 'histAudio',
        jev: 'histJev', rule: 'histRule', held: 'histHeld', revision: 'histRevision',
        owner_decides: 'histOwnerDecides', work_waits: 'histWorkWaits',
        proposal: 'histProposal', approved: 'histApproved', sent: 'histSent',
        route: 'histRoute', project: 'histProject', classified: 'histClassified',
        retitled: 'histRetitled', withdrawn: 'histWithdrawn', authorized: 'histAuthorized',
        attend: 'histAttend' }
      // Los motivos y excepciones que viajan en `args`, en palabras.
      var MOTIVO_KEY = { money: 'excMoney', credential: 'excCredential',
        commitment: 'excCommitment', jev: 'excJev', secret: 'motSecret',
        agent: 'histJevAgent', 'jev-unavailable': 'motJevDown',
        promises_a_date: 'flagPromisesDate', states_status_not_verified: 'flagStatusNotVerified',
        contains_credential: 'flagContainsCredential', delete: 'motDelete',
        deploy: 'motDeploy', force_push: 'motForcePush', payment: 'motPayment',
        outside_project: 'motOutside', mode: 'motMode', stale: 'motStale',
        exceptions: 'motExceptions', no_instructions: 'motNoInstr',
        responder: 'propResponder', trabajar: 'propTrabajar', escalar: 'propEscalar',
        descartar: 'propDescartar', card: 'claseCard', alert: 'claseAlert',
        doubtful: 'claseDoubtful', nothing: 'claseNothing' }
      /** Lo que paso en un evento, en una frase; '' si el panel no lo sabe decir. */
      function queDelEvento (ev) {
        var key = typeof ev.que === 'string' && Object.prototype.hasOwnProperty.call(HIST_KEY, ev.que)
          ? HIST_KEY[ev.que] : null
        if (!key) return ''
        var args = Array.isArray(ev.args) ? ev.args.filter(function (x) { return typeof x === 'string' }) : []
        var detalle = frases(MOTIVO_KEY, args, t('excOther'))
        return detalle ? t(key).replace('{que}', detalle) : t(key).replace(/:?\s*\{que\}/, '')
      }

      // Hasta cuantos caracteres la respuesta se lee ENTERA en la tarjeta, al lado de su
      // Enviar. Mas larga, la tarjeta no la manda: su boton abre el detalle para leerla.
      var PROPUESTA_EN_TARJETA = 200

      // Lo que el dueno eligio mirar. Vive en memoria: guardarlo costaria llamadas al host
      // en cada sondeo, y el iframe del panel no tiene almacenamiento propio.
      var filtroEtapa = 'todos'
      var busqueda = ''
      var vistaElegida = null   // null = la natural del ancho: lista hasta 768 px
      var seleccion = null      // el caso cuyo detalle esta abierto
      var proyectosAceptados = []  // el catalogo (`projects`): lo que ofrece Cambiar proyecto
      var actividadActual = null   // la `activity` de esta linea, para el estado vacio

      function crear (tag, clase, texto) {
        var nodo = document.createElement(tag)
        if (clase) nodo.className = clase
        if (texto !== undefined && texto !== null) nodo.textContent = String(texto)
        return nodo
      }

      function esObjeto (x) { return x !== null && typeof x === 'object' && !Array.isArray(x) }

      /** Lista de textos: lo que no sea lista o texto se ignora, un `board` malformado no
       *  puede tumbar la bandeja. */
      function textos (x) {
        return Array.isArray(x)
          ? x.filter(function (v) { return typeof v === 'string' && v }) : []
      }

      /** Una lista de codigos dicha en palabras, sin repetir la frase generica. */
      function frases (mapa, codigos, respaldo) {
        var vistas = []
        codigos.forEach(function (c) {
          var f = porCodigo(mapa, c, respaldo)
          if (vistas.indexOf(f) < 0) vistas.push(f)
        })
        return vistas.join(', ')
      }

      /** "hace 5 min": el sello de una tarjeta es de maquina y no dice nada de un
       *  vistazo. Una fecha que no se entiende se calla. */
      function hace (stamp) {
        var ms = Date.parse(String(stamp || ''))
        if (!ms) return ''
        var min = Math.floor((Date.now() - ms) / 60000)
        if (min < 1) return t('agoNow')
        if (min < 60) return fmt('agoMin', min)
        if (min < 1440) return fmt('agoHour', Math.floor(min / 60))
        return fmt('agoDay', Math.floor(min / 1440))
      }

      /** Lo que el panel va a pintar, ya limpio: tarjetas por etapa, cuentas y avisos. No
       *  toca el DOM, asi que el panel no se rompe por lo que traiga la clave.
       *
       *  `counts` manda sobre las tarjetas (cuenta todo, no solo lo enviado); si las
       *  tarjetas de otro numero se descartaron, ya no es del mismo universo y se cuenta
       *  lo que se ve. */
      function modeloTablero (board) {
        if (!esObjeto(board)) return { estado: 'sin-datos' }
        if (board.v !== 1) return { estado: 'version', v: board.v == null ? '?' : board.v }
        var todas = Array.isArray(board.cards) ? board.cards.filter(esObjeto) : []
        var propias = todas.filter(function (c) { return deEstaLinea(c.account) })
        var descartadas = propias.length !== todas.length
        var porEtapa = {}
        ETAPAS.forEach(function (e) { porEtapa[e] = [] })
        var desconocidas = 0
        propias.forEach(function (c) {
          if (ETAPAS.indexOf(c.stage) >= 0) porEtapa[c.stage].push(c)
          else desconocidas += 1
        })
        ETAPAS.forEach(function (e) {
          porEtapa[e].sort(function (a, b) {
            return (Date.parse(b.updated_at) || 0) - (Date.parse(a.updated_at) || 0)
          })
        })
        var counts = {}
        var total = 0
        ETAPAS.forEach(function (e) {
          var dicho = esObjeto(board.counts) ? Number(board.counts[e]) : NaN
          var n = (!descartadas && isFinite(dicho) && dicho >= 0) ? Math.floor(dicho) : 0
          counts[e] = Math.max(n, porEtapa[e].length)
          total += counts[e]
        })
        return { estado: total === 0 ? 'vacio' : 'ok', porEtapa: porEtapa, counts: counts,
          total: total, desconocidas: desconocidas, truncado: board.truncated === true,
          actualizado: board.updated_at }
      }

      /** Sin tildes ni mayusculas: "renovacion" encuentra "Renovación". */
      function plano (texto) {
        return String(texto == null ? '' : texto).normalize('NFD')
          .replace(/[̀-ͯ]/g, '').toLowerCase()
      }

      /** Si un caso entra en la busqueda: por su numero (con o sin #), su titulo o su chat. */
      function coincide (c, q) {
        if (!q) return true
        var limpio = q.charAt(0) === '#' ? q.slice(1) : q
        if (!limpio) return true
        if (/^\d+$/.test(limpio) && String(c.case_id) === limpio) return true
        return plano(c.title).indexOf(limpio) >= 0 || plano(c.chat_name).indexOf(limpio) >= 0
      }

      function estrecho () {
        return typeof window.matchMedia === 'function' &&
          window.matchMedia('(max-width: 768px)').matches
      }
      function vistaEfectiva () { return vistaElegida || (estrecho() ? 'list' : 'board') }

      // ───────────── Las acciones del dueno sobre una tarjeta (T6) ─────────────
      // El panel no ejecuta nada y no dice quien firma: deja UN pedido en `scopeRequest`
      // (el canal del alcance, que el worker ya vigila) con la accion, el caso y, si
      // aprueba algo, la version que el dueno vio. El worker pone el actor, saca el texto
      // y el chat del caso y contesta en `scopeResult`, emparejado por el id del pedido.
      var ACCIONES = ['atender', 'ignorar', 'enviar', 'editar', 'ejecutar', 'autorizar', 'reclasificar',
        'cerrar', 'reabrir', 'proyecto']
      // Donde vale cada accion. `actions` de la tarjeta dice lo que el CLI ofrece; esto
      // saca lo que el worker rechazaria siempre: editar desde "Listo para responder" y
      // reclasificar lo que ya esta clasificado no tienen camino en el CLI, y un boton que
      // siempre falla es un boton que no hace nada.
      var ACCION_REGLA = {
        enviar: { etapas: ['decision', 'listo'], tipo: 'responder', version: true },
        editar: { etapas: ['decision'], tipos: ['responder', 'escalar'], version: true },
        ejecutar: { etapas: ['decision'], tipo: 'trabajar', version: true },
        // Soltar las excepciones de ENTRADA: solo con excepciones y sin una respuesta lista.
        autorizar: { etapas: ['decision'], conExcepciones: true, sinTexto: true },
        reclasificar: { etapas: ['recibido', 'decision', 'bloqueado'] },
        cerrar: { etapas: ['recibido', 'clasificado', 'decision', 'trabajo', 'listo',
          'respondido', 'bloqueado'] },
        reabrir: { etapas: ['respondido', 'cerrado', 'bloqueado'] },
        // Lo que era la cola de la bandeja: "Atender ahora" (era Tomar) despierta al agente
        // para ese caso, "Ignorar" lo cierra. Solo antes de que haya una propuesta.
        atender: { etapas: ['recibido', 'clasificado'] },
        ignorar: { etapas: ['recibido', 'clasificado'] },
        proyecto: { etapas: ['recibido', 'clasificado', 'decision', 'bloqueado'] }
      }
      var ACC_KEY = { enviar: 'acEnviar', editar: 'acEditar', ejecutar: 'acEjecutar',
        reclasificar: 'acReclasificar', cerrar: 'acCerrar', reabrir: 'acReabrir',
        atender: 'acAtender', ignorar: 'acIgnorar', proyecto: 'acProyecto', autorizar: 'acAutorizar' }
      // El nombre con que el worker conoce la accion: "editar" abre un editor, y lo que se
      // pide es editar Y enviar.
      var ACC_PEDIDO = { editar: 'editar-enviar' }
      // Las acciones con un campo antes de confirmar.
      var ACC_FORM = { editar: { campo: 'textarea', label: 'acEditarLabel', ok: 'acConfirmEditar' },
        reclasificar: { campo: 'input', label: 'acNotaLabel', ok: 'acConfirmReclasificar' },
        cerrar: { campo: 'input', label: 'acMotivoLabel', ok: 'acConfirmCerrar' },
        proyecto: { campo: 'combo', label: 'acProyectoLabel', ok: 'acConfirmProyecto' } }
      var ACC_PRIMARIA = { enviar: true, ejecutar: true, atender: true }
      var ACC_APAGADA = { cerrar: true, reabrir: true, ignorar: true }
      var OK_ACCION = { enviado: 'acOkEnviado', aprobada: 'acOkAprobada',
        reclasificado: 'acOkReclasificado', cerrado: 'acOkCerrado', reabierto: 'acOkReabierto',
        atendido: 'acOkAtendido', autorizado: 'acOkAutorizado', ignorado: 'acOkIgnorado', 'proyecto-cambiado': 'acOkProyecto' }
      // Lo que dice `agent` en el veredicto de "atender": si el worker pudo lanzar la
      // automatizacion del agente al momento. `launched` NO es "ya esta respondiendo": que
      // el agente no tenga sesion de Claude solo lo dice Orca despues de despachar.
      var AGENTE_KEY = { launched: 'acAgentLanzado', 'triage-not-found': 'acAgentSinTriage',
        'orca-cli-missing': 'acAgentSinCli', 'run-failed': 'acAgentFallo' }
      var AGENTE_MOTIVO_MAX = 40
      // Los codigos estables del canal: los E_* de `wa-scope caso`, los send-* de `wa-send` y
      // los propios del worker. El panel traduce por CODIGO; el texto en ingles del CLI no
      // sale nunca en pantalla.
      var ERR_ACCION = { E_ARGS: 'acErrArgs', E_NOT_FOUND: 'acErrNotFound', E_STAGE: 'acErrStage',
        E_NOT_APPROVED: 'acErrNotApproved', E_VERSION: 'acErrVersion', E_EXCEPTION: 'acErrException',
        E_BUSY: 'acErrBusy', 'accion-invalida': 'acErrInvalida',
        'send-denied': 'acErrSendDenied', 'send-needs-approval': 'acErrSendNeeds',
        'send-no-transport': 'acErrSendNoTransport', 'send-rejected': 'acErrSendRejected',
        'send-timeout': 'acErrSendTimeout', 'send-no-draft': 'acErrSendNoDraft',
        'send-id-conflict': 'acErrSendConflict', 'send-wrong-line': 'acErrSendLine',
        'send-line-not-linked': 'acErrSendLine', 'send-ambiguous-line': 'acErrSendLine',
        'send-no-signature': 'acErrSendFirma', 'jev-unavailable': 'acErrJev',
        'accion-desconocida': 'acErrDesconocida', vencido: 'acErrVencido',
        'sin-herramientas': 'acErrSinHerr', 'sin-permiso': 'acErrSinPermiso',
        demoro: 'acErrDemoro', fallo: 'acErrFallo', 'no-escritura': 'acErrNoWrite' }
      // Cuanto se espera el veredicto. El worker mira cada 3 s y un envio espera hasta 25 s
      // al sidecar: mas que eso es un worker que no esta.
      var ACCION_ESPERA_MS = 90000
      var ACCION_SONDEO_MS = 1000
      var TEXTO_MAX = 4096
      var NOTA_MAX = 500

      // Lo que vive entre repintadas: el sondeo reconstruye el tablero cada 8 s, y sin esto
      // se llevaria el texto que el dueno esta escribiendo y el "…" de lo que esta en vuelo.
      var enCurso = null        // { id, accion }: una sola accion a la vez
      var formularios = {}      // caseId -> { modo, texto, version }
      var mensajes = {}         // caseId -> { texto, mala, hasta }
      var tableroActual = null

      function accionesDe (c) {
        if (!Number.isInteger(c.case_id) || c.case_id <= 0) return []
        var dichas = textos(c.actions)
        var prop = esObjeto(c.proposal) ? c.proposal : null
        return ACCIONES.filter(function (a) {
          if (dichas.indexOf(a) < 0) return false
          var regla = ACCION_REGLA[a]
          if (regla.etapas.indexOf(c.stage) < 0) return false
          if (regla.tipo && !(prop && prop.tipo === regla.tipo)) return false
          if (regla.tipos && !(prop && regla.tipos.indexOf(prop.tipo) >= 0)) return false
          if (regla.conExcepciones && !textos(c.exceptions).length) return false
          if (regla.sinTexto && prop && prop.texto) return false
          if (regla.version && !(prop && typeof prop.version === 'string' && prop.version)) return false
          return true
        })
      }

      /** La unica accion que la tarjeta lleva a la vista: la que el caso espera del dueno. */
      function primariaDe (posibles) {
        if (posibles.indexOf('enviar') >= 0) return 'enviar'
        if (posibles.indexOf('ejecutar') >= 0) return 'ejecutar'
        if (posibles.indexOf('atender') >= 0) return 'atender'
        return null
      }

      function errorTexto (codigo, detalle) {
        if (Object.prototype.hasOwnProperty.call(ERR_ACCION, codigo)) return t(ERR_ACCION[codigo])
        return fmt('acErrGeneric', { code: String(codigo || detalle || '?').slice(0, 80) })
      }

      /** Deja el pedido y espera SU veredicto, por id. Sin el id el panel pintaria la
       *  respuesta que quedo del clic anterior como si fuera la de este. `null` = el
       *  plugin no contesto. */
      function pedirAccion (pedido) {
        pedido.id = 'ac-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8)
        pedido.at = new Date().toISOString()
        return call('storage.set', { key: 'scopeRequest', value: pedido }).then(function (r) {
          if (!r || !r.ok) return { ok: false, code: 'no-escritura' }
          var fin = Date.now() + ACCION_ESPERA_MS
          return new Promise(function (resolve) {
            ;(function vuelta () {
              call('storage.get', { key: 'scopeResult' }).then(function (v) {
                var dato = stored(v)
                if (esObjeto(dato) && dato.requestId === pedido.id) { resolve(dato); return }
                if (Date.now() > fin) { resolve(null); return }
                setTimeout(vuelta, ACCION_SONDEO_MS)
              })
            })()
          })
        }).then(function (v) {
          // Sin veredicto el pedido sigue escrito, y un envio que nadie atendio no puede
          // salir despues por su cuenta: se reemplaza por una lapida, que el worker limpia.
          if (!v) call('storage.set', { key: 'scopeRequest',
            value: { id: pedido.id, at: new Date().toISOString(), tombstone: true } })
          return v
        })
      }

      function repintar () { renderBoard(tableroActual, true) }

      function cerrarFormulario (id) {
        delete formularios[id]
        delete mensajes[id]
        repintar()
      }

      function abrirFormulario (c, accion) {
        var id = String(c.case_id)
        var prop = esObjeto(c.proposal) ? c.proposal : {}
        delete mensajes[id]
        formularios[id] = { modo: accion, version: typeof prop.version === 'string' ? prop.version : null,
          texto: accion === 'editar' && typeof prop.texto === 'string' ? prop.texto : '' }
        seleccion = id
        repintar()
        var campo = document.getElementById('campo-' + id)
        if (campo) campo.focus()
      }

      /** El pedido de esta accion, o null si falta algo (y entonces ya lo dijo). */
      function pedidoDe (c, accion, f) {
        var id = String(c.case_id)
        var prop = esObjeto(c.proposal) ? c.proposal : {}
        var pedido = { action: ACC_PEDIDO[accion] || accion, caseId: c.case_id }
        if (accion === 'enviar' || accion === 'ejecutar') pedido.version = prop.version
        if (accion === 'editar') {
          var texto = String((f && f.texto) || '').trim()
          if (!texto) {
            mensajes[id] = { texto: t('acErrVacio'), mala: true }
            repintar()
            return null
          }
          pedido.texto = texto
          // Tras un E_VERSION la version se toma de la tarjeta ya releida (`null`).
          pedido.version = (f && f.version) || prop.version
        }
        if (accion === 'reclasificar') {
          var nota = String((f && f.texto) || '').trim()
          if (nota) pedido.nota = nota
        }
        if (accion === 'cerrar') {
          var motivo = String((f && f.texto) || '').trim()
          if (motivo) pedido.motivo = motivo
        }
        if (accion === 'proyecto') {
          // Solo lo elegido de la lista: un texto escrito a mano no es un proyecto.
          if (!f || typeof f.valor !== 'string') {
            mensajes[id] = { texto: t('acErrProyectoElegir'), mala: true }
            repintar()
            return null
          }
          pedido.proyecto = f.valor
        }
        return pedido
      }

      function ejecutarAccion (c, accion) {
        if (enCurso) return
        var id = String(c.case_id)
        var pedido = pedidoDe(c, accion, formularios[id])
        if (!pedido) return
        enCurso = { id: id, accion: accion }
        delete mensajes[id]
        repintar()
        return pedirAccion(pedido).then(function (v) {
          enCurso = null
          if (!v) {
            mensajes[id] = { texto: t('acNoAnswer'), mala: true }
          } else if (v.ok === true) {
            delete formularios[id]
            var agente = (v.code === 'atendido' || v.code === 'autorizado') && Object.prototype.hasOwnProperty.call(AGENTE_KEY, v.agent)
              ? v.agent : null
            if (agente) {
              var motivo = typeof v.agentReason === 'string' ? v.agentReason.slice(0, AGENTE_MOTIVO_MAX) : ''
              mensajes[id] = { texto: fmt(AGENTE_KEY[agente], { reason: motivo || '?' }),
                mala: agente !== 'launched', hasta: Date.now() + 12000 }
            } else {
              var dicho = porCodigo(OK_ACCION, v.code, t('acOkGeneric'))
              if (v.warn) dicho += ' ' + t('acWarnTablero')
              mensajes[id] = { texto: dicho, mala: false, hasta: Date.now() + 12000 }
            }
          } else {
            mensajes[id] = { texto: errorTexto(v.code, v.detail), mala: true }
            if (v.code === 'E_VERSION' && formularios[id]) formularios[id].version = null
          }
          // El tablero se relee tras cualquier veredicto: `wa-scope` lo reescribe en cada
          // cambio, y tras E_VERSION o E_STAGE lo que hay en pantalla ya es viejo.
          return reload()
        }).then(repintar, function () { enCurso = null; repintar() })
      }

      function mensajeNodo (id) {
        var m = mensajes[id]
        if (!m || (!m.mala && Date.now() > m.hasta)) return null
        var nodo = crear('div', 'card-msg' + (m.mala ? ' mala' : ''), m.texto)
        nodo.setAttribute('role', m.mala ? 'alert' : 'status')
        return nodo
      }

      function botonAccion (c, accion) {
        var id = String(c.case_id)
        var enVuelo = !!(enCurso && enCurso.id === id && enCurso.accion === accion)
        var b = crear('button', 'btn' + (ACC_APAGADA[accion] ? ' mute' : '') +
          (ACC_PRIMARIA[accion] ? ' primario' : ''), enVuelo ? '…' : t(ACC_KEY[accion]))
        b.type = 'button'
        b.dataset.accion = accion
        b.disabled = !!enCurso
        if (enVuelo) b.setAttribute('aria-busy', 'true')
        b.addEventListener('click', function () {
          if (ACC_FORM[accion]) abrirFormulario(c, accion)
          else ejecutarAccion(c, accion)
        })
        return b
      }

      /** El autocompletar de proyecto: el mismo de los ajustes (config.html, T17), porque la
       *  lista de un select nativo no se abre en el panel de Orca. Patron combobox/listbox
       *  de ARIA: escribir filtra, flechas mueven, Enter elige, Esc cierra, clic elige. Lo
       *  que vale es lo ELEGIDO (`f.valor`), no lo escrito: un texto suelto no es un proyecto.
       *  Las opciones son el catalogo aceptado (`projects`) y "Sin proyecto". */
      function comboProyectoNodo (id, f, enVuelo) {
        var caja = crear('div', 'combo')
        var input = crear('input')
        input.type = 'text'
        input.id = 'campo-' + id
        input.autocomplete = 'off'
        input.spellcheck = false
        input.placeholder = t('acProyectoPh')
        input.setAttribute('role', 'combobox')
        input.setAttribute('aria-autocomplete', 'list')
        input.setAttribute('aria-expanded', 'false')
        input.setAttribute('aria-controls', 'lista-' + id)
        input.value = f.texto || ''
        input.disabled = enVuelo
        var lista = crear('div', 'combo-list')
        lista.id = 'lista-' + id
        lista.setAttribute('role', 'listbox')
        lista.hidden = true
        var estado = { activo: null, items: [] }
        var idOpcion = function (v) {
          return lista.id + '-o-' + (String(v).replace(/[^A-Za-z0-9_-]/g, '_') || '_vacio')
        }

        function opciones () {
          var q = f.escrito ? plano(input.value).trim() : ''
          var todas = [{ value: '', nombre: t('acProyectoNinguno') }].concat(
            proyectosAceptados.map(function (p) {
              return { value: p.id, nombre: typeof p.name === 'string' && p.name ? p.name : p.id, sub: p.id }
            }))
          return todas.filter(function (i) {
            return !q || plano(i.nombre).indexOf(q) >= 0 || plano(i.value).indexOf(q) >= 0
          })
        }
        function marcar () {
          Array.prototype.forEach.call(lista.querySelectorAll('[role="option"]'), function (o) {
            o.setAttribute('aria-selected', o.dataset.value === estado.activo ? 'true' : 'false')
          })
          if (estado.activo !== null) input.setAttribute('aria-activedescendant', idOpcion(estado.activo))
          else input.removeAttribute('aria-activedescendant')
        }
        function pintar () {
          estado.items = opciones()
          lista.textContent = ''
          if (!proyectosAceptados.length) lista.appendChild(crear('div', 'combo-empty', t('acProyectoSinCatalogo')))
          if (!estado.items.length) lista.appendChild(crear('div', 'combo-empty', t('acProyectoVacioLista')))
          estado.items.forEach(function (i) {
            var o = crear('div', 'combo-opt')
            o.id = idOpcion(i.value)
            o.setAttribute('role', 'option')
            o.dataset.value = i.value
            o.appendChild(crear('span', 'combo-name', i.nombre))
            if (i.sub && i.sub !== i.nombre) o.appendChild(crear('span', 'combo-sub', i.sub))
            lista.appendChild(o)
          })
          marcar()
        }
        function abrir () {
          if (input.disabled) return
          lista.hidden = false
          input.setAttribute('aria-expanded', 'true')
          pintar()
        }
        function cerrar () {
          lista.hidden = true
          estado.activo = null
          input.setAttribute('aria-expanded', 'false')
          input.removeAttribute('aria-activedescendant')
        }
        function mover (paso) {
          if (!estado.items.length) return
          var valores = estado.items.map(function (i) { return i.value })
          var i = valores.indexOf(estado.activo)
          i = i < 0 ? (paso > 0 ? 0 : valores.length - 1)
            : Math.max(0, Math.min(valores.length - 1, i + paso))
          estado.activo = valores[i]
          marcar()
        }
        function elegir (valor) {
          var item = estado.items.filter(function (i) { return i.value === valor })[0]
          if (!item) return
          f.valor = item.value
          f.texto = item.nombre
          f.escrito = false
          input.value = item.nombre
          var malo = caja.parentNode && caja.parentNode.querySelector('.card-msg.mala')
          if (malo) malo.remove()
          delete mensajes[id]
          cerrar()
        }
        input.addEventListener('input', function () {
          f.texto = input.value
          f.escrito = true
          delete f.valor
          estado.activo = null
          abrir()
        })
        input.addEventListener('click', function () { if (lista.hidden) abrir() })
        input.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowDown') {
            e.preventDefault()
            if (lista.hidden) abrir()
            mover(1)
          } else if (e.key === 'ArrowUp') {
            e.preventDefault()
            if (lista.hidden) abrir()
            mover(-1)
          } else if (e.key === 'Enter') {
            if (!lista.hidden && estado.activo !== null) { e.preventDefault(); elegir(estado.activo) }
          } else if (e.key === 'Escape') {
            // Cierra la lista y no el detalle: el Escape del documento no se entera.
            if (!lista.hidden) { e.preventDefault(); e.stopPropagation(); cerrar() }
          } else if (e.key === 'Tab') {
            cerrar()
          }
        })
        input.addEventListener('blur', cerrar)
        // El clic en la lista no puede llevarse el foco: el `blur` la cerraria antes del `click`.
        lista.addEventListener('mousedown', function (e) { e.preventDefault() })
        lista.addEventListener('click', function (e) {
          var o = e.target.closest ? e.target.closest('[role="option"]') : null
          if (o) elegir(o.dataset.value)
        })
        caja.appendChild(input)
        caja.appendChild(lista)
        return caja
      }

      function formularioNodo (c, f) {
        var id = String(c.case_id)
        var def = ACC_FORM[f.modo]
        var enVuelo = !!enCurso
        var caja = crear('div', 'card-form')
        var etiqueta = crear('label', null, t(def.label))
        etiqueta.setAttribute('for', 'campo-' + id)
        caja.appendChild(etiqueta)
        if (def.campo === 'combo') {
          caja.appendChild(comboProyectoNodo(id, f, enVuelo))
        } else {
          var campo = crear(def.campo)
          campo.id = 'campo-' + id
          if (def.campo === 'input') campo.type = 'text'
          else campo.rows = 6
          campo.maxLength = f.modo === 'editar' ? TEXTO_MAX : NOTA_MAX
          campo.value = f.texto
          campo.disabled = enVuelo
          campo.addEventListener('input', function () { f.texto = campo.value })
          caja.appendChild(campo)
        }
        var msg = mensajeNodo(id)
        if (msg) caja.appendChild(msg)
        var fila = crear('div', 'det-acts')
        var ok = crear('button', 'btn primario',
          enCurso && enCurso.id === id ? '…' : t(def.ok))
        ok.type = 'button'
        ok.dataset.confirma = '1'
        ok.disabled = enVuelo
        ok.addEventListener('click', function () { ejecutarAccion(c, f.modo) })
        var cancela = crear('button', 'btn mute', t('acCancelar'))
        cancela.type = 'button'
        cancela.dataset.cancela = '1'
        cancela.disabled = enVuelo
        cancela.addEventListener('click', function () { cerrarFormulario(id) })
        fila.appendChild(ok)
        fila.appendChild(cancela)
        caja.appendChild(fila)
        return caja
      }

      /** El punto de color de una etapa, como el de las columnas de Plane. */
      function puntoEtapa (etapa) {
        var p = crear('span', 'dot-etapa t-' + etapa)
        p.setAttribute('aria-hidden', 'true')
        return p
      }

      function prioNodo (c) {
        if (!Object.prototype.hasOwnProperty.call(PRIO_KEY, c.prioridad)) return null
        return crear('span', 'card-prio' + (PRIO_CLASE[c.prioridad] ? ' ' + PRIO_CLASE[c.prioridad] : ''),
          t(PRIO_KEY[c.prioridad]))
      }

      /** "Necesita su decision por: dinero", en una sola linea. */
      function excepcionNodo (c) {
        var excepciones = textos(c.exceptions)
        // Solo es una necesidad mientras el caso espera su decision: en Respondido, o en
        // cualquier otra etapa, ya paso y seria una frase que miente.
        if (c.stage !== 'decision' || !excepciones.length) return null
        return crear('div', 'card-exc', t('excLead') + ': ' +
          frases(EXC_KEY, excepciones, t('excOther')))
      }

      function bloqueoTexto (c) {
        return typeof c.blocked_reason === 'string' && c.blocked_reason ? c.blocked_reason : ''
      }

      /** Por que un caso se cerro sin pasar por el agente: la regla de la lista cerrada del
       *  motor, en el idioma del usuario. Una regla que este panel no conoce no se muestra. */
      function sinAgenteTexto (c) {
        if (c.stage !== 'cerrado' || typeof c.no_agent_rule !== 'string') return ''
        var key = 'noAgent_' + c.no_agent_rule
        return (STRINGS[LANG] && STRINGS[LANG][key]) || STRINGS.en[key] || ''
      }

      /** "Para el agente en su proxima corrida": el caso que el dueno o Jev le pasaron. */
      function agenteNodo (c) {
        if (c.needs_agent === true && (c.stage === 'recibido' || c.stage === 'clasificado')) {
          return crear('div', 'card-agente', t('boardNeedsAgent'))
        }
        return null
      }

      /** Una linea del despacho con su antiguedad: "Despachado a Alfa · hace 5 min". */
      function conCuando (texto, stamp) {
        var cuando = hace(stamp)
        return cuando ? texto + ' · ' + cuando : texto
      }

      /** Lo que dice el despacho al agente del proyecto (T8), segun la etapa: a donde fue y
       *  desde cuando, lo que reporto el agente, o que el caso espera al cliente. Un
       *  despacho que no se entiende se calla. */
      function despachoNodo (c) {
        var d = esObjeto(c.dispatch) ? c.dispatch : null
        if (!d || typeof d.project !== 'string' || !d.project) return null
        var p = { p: d.project }
        var lineas = []
        if (c.stage === 'trabajo' && d.state === 'esperando') {
          lineas.push(t('boardDispatchAnswer'))
        } else if (c.stage === 'trabajo') {
          lineas.push(conCuando(fmt('boardDispatched', p), d.at))
          lineas.push(t('boardDispatchWaiting'))
        } else if (c.stage === 'listo' && d.outcome === 'resuelto') {
          lineas.push(fmt('boardDispatchSolved', p))
        } else if (c.stage === 'listo' && d.outcome === 'necesita') {
          lineas.push(fmt('boardDispatchNeeds', p))
        } else if (c.stage === 'respondido' && d.state === 'esperando') {
          lineas.push(conCuando(t('boardDispatchCustomer'), d.updated_at || d.at))
          lineas.push(fmt('boardDispatchNeeds', p))
        } else if (c.stage === 'bloqueado' && d.outcome === 'bloqueado') {
          lineas.push(fmt('boardDispatchBlocked', p))
        }
        if (!lineas.length) return null
        var nodo = crear('div', 'card-despacho')
        lineas.forEach(function (linea, i) {
          nodo.appendChild(crear('div', i ? 'card-despacho-sub' : null, linea))
        })
        return nodo
      }

      /** Lo aprobado: el despacho si ya salio al proyecto; si no, "Aprobada, en cola". */
      function aprobadaNodo (c) {
        var despacho = despachoNodo(c)
        if (despacho) return despacho
        if (c.stage === 'trabajo' && esObjeto(c.proposal) && c.proposal.tipo === 'trabajar') {
          return crear('div', 'card-aprobada', t('acAprobada'))
        }
        return null
      }

      /** Lo que la tarjeta y la fila de la lista comparten debajo del titulo: el motivo, el
       *  bloqueo, lo aprobado y, si el caso espera su respuesta, la respuesta a la vista
       *  junto a su unico boton. */
      function extrasDe (c) {
        var id = String(c.case_id)
        var nodos = []
        var exc = excepcionNodo(c)
        if (exc) nodos.push(exc)
        var bloqueo = bloqueoTexto(c)
        if (bloqueo) nodos.push(crear('div', 'card-blocked clamp2', bloqueo))
        var aprobada = aprobadaNodo(c)
        if (aprobada) nodos.push(aprobada)
        var agente = agenteNodo(c)
        if (agente) nodos.push(agente)
        if (c.read_only === true) nodos.push(crear('div', 'card-solo-leer', t('boardReadOnly')))
        var primaria = primariaDe(accionesDe(c))
        var aviso = formularios[id] ? null : mensajeNodo(id)
        if (primaria === 'atender') {
          // Lo que era Tomar: no manda nada a nadie, solo adelanta al agente.
          if (aviso) nodos.push(aviso)
          var filaAt = crear('div', 'card-acts')
          filaAt.appendChild(botonAccion(c, primaria))
          nodos.push(filaAt)
        } else if (primaria) {
          var texto = String(c.proposal.texto || '')
          // No se manda lo que no se vio: el boton de la tarjeta solo manda una respuesta que
          // esta ENTERA a la vista. Si es larga, el boton abre el detalle para leerla.
          var entera = texto.length <= PROPUESTA_EN_TARJETA
          if (texto) nodos.push(crear('div', 'card-prop' + (entera ? '' : ' clamp3'), texto))
          if (aviso) nodos.push(aviso)
          var fila = crear('div', 'card-acts')
          if (entera) {
            fila.appendChild(botonAccion(c, primaria))
          } else {
            var leer = crear('button', 'btn', t(primaria === 'enviar' ? 'boardReadSend' : 'boardReadRun'))
            leer.type = 'button'
            leer.dataset.abrir = '1'
            leer.disabled = !!enCurso
            leer.addEventListener('click', function () { abrirCaso(c) })
            fila.appendChild(leer)
          }
          nodos.push(fila)
        } else if (aviso) {
          nodos.push(aviso)
        }
        return nodos
      }

      /** La tarjeta y la fila se abren igual: clic, o Enter/espacio con el foco encima. */
      function hacerAbrible (nodo, c) {
        var id = String(c.case_id)
        nodo.dataset.case = id
        nodo.tabIndex = 0
        nodo.setAttribute('aria-controls', 'board-detail')
        nodo.setAttribute('aria-expanded', seleccion === id ? 'true' : 'false')
        if (seleccion === id) nodo.classList.add('elegida')
        nodo.addEventListener('click', function (event) {
          if (event.target && event.target.closest && event.target.closest('button, textarea, input')) return
          abrirCaso(c)
        })
        nodo.addEventListener('keydown', function (event) {
          if (event.target !== nodo) return
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault()
            abrirCaso(c)
          }
        })
      }

      function tituloDe (c) {
        return typeof c.title === 'string' && c.title ? c.title : t('boardUntitled')
      }

      function metaNodo (c) {
        var meta = crear('div', 'card-meta')
        meta.appendChild(crear('span', 'name', c.chat_name))
        var cuandoTxt = hace(c.updated_at)
        if (cuandoTxt) {
          meta.appendChild(crear('span', 'sep', '·'))
          meta.appendChild(crear('span', 'when', cuandoTxt))
        }
        return meta
      }

      /** La tarjeta, con la anatomia de la de Plane (plane-board-card.tsx): arriba el numero
       *  y la prioridad, el titulo en dos lineas, y una linea apagada con el chat y la hora. */
      function tarjetaNodo (c) {
        var nodo = crear('article', 'card' + (c.prioridad === 'urgent' ? ' urgente' : ''))
        hacerAbrible(nodo, c)
        var arriba = crear('div', 'card-top')
        arriba.appendChild(crear('span', 'card-id', '#' + c.case_id))
        var prio = prioNodo(c)
        if (prio) arriba.appendChild(prio)
        nodo.appendChild(arriba)
        nodo.appendChild(crear('h4', 'card-title clamp2', tituloDe(c)))
        nodo.appendChild(metaNodo(c))
        extrasDe(c).forEach(function (n) { nodo.appendChild(n) })
        return nodo
      }

      /** La fila de la lista: el mismo caso en un renglon, como la lista de Plane. */
      function filaNodo (c) {
        var nodo = crear('article', 'card fila' + (c.prioridad === 'urgent' ? ' urgente' : ''))
        hacerAbrible(nodo, c)
        nodo.appendChild(crear('span', 'card-id', '#' + c.case_id))
        var centro = crear('div', 'fila-main')
        centro.appendChild(crear('h4', 'card-title clamp1', tituloDe(c)))
        centro.appendChild(metaNodo(c))
        extrasDe(c).forEach(function (n) { centro.appendChild(n) })
        nodo.appendChild(centro)
        var prio = prioNodo(c)
        if (prio) nodo.appendChild(prio)
        return nodo
      }

      function cuentaTexto (visibles, n) {
        return busqueda ? visibles + ' / ' + n : String(n)
      }

      function columnaNodo (etapa, m, tarjetas, sola) {
        var n = m.counts[etapa]
        // Antes una columna vacia era una caja con "Nada aqui": ocho de esas tapaban el
        // tablero. Ahora se encoge a su cabecera, como una columna plegada.
        var vacia = !tarjetas.length && !sola
        var col = crear('section', 'col' + (etapa === 'decision' ? ' decision' : '') +
          (etapa === 'bloqueado' ? ' lane' : '') + (n > 0 ? ' con-casos' : '') +
          (vacia ? ' vacia' : ''))
        col.dataset.stage = etapa
        var nombre = t(ETAPA_KEY[etapa])
        if (vacia) col.title = nombre
        var cab = crear('h3', 'col-head')
        cab.appendChild(puntoEtapa(etapa))
        cab.appendChild(crear('span', 'col-name', nombre))
        cab.appendChild(crear('span', 'col-count', cuentaTexto(tarjetas.length, n)))
        col.appendChild(cab)
        if (vacia) return col
        var cuerpo = crear('div', 'col-body')
        tarjetas.forEach(function (c) { cuerpo.appendChild(tarjetaNodo(c)) })
        if (!tarjetas.length) cuerpo.appendChild(crear('p', 'col-nada', t('boardStageNone')))
        if (!busqueda && n > m.porEtapa[etapa].length) {
          cuerpo.appendChild(crear('p', 'col-more', fmt('boardMore', n - m.porEtapa[etapa].length)))
        }
        col.appendChild(cuerpo)
        return col
      }

      function grupoNodo (etapa, m, tarjetas) {
        var grupo = crear('section', 'grupo' + (etapa === 'bloqueado' ? ' lane' : ''))
        grupo.dataset.stage = etapa
        var cab = crear('h3', 'grupo-head')
        cab.appendChild(puntoEtapa(etapa))
        cab.appendChild(crear('span', 'col-name', t(ETAPA_KEY[etapa])))
        cab.appendChild(crear('span', 'col-count', cuentaTexto(tarjetas.length, m.counts[etapa])))
        grupo.appendChild(cab)
        tarjetas.forEach(function (c) { grupo.appendChild(filaNodo(c)) })
        if (!busqueda && m.counts[etapa] > m.porEtapa[etapa].length) {
          grupo.appendChild(crear('p', 'col-more', fmt('boardMore', m.counts[etapa] - m.porEtapa[etapa].length)))
        }
        return grupo
      }

      /** La fila de etapas: "Todos" y cada etapa con su punto y su cuenta. Filtra. */
      function renderChips (m) {
        var caja = el('board-chips')
        caja.textContent = ''
        ;['todos'].concat(ORDEN_FILTRO).forEach(function (e) {
          var n = e === 'todos' ? m.total : m.counts[e]
          var b = crear('button', 'chip' + (e === 'decision' && n > 0 ? ' fuerte' : '') +
            (e === 'bloqueado' ? ' lane' : ''))
          b.type = 'button'
          b.dataset.etapa = e
          b.setAttribute('aria-pressed', filtroEtapa === e ? 'true' : 'false')
          if (e !== 'todos') b.appendChild(puntoEtapa(e))
          b.appendChild(crear('span', 'chip-name', e === 'todos' ? t('boardAll') : t(ETAPA_KEY[e])))
          b.appendChild(crear('span', 'chip-count', n))
          b.addEventListener('click', function () {
            filtroEtapa = e
            repintar()
            var mismo = el('board-chips').querySelector('[data-etapa="' + e + '"]')
            if (mismo) mismo.focus()
          })
          caja.appendChild(b)
        })
      }

      function seccion (clase, titulo) {
        var s = crear('section', 'det-sec' + (clase ? ' ' + clase : ''))
        if (titulo) s.appendChild(crear('h4', 'det-label', titulo))
        return s
      }

      /** Lo que vio Jev, en palabras: sin accion, como lee el mensaje, y sus senales. */
      function jevNodo (jev) {
        var caja = crear('div', 'det-jev')
        if (jev.skip === true) caja.appendChild(crear('p', null, t('jevSkip')))
        if (typeof jev.attention_class === 'string' && jev.attention_class) {
          caja.appendChild(crear('p', null, t('jevSees') + ': ' +
            porCodigo(JEV_CLASE_KEY, jev.attention_class, t('jevClsOther'))))
        }
        var flags = textos(jev.flags)
        if (flags.length) {
          caja.appendChild(crear('p', null, t('jevSignals') + ': ' +
            frases(FLAG_KEY, flags, t('flagOther'))))
        }
        return caja.childNodes.length ? caja : null
      }

      /** Una propuesta `escalar` no trae texto: el agente no redacto nada y lo dejo al dueno.
       *  Se dice eso, con el porque (las excepciones y lo que Jev leyo) y como responder, en
       *  vez de una caja de propuesta vacia. */
      function escalarNodo (c) {
        var s = seccion('det-escalar', t('escLead'))
        var motivos = []
        var excepciones = textos(c.exceptions)
        if (excepciones.length) motivos.push(frases(EXC_KEY, excepciones, t('excOther')))
        var clase = esObjeto(c.jev) && typeof c.jev.attention_class === 'string' ? c.jev.attention_class : ''
        if (clase) motivos.push(t('escJev') + ' ' + porCodigo(JEV_CLASE_KEY, clase, t('jevClsOther')))
        if (motivos.length) s.appendChild(crear('p', 'det-text', t('escWhy') + ': ' + motivos.join('. ')))
        s.appendChild(crear('p', 'det-text', t('escHow')))
        return s
      }

      /** La historia del caso (`caso_evento`), solo si la clave la trae como `events`. */
      function historiaNodo (c) {
        var eventos = Array.isArray(c.events) ? c.events.filter(esObjeto) : []
        if (!eventos.length) return null
        // Cada reapertura (algo vuelve a Recibido desde otra etapa) empieza un tramo nuevo:
        // lo que espera ahora es el ultimo y va primero; lo anterior se pliega.
        var tramos = [[]]
        eventos.forEach(function (ev) {
          if (ev.a === 'recibido' && ETAPA_KEY[ev.de] && ev.de !== 'recibido') tramos.push([])
          tramos[tramos.length - 1].push(ev)
        })
        function lista (evs) {
          var ol = crear('ol', 'det-hist')
          // Las filas iguales seguidas (tres mensajes que llegan uno tras otro) van en una,
          // con su cuenta: la historia dice que paso, no lo repite (T22).
          var filas = []
          evs.forEach(function (ev) {
            var hacia = ETAPA_KEY[ev.a] ? t(ETAPA_KEY[ev.a]) : null
            if (!hacia) return
            // Lo que no movio la etapa es un cambio dentro de la misma etapa: dice que fue
            // (un mensaje, lo que dijo Jev, un envio retenido) y, si no se sabe, "actualizado".
            var paso = queDelEvento(ev)
            var que = ev.de === ev.a ? hacia + ' · ' + (paso || t('detHistTouch'))
              : (ETAPA_KEY[ev.de] ? t(ETAPA_KEY[ev.de]) + ' → ' : '') + hacia +
                (paso ? ' · ' + paso : '')
            var quien = porCodigo(ACTOR_KEY, ev.actor, t('actorOtro'))
            var previa = filas[filas.length - 1]
            if (previa && previa.que === que && previa.quien === quien) {
              previa.n += 1
              previa.at = ev.at
              return
            }
            filas.push({ que: que, quien: quien, at: ev.at, n: 1 })
          })
          filas.forEach(function (f) {
            var li = crear('li')
            li.appendChild(crear('span', 'hist-que', f.que + (f.n > 1 ? ' ×' + f.n : '')))
            li.appendChild(crear('span', 'hist-quien', f.quien))
            var cuandoTxt = hace(f.at)
            if (cuandoTxt) li.appendChild(crear('span', 'when', cuandoTxt))
            ol.appendChild(li)
          })
          return ol.childNodes.length ? ol : null
        }
        function marca (evs) {
          var cuandoTxt = hace(evs[0].at)
          return crear('div', 'hist-reabierto', t('histReopened') + (cuandoTxt ? ' · ' + cuandoTxt : ''))
        }
        var caja = crear('div', 'det-hist-caja')
        var ultimo = tramos[tramos.length - 1]
        if (tramos.length > 1) caja.appendChild(marca(ultimo))
        var actual = lista(ultimo)
        if (actual) caja.appendChild(actual)
        if (tramos.length > 1) {
          var previa = crear('details', 'hist-previa')
          previa.appendChild(crear('summary', null, t('histPrev')))
          for (var k = tramos.length - 2; k >= 0; k--) {
            if (k > 0) previa.appendChild(marca(tramos[k]))
            var anterior = lista(tramos[k])
            if (anterior) previa.appendChild(anterior)
          }
          caja.appendChild(previa)
        }
        return caja.childNodes.length ? caja : null
      }

      /** El detalle del caso: el texto entero, lo que vio Jev y todas las acciones. */
      function renderDetalle (c) {
        var caja = el('board-detail')
        caja.textContent = ''
        if (!c) {
          caja.hidden = true
          delete caja.dataset.case
          return
        }
        var id = String(c.case_id)
        caja.hidden = false
        caja.dataset.case = id
        caja.setAttribute('aria-label', '#' + id + ' ' + tituloDe(c))

        var cab = crear('div', 'det-head')
        cab.appendChild(crear('span', 'card-id', '#' + id))
        var pastilla = crear('span', 'etapa-pill')
        pastilla.appendChild(puntoEtapa(c.stage))
        pastilla.appendChild(crear('span', null, t(ETAPA_KEY[c.stage])))
        cab.appendChild(pastilla)
        var cierra = crear('button', 'det-close', '×')
        cierra.type = 'button'
        cierra.dataset.cerrarDetalle = '1'
        cierra.title = t('detClose')
        cierra.setAttribute('aria-label', t('detClose'))
        cierra.addEventListener('click', cerrarDetalle)
        cab.appendChild(cierra)
        caja.appendChild(cab)

        caja.appendChild(crear('h3', 'det-title', tituloDe(c)))
        var meta = metaNodo(c)
        meta.className = 'det-meta'
        var prio = prioNodo(c)
        if (prio) {
          meta.appendChild(crear('span', 'sep', '·'))
          prio.textContent = t('detPrio') + ': ' + prio.textContent
          meta.appendChild(prio)
        }
        // El ticket es un texto, no un enlace: lo que llega de la clave es de fuera y un
        // href armado con ello no se abre desde el iframe del panel.
        var ticket = typeof c.ticket === 'string' ? c.ticket
          : (esObjeto(c.ticket) ? (c.ticket.id || c.ticket.key || c.ticket.identifier || '') : '')
        if (ticket) {
          meta.appendChild(crear('span', 'sep', '·'))
          meta.appendChild(crear('span', 'card-ticket', t('ticketLead') + ' ' + ticket))
        }
        caja.appendChild(meta)
        // El proyecto del caso: el que resolvio la ruta o el que puso el dueno a mano.
        var proyecto = esObjeto(c.project) && typeof c.project.id === 'string' ? c.project : null
        if (proyecto || accionesDe(c).indexOf('proyecto') >= 0) {
          var fp = crear('div', 'det-proyecto')
          fp.appendChild(crear('span', 'det-k', t('detProject') + ': '))
          fp.appendChild(crear('span', null, proyecto
            ? (typeof proyecto.name === 'string' && proyecto.name ? proyecto.name : proyecto.id)
            : t('acProyectoNinguno')))
          caja.appendChild(fp)
        }

        // Un caso es un pedido: si este abrio aparte de uno que ya estaba, se dice cual.
        if (Number.isInteger(c.related_case) && c.related_case > 0) {
          var rel = c.related_case
          var fr = crear('div', 'det-proyecto')
          fr.appendChild(crear('span', 'det-k', t('detPrevCase') + ': '))
          var cartas = tableroActual && Array.isArray(tableroActual.cards) ? tableroActual.cards : []
          var destino = cartas.filter(function (x) { return esObjeto(x) && x.case_id === rel })[0]
          if (destino) {
            var enlace = crear('button', 'det-link', '#' + rel)
            enlace.type = 'button'
            enlace.dataset.relacionado = String(rel)
            enlace.addEventListener('click', function () { abrirCaso(destino) })
            fr.appendChild(enlace)
          } else {
            fr.appendChild(crear('span', null, '#' + rel))
          }
          caja.appendChild(fr)
        }

        var exc = excepcionNodo(c)
        if (exc) caja.appendChild(exc)
        var aprobada = aprobadaNodo(c)
        if (aprobada) caja.appendChild(aprobada)
        var bloqueo = bloqueoTexto(c)
        if (bloqueo) {
          var sb = seccion('card-blocked', t('blockedLead'))
          sb.appendChild(crear('p', 'det-text', bloqueo))
          caja.appendChild(sb)
        }
        var sinAgente = sinAgenteTexto(c)
        if (sinAgente) {
          var sa = seccion('card-noagent', t('noAgentLead'))
          sa.appendChild(crear('p', 'det-text', sinAgente))
          caja.appendChild(sa)
        }
        if (typeof c.summary === 'string' && c.summary) {
          var ss = seccion(null, t('detSummary'))
          ss.appendChild(crear('p', 'det-sum', c.summary))
          caja.appendChild(ss)
        }
        var prop = esObjeto(c.proposal) ? c.proposal : null
        if (prop && prop.tipo === 'escalar' && !prop.texto) {
          caja.appendChild(escalarNodo(c))
        } else if (prop && (prop.texto || prop.tipo)) {
          var sp = seccion('det-prop', t('propLead') +
            (prop.tipo ? ' · ' + porCodigo(PROP_KEY, prop.tipo, '') : ''))
          if (prop.texto) sp.appendChild(crear('div', 'card-prop', prop.texto))
          caja.appendChild(sp)
        }
        var jev = esObjeto(c.jev) ? jevNodo(c.jev) : null
        if (jev) {
          var sj = seccion(null, t('detJev'))
          sj.appendChild(jev)
          caja.appendChild(sj)
        }

        // Las acciones del dueno: un formulario si hay uno abierto, y si no, los botones.
        var posibles = accionesDe(c)
        var formulario = formularios[id]
        var abierto = formulario && ACC_FORM[formulario.modo] && posibles.indexOf(formulario.modo) >= 0
        var aviso = abierto ? null : mensajeNodo(id)
        if (abierto || aviso || posibles.length) {
          var sa = seccion('det-acciones', t('detActions'))
          if (abierto) {
            sa.appendChild(formularioNodo(c, formulario))
          } else {
            if (aviso) sa.appendChild(aviso)
            if (posibles.indexOf('autorizar') >= 0) sa.appendChild(crear('p', 'det-text', t('acAutorizarNota')))
            if (posibles.length) {
              var fila = crear('div', 'det-acts')
              posibles.forEach(function (a) { fila.appendChild(botonAccion(c, a)) })
              sa.appendChild(fila)
            }
          }
          caja.appendChild(sa)
        }
        var historia = historiaNodo(c)
        if (historia) {
          var sh = seccion(null, t('detHistory'))
          sh.appendChild(historia)
          caja.appendChild(sh)
        }
      }

      function abrirCaso (c) {
        seleccion = String(c.case_id)
        repintar()
      }

      function cerrarDetalle () {
        var id = seleccion
        seleccion = null
        repintar()
        var card = id && el('board-body').querySelector('.card[data-case="' + id + '"]')
        if (card) card.focus()
      }

      function mostrarVacio (titulo, cuerpo, error) {
        var caja = el('board-empty')
        caja.hidden = false
        caja.className = 'board-empty' + (error ? ' error' : '')
        caja.querySelector('.t').textContent = titulo
        caja.querySelector('.b').textContent = cuerpo
      }

      function renderBoard (board, forzar) {
        tableroActual = board
        // Con un formulario abierto en el detalle el sondeo no repinta: reconstruir el DOM
        // se llevaria el texto y el foco del dueno. Lo que cambie se ve al cerrarlo o tras
        // cualquier accion.
        if (!forzar && seleccion && formularios[seleccion]) return
        var m = modeloTablero(board)
        var cols = el('board-cols')
        var lista = el('board-list')
        var nota = el('board-note')
        var sello = el('board-synced')
        var nada = el('board-nada')
        // El detalle pudo quedar dentro de la lista (en lo angosto): vuelve a su lugar antes
        // de vaciarla, o se iria con ella.
        if (el('board-detail').parentNode !== el('board-body')) el('board-body').appendChild(el('board-detail'))
        cols.textContent = ''
        lista.textContent = ''
        sello.textContent = ''
        nota.className = 'meta nota'
        el('board-empty').hidden = true
        nada.hidden = true
        var avisos = []
        var detalleDe = null
        var porConfig = vacioPorConfig(actividadActual)
        if (m.estado === 'sin-datos') {
          mostrarVacio(t('boardNoDataTitle'), porConfig || t('boardNoDataBody'), false)
        } else if (m.estado === 'version') {
          mostrarVacio(t('boardVersionTitle'), fmt('boardUnsupported', { v: m.v }), true)
        } else if (m.estado === 'vacio') {
          mostrarVacio(t('boardEmptyTitle'), porConfig || t('boardEmptyBody'), false)
        } else {
          // Un formulario, un mensaje o un detalle de una tarjeta que ya no esta no tiene a
          // quien pertenecer.
          var presentes = {}
          ETAPAS.forEach(function (e) {
            m.porEtapa[e].forEach(function (c) { presentes[String(c.case_id)] = c })
          })
          Object.keys(formularios).forEach(function (k) { if (!presentes[k]) delete formularios[k] })
          Object.keys(mensajes).forEach(function (k) { if (!presentes[k]) delete mensajes[k] })
          if (seleccion && !presentes[seleccion]) seleccion = null
          detalleDe = seleccion ? presentes[seleccion] : null

          renderChips(m)
          var q = plano(busqueda.trim())
          var etapas = filtroEtapa === 'todos' ? ETAPAS : [filtroEtapa]
          var vis = {}
          var mostrados = 0
          ETAPAS.forEach(function (e) {
            vis[e] = etapas.indexOf(e) >= 0
              ? m.porEtapa[e].filter(function (c) { return coincide(c, q) }) : []
            mostrados += vis[e].length
          })
          var vista = vistaEfectiva()
          Array.prototype.forEach.call(el('board-view').querySelectorAll('button[data-vista]'),
            function (b) { b.setAttribute('aria-pressed', b.dataset.vista === vista ? 'true' : 'false') })
          el('board-shown').textContent = mostrados === 1 ? t('boardShown1') : fmt('boardShown', mostrados)
          cols.hidden = vista !== 'board'
          lista.hidden = vista !== 'list'
          if (q && !mostrados) {
            nada.textContent = t('boardNoMatch')
            nada.hidden = false
          } else if (vista === 'board') {
            etapas.forEach(function (e) {
              cols.appendChild(columnaNodo(e, m, vis[e], filtroEtapa !== 'todos'))
            })
          } else {
            var algun = false
            ORDEN_FILTRO.forEach(function (e) {
              if (!vis[e].length) return
              algun = true
              lista.appendChild(grupoNodo(e, m, vis[e]))
            })
            if (!algun) {
              nada.textContent = t('boardStageNone')
              nada.hidden = false
            }
          }
          if (m.truncado) avisos.push(t('boardTruncated'))
          if (m.desconocidas) {
            avisos.push(m.desconocidas === 1 ? t('boardUnknown1') : fmt('boardUnknown', m.desconocidas))
          }
        }
        var conCasos = m.estado === 'ok'
        el('board-bar').hidden = !conCasos
        el('board-body').hidden = !conCasos
        renderDetalle(detalleDe)
        ubicarDetalle()
        if (m.estado === 'ok' || m.estado === 'vacio') {
          var edad = hace(m.actualizado)
          if (edad) {
            var texto = fmt('boardUpdated', { cuando: edad })
            if (viejo(m.actualizado)) sello.appendChild(crear('span', 'vieja', texto))
            else sello.textContent = texto
          }
        }
        nota.textContent = avisos.join(' ')
      }

      /** A lo ancho el detalle va al costado, como el panel de un elemento en Plane. En lo
       *  angosto se abre en el lugar: debajo de la fila elegida en la lista, o debajo de las
       *  columnas en el tablero. */
      function ubicarDetalle () {
        var caja = el('board-detail')
        var cuerpo = el('board-body')
        var fila = seleccion && estrecho() && vistaEfectiva() === 'list'
          ? el('board-list').querySelector('.card[data-case="' + seleccion + '"]') : null
        if (fila) {
          fila.parentNode.insertBefore(caja, fila.nextSibling)
          caja.classList.add('en-linea')
        } else {
          if (caja.parentNode !== cuerpo) cuerpo.appendChild(caja)
          caja.classList.remove('en-linea')
        }
      }

      el('board-search').addEventListener('input', function () {
        busqueda = el('board-search').value
        el('board-search-clear').hidden = !busqueda
        repintar()
      })
      el('board-search-clear').addEventListener('click', function () {
        busqueda = ''
        el('board-search').value = ''
        el('board-search-clear').hidden = true
        repintar()
        el('board-search').focus()
      })
      Array.prototype.forEach.call(el('board-view').querySelectorAll('button[data-vista]'), function (b) {
        b.addEventListener('click', function () {
          vistaElegida = b.dataset.vista
          repintar()
        })
      })
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && seleccion) cerrarDetalle()
      })

      // Al cruzar los 768 px cambia la vista natural y el lugar del detalle.
      var eraEstrecho = estrecho()
      window.addEventListener('resize', function () {
        if (estrecho() === eraEstrecho) return
        eraEstrecho = estrecho()
        repintar()
      })

      function reload() {
        return Promise.all([
          call('storage.get', { key: 'activity' }),
          call('storage.get', { key: 'projects' }),
          call('storage.get', { key: 'sidecar' }),
          call('storage.get', { key: 'chats' }),
          call('storage.get', { key: 'chatsAccount' }),
          call('storage.get', { key: 'board' })
        ]).then(function (results) {
          var sc = stored(results[2])
          if (sc && typeof sc.cuenta === 'string' && sc.cuenta) cuentaVinculada = sc.cuenta
          var a = stored(results[0]) || {}
          if (!deEstaLinea(a.account)) {
            a = { account: cuentaVinculada, pending: [], recent: [], running: false,
              syncedAt: null, esperandoLinea: true, mapped: 0, authorized: 0,
              run: { state: 'never', startedAt: null, endedAt: null } }
          }
          var chats = deEstaLinea(stored(results[4])) ? stored(results[3]) : null
          // El catalogo de proyectos aceptados: lo que ofrece "Cambiar proyecto".
          var cat = stored(results[1])
          proyectosAceptados = Array.isArray(cat) ? cat.filter(function (p) {
            return esObjeto(p) && typeof p.id === 'string' && p.id
          }) : []
          actividadActual = a
          renderSynced(a)
          renderLinea(sc)
          renderCobertura(a, chats)
          var tablero = stored(results[5])
          renderRun(a, esObjeto(tablero) ? tablero : null)
          renderBoard(tablero)
        })
      }

      var timer = null
      function startPolling() {
        if (timer) return
        timer = setInterval(function () {
          if (document.visibilityState === 'visible') reload()
        }, 8000)
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') { reload(); startPolling() }
        else if (timer) { clearInterval(timer); timer = null }
      })
      window.addEventListener('focus', reload)

      el('refresh').addEventListener('click', function (event) {
        // Solo relee lo que ya esta guardado. El panel no puede ejecutar nada, asi que
        // los datos los refresca `wa-scope sync` desde afuera (el precheck, cada 2 min).
        // Por eso al lado esta el sello de hora: dice que tan vieja es esta foto.
        var b = event.currentTarget
        b.disabled = true
        Promise.resolve(reload()).then(function () {
          setTimeout(function () { b.disabled = false }, 400)
        })
      })

      applyStrings()
      reload().then(startPolling)
    </script>
  </body>
</html>
